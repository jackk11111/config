name: Wear7 DIAG4 build in-place patch V2

on:
  push:
    branches: [wear7-diag4-init-bisect-20261002]
    paths: ['.github/workflows/wear7-diag4-build-inplace-patch-v2.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs >/dev/null
          mkdir -p "$RUNNER_TEMP/w7/input" "$RUNNER_TEMP/w7/tools" "$RUNNER_TEMP/w7/parts" "$RUNNER_TEMP/w7/mnt" out-diag4

      - name: Download exact DIAG3 final super
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-DIAG3-Final-Super-V2
          path: ${{ runner.temp }}/w7/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '36913721664'

      - name: Fetch pinned Android image tools
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"
          ZIP="$W/tools/otatools.zip"
          curl -fL --retry 2 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          echo "f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84  $ZIP" | sha256sum -c -
          python3 - "$ZIP" "$W/tools/extracted" <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]).resolve()
          wanted=('bin/simg2img','bin/img2simg','bin/lpunpack','bin/lpmake')
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n in wanted or n.startswith(('lib64/','lib/')):
                      p=(out/n).resolve()
                      if not p.is_relative_to(out): raise SystemExit('unsafe')
                      z.extract(n,out)
          PY
          rm -f "$ZIP"
          chmod +x "$W/tools/extracted/bin/"*

      - name: Expand and unpack exact DIAG3 source
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"; T="$W/tools/extracted"
          export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          S=$(find "$W/input" -type f -name super_WEAR7_V11_DIAG3_FINAL.img -print -quit)
          test -n "$S"
          test "$(stat -c %s "$S")" = 3837889664
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  '"$S" | sha256sum -c -
          simg2img "$S" "$W/source.raw"
          test "$(stat -c %s "$W/source.raw")" = 4294967296
          echo '725df162529100ddb924caa22a1f72db77189b00620d27a2450da4e9351e913e  '"$W/source.raw" | sha256sum -c -
          lpunpack "$W/source.raw" "$W/parts"
          cp "$W/parts/vendor.img" "$W/vendor.orig.img"
          echo "SOURCE_SPARSE=$S" >> "$GITHUB_ENV"
          echo 'SOURCE_SPARSE_SHA256=75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329' > out-diag4/MANIFEST.txt
          echo 'SOURCE_RAW_SHA256=725df162529100ddb924caa22a1f72db77189b00620d27a2450da4e9351e913e' >> out-diag4/MANIFEST.txt

      - name: Create exact-size marker variants and patch only existing file data blocks
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"
          mkdir -p "$W/mnt/vendor"
          sudo mount -o loop,ro,noload "$W/parts/vendor.img" "$W/mnt/vendor"
          python3 - "$W/parts/vendor.img" "$W/mnt/vendor" out-diag4 <<'PY'
          import pathlib,subprocess,sys,re,hashlib,json
          vendor=pathlib.Path(sys.argv[1]); root=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3])
          specs=[
            ('etc/init/android.hardware.keymaster@4.1-service-qti.rc','start vendor.keymaster-4-1','/metadata/vold/d/04','AFTER_KEYMASTER_START'),
            ('etc/init/qseecomd.rc','start vendor.qseecomd','/metadata/vold/d/12','AFTER_QSEECOMD_START'),
            ('etc/init/vendor.qti.hardware.qseecom@1.0-service.rc','start qseecom-service','/metadata/vold/d/17','AFTER_QSEECOM_SERVICE_START'),
          ]
          info=subprocess.check_output(['tune2fs','-l',str(vendor)],text=True,stderr=subprocess.STDOUT)
          m=re.search(r'^Block size:\s*(\d+)',info,re.M)
          if not m: raise SystemExit('no block size')
          bs=int(m.group(1)); maxblk=vendor.stat().st_size//bs
          rows=[]
          def semantic(lines):
              return [x.strip() for x in lines if x.strip() and not x.lstrip().startswith('#')]
          def make(old,start,mpath):
              text=old.decode('utf-8')
              lines=text.splitlines(keepends=True)
              hits=[i for i,x in enumerate(lines) if x.strip()==start]
              if len(hits)!=1: raise SystemExit(f'{start}: hits={len(hits)}')
              marker=f'    chmod 0777 {mpath}\n'
              lines.insert(hits[0]+1,marker)
              # First remove only parser-inert comments and blank lines.
              lines=[x for x in lines if x.strip() and not x.lstrip().startswith('#')]
              mod=''.join(lines)
              # If needed, compact leading whitespace only. Tokens remain byte-identical.
              if len(mod.encode())>len(old):
                  ls=mod.splitlines(keepends=True)
                  ls=[((' '+x.lstrip()) if x[:1].isspace() else x) for x in ls]
                  mod=''.join(ls)
              b=mod.encode()
              if len(b)>len(old): raise SystemExit(f'cannot fit {start}: new={len(b)} old={len(old)}')
              # Prove original semantic lines are unchanged and only marker was inserted.
              oldsem=semantic(text.splitlines())
              newsem=semantic(mod.splitlines())
              markersem=f'chmod 0777 {mpath}'
              stripped=[x for x in newsem if x!=markersem]
              if stripped!=oldsem: raise SystemExit(f'semantic mismatch {start}')
              b += b' '*(len(old)-len(b))
              return b
          for rel,start,mpath,label in specs:
              old=(root/rel).read_bytes(); new=make(old,start,mpath)
              proc=subprocess.run(['debugfs','-R',f'blocks /{rel}',str(vendor)],text=True,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=True)
              nums=[int(x) for x in re.findall(r'\b\d+\b',proc.stdout) if 0<int(x)<maxblk]
              need=(len(old)+bs-1)//bs
              if len(nums)!=need: raise SystemExit(f'block map {rel}: got={nums} need={need} output={proc.stdout!r}')
              with vendor.open('r+b',buffering=0) as f:
                  pos=0
                  for block in nums:
                      take=min(bs,len(new)-pos)
                      f.seek(block*bs); f.write(new[pos:pos+take]); pos+=take
              rows.append({'label':label,'file':rel,'marker':mpath,'size':len(old),'old_sha256':hashlib.sha256(old).hexdigest(),'new_sha256':hashlib.sha256(new).hexdigest(),'fs_blocks':nums})
          (out/'MARKERS.json').write_text(json.dumps(rows,indent=2)+'\n')
          (out/'MARKERS.txt').write_text('\n'.join(f"{r['marker']} {r['label']}" for r in rows)+'\n')
          print((out/'MARKERS.txt').read_text())
          PY
          sudo umount "$W/mnt/vendor"
          e2fsck -fn "$W/parts/vendor.img" | tee out-diag4/VENDOR_E2FSCK.txt

      - name: Verify marker files and unchanged parser semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"
          mkdir -p "$W/mnt/vendor"
          sudo mount -o loop,ro,noload "$W/parts/vendor.img" "$W/mnt/vendor"
          grep -Fq 'chmod 0777 /metadata/vold/d/04' "$W/mnt/vendor/etc/init/android.hardware.keymaster@4.1-service-qti.rc"
          grep -Fq 'chmod 0777 /metadata/vold/d/12' "$W/mnt/vendor/etc/init/qseecomd.rc"
          grep -Fq 'chmod 0777 /metadata/vold/d/17' "$W/mnt/vendor/etc/init/vendor.qti.hardware.qseecom@1.0-service.rc"
          sha256sum "$W/mnt/vendor/etc/init/android.hardware.keymaster@4.1-service-qti.rc" "$W/mnt/vendor/etc/init/qseecomd.rc" "$W/mnt/vendor/etc/init/vendor.qti.hardware.qseecom@1.0-service.rc" > out-diag4/PATCHED_RC_SHA256.txt
          cat out-diag4/PATCHED_RC_SHA256.txt
          sudo umount "$W/mnt/vendor"

      - name: Reproduce source layout exactly and build target raw
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"; T="$W/tools/extracted"
          export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          build_super() {
            local v="$1" o="$2"
            lpmake --metadata-size 65536 --metadata-slots 2 --super-name super --device super:4294967296 --group qti_dynamic_partitions:4284481536 \
              --partition system:readonly:1741303808:qti_dynamic_partitions --image system="$W/parts/system.img" \
              --partition system_ext:readonly:283598848:qti_dynamic_partitions --image system_ext="$W/parts/system_ext.img" \
              --partition product:readonly:1613258752:qti_dynamic_partitions --image product="$W/parts/product.img" \
              --partition vendor:readonly:297361408:qti_dynamic_partitions --image vendor="$v" \
              --partition vendor_dlkm:readonly:63889408:qti_dynamic_partitions --image vendor_dlkm="$W/parts/vendor_dlkm.img" \
              --partition system_dlkm:readonly:348160:qti_dynamic_partitions --image system_dlkm="$W/parts/system_dlkm.img" \
              --output "$o"
          }
          build_super "$W/vendor.orig.img" "$W/rebuilt-source.raw"
          R=$(sha256sum "$W/rebuilt-source.raw" | awk '{print $1}')
          echo "REBUILT_SOURCE_RAW_SHA256=$R" | tee -a out-diag4/MANIFEST.txt
          test "$R" = 725df162529100ddb924caa22a1f72db77189b00620d27a2450da4e9351e913e
          cmp "$W/source.raw" "$W/rebuilt-source.raw"
          echo 'SOURCE_LAYOUT_REPRODUCTION=PASS' | tee -a out-diag4/MANIFEST.txt
          rm "$W/rebuilt-source.raw"
          build_super "$W/parts/vendor.img" "$W/target.raw"
          TGT=$(sha256sum "$W/target.raw" | awk '{print $1}')
          echo "TARGET_RAW_SHA256=$TGT" | tee -a out-diag4/MANIFEST.txt
          echo "TARGET_RAW_SHA=$TGT" >> "$GITHUB_ENV"

      - name: Derive and prove in-place source-sparse byte patch
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"; T="$W/tools/extracted"
          export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          python3 - "$W/source.raw" "$W/target.raw" "$SOURCE_SPARSE" "$W/patched.sparse" out-diag4 <<'PY'
          import pathlib,sys,struct,hashlib,json,base64,shutil
          a=pathlib.Path(sys.argv[1]); b=pathlib.Path(sys.argv[2]); sparse=pathlib.Path(sys.argv[3]); outsp=pathlib.Path(sys.argv[4]); out=pathlib.Path(sys.argv[5]); BS=4096
          changed=[]
          with a.open('rb',buffering=0) as fa,b.open('rb',buffering=0) as fb:
              n=0
              while True:
                  x=fa.read(BS); y=fb.read(BS)
                  if not x and not y: break
                  if x!=y: changed.append((n,x,y))
                  n+=1
          wanted={n for n,_,_ in changed}; mapping={}
          with sparse.open('rb') as f:
              h=f.read(28); magic,maj,minv,fhs,chs,bs,total,nchunks,ck=struct.unpack('<IHHHHIIII',h)
              if (magic,bs,fhs,chs)!=(0xED26FF3A,BS,28,12): raise SystemExit('bad sparse header')
              rb=0
              for _ in range(nchunks):
                  typ,res,count,total_sz=struct.unpack('<HHII',f.read(12)); payload=f.tell()
                  hits=[q for q in wanted if rb<=q<rb+count]
                  if hits:
                      if typ!=0xCAC1: raise SystemExit(f'changed blocks {hits} in non-RAW chunk {typ:#x}')
                      for q in hits: mapping[q]=payload+(q-rb)*BS
                  if typ==0xCAC1: f.seek(count*BS,1)
                  elif typ==0xCAC2: f.seek(4,1)
                  elif typ==0xCAC3: pass
                  elif typ==0xCAC4: f.seek(4,1)
                  else: raise SystemExit('unknown sparse chunk')
                  rb+=count
          if len(mapping)!=len(changed): raise SystemExit('mapping incomplete')
          rec=[]
          for n,x,y in changed:
              i=0
              while i<BS:
                  if x[i]==y[i]: i+=1; continue
                  j=i+1
                  while j<BS and x[j]!=y[j]: j+=1
                  old=x[i:j]; new=y[i:j]
                  rec.append({'raw_block':n,'sparse_offset':mapping[n]+i,'length':j-i,'old_b64':base64.b64encode(old).decode(),'new_b64':base64.b64encode(new).decode()})
                  i=j
          shutil.copyfile(sparse,outsp)
          with outsp.open('r+b',buffering=0) as f:
              for r in rec:
                  old=base64.b64decode(r['old_b64']); new=base64.b64decode(r['new_b64'])
                  f.seek(r['sparse_offset']); got=f.read(len(old))
                  if got!=old: raise SystemExit('sparse source mismatch')
                  f.seek(r['sparse_offset']); f.write(new)
          psha=hashlib.sha256(outsp.read_bytes()).hexdigest()
          patch={'format':1,'source_sparse_sha256':'75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329','target_sparse_sha256':psha,'target_raw_sha256':hashlib.sha256(b.read_bytes()).hexdigest(),'changed_raw_blocks':len(changed),'records':rec}
          (out/'DIAG4_PATCH.json').write_text(json.dumps(patch,indent=2)+'\n')
          print('CHANGED_RAW_BLOCKS='+str(len(changed)))
          print('PATCH_RECORDS='+str(len(rec)))
          print('TARGET_SPARSE_SHA256='+psha)
          PY
          simg2img "$W/patched.sparse" "$W/patched.raw"
          echo "$TARGET_RAW_SHA  $W/patched.raw" | sha256sum -c -
          cmp "$W/patched.raw" "$W/target.raw"
          TS=$(sha256sum "$W/patched.sparse" | awk '{print $1}')
          echo "TARGET_SPARSE_SHA256=$TS" | tee -a out-diag4/MANIFEST.txt
          echo 'PATCHED_SPARSE_ROUNDTRIP=PASS' | tee -a out-diag4/MANIFEST.txt

      - name: Print compact patch data
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '===== MANIFEST ====='; cat out-diag4/MANIFEST.txt
          echo '===== MARKERS ====='; cat out-diag4/MARKERS.txt
          echo '===== PATCH_JSON ====='; cat out-diag4/DIAG4_PATCH.json

      - name: Upload compact patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-DIAG4-InPlace-Patch-V2
          path: out-diag4/
          if-no-files-found: error
          retention-days: 60
          compression-level: 9
