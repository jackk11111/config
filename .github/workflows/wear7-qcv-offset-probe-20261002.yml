name: Wear7 QCV SKU setprop one-byte bisect map

on:
  push:
    branches: [wear7-diag4-init-bisect-20261002]
    paths:
      - '.github/workflows/wear7-qcv-offset-probe-20261002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download exact DIAG3 release super
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p parts
          gh release download wear7-diag3-final-20261002 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' \
            --dir parts
          cat parts/super_WEAR7_V11_DIAG3_FINAL.img.part* > super.img
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  super.img' | sha256sum -c -

      - name: Map minimal SKU setprop neutralization
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import mmap, struct, hashlib, pathlib

          p = pathlib.Path('super.img')
          with p.open('rb') as f:
              mm = mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ)
              try:
                  magic, major, minor, file_hdr_sz, chunk_hdr_sz, blk_sz, total_blks, total_chunks, checksum = struct.unpack('<IHHHHIIII', mm[:28])
                  if magic != 0xED26FF3A or blk_sz != 4096:
                      raise SystemExit(f'BAD_SPARSE_HEADER magic={magic:#x} blk={blk_sz}')

                  comment = b'    # Set ro.boot.product.vendor.sku to soc_name\n'
                  exec_line = b'    exec u:r:vendor_qti_init_shell:s0 -- /vendor/bin/init.qti.qcv.sh\n'
                  post_line = b'    setprop ro.boot.product.vendor.sku ${ro.vendor.qti.soc_name}\n'
                  prefix = b'on early-init\n' + comment + exec_line + post_line
                  base = mm.find(prefix)
                  if base < 0 or mm.find(prefix, base + 1) >= 0:
                      raise SystemExit('QCV_PREFIX_NOT_UNIQUE')
                  sparse_post = base + len(b'on early-init\n') + len(comment) + len(exec_line)

                  def sparse_to_raw(sp):
                      pos = file_hdr_sz
                      raw_block = 0
                      for _ in range(total_chunks):
                          typ, reserved, count, total_sz = struct.unpack('<HHII', mm[pos:pos+12])
                          data = pos + chunk_hdr_sz
                          if typ == 0xCAC1:
                              end = data + count * blk_sz
                              if data <= sp < end:
                                  raw_off = raw_block * blk_sz + (sp - data)
                                  return raw_off, data, raw_block, count
                          pos += total_sz
                          raw_block += count
                      raise SystemExit('POST_NOT_IN_RAW_CHUNK')

                  raw_post, chunk_data, chunk_raw_start, chunk_count = sparse_to_raw(sparse_post)
                  block, in_post = divmod(raw_post, blk_sz)
                  sparse_block = chunk_data + (block - chunk_raw_start) * blk_sz
                  original = bytearray(mm[sparse_block:sparse_block+blk_sz])
                  if block != 904056 or in_post != 444:
                      raise SystemExit(f'UNEXPECTED_LOCATION block={block} in_post={in_post}')
                  if hashlib.sha256(original).hexdigest() != 'c64bdbdebc7cbeef49b2d7501d28fdd857578cccfd6070dee32eb3bb80e806a9':
                      raise SystemExit('ORIGINAL_BLOCK_SHA_MISMATCH')
                  if original[in_post:in_post+len(post_line)] != post_line:
                      raise SystemExit('POST_SOURCE_MISMATCH')

                  patch_off = in_post + 4
                  if original[patch_off] != ord('s'):
                      raise SystemExit(f'OLD_BYTE_MISMATCH={original[patch_off]:02x}')
                  patched = bytearray(original)
                  patched[patch_off] = ord('#')

                  diffs = [(i,a,b) for i,(a,b) in enumerate(zip(original,patched)) if a != b]
                  if diffs != [(448,0x73,0x23)]:
                      raise SystemExit(f'NOT_ONE_BYTE={diffs}')
                  target_sha = hashlib.sha256(patched).hexdigest()
                  result_line = bytes(patched[in_post:in_post+len(post_line)])

                  print('===== QCV SKU SETPROP ONE-BYTE BISECT =====')
                  print(f'RAW_BLOCK={block}')
                  print(f'RAW_BLOCK_OFFSET={block*blk_sz}')
                  print(f'SETPROP_LINE_OFFSET_IN_BLOCK={in_post}')
                  print(f'PATCH_OFFSET_IN_BLOCK={patch_off}')
                  print('OLD_BYTE_HEX=73')
                  print('NEW_BYTE_HEX=23')
                  print('ORIGINAL_BLOCK_SHA256='+hashlib.sha256(original).hexdigest())
                  print('TARGET_BLOCK_SHA256='+target_sha)
                  print('ORIGINAL_LINE='+post_line.decode().rstrip())
                  print('PATCHED_LINE='+result_line.decode().rstrip())
                  print('CHANGED_BYTES=1')
                  print('SEMANTICS=neutralize_only_ro.boot.product.vendor.sku_setprop_keep_qcv_exec_unchanged')
                  print('RESULT=QCV_SKU_ONE_BYTE_MAP_PASS')
              finally:
                  mm.close()
          PY
