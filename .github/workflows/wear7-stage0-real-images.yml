name: Wear7 real Stage0 software image build

on:
  push:
    branches: [wear7-rom-staging]
    paths:
      - '.github/workflows/wear7-stage0-real-images.yml'
      - 'wear7/scripts/apply_stage0_overlay_v8.py'
      - 'wear7/scripts/reconstruct_block_ota.py'
      - 'wear7/scripts/generate_exact_fs_config.py'
      - 'wear7/scripts/fs_semantic_manifest.py'
      - 'wear7/manifests/STAGE0_SOURCE_HASHES.tsv'
      - 'wear7/manifests/STAGE0_POLICY.txt'
      - 'wear7/manifests/STAGE0_PROPERTIES.txt'
      - 'wear7/TRIGGER_REAL_STAGE0*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIXEL_FILE: solios-cp2a.260603.001.s1-factory-d203665c.zip
  PIXEL_SHA256: d203665c90bc06bf175dbb3cbd7fcc9d212c056a030f9c51b541129e8651fb7d
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d
  KERNEL_BUILD_TOOLS_SHA: 010d8a83d84ced4beef7779453766350db8c08cd

jobs:
  build-stage0:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install host helpers
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip e2fsprogs android-sdk-libsparse-utils attr libcap2-bin file python3

      - name: Pin proven Android filesystem tools
        shell: bash
        run: |
          set -euxo pipefail
          REPO='https://android.googlesource.com/kernel/prebuilts/build-tools'
          git clone --filter=blob:none --no-checkout "$REPO" "$RUNNER_TEMP/kernel-build-tools"
          git -C "$RUNNER_TEMP/kernel-build-tools" fetch --depth=1 origin "$KERNEL_BUILD_TOOLS_SHA"
          git -C "$RUNNER_TEMP/kernel-build-tools" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/kernel-build-tools" rev-parse HEAD)" = "$KERNEL_BUILD_TOOLS_SHA"
          B="$RUNNER_TEMP/kernel-build-tools/linux-x86/bin"
          for c in mkuserimg_mke2fs mke2fs e2fsdroid simg2img tune2fs avbtool; do
            test -x "$B/$c" || { echo "missing pinned tool: $c"; exit 20; }
          done
          echo "$B" >> "$GITHUB_PATH"

      - name: Download and hash-lock both exact sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/work" wear7-stage0-real-report
          cd "$RUNNER_TEMP/src"
          curl -fL --retry 3 --retry-delay 3 -o "$PIXEL_FILE" "https://dl.google.com/dl/android/aosp/$PIXEL_FILE"
          echo "$PIXEL_SHA256  $PIXEL_FILE" | sha256sum -c -
          curl -fL --retry 3 --retry-delay 3 -o ticwatch379.zip "$TIC_URL"
          echo "$TIC_SHA256  ticwatch379.zip" | sha256sum -c -
          {
            echo "pixel=$PIXEL_FILE"
            echo "pixel_sha256=$PIXEL_SHA256"
            echo "ticwatch_sha256=$TIC_SHA256"
            echo "toolchain_sha=$KERNEL_BUILD_TOOLS_SHA"
          } > "$GITHUB_WORKSPACE/wear7-stage0-real-report/INPUTS.txt"

      - name: Extract exact Pixel software partitions without AVB footers
        shell: bash
        run: |
          set -euxo pipefail
          FACTORY="$RUNNER_TEMP/src/$PIXEL_FILE"
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-stage0-real-report"
          nested=$(unzip -Z1 "$FACTORY" | grep -E '(^|/)image-[^/]+\.zip$' | head -n1)
          test -n "$nested"
          unzip -p "$FACTORY" "$nested" > "$WORK/pixel-inner.zip"
          for p in system system_ext product; do
            unzip -p "$WORK/pixel-inner.zip" "$p.img" > "$WORK/$p.input"
            magic=$(od -An -tx4 -N4 "$WORK/$p.input" | tr -d ' \n')
            if test "$magic" = ed26ff3a; then
              simg2img "$WORK/$p.input" "$WORK/$p.raw"
              rm -f "$WORK/$p.input"
            else
              mv "$WORK/$p.input" "$WORK/$p.raw"
            fi
            avbtool info_image --image "$WORK/$p.raw" > "$OUT/${p}_donor_avb_info.txt"
            avbtool erase_footer --image "$WORK/$p.raw"
            e2fsck -fn "$WORK/$p.raw" > "$OUT/${p}_donor_noavb_fsck.txt" 2>&1 || rc=$?
            rc=${rc:-0}; test "$rc" -lt 8; unset rc
            stat -c "$p donor_noavb_bytes=%s" "$WORK/$p.raw" >> "$OUT/DONOR_FS_SIZES.txt"
          done

      - name: Reconstruct stock TicWatch Stage0 source partitions
        shell: bash
        run: |
          set -euxo pipefail
          OTA="$RUNNER_TEMP/src/ticwatch379.zip"
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-stage0-real-report"
          for p in system system_ext product; do
            python3 wear7/scripts/reconstruct_block_ota.py "$OTA" "$p" "$WORK/tic-$p.raw"
            e2fsck -fn "$WORK/tic-$p.raw" > "$OUT/tic_${p}_fsck.txt" 2>&1 || rc=$?
            rc=${rc:-0}; test "$rc" -lt 8; unset rc
          done

      - name: Recreate and verify frozen 8-file Stage0 bundle from stock 379
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-stage0-real-report"
          BUNDLE="$WORK/stage0-bundle"
          sudo mkdir -p "$WORK/tic-system-mnt" "$WORK/tic-systemext-mnt" "$WORK/tic-product-mnt"
          sudo mount -o loop,ro "$WORK/tic-system.raw" "$WORK/tic-system-mnt"
          sudo mount -o loop,ro "$WORK/tic-system_ext.raw" "$WORK/tic-systemext-mnt"
          sudo mount -o loop,ro "$WORK/tic-product.raw" "$WORK/tic-product-mnt"
          mkdir -p "$BUNDLE/manifests" \
            "$BUNDLE/payload/system/priv-app/TicCompanionWear" \
            "$BUNDLE/payload/product/overlay/DaceEnduroFastPairOverlay" \
            "$BUNDLE/payload/system_ext/lib"
          cp wear7/manifests/STAGE0_SOURCE_HASHES.tsv "$BUNDLE/manifests/SOURCE_HASHES.tsv"

          one_match() {
            root=$1; name=$2
            mapfile -t a < <(sudo find "$root" -type f -name "$name" -print)
            test "${#a[@]}" = 1 || { printf 'expected one %s, got %s\n' "$name" "${#a[@]}" >&2; printf '%s\n' "${a[@]}" >&2; exit 41; }
            printf '%s\n' "${a[0]}"
          }

          sudo cp "$(one_match "$WORK/tic-system-mnt" TicCompanionWear.apk)" \
            "$BUNDLE/payload/system/priv-app/TicCompanionWear/TicCompanionWear.apk"
          sudo cp "$(one_match "$WORK/tic-product-mnt" DaceEnduroFastPairOverlay.apk)" \
            "$BUNDLE/payload/product/overlay/DaceEnduroFastPairOverlay/DaceEnduroFastPairOverlay.apk"
          for f in \
            libdisplayconfig.system.qti.so \
            libgralloc.system.qti.so \
            vendor.display.config@2.0.so \
            android.hardware.radio@1.5.so \
            android.hardware.radio@1.6.so \
            vendor.google_clockwork.wristorientation@1.0.so; do
            sudo cp "$(one_match "$WORK/tic-systemext-mnt" "$f")" "$BUNDLE/payload/system_ext/lib/$f"
          done
          sudo umount "$WORK/tic-system-mnt" "$WORK/tic-systemext-mnt" "$WORK/tic-product-mnt"
          sudo chown -R "$(id -u):$(id -g)" "$BUNDLE"

          python3 - <<'PY'
          import csv, hashlib, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'work/stage0-bundle'
          rows=list(csv.DictReader((root/'manifests/SOURCE_HASHES.tsv').open(), delimiter='\t'))
          if len(rows)!=8: raise SystemExit(f'expected 8 Stage0 rows, got {len(rows)}')
          for row in rows:
              p=root/row['bundle_path']
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              if h != row['sha256']:
                  raise SystemExit(f'SHA mismatch {row["bundle_path"]}: {h} != {row["sha256"]}')
          print('STAGE0_8_OF_8_HASH_LOCK=PASS')
          PY
          file "$BUNDLE"/payload/system_ext/lib/*.so | tee "$OUT/STAGE0_BRIDGE_FILE.txt"
          test "$(grep -c 'ELF 32-bit' "$OUT/STAGE0_BRIDGE_FILE.txt")" = 6

      - name: Copy exact Pixel trees and preserve donor metadata
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-stage0-real-report"
          for p in system system_ext product; do sudo mkdir -p "$WORK/$p-mnt" "$WORK/stage-$p"; done
          sudo mount -o loop,ro "$WORK/system.raw" "$WORK/system-mnt"
          sudo mount -o loop,ro "$WORK/system_ext.raw" "$WORK/system_ext-mnt"
          sudo mount -o loop,ro "$WORK/product.raw" "$WORK/product-mnt"
          sudo cp -a "$WORK/system-mnt/." "$WORK/stage-system/"
          sudo cp -a "$WORK/system_ext-mnt/." "$WORK/stage-system_ext/"
          sudo cp -a "$WORK/product-mnt/." "$WORK/stage-product/"
          sudo python3 wear7/scripts/fs_semantic_manifest.py "$WORK/system-mnt" "$OUT/system_donor_manifest.tsv"
          sudo python3 wear7/scripts/fs_semantic_manifest.py "$WORK/system_ext-mnt" "$OUT/system_ext_donor_manifest.tsv"
          sudo python3 wear7/scripts/fs_semantic_manifest.py "$WORK/product-mnt" "$OUT/product_donor_manifest.tsv"
          sudo umount "$WORK/system-mnt" "$WORK/system_ext-mnt" "$WORK/product-mnt"

      - name: Apply frozen real Stage0 policy to all three Pixel trees
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-stage0-real-report"
          sudo python3 wear7/scripts/apply_stage0_overlay_v8.py \
            --system-root "$WORK/stage-system" \
            --system-ext-root "$WORK/stage-system_ext" \
            --product-root "$WORK/stage-product" \
            --stage0-bundle "$WORK/stage0-bundle" \
            --report "$OUT/STAGE0_APPLY.txt"
          grep -q '^WEAR7_STAGE0_APPLY=PASS$' "$OUT/STAGE0_APPLY.txt"
          sudo python3 wear7/scripts/generate_exact_fs_config.py "$WORK/stage-system" '' "$WORK/system.fs_config"
          sudo python3 wear7/scripts/generate_exact_fs_config.py "$WORK/stage-system_ext" system_ext "$WORK/system_ext.fs_config"
          sudo python3 wear7/scripts/generate_exact_fs_config.py "$WORK/stage-product" product "$WORK/product.fs_config"
          sudo cp "$WORK/stage-system/system/etc/selinux/plat_file_contexts" "$WORK/plat_file_contexts"
          sudo cp "$WORK/stage-system_ext/etc/selinux/system_ext_file_contexts" "$WORK/system_ext_file_contexts"
          sudo cp "$WORK/stage-product/etc/selinux/product_file_contexts" "$WORK/product_file_contexts"
          sudo sh -c "cat '$WORK/plat_file_contexts' '$WORK/system_ext_file_contexts' > '$WORK/system_ext_combined_file_contexts'"
          sudo sh -c "cat '$WORK/plat_file_contexts' '$WORK/product_file_contexts' > '$WORK/product_combined_file_contexts'"
          sudo chown "$(id -u):$(id -g)" "$WORK"/*.fs_config "$WORK"/*file_contexts
          chmod 0644 "$WORK"/*.fs_config "$WORK"/*file_contexts

      - name: Rebuild modified Android 17 software filesystems with controlled margins
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-stage0-real-report"
          B="$RUNNER_TEMP/kernel-build-tools/linux-x86/bin"
          build_one() {
            p=$1; mountp=$2; extra=$3; contexts=$4
            donor="$WORK/$p.raw"; stage="$WORK/stage-$p"; cfg="$WORK/$p.fs_config"; rebuilt="$WORK/$p.stage0.raw"
            old=$(stat -c %s "$donor")
            new=$(( (old + extra + 4095) / 4096 * 4096 ))
            uuid=$(tune2fs -l "$donor" | awk -F: '/Filesystem UUID:/ {gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2; exit}')
            hashseed=$(debugfs -R stats "$donor" 2>/dev/null | awk -F: '/Directory Hash Seed:/ {gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2; exit}')
            inode=$(tune2fs -l "$donor" | awk -F: '/Inode count:/ {gsub(/ /,"",$2); print $2; exit}')
            inode=$((inode + 128))
            args=(
              "$stage" "$rebuilt" ext4 "$mountp" "$new" "$contexts"
              --journal_size 0
              --timestamp 1230768000
              --fs_config "$cfg"
              --label "$p"
              --inodes "$inode"
              --inode_size 256
              --reserved_percent 0
              --mke2fs_uuid "$uuid"
              --share_dup_blocks
            )
            if test -n "$hashseed"; then args+=(--mke2fs_hash_seed "$hashseed"); fi
            sudo env PATH="$B:$PATH" "$B/mkuserimg_mke2fs" "${args[@]}" | tee "$OUT/${p}_mkuserimg.log"
            sudo chown "$(id -u):$(id -g)" "$rebuilt"
            e2fsck -fn "$rebuilt" > "$OUT/${p}_stage0_fsck.txt" 2>&1 || rc=$?
            rc=${rc:-0}; test "$rc" -lt 8; unset rc
            printf '%s\tdonor_noavb=%s\tstage0_noavb=%s\tdelta=%s\n' "$p" "$old" "$new" "$((new-old))" >> "$OUT/REBUILT_SIZES.tsv"
          }
          build_one system / $((32*1024*1024)) "$WORK/plat_file_contexts"
          build_one system_ext /system_ext $((16*1024*1024)) "$WORK/system_ext_combined_file_contexts"
          build_one product /product $((8*1024*1024)) "$WORK/product_combined_file_contexts"

      - name: Mount rebuilt images and enforce Stage0 invariants
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-stage0-real-report"
          for p in system system_ext product; do sudo mkdir -p "$WORK/rebuilt-$p-mnt"; sudo mount -o loop,ro "$WORK/$p.stage0.raw" "$WORK/rebuilt-$p-mnt"; done
          SYS="$WORK/rebuilt-system-mnt"; SX="$WORK/rebuilt-system_ext-mnt"; PROD="$WORK/rebuilt-product-mnt"

          test ! -e "$SYS/system/etc/vintf/compatibility_matrix.device.xml"
          test ! -e "$SX/etc/permissions/display_offload_feature.xml"
          test ! -e "$SX/etc/vintf/compatibility_matrix_google_battery.xml"
          test ! -e "$SX/etc/vintf/compatibility_matrix_wac_management.xml"
          test ! -e "$SX/etc/vintf/compatibility_matrix_watch_charger.xml"
          ! grep -q 'vendor.google_clockwork.displayoffload' "$SYS/system/etc/vintf/wear_compatibility_matrix.7.xml"
          grep -q 'vendor.google_clockwork.wristorientation' "$SYS/system/etc/vintf/wear_compatibility_matrix.7.xml"

          for kv in \
            'ro.oem.home_package_names=com.mobvoi.companion.aw' \
            'ro.oem.key1=TicWatchPro5Enduro' \
            'config.enable_wristorientation=1' \
            'config.use_aidl_api_for_display_offload=0' \
            'ro.wear.comms.offload.enabled=false'; do grep -qxF "$kv" "$SYS/system/build.prop"; done

          python3 - <<'PY'
          import csv, hashlib, os, pathlib
          work=pathlib.Path(os.environ['RUNNER_TEMP'])/'work'
          rows=list(csv.DictReader(pathlib.Path('wear7/manifests/STAGE0_SOURCE_HASHES.tsv').open(), delimiter='\t'))
          for r in rows:
              src=r['bundle_path']
              if src.endswith('TicCompanionWear.apk'):
                  dst=work/'rebuilt-system-mnt/system/priv-app/TicCompanionWear/TicCompanionWear.apk'
              elif src.endswith('DaceEnduroFastPairOverlay.apk'):
                  dst=work/'rebuilt-product-mnt/overlay/DaceEnduroFastPairOverlay/DaceEnduroFastPairOverlay.apk'
              else:
                  dst=work/'rebuilt-system_ext-mnt/lib'/pathlib.Path(src).name
              got=hashlib.sha256(dst.read_bytes()).hexdigest()
              if got != r['sha256']: raise SystemExit(f'{dst}: {got} != {r["sha256"]}')
          print('STAGE0_REBUILT_8_OF_8=PASS')
          PY

          file "$SX"/lib/libdisplayconfig.system.qti.so \
               "$SX"/lib/libgralloc.system.qti.so \
               "$SX"/lib/vendor.display.config@2.0.so \
               "$SX"/lib/android.hardware.radio@1.5.so \
               "$SX"/lib/android.hardware.radio@1.6.so \
               "$SX"/lib/vendor.google_clockwork.wristorientation@1.0.so \
               | tee "$OUT/REBUILT_BRIDGE_FILE.txt"
          test "$(grep -c 'ELF 32-bit' "$OUT/REBUILT_BRIDGE_FILE.txt")" = 6

          getfattr -n security.selinux -e text "$SYS/system/priv-app/TicCompanionWear/TicCompanionWear.apk" | tee "$OUT/NEW_PATH_SELINUX.txt"
          getfattr -n security.selinux -e text "$PROD/overlay/DaceEnduroFastPairOverlay/DaceEnduroFastPairOverlay.apk" | tee -a "$OUT/NEW_PATH_SELINUX.txt"
          for f in "$SX"/lib/libdisplayconfig.system.qti.so "$SX"/lib/libgralloc.system.qti.so "$SX"/lib/vendor.display.config@2.0.so "$SX"/lib/android.hardware.radio@1.5.so "$SX"/lib/android.hardware.radio@1.6.so "$SX"/lib/vendor.google_clockwork.wristorientation@1.0.so; do getfattr -n security.selinux -e text "$f" >> "$OUT/NEW_PATH_SELINUX.txt"; done
          test "$(grep -c 'security.selinux=' "$OUT/NEW_PATH_SELINUX.txt")" -ge 8

          sudo python3 wear7/scripts/fs_semantic_manifest.py "$SYS" "$OUT/system_stage0_manifest.tsv"
          sudo python3 wear7/scripts/fs_semantic_manifest.py "$SX" "$OUT/system_ext_stage0_manifest.tsv"
          sudo python3 wear7/scripts/fs_semantic_manifest.py "$PROD" "$OUT/product_stage0_manifest.tsv"
          sudo umount "$SYS" "$SX" "$PROD"
          sudo chown "$(id -u):$(id -g)" "$OUT"/*manifest.tsv

      - name: Final real-image Stage0 verdict
        shell: bash
        run: |
          set -euxo pipefail
          OUT=wear7-stage0-real-report
          {
            echo 'WEAR7_REAL_STAGE0_SOFTWARE_IMAGES=PASS'
            echo 'SYSTEM_EXT_SEMANTIC_ROUNDTRIP_BASELINE=PASS'
            echo 'STAGE0_PAYLOAD_HASH_LOCK=PASS'
            echo 'STAGE0_REBUILT_FSCK=PASS'
            echo 'STAGE0_NEW_PATH_SELINUX_LABELS=PRESENT'
            echo
            cat "$OUT/REBUILT_SIZES.tsv"
          } | tee "$OUT/SUMMARY.txt"
          find "$OUT" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/REPORT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wear7-Real-Stage0-Software-Image-Reports
          path: wear7-stage0-real-report/
          retention-days: 30
          compression-level: 9
