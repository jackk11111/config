name: Wear7 official Android17 checkvintf V5 final gate

on:
  workflow_dispatch:
  push:
    branches: [wear7-rom-staging]
    paths: ['.github/workflows/wear7-official-checkvintf-v5.yml']

permissions:
  contents: read
  actions: read

env:
  FINAL_RUN_ID: '35082309709'
  OTATOOLS_URL: https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
  TICWATCH_FIRST_API_LEVEL: '30'
  TICWATCH_VENDOR_SKU: monaco

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: wear7-rom-staging, fetch-depth: 1}
      - name: Prepare host
        run: |
          set -Eeuo pipefail
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/share/boost /usr/local/lib/android/sdk/ndk || true
          sudo apt-get update >/dev/null
          sudo apt-get install -y curl unzip file android-sdk-libsparse-utils e2fsprogs erofs-utils >/dev/null
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/ota" "$RUNNER_TEMP/parts" "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/apex" report
      - name: Download V5 super
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: Wear7-Final-V5-Super, path: '${{ runner.temp }}/candidate', github-token: '${{ secrets.GITHUB_TOKEN }}', repository: '${{ github.repository }}', run-id: '${{ env.FINAL_RUN_ID }}'}
      - name: Pin official Android17 host tools
        run: |
          set -Eeuo pipefail
          ZIP="$RUNNER_TEMP/ota/otatools.zip"; curl -fL --retry 3 -o "$ZIP" "$OTATOOLS_URL"
          test "$(sha256sum "$ZIP"|awk '{print $1}')" = f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84
          python3 - "$ZIP" "$RUNNER_TEMP/ota/x" <<'PY'
          import sys,zipfile,pathlib
          z=zipfile.ZipFile(sys.argv[1]); out=pathlib.Path(sys.argv[2]); bins={'bin/checkvintf','bin/lpunpack','bin/apexd_host','bin/deapexer','bin/debugfs','bin/debugfs_static','bin/fsck.erofs'}
          keep=[n for n in z.namelist() if n in bins or n.startswith('lib64/') or n.startswith('lib/')]
          for n in keep:z.extract(n,out)
          PY
          BIN="$RUNNER_TEMP/ota/x/bin"; test -e "$BIN/debugfs" || ln -s debugfs_static "$BIN/debugfs"; test -e "$BIN/debugfs_static" || ln -s debugfs "$BIN/debugfs_static"; chmod +x "$BIN"/*
          echo "CHECKVINTF=$BIN/checkvintf" >> "$GITHUB_ENV"; echo "LPUNPACK=$BIN/lpunpack" >> "$GITHUB_ENV"; echo "APEXD_HOST=$BIN/apexd_host" >> "$GITHUB_ENV"; echo "HOSTROOT=$RUNNER_TEMP/ota/x" >> "$GITHUB_ENV"
      - name: Unpack and mount V5
        run: |
          set -Eeuo pipefail
          SUPER="$RUNNER_TEMP/candidate/super.img"; test "$(sha256sum "$SUPER"|awk '{print $1}')" = 8a9f0caebda3c5a9d1f7e36f2dc67f6f7f7da4a6759e5f89f753ea02635c1a42
          simg2img "$SUPER" "$RUNNER_TEMP/super.raw"; env LD_LIBRARY_PATH="$HOSTROOT/lib64:$HOSTROOT/lib" "$LPUNPACK" "$RUNNER_TEMP/super.raw" "$RUNNER_TEMP/parts"
          for p in system system_ext product vendor; do img="$RUNNER_TEMP/parts/$p.img"; sudo mkdir -p "$RUNNER_TEMP/mnt/$p"; fs="$(blkid -s TYPE -o value "$img"||true)"; case "$fs" in ext4) sudo mount -o loop,ro "$img" "$RUNNER_TEMP/mnt/$p";; erofs) sudo mount -t erofs -o loop,ro "$img" "$RUNNER_TEMP/mnt/$p";; *) exit 1;; esac; done
          if test -d "$RUNNER_TEMP/mnt/system/system/etc/vintf"; then SYS="$RUNNER_TEMP/mnt/system/system"; else SYS="$RUNNER_TEMP/mnt/system"; fi
          echo "SYS=$SYS" >> "$GITHUB_ENV"; echo "SX=$RUNNER_TEMP/mnt/system_ext" >> "$GITHUB_ENV"; echo "PROD=$RUNNER_TEMP/mnt/product" >> "$GITHUB_ENV"; echo "VEN=$RUNNER_TEMP/mnt/vendor" >> "$GITHUB_ENV"; echo "ODM=$RUNNER_TEMP/mnt/vendor/odm" >> "$GITHUB_ENV"
          grep -q '<version>33</version>' "$SYS/etc/vintf/manifest.xml"; test -e "$SYS/apex/com.android.vndk.current/apex_manifest.pb"; test -s "$SYS/etc/vintf/compatibility_matrix.dace.xml"
      - name: Activate APEX and run official checkvintf
        run: |
          set -Eeuo pipefail
          env LD_LIBRARY_PATH="$HOSTROOT/lib64:$HOSTROOT/lib" "$APEXD_HOST" --tool_path "$HOSTROOT" --apex_path "$RUNNER_TEMP/apex" --system_path "$SYS" --system_ext_path "$SX" --product_path "$PROD" --vendor_path "$VEN" --odm_path "$ODM" > report/APEXD_HOST_STDOUT.txt 2> report/APEXD_HOST_STDERR.txt
          test -s "$RUNNER_TEMP/apex/apex-info-list.xml"
          set +e
          env LD_LIBRARY_PATH="$HOSTROOT/lib64:$HOSTROOT/lib" "$CHECKVINTF" --check-compat --dirmap "/system:$SYS" --dirmap "/system_ext:$SX" --dirmap "/product:$PROD" --dirmap "/vendor:$VEN" --dirmap "/odm:$ODM" --dirmap "/apex:$RUNNER_TEMP/apex" --property "ro.product.first_api_level=$TICWATCH_FIRST_API_LEVEL" --property 'ro.boot.product.hardware.sku=' --property "ro.boot.product.vendor.sku=$TICWATCH_VENDOR_SKU" > report/CHECKVINTF_STDOUT.txt 2> report/CHECKVINTF_STDERR.txt
          rc=$?; set -e; echo "CHECKVINTF_EXIT=$rc" | tee report/CHECKVINTF_EXIT.txt; cat report/CHECKVINTF_STDOUT.txt; cat report/CHECKVINTF_STDERR.txt >&2; test "$rc" = 0; tail -n 1 report/CHECKVINTF_STDOUT.txt | grep -q '^COMPATIBLE$'
          printf 'OFFICIAL_CHECKVINTF_V5=PASS\nVNDK33_BRIDGE=PASS\nDACE_MATRIX=PASS\nRECOVERY_ROLLBACK_READY_FOR_FIRST_WEAR7_FLASH=NO\n' > report/OFFICIAL_CHECKVINTF_V5.txt
      - name: Finalize
        if: always()
        run: |
          set -u; for p in system system_ext product vendor; do sudo umount "$RUNNER_TEMP/mnt/$p" 2>/dev/null || true; done; sudo chown -R "$(id -u):$(id -g)" report || true; find report -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > report/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: Wear7-Official-CheckVintf-V5, path: report/, retention-days: 30, compression-level: 9}
