name: Wear7 DIAG3 static init root-cause audit

on:
  push:
    branches: [wear7-diag4-init-bisect-20261002]
    paths:
      - '.github/workflows/wear7-diag3-static-init-audit-20261002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download exact DIAG3 release super
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p parts work/tools work/parts work/mnt report
          gh release download wear7-diag3-final-20261002 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' \
            --dir parts
          cat parts/super_WEAR7_V11_DIAG3_FINAL.img.part* > work/super.img
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  work/super.img' | sha256sum -c -

      - name: Get pinned Android tools and unpack exact logical partitions
        shell: bash
        run: |
          set -Eeuo pipefail
          ZIP=work/tools/otatools.zip
          curl -fL --retry 2 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          echo 'f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84  work/tools/otatools.zip' | sha256sum -c -
          python3 - "$ZIP" work/tools/extracted <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as z:
              for name in z.namelist():
                  if name.startswith(('bin/','lib64/','lib/')):
                      dst=(out/name).resolve()
                      if not dst.is_relative_to(out): raise SystemExit('unsafe tool path')
                      z.extract(name,out)
          PY
          T="$PWD/work/tools/extracted"
          chmod +x "$T/bin/"*
          export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          simg2img work/super.img work/super.raw
          lpunpack work/super.raw work/parts
          for p in system system_ext product vendor; do
            mkdir -p "work/mnt/$p"
            sudo mount -o loop,ro,noload "work/parts/$p.img" "work/mnt/$p"
          done

      - name: Build deterministic init/service/reboot audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee report/STATIC_INIT_AUDIT.txt
          from pathlib import Path
          import re, os, subprocess

          roots = {
              'system': Path('work/mnt/system/system'),
              'system_ext': Path('work/mnt/system_ext'),
              'product': Path('work/mnt/product'),
              'vendor': Path('work/mnt/vendor'),
          }
          order = ['system','system_ext','product','vendor']

          def rc_files(part):
              r=roots[part]/'etc/init'
              return sorted(r.rglob('*.rc')) if r.exists() else []

          actions=[]
          services={}
          power_lines=[]

          trig_re=re.compile(r'^on\s+(.+?)\s*$')
          svc_re=re.compile(r'^service\s+(\S+)\s+(.+?)\s*$')

          for part in order:
              for f in rc_files(part):
                  lines=f.read_text(errors='replace').splitlines()
                  i=0
                  while i < len(lines):
                      s=lines[i]
                      m=trig_re.match(s)
                      if m:
                          trig=m.group(1)
                          block=[]; i+=1
                          while i<len(lines) and (not lines[i] or lines[i][0].isspace() or lines[i].lstrip().startswith('#')):
                              block.append(lines[i]); i+=1
                          actions.append((part,str(f),trig,block))
                          continue
                      m=svc_re.match(s)
                      if m:
                          name=m.group(1); cmd=m.group(2)
                          block=[]; i+=1
                          while i<len(lines) and (not lines[i] or lines[i][0].isspace() or lines[i].lstrip().startswith('#')):
                              block.append(lines[i]); i+=1
                          services[name]=(part,str(f),cmd,block)
                          continue
                      i+=1

          print('===== PARSE ORDER =====')
          for part in order:
              print(part, len(rc_files(part)))

          print('\n===== EARLY-INIT + INIT ACTIONS IN PARSE ORDER =====')
          started=[]
          for part,f,trig,block in actions:
              if trig=='early-init' or trig=='init' or trig.startswith('init '):
                  print(f'[{part}] {f} :: on {trig}')
                  for line in block:
                      t=line.strip()
                      if not t or t.startswith('#'): continue
                      if re.match(r'^(start|restart|exec|exec_start|trigger|mount|setprop|write|chmod|chown|restorecon|mkdir|class_start)\b', t):
                          print('  '+t)
                      mm=re.match(r'^(?:start|restart)\s+(\S+)', t)
                      if mm: started.append((mm.group(1),part,f,trig))
                      if 'sys.powerctl' in t or re.search(r'\breboot\b|\bshutdown\b',t):
                          power_lines.append((part,f,trig,t))

          names=[]
          for n,*_ in started:
              if n not in names: names.append(n)

          print('\n===== STARTED SERVICE DEFINITIONS =====')
          for name in names:
              print(f'--- {name} ---')
              if name not in services:
                  print('MISSING_SERVICE_DEFINITION')
                  continue
              part,f,cmd,block=services[name]
              print('partition='+part)
              print('file='+f)
              print('cmd='+cmd)
              for line in block:
                  t=line.strip()
                  if t and not t.startswith('#'):
                      print('  '+t)
                      if 'reboot_on_failure' in t or t=='critical' or t.startswith('onrestart '):
                          power_lines.append((part,f,'service '+name,t))

          print('\n===== EXPLICIT REBOOT / CRITICAL / ONRESTART SOURCES =====')
          seen=set()
          for row in power_lines:
              if row in seen: continue
              seen.add(row)
              print(' | '.join(row))

          focus=['logd','lmkd','servicemanager','hwservicemanager','vndservicemanager']
          print('\n===== FOCUS SERVICES =====')
          for name in focus:
              print(f'--- {name} ---')
              ent=services.get(name)
              if not ent:
                  print('NO_DEFINITION'); continue
              part,f,cmd,block=ent
              print('partition='+part)
              print('file='+f)
              print('cmd='+cmd)
              for line in block:
                  t=line.strip()
                  if t and not t.startswith('#'): print('  '+t)

          def resolve_exec(cmd):
              exe=cmd.split()[0]
              if not exe.startswith('/'): return None
              candidates=[]
              mapping=[('/system_ext/',roots['system_ext']),('/product/',roots['product']),('/vendor/',roots['vendor']),('/system/',roots['system'])]
              for pref,root in mapping:
                  if exe.startswith(pref):
                      candidates.append(root/exe[len(pref):])
              for p in candidates:
                  if p.exists(): return p
              return None

          print('\n===== FOCUS ELF NEEDED =====')
          for name in focus:
              ent=services.get(name)
              if not ent: continue
              p=resolve_exec(ent[2])
              print(f'--- {name} ---')
              print('path='+str(p) if p else 'path=UNRESOLVED')
              if not p or not p.is_file(): continue
              try:
                  out=subprocess.check_output(['readelf','-d',str(p)],text=True,stderr=subprocess.STDOUT)
                  needed=re.findall(r'\(NEEDED\).*?\[(.*?)\]',out)
                  print('needed=' + ','.join(needed))
              except Exception as e:
                  print('readelf_error='+repr(e))

          print('\n===== GLOBAL REBOOT TOKENS =====')
          token_re=re.compile(r'(sys\.powerctl|reboot_on_failure|\breboot\b|\bshutdown\b)')
          for part in order:
              for f in rc_files(part):
                  for n,line in enumerate(f.read_text(errors='replace').splitlines(),1):
                      if token_re.search(line) and not line.lstrip().startswith('#'):
                          print(f'{part}:{f}:{n}:{line.strip()}')

          print('\nRESULT=STATIC_INIT_AUDIT_PASS')
          PY

      - name: Show audit
        shell: bash
        run: cat report/STATIC_INIT_AUDIT.txt
