name: Wear7 coherent full-date bootchain candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wear7-full-date-bootchain-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download exact Run16 bootchain
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-Dace-Clean-V1-RecoverySafe-Bootchain
          path: ${{ runner.temp }}/run16
          github-token: ${{ github.token }}
          repository: jackk11111/ticwatch-pro5-dace
          run-id: 37287348856

      - name: Download exact property-complete root vbmeta source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-Run16-VBMeta-Stock-HW-Bindings-Hotfix
          path: ${{ runner.temp }}/hotfix
          github-token: ${{ github.token }}
          repository: jackk11111/ticwatch-pro5-dace
          run-id: 37311472755

      - name: Pin qualified avbtool 1.4.0
        shell: bash
        run: |
          set -Eeuo pipefail
          Z="$RUNNER_TEMP/otatools.zip"
          D="$RUNNER_TEMP/otatools"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$Z" \
            'https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip'
          echo 'f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84  '"$Z" | sha256sum -c -
          mkdir -p "$D"
          unzip -q "$Z" 'bin/avbtool' -d "$D"
          chmod +x "$D/bin/avbtool"
          "$D/bin/avbtool" version | grep -q 'avbtool 1.4.0'
          "$D/bin/avbtool" add_hash_footer --help 2>&1 | grep -q -- '--prop'
          echo "AVBTOOL=$D/bin/avbtool" >> "$GITHUB_ENV"

      - name: Build coherent full-date boot and root vbmeta
        shell: bash
        run: |
          set -Eeuo pipefail
          B="$RUNNER_TEMP/run16"
          H="$RUNNER_TEMP/hotfix/vbmeta-W7-STOCK-HW-BINDINGS.img"
          O="$GITHUB_WORKSPACE/wear7-full-date-bootchain"
          KEY="$RUNNER_TEMP/full-date-rsa4096.pem"
          mkdir -p "$O"

          echo '5557bce09dab368413ca07a88ae08810baf7cff682162fc7e5e3dec89c7208fe  '"$B/boot.img" | sha256sum -c -
          echo 'a3c87f30d46df453c6ac3822c59fc61a622169fd75cd1efa5419e73db85ad3cd  '"$H" | sha256sum -c -

          cp "$B/boot.img" "$O/boot-W7-FULLDATE.img"
          "$AVBTOOL" erase_footer --image "$O/boot-W7-FULLDATE.img"
          test "$(stat -c %s "$O/boot-W7-FULLDATE.img")" = 42647552

          # The payload itself must remain byte-identical to Run16. Only its embedded
          # AVB footer is regenerated, mirroring the recovery FULLDATE mechanism.
          cmp -n 42647552 "$B/boot.img" "$O/boot-W7-FULLDATE.img"

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$KEY" >/dev/null 2>&1

          "$AVBTOOL" add_hash_footer \
            --image "$O/boot-W7-FULLDATE.img" \
            --partition_name boot \
            --partition_size 100663296 \
            --algorithm SHA256_RSA4096 \
            --key "$KEY" \
            --rollback_index 0 \
            --salt 8078f56b41ac2e6ebea1f428d5b574f02f57d480d916879b2b28628caed0e616 \
            --prop 'com.android.build.boot.os_version:13' \
            --prop 'com.android.build.boot.security_patch:2024-11-01' \
            --prop 'com.android.build.boot.fingerprint:Mobvoi/dace/dace:13/TMDB.240925.002/379:user/release-keys'

          test "$(stat -c %s "$O/boot-W7-FULLDATE.img")" = 100663296
          "$AVBTOOL" info_image --image "$O/boot-W7-FULLDATE.img" > "$O/BOOT_FULLDATE_INFO.txt"
          grep -q '^Algorithm:[[:space:]]*SHA256_RSA4096$' "$O/BOOT_FULLDATE_INFO.txt"
          grep -q "Prop: com.android.build.boot.os_version -> '13'" "$O/BOOT_FULLDATE_INFO.txt"
          grep -q "Prop: com.android.build.boot.security_patch -> '2024-11-01'" "$O/BOOT_FULLDATE_INFO.txt"
          grep -q 'Image Size:[[:space:]]*42647552 bytes' "$O/BOOT_FULLDATE_INFO.txt"
          grep -q 'Digest:[[:space:]]*419ff5eb7f0d198329e95f38f2777ca32d66dab95183297ffb61e3c3d1e0941d' "$O/BOOT_FULLDATE_INFO.txt"
          "$AVBTOOL" verify_image --image "$O/boot-W7-FULLDATE.img" --key "$KEY" > "$O/BOOT_VERIFY.txt" 2>&1

          # Re-sign the already-tested root-vbmeta descriptor set with the same key
          # and flags 0. Its boot descriptor remains valid because the 42,647,552-byte
          # Run16 boot payload is unchanged.
          "$AVBTOOL" make_vbmeta_image \
            --output "$O/vbmeta-W7-FULLDATE.img" \
            --algorithm SHA256_RSA4096 \
            --key "$KEY" \
            --flags 0 \
            --padding_size 8192 \
            --include_descriptors_from_image "$H"

          "$AVBTOOL" info_image --image "$O/vbmeta-W7-FULLDATE.img" > "$O/VBMETA_FULLDATE_INFO.txt"
          grep -q '^Algorithm:[[:space:]]*SHA256_RSA4096$' "$O/VBMETA_FULLDATE_INFO.txt"
          grep -q '^Flags:[[:space:]]*0$' "$O/VBMETA_FULLDATE_INFO.txt"
          grep -q "Prop: com.android.build.boot.os_version -> '13'" "$O/VBMETA_FULLDATE_INFO.txt"
          grep -q "Prop: com.android.build.boot.security_patch -> '2024-11-01'" "$O/VBMETA_FULLDATE_INFO.txt"
          grep -q 'Digest:[[:space:]]*419ff5eb7f0d198329e95f38f2777ca32d66dab95183297ffb61e3c3d1e0941d' "$O/VBMETA_FULLDATE_INFO.txt"

          # Supply all small referenced images so root verification can prove that
          # boot/init_boot/vendor_boot/dtbo descriptors are coherent. It may stop only
          # when it reaches logical images that are not part of this small artifact.
          cp "$O/boot-W7-FULLDATE.img" "$O/boot.img"
          cp "$B/init_boot.img" "$B/vendor_boot.img" "$B/dtbo.img" "$O/"
          set +e
          (cd "$O" && "$AVBTOOL" verify_image --image vbmeta-W7-FULLDATE.img --key "$KEY") > "$O/ROOT_VERIFY.txt" 2>&1
          RC=$?
          set -e
          ! grep -qiE 'boot.*(does not match|digest mismatch|verification failed)' "$O/ROOT_VERIFY.txt"
          grep -q 'Successfully verified SHA256_RSA4096 vbmeta struct' "$O/ROOT_VERIFY.txt"

          rm -f "$O/boot.img" "$O/init_boot.img" "$O/vendor_boot.img" "$O/dtbo.img"
          sha256sum "$O/boot-W7-FULLDATE.img" "$O/vbmeta-W7-FULLDATE.img" > "$O/SHA256SUMS.txt"
          cat > "$O/README.txt" <<'EOF'
          BASELINE_RUN=37287348856
          BASELINE_COMMIT=e138cb634259f43f49a6ddd49f601c523d23851d
          SCOPE=boot embedded AVB footer + matching root vbmeta only
          BOOT_PAYLOAD_42647552_BYTES=IDENTICAL_TO_RUN16
          KERNEL_BYTES=IDENTICAL_TO_RUN16_CLEAN_5.15.220
          BOOT_INTERNAL_AVB=SHA256_RSA4096_FLAGS0_FULLDATE
          ROOT_VBMETA=SHA256_RSA4096_FLAGS0_FULLDATE
          BOOT_OS_VERSION=13
          BOOT_SECURITY_PATCH=2024-11-01
          EXPECTED_EFFECT=ABL/TEE BOOT_PATCHLEVEL 20241101 without changing kernel or Android partitions
          FLASH_SCOPE=boot + vbmeta only
          DO_NOT_FLASH=init_boot,vendor_boot,dtbo,vbmeta_system,super
          EOF
          cat "$O/SHA256SUMS.txt"

      - name: Upload coherent two-image candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-Run16-FULLDATE-Coherent-Bootchain
          path: wear7-full-date-bootchain/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
