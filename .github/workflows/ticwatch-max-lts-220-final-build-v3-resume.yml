name: TicWatch MAX-LTS 5.15.220 - Final Build V3 Resume

on:
  workflow_dispatch:
  push:
    branches:
      - ticwatch-max-lts-220
    paths:
      - '.github/workflows/ticwatch-max-lts-220-final-build-v3-resume.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ticwatch-max-lts-220-final-v3
  cancel-in-progress: true

env:
  LLVM_VERSION: '20.1.0'
  LLVM_ARCHIVE: 'LLVM-20.1.0-Linux-X64.tar.xz'
  BASE_KERNEL_SHA: '3929c55fbc7559af6df290d2c0f66dc551af161a'
  AOSP_ASB_TIP: '56cdb4d13a91efb666d571084ab82de351cc4900'
  TARGET_STABLE_TAG: 'v5.15.220'
  UPLIFT_ORCHESTRATOR_SHA: 'ba33c66c36981cd024e48326b459684605c667a9'
  EXPECTED_UTS_PREFIX: '5.15.220-Xinran_StarBai-Test'
  PREVIOUS_RUN_ID: '34655933953'
  PREVIOUS_ARTIFACT: 'TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter'
  PREVIOUS_ANYKERNEL: 'TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter.zip'
  MANAGER_APK: 'KernelSU_Next_v3.3.0-spoofed-TicWatch-armeabi-v7a-release.apk'
  MANAGER_APK_SHA256: '8310faebd2b592ccddd6a15a6d996c70d89cd679eb51835e84d18f531471357b'
  KSU_NEXT_MANAGER_SIZE: '0x3c2'
  KSU_NEXT_MANAGER_HASH: '3bc9938c38106bcf618bbe1d37ad4adde8a49c659e2860709bbfc341f7e749f2'
  V2_WORKFLOW: '.github/workflows/ticwatch-max-lts-220-final-build-v2.yml'
  CHECKPOINT_NAME: 'TicWatch-5.15.220-precompile-checkpoint'

jobs:
  prepare:
    name: Prepare source and save checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout final-build branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-max-lts-220
          fetch-depth: 1

      - name: Install V2 step runner
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/run-v2-step.py <<'PY'
          from pathlib import Path
          import subprocess, sys
          workflow, step = sys.argv[1], sys.argv[2]
          lines = Path(workflow).read_text().splitlines()
          marker = f"      - name: {step}"
          try:
              i = lines.index(marker)
          except ValueError:
              raise SystemExit(f"V2 step not found: {step}")
          while i < len(lines) and lines[i].strip() != "run: |":
              i += 1
          if i == len(lines):
              raise SystemExit(f"run block not found: {step}")
          i += 1
          out = []
          while i < len(lines):
              line = lines[i]
              if line.startswith("      - name: "):
                  break
              if line and not line.startswith("          "):
                  raise SystemExit(f"unexpected indentation in {step}: {line!r}")
              out.append(line[10:] if line else "")
              i += 1
          subprocess.run(["bash", "-Eeuo", "pipefail", "-c", "\n".join(out) + "\n"], check=True)
          PY

      - name: Dependencies and known-good bundle
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Dependencies and known-good bundle"

      - name: Install exact LLVM 20.1.0
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Install exact LLVM 20.1.0"

      - name: Materialize exact proven uplift engine
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Materialize exact proven uplift engine"

      - name: Reproduce verified source uplift to 5.15.220
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Reproduce verified source uplift to 5.15.220"

      - name: Resume proven KSU Next and SuSFS integration
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Resume proven KSU Next and SuSFS integration"

      - name: Apply proven KSU SuSFS Seccomp and hardened SafeKey fixes
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Apply proven KSU SuSFS Seccomp and hardened SafeKey fixes"

      - name: Keep proven Slatecom PM fix
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Keep proven Slatecom PM fix"

      - name: Configure Wear7-ready final kernel
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Configure Wear7-ready final kernel"

      - name: Build precompile checkpoint archive
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d .ticwatch-preflight/common/.git
          test -s .ticwatch-preflight/common/out/.config
          test -d previous
          test -s final.config
          test -s lts-merged-head.txt
          test -s llvm-version.txt
          tar --zstd -cf "$GITHUB_WORKSPACE/precompile-checkpoint.tar.zst" \
            .ticwatch-preflight previous final.config lts-merged-head.txt llvm-version.txt
          test -s precompile-checkpoint.tar.zst
          sha256sum precompile-checkpoint.tar.zst | tee precompile-checkpoint.sha256

      - name: Upload precompile checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.CHECKPOINT_NAME }}
          path: |
            precompile-checkpoint.tar.zst
            precompile-checkpoint.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  compile:
    name: Compile from saved checkpoint
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout latest final-build branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-max-lts-220
          fetch-depth: 1

      - name: Install V2 step runner
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/run-v2-step.py <<'PY'
          from pathlib import Path
          import subprocess, sys
          workflow, step = sys.argv[1], sys.argv[2]
          lines = Path(workflow).read_text().splitlines()
          marker = f"      - name: {step}"
          try:
              i = lines.index(marker)
          except ValueError:
              raise SystemExit(f"V2 step not found: {step}")
          while i < len(lines) and lines[i].strip() != "run: |":
              i += 1
          if i == len(lines):
              raise SystemExit(f"run block not found: {step}")
          i += 1
          out = []
          while i < len(lines):
              line = lines[i]
              if line.startswith("      - name: "):
                  break
              if line and not line.startswith("          "):
                  raise SystemExit(f"unexpected indentation in {step}: {line!r}")
              out.append(line[10:] if line else "")
              i += 1
          subprocess.run(["bash", "-Eeuo", "pipefail", "-c", "\n".join(out) + "\n"], check=True)
          PY

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc python3 python-is-python3 \
            libssl-dev libelf-dev dwarves make cmake zip unzip curl wget \
            gnupg gawk gcc-multilib g++-multilib ccache rsync file zstd \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf >/dev/null

      - name: Install exact LLVM 20.1.0
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Install exact LLVM 20.1.0"

      - name: Download precompile checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.CHECKPOINT_NAME }}
          path: checkpoint

      - name: Restore and verify precompile checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          cp checkpoint/precompile-checkpoint.tar.zst .
          cp checkpoint/precompile-checkpoint.sha256 .
          sha256sum -c precompile-checkpoint.sha256
          tar --zstd -xf precompile-checkpoint.tar.zst
          test -d .ticwatch-preflight/common/.git
          test -s .ticwatch-preflight/common/out/.config
          test -s previous/"$PREVIOUS_ANYKERNEL"
          test -s final.config
          test -s lts-merged-head.txt
          grep -Fqx 'CONFIG_KSU=y' final.config
          grep -Fqx 'CONFIG_KSU_SUSFS=y' final.config
          grep -Fqx 'CONFIG_SECCOMP_FILTER=y' final.config
          grep -Fqx 'CONFIG_MODVERSIONS=y' final.config
          echo 'PRECOMPILE_CHECKPOINT_RESTORE=PASS'

      - name: Apply latest compile compatibility fixes
        shell: bash
        run: bash .github/scripts/ticwatch-5.15.220-compile-compat.sh .ticwatch-preflight/common

      - name: Compile real 5.15.220 kernel
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Compile real 5.15.220 kernel"

      - name: Static modversions and artifact audit
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Static modversions and artifact audit"

      - name: Package final candidate without flashing
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Package final candidate without flashing"

      - name: Upload final candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TicWatch-MAX-LTS-5.15.220-FINAL-CANDIDATE
          path: bundle/
          if-no-files-found: error
          retention-days: 90
