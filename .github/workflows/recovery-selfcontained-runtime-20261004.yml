name: Recovery self-contained A13 runtime closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-selfcontained-runtime-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_COMMIT: 0402bd118a891fd5802214dd2c64f1855aed4f73
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d

jobs:
  build-runtime-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Reconstruct exact stock379 system and vendor
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl e2fsprogs binutils git python3 >/dev/null
          git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
          W="$RUNNER_TEMP/recovery-selfcontained"
          mkdir -p "$W" "$GITHUB_WORKSPACE/recovery-selfcontained-report"
          git show "$BASE_COMMIT:wear7/scripts/reconstruct_block_ota.py" > "$W/reconstruct_block_ota.py"
          cd "$W"
          curl -fL --retry 3 --retry-delay 3 -o ticwatch379.zip "$TIC_URL"
          echo "$TIC_SHA256  ticwatch379.zip" | sha256sum -c -
          python3 reconstruct_block_ota.py ticwatch379.zip system system.raw
          python3 reconstruct_block_ota.py ticwatch379.zip vendor vendor.raw
          echo '150238505037c881b079b7c9de1adc231f2c4a94b64f8dd3a7694ebc7408371e  vendor.raw' | sha256sum -c -
          sha256sum system.raw vendor.raw > "$GITHUB_WORKSPACE/recovery-selfcontained-report/STOCK379_PARTITION_SHA256.txt"

      - name: Build exact minimal runtime dependency closure
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/recovery-selfcontained"
          R="$GITHUB_WORKSPACE/recovery-selfcontained-report"
          SM="$W/system-mnt"
          VM="$W/vendor-mnt"
          OUT="$W/a13-selfcontained"
          mkdir -p "$SM" "$VM" "$OUT"
          sudo mount -o loop,ro,noload "$W/system.raw" "$SM"
          sudo mount -o loop,ro,noload "$W/vendor.raw" "$VM"
          cleanup(){ sudo umount "$SM" 2>/dev/null || true; sudo umount "$VM" 2>/dev/null || true; }
          trap cleanup EXIT

          python3 - "$SM" "$VM" "$OUT" "$R" <<'PY'
          from pathlib import Path
          import hashlib, os, re, shutil, subprocess, sys

          sm, vm, out, report = map(Path, sys.argv[1:])
          sysroot = sm / 'system' if (sm / 'system/bin').is_dir() else sm
          vendor = vm

          syslib = sysroot / 'lib'
          bootstrap = syslib / 'bootstrap'
          i18n = sysroot / 'apex/com.android.i18n/lib'
          vendorlib = vendor / 'lib'

          system_bins = [
              'bin/hwservicemanager',
              'bin/servicemanager',
              'bin/service',
              'bin/keystore2',
              'bin/vold',
              'bin/vdc',
          ]
          vendor_bins = [
              'bin/qseecomd',
              'bin/hw/android.hardware.keymaster@4.1-service-qti',
          ]

          for rel in system_bins:
              if not (sysroot / rel).is_file():
                  raise SystemExit(f'missing stock system root binary: {rel}')
          for rel in vendor_bins:
              if not (vendor / rel).is_file():
                  raise SystemExit(f'missing stock vendor root binary: {rel}')

          def deref(p: Path) -> Path:
              seen = set()
              cur = p
              while cur.is_symlink():
                  key = str(cur)
                  if key in seen:
                      raise RuntimeError(f'symlink loop: {p}')
                  seen.add(key)
                  t = os.readlink(cur)
                  if t.startswith('/system/'):
                      cur = sysroot / t[len('/system/'):]
                  elif t.startswith('/apex/'):
                      cur = sysroot / 'apex' / t[len('/apex/'):]
                  elif t.startswith('/vendor/'):
                      cur = vendor / t[len('/vendor/'):]
                  elif t.startswith('/'):
                      raise RuntimeError(f'unsupported absolute symlink {cur} -> {t}')
                  else:
                      cur = cur.parent / t
              return cur

          def needed(p: Path):
              q = deref(p)
              if not q.is_file():
                  raise RuntimeError(f'ELF target missing: {p} -> {q}')
              cp = subprocess.run(['readelf', '-d', str(q)], text=True,
                                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              if cp.returncode != 0:
                  return []
              return re.findall(r'\(NEEDED\).*Shared library: \[(.*?)\]', cp.stdout)

          def lexists(p: Path):
              return p.exists() or p.is_symlink()

          search = [
              ('system/lib', syslib, True),
              ('system/lib/bootstrap', bootstrap, True),
              ('system/apex/com.android.i18n/lib', i18n, True),
              ('vendor/lib', vendorlib, False),
          ]

          bundled = {}
          visited = set()
          unresolved = set()
          queue = []

          def add_bundle(src: Path, rel: str):
              src_real = deref(src)
              dst = out / rel
              if rel in bundled:
                  if hashlib.sha256(src_real.read_bytes()).hexdigest() != bundled[rel]:
                      raise RuntimeError(f'conflicting bundled bytes: {rel}')
                  return
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src_real, dst)
              bundled[rel] = hashlib.sha256(dst.read_bytes()).hexdigest()

          for rel in system_bins:
              p = sysroot / rel
              add_bundle(p, f'system/{rel}')
              queue.append(p)
          for rel in vendor_bins:
              queue.append(vendor / rel)

          while queue:
              node = queue.pop(0)
              real = deref(node)
              key = str(real)
              if key in visited:
                  continue
              visited.add(key)
              for name in needed(real):
                  hit = None
                  for prefix, base, bundle in search:
                      p = base / name
                      if lexists(p):
                          hit = (prefix, p, bundle)
                          break
                  if hit is None:
                      unresolved.add(name)
                      continue
                  prefix, p, bundle = hit
                  if bundle:
                      add_bundle(p, f'{prefix}/{name}')
                  queue.append(p)

          if unresolved:
              (report / 'UNRESOLVED_DT_NEEDED.txt').write_text('\n'.join(sorted(unresolved)) + '\n')
              raise SystemExit(f'unresolved DT_NEEDED: {sorted(unresolved)}')

          for rel in ('etc/vintf', 'etc/selinux'):
              src = sysroot / rel
              if not src.is_dir():
                  raise SystemExit(f'missing coherent A13 config dir: {rel}')
              shutil.copytree(src, out / 'system' / rel, symlinks=True, dirs_exist_ok=True)

          manifest = []
          for p in sorted(out.rglob('*')):
              if p.is_file():
                  manifest.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out)}')
          (out / 'MANIFEST.sha256').write_text('\n'.join(manifest) + '\n')

          known = {
              'system/bin/hwservicemanager': 'c22b20ceb0f14f0199bed1711a5670d93bf9a6cd1360f99bf9d2791eeac98080',
              'system/bin/servicemanager': '28a04317efbb42b61fbc34a925e6b76988b6457f01738b4959f95dd45f1f8a15',
              'system/bin/service': 'b716af680963e7ac627a5d755869c090d8927530ba368604bec9b872b6e691c7',
              'system/bin/keystore2': '3c4a26761cc46afe341ee68b70d098933375a2c73a7da91e5ae35050efac6831',
              'system/bin/vold': '5e0248d119dd6fb319bf3e1f210935a003d9f18ed14822f133f1b0fa85eb0f5f',
              'system/bin/vdc': '32ba2708fb8e5ab6c484cd3548691f6bcd459b1dbcb118e3abfa2a9e3775f7ae',
              'system/lib/libbinder.so': '9b00066d989f11fba12a11f1f675a6e757355e234c4c35a8c8a8d0550e6c5803',
              'system/lib/android.hidl.token@1.0.so': '227196890e0e1f8bc826dd4716e91324e6379f14e69a18df8fa8465f4ea8759a',
          }
          gates = []
          for rel, want in known.items():
              p = out / rel
              got = hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else 'MISSING'
              gates.append(f'{rel}\t{got}\t{"PASS" if got == want else "FAIL"}')
              if got != want:
                  raise SystemExit(f'qualified hash mismatch {rel}: {got} != {want}')

          file_count = sum(1 for p in out.rglob('*') if p.is_file())
          raw_bytes = sum(p.stat().st_size for p in out.rglob('*') if p.is_file())
          (report / 'QUALIFIED_HASH_GATES.tsv').write_text('\n'.join(gates) + '\n')
          (report / 'CLOSURE_SUMMARY.txt').write_text(
              f'ELF_NODES_VISITED={len(visited)}\nBUNDLED_ELF_PATHS={len(bundled)}\n'
              f'BUNDLE_FILE_COUNT={file_count}\nBUNDLE_RAW_BYTES={raw_bytes}\n'
              f'QUALIFIED_HASHES=8_OF_8_PASS\nDT_NEEDED_CLOSURE=PASS\n'
          )
          print((report / 'CLOSURE_SUMMARY.txt').read_text(), end='')
          PY

          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          chmod 0755 "$OUT" "$OUT/system" "$OUT/system/lib" || true
          tar -C "$W" -czf "$GITHUB_WORKSPACE/a13-selfcontained-runtime.tgz" a13-selfcontained
          sha256sum "$GITHUB_WORKSPACE/a13-selfcontained-runtime.tgz" | tee "$R/A13_SELFCONTAINED_TGZ_SHA256.txt"
          stat -c 'A13_SELFCONTAINED_TGZ_BYTES=%s' "$GITHUB_WORKSPACE/a13-selfcontained-runtime.tgz" | tee "$R/A13_SELFCONTAINED_TGZ_SIZE.txt"
          cat "$R/QUALIFIED_HASH_GATES.tsv"
          cat "$R/CLOSURE_SUMMARY.txt"
          cleanup
          trap - EXIT

      - name: Upload compact runtime and audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Recovery-SelfContained-A13-Runtime-Closure
          path: |
            a13-selfcontained-runtime.tgz
            recovery-selfcontained-report/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
