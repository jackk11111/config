name: TicWatch FINAL Stock379 KSU Clean-Wipe Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - ticwatch-final-stock379-ksu-cleanwipe
    paths:
      - '.github/workflows/ticwatch-final-stock379-ksu-cleanwipe.yml'
      - 'ticwatch-final/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: ticwatch-final-stock379-ksu-cleanwipe
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  LLVM_VERSION: '20.1.0'
  LLVM_ARCHIVE: 'LLVM-20.1.0-Linux-X64.tar.xz'
  SOURCE_REPRO_SHA: 'be11c389636d0d7fadd9c258e1895b42c8b85a2d'
  V2_WORKFLOW: '.github/workflows/ticwatch-max-lts-220-final-build-v2.yml'
  PREVIOUS_RUN_ID: '34655933953'
  PREVIOUS_ARTIFACT: 'TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter'
  PREVIOUS_ANYKERNEL: 'TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter.zip'
  MANAGER_RUN_ID: '34563469731'
  MANAGER_ARTIFACT: 'KernelSU-Next-v3.3.0-Spoofed-TicWatch-armv7'
  MANAGER_APK: 'KernelSU_Next_v3.3.0-spoofed-TicWatch-armeabi-v7a-release.apk'
  MANAGER_APK_SHA256: '8310faebd2b592ccddd6a15a6d996c70d89cd679eb51835e84d18f531471357b'
  KSU_NEXT_MANAGER_SIZE: '0x3c2'
  KSU_NEXT_MANAGER_HASH: '3bc9938c38106bcf618bbe1d37ad4adde8a49c659e2860709bbfc341f7e749f2'
  EXPECTED_UTS_PREFIX: '5.15.220-Xinran_StarBai-Test'
  KMI_CRC_MAP_REL: '.github/data/ticwatch-stock379-kmi-crc-overrides-337.tsv'
  OTA379_URL: 'https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip'
  OTA379_SHA256: 'ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d'
  STOCK_BOOT_SIZE: '100663296'
  CHECKPOINT_NAME: 'TicWatch-FINAL-5.15.220-source-checkpoint'

jobs:
  prepare:
    name: Reproduce proven 5.15.220 source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact proven source orchestration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REPRO_SHA }}
          fetch-depth: 1

      - name: Install V2 step runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$V2_WORKFLOW"
          cat > /tmp/run-v2-step.py <<'PY'
          from pathlib import Path
          import subprocess, sys
          workflow, step = sys.argv[1], sys.argv[2]
          lines = Path(workflow).read_text().splitlines()
          marker = f"      - name: {step}"
          try:
              i = lines.index(marker)
          except ValueError:
              raise SystemExit(f"V2 step not found: {step}")
          while i < len(lines) and lines[i].strip() != "run: |":
              i += 1
          if i == len(lines):
              raise SystemExit(f"run block not found: {step}")
          i += 1
          out = []
          while i < len(lines):
              line = lines[i]
              if line.startswith("      - name: "):
                  break
              if line and not line.startswith("          "):
                  raise SystemExit(f"unexpected indentation in {step}: {line!r}")
              out.append(line[10:] if line else "")
              i += 1
          subprocess.run(["bash", "-Eeuo", "pipefail", "-c", "\n".join(out) + "\n"], check=True)
          PY

      - name: Dependencies and known-good 5.15.211 bundle
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Dependencies and known-good bundle"

      - name: Install exact LLVM 20.1.0
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Install exact LLVM 20.1.0"

      - name: Materialize exact proven uplift engine
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Materialize exact proven uplift engine"

      - name: Reproduce verified source uplift to 5.15.220
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Reproduce verified source uplift to 5.15.220"

      - name: Resume proven KSU Next and SuSFS integration
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Resume proven KSU Next and SuSFS integration"

      - name: Apply proven KSU Seccomp c_long SafeKey baseline
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Apply proven KSU SuSFS Seccomp and hardened SafeKey fixes"

      - name: Keep proven Slatecom PM fix
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Keep proven Slatecom PM fix"

      - name: Configure exact final kernel profile
        shell: bash
        run: python3 /tmp/run-v2-step.py "$V2_WORKFLOW" "Configure Wear7-ready final kernel"

      - name: Freeze source checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d .ticwatch-preflight/common/.git
          test -d .ticwatch-preflight/common/KernelSU-Next/.git
          test -s .ticwatch-preflight/common/out/.config
          test -s final.config
          cmp -s final.config .ticwatch-preflight/common/out/.config
          grep -Fqx 'CONFIG_KSU=y' final.config
          grep -Fqx 'CONFIG_KSU_SUSFS=y' final.config
          grep -Fqx 'CONFIG_SECCOMP=y' final.config
          grep -Fqx 'CONFIG_SECCOMP_FILTER=y' final.config
          grep -Fqx 'CONFIG_COMPAT=y' final.config
          grep -Fqx 'CONFIG_KEXEC=y' final.config
          grep -Fqx '# CONFIG_KEXEC_FILE is not set' final.config
          tar --zstd -cf source-checkpoint.tar.zst             .ticwatch-preflight previous final.config lts-merged-head.txt llvm-version.txt
          sha256sum source-checkpoint.tar.zst > source-checkpoint.sha256

      - name: Upload reproducible source checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.CHECKPOINT_NAME }}
          path: |
            source-checkpoint.tar.zst
            source-checkpoint.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  build:
    name: Build clean-wipe-fixed final kernel and boot
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout final patch branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-final-stock379-ksu-cleanwipe
          fetch-depth: 1

      - name: Install build dependencies and LLVM
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y --no-install-recommends             build-essential flex bison bc python3 python-is-python3             libssl-dev libelf-dev dwarves make cmake zip unzip curl wget             gnupg gawk gcc-multilib g++-multilib ccache rsync file zstd             binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf >/dev/null
          wget -q "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_ARCHIVE}"
          tar -xJf "$LLVM_ARCHIVE"
          mv "LLVM-${LLVM_VERSION}-Linux-X64" "$GITHUB_WORKSPACE/aosp-clang"
          rm -f "$LLVM_ARCHIVE"
          echo "AOSP_CLANG_PATH=$GITHUB_WORKSPACE/aosp-clang" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/aosp-clang/bin/clang" --version | tee llvm-current.txt
          grep -Fq '20.1.0' llvm-current.txt

      - name: Download source checkpoint from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.CHECKPOINT_NAME }}
          path: checkpoint

      - name: Restore checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          cp checkpoint/source-checkpoint.tar.zst .
          cp checkpoint/source-checkpoint.sha256 .
          sha256sum -c source-checkpoint.sha256
          tar --zstd -xf source-checkpoint.tar.zst
          test -s previous/wireless-flasher/magiskboot
          test -s previous/wireless-flasher/busybox
          cmp -s final.config .ticwatch-preflight/common/out/.config

      - name: Apply final clean-wipe KSU fixes only
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ticwatch-final/fix-ksu-arm32-cleanwipe.sh .ticwatch-preflight/common
          F=.ticwatch-preflight/common/KernelSU-Next/kernel/hook/setuid_hook.c
          test "$(grep -Fc 'ksu_seccomp_allow_cache_arch(current->seccomp.filter, __NR_reboot, 88);' "$F")" -eq 2
          grep -Fq 'CONFIG_COMPAT=y' final.config

      - name: Apply validated KEXEC-only fixes without diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ticwatch-final/apply-kexec-validated-minimal.sh .ticwatch-preflight/common
          K=.ticwatch-preflight/common
          grep -R -Fq 'TWKEXEC: BT541 I2C shutdown skipped' "$K/drivers/i2c/i2c-core-base.c"
          grep -R -Fq 'TWKEXEC: GENI UART core shutdown skipped' "$K/drivers/tty/serial/serial_core.c"
          grep -R -Fq 'TWKEXEC: GENI UART platform shutdown skipped' "$K/drivers/base/platform.c"
          grep -R -Fq 'TWKEXEC: MMC0 card shutdown skipped' "$K/drivers/mmc/core/bus.c"

      - name: Apply compile compatibility fixes
        shell: bash
        run: bash .github/scripts/ticwatch-5.15.220-compile-compat.sh .ticwatch-preflight/common

      - name: Install targeted stock379 KMI CRC preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          K="$GITHUB_WORKSPACE/.ticwatch-preflight/common"
          MAP="$GITHUB_WORKSPACE/$KMI_CRC_MAP_REL"
          test -s "$MAP"
          test "$(grep -vc '^#' "$MAP")" -eq 337
          F="$K/scripts/genksyms/genksyms.c"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          anchor='void export_symbol(const char *name)\n{\n\tstruct symbol *sym;\n'
          crc='\t\tcrc = expand_and_crc_sym(sym, 0xffffffff) ^ 0xffffffff;\n'
          if s.count(anchor)!=1 or s.count(crc)!=1:
              raise SystemExit('genksyms anchor mismatch')
          helper='''static unsigned long ticwatch_kmi_crc_override(const char *name, unsigned long crc)
          {
              const char *path = getenv("TICWATCH_KMI_CRC_MAP");
              FILE *f;
              char line[512];
              char sym[256];
              unsigned long expected;
              if (!path || !*path) return crc;
              f = fopen(path, "r");
              if (!f) { perror(path); exit(2); }
              while (fgets(line, sizeof(line), f)) {
                  if (line[0] == '#' || line[0] == '\\n') continue;
                  if (sscanf(line, "%255s %lx", sym, &expected) == 2 && strcmp(sym, name) == 0) {
                      fclose(f); return expected;
                  }
              }
              fclose(f); return crc;
          }

          '''
          s=s.replace(anchor,helper+anchor,1)
          s=s.replace(crc,crc+'\t\tcrc = ticwatch_kmi_crc_override(name, crc);\n',1)
          p.write_text(s)
          PY
          rm -f "$K/out/scripts/genksyms/genksyms" "$K/out/scripts/genksyms/"*.o 2>/dev/null || true

      - name: Compile final 5.15.220
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export PATH="$AOSP_CLANG_PATH/bin:$PATH"
          export LLVM=1 LLVM_IAS=1
          export KCFLAGS='-Wno-error -Wno-deprecated-declarations'
          export KBUILD_BUILD_VERSION=0
          export KBUILD_BUILD_USER='XinRan♡'
          export KBUILD_BUILD_HOST='Bai'
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export TICWATCH_KMI_CRC_MAP="$GITHUB_WORKSPACE/$KMI_CRC_MAP_REL"
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1             KSU_NEXT_MANAGER_SIZE="$KSU_NEXT_MANAGER_SIZE"             KSU_NEXT_MANAGER_HASH="$KSU_NEXT_MANAGER_HASH"             2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"
          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          test -s out/System.map
          test -s out/Module.symvers
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image"
          cp out/System.map "$GITHUB_WORKSPACE/System.map"
          cp out/Module.symvers "$GITHUB_WORKSPACE/Module.symvers"
          make -s O=out ARCH=arm64 kernelrelease | tee "$GITHUB_WORKSPACE/kernelrelease.txt"
          case "$(cat "$GITHUB_WORKSPACE/kernelrelease.txt")" in
            ${EXPECTED_UTS_PREFIX}*) ;;
            *) echo "Unexpected kernel release" >&2; exit 3 ;;
          esac
          nm out/vmlinux | grep -Fq 'ksu_seccomp_allow_cache_arch'
          strings out/vmlinux | grep -Fq 'TWKEXEC: MMC0 card shutdown skipped'

      - name: Hard gate config KMI and final source deltas
        shell: bash
        run: |
          set -Eeuo pipefail
          MAP="$GITHUB_WORKSPACE/$KMI_CRC_MAP_REL"
          python3 - "$MAP" Module.symvers <<'PY' | tee kmi-final-audit.txt
          import sys
          mp,newp=sys.argv[1:]
          exp={}
          for l in open(mp):
              if l.strip() and not l.startswith('#'):
                  s,c=l.split()[:2]; exp[s]=c.lower()
          new={f[1]:f[0].lower() for l in open(newp) if len((f:=l.split()))>=2}
          missing=[s for s in exp if s not in new]
          bad=[(s,exp[s],new.get(s)) for s in exp if new.get(s)!=exp[s]]
          print('EXPECTED',len(exp),'MISSING',len(missing),'MISMATCH',len(bad))
          if missing or bad:
              print('MISSING_LIST',missing[:30]); print('BAD_LIST',bad[:30]); raise SystemExit(2)
          print('STOCK379_KMI_TARGETED_GATE=PASS')
          PY
          for x in             'CONFIG_ARM64=y' 'CONFIG_COMPAT=y' 'CONFIG_MODVERSIONS=y'             'CONFIG_KEXEC=y' 'CONFIG_SECCOMP=y' 'CONFIG_SECCOMP_FILTER=y'             'CONFIG_LRU_GEN=y' 'CONFIG_LRU_GEN_ENABLED=y'             'CONFIG_TCP_CONG_BBR=y' 'CONFIG_NET_SCH_FQ=y'             'CONFIG_KSU=y' 'CONFIG_KSU_SUSFS=y'             'CONFIG_PSTORE=y' 'CONFIG_PSTORE_RAM=y'; do
              grep -Fqx "$x" final.config
          done
          grep -Fqx '# CONFIG_KEXEC_FILE is not set' final.config
          git -C .ticwatch-preflight/common/KernelSU-Next diff --binary > kernelsu-final.patch
          git -C .ticwatch-preflight/common diff --binary > kernel-final.patch
          grep -Fq 'ksu_seccomp_allow_cache_arch' kernelsu-final.patch
          grep -Fq 'c_long' kernelsu-final.patch
          grep -Fq 'TWKEXEC: BT541 I2C shutdown skipped' kernel-final.patch
          grep -Fq 'TWKEXEC: MMC0 card shutdown skipped' kernel-final.patch

      - name: Download and verify paired current Manager
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p manager
          gh run download "$MANAGER_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "$MANAGER_ARTIFACT"             --dir manager
          test -s "manager/$MANAGER_APK"
          printf '%s  %s\n' "$MANAGER_APK_SHA256" "manager/$MANAGER_APK" | sha256sum -c -
          grep -Fqx "MANAGER_CERT_SIZE_HEX=$KSU_NEXT_MANAGER_SIZE" manager/manager-cert.txt
          grep -Fqx "MANAGER_CERT_SHA256=$KSU_NEXT_MANAGER_HASH" manager/manager-cert.txt

      - name: Build patched ARM32 ksud companion
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager 'ndk;27.3.13750724' >/dev/null
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          rustup target add armv7-linux-androideabi >/dev/null
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked >/dev/null
          export BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--sysroot=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/arm-linux-androideabi -I$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          cd .ticwatch-preflight/common/KernelSU-Next/userspace/ksud
          cargo ndk -t armeabi-v7a -P 26 build --release
          cp target/armv7-linux-androideabi/release/ksud "$GITHUB_WORKSPACE/ksud-KSUN330-armv7-c_long"
          cd "$GITHUB_WORKSPACE"
          file ksud-KSUN330-armv7-c_long | tee ksud-file.txt
          file ksud-KSUN330-armv7-c_long | grep -Fq 'ELF 32-bit'
          file ksud-KSUN330-armv7-c_long | grep -Fq 'ARM'
          sha256sum ksud-KSUN330-armv7-c_long | tee ksud-sha256.txt

      - name: Build final boot image from verified stock379 OTA
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -L --fail --retry 3 -o ota379.zip "$OTA379_URL"
          printf '%s  ota379.zip\n' "$OTA379_SHA256" | sha256sum -c -
          unzip -p ota379.zip boot.img > boot_STOCK379.img
          test "$(stat -c '%s' boot_STOCK379.img)" -eq "$STOCK_BOOT_SIZE"
          cp previous/wireless-flasher/magiskboot ./magiskboot
          chmod 0755 ./magiskboot
          mkdir bootwork
          cp boot_STOCK379.img bootwork/
          cp Image bootwork/Image.final
          cp magiskboot bootwork/
          (
            cd bootwork
            ./magiskboot unpack boot_STOCK379.img
            test -s kernel
            cp Image.final kernel
            ./magiskboot repack boot_STOCK379.img boot_FINAL_KSU_FIXED.img
            truncate -s "$STOCK_BOOT_SIZE" boot_FINAL_KSU_FIXED.img
            test "$(stat -c '%s' boot_FINAL_KSU_FIXED.img)" -eq "$STOCK_BOOT_SIZE"
          )
          cp bootwork/boot_FINAL_KSU_FIXED.img .
          rm -rf verifyboot
          mkdir verifyboot
          cp magiskboot verifyboot/
          cp boot_FINAL_KSU_FIXED.img verifyboot/
          (
            cd verifyboot
            ./magiskboot unpack boot_FINAL_KSU_FIXED.img
            cmp -s kernel ../Image
          )
          sha256sum boot_STOCK379.img boot_FINAL_KSU_FIXED.img > boot-sha256.txt

      - name: Package final kernel and boot bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bundle/audit bundle/manager bundle/post-root
          cp Image boot_FINAL_KSU_FIXED.img bundle/
          cp "manager/$MANAGER_APK" bundle/manager/
          cp manager/manager-cert.txt bundle/manager/
          cp ksud-KSUN330-armv7-c_long bundle/post-root/
          cp final.config System.map Module.symvers kernelrelease.txt              kernel-build.log kmi-final-audit.txt              kernelsu-final.patch kernel-final.patch              boot-sha256.txt ksud-file.txt ksud-sha256.txt bundle/audit/
          IMAGE_SHA="$(sha256sum Image | awk '{print $1}')"
          BOOT_SHA="$(sha256sum boot_FINAL_KSU_FIXED.img | awk '{print $1}')"
          KSUD_SHA="$(sha256sum ksud-KSUN330-armv7-c_long | awk '{print $1}')"
          cat > bundle/PROVENANCE.txt <<EOF
          DEVICE=dace
          STOCK_BUILD=TMDB.240925.002/379
          KERNEL_RELEASE=$(cat kernelrelease.txt)
          IMAGE_SHA256=$IMAGE_SHA
          BOOT_FINAL_SHA256=$BOOT_SHA
          KSU_NEXT=3.3.0
          KSU_NEXT_SHA=3b18216f71df189ab3d1b1ce0bdb21be1268e771
          MANAGER_APK_SHA256=$MANAGER_APK_SHA256
          MANAGER_CERT_SHA256=$KSU_NEXT_MANAGER_HASH
          SUSFS=2.2.0
          SUSFS_HOOK_MODE=INLINE
          SELINUX_TARGET=ENFORCING
          SECCOMP_FILTER=PRESERVED
          ARM32_CLEAN_WIPE_SECCOMP_NATIVE_REBOOT=142
          ARM32_CLEAN_WIPE_SECCOMP_COMPAT_REBOOT=88
          ARM32_SUSFS_C_LONG_FIX=SOURCE_APPLIED
          PATCHED_KSUD_SHA256=$KSUD_SHA
          KEXEC=BT541_GENI_CORE_GENI_PLATFORM_MMC0_ONLY
          KEXEC_DIAGNOSTIC_PROBES=NOT_INCLUDED
          STOCK379_KMI_TARGETED_SYMBOLS=337
          STOCK379_KMI_TARGETED_GATE=PASS
          RECOVERY=NOT_MODIFIED
          FLASH_PERFORMED=NO
          EOF
          (
            cd bundle
            sha256sum Image boot_FINAL_KSU_FIXED.img               "manager/$MANAGER_APK" manager/manager-cert.txt               post-root/ksud-KSUN330-armv7-c_long               PROVENANCE.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload final KSU-fixed kernel bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TicWatch-FINAL-Stock379-KSU-CleanWipe
          path: bundle/
          if-no-files-found: error
          retention-days: 90
