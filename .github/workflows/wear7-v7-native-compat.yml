name: Wear7 V7 stock32 native compatibility repair

on:
  workflow_dispatch:
  push:
    branches: [wear7-v6-offline-validation]
    paths:
      - '.github/workflows/wear7-v7-native-compat.yml'
      - 'wear7/v7/**'

permissions:
  contents: read
  actions: read

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare exact-image repair environment
        run: |
          set -Eeuo pipefail
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs android-sdk-libsparse-utils erofs-utils unzip curl python3-yaml python3-pyelftools secilc qemu-user-static apksigner binutils >/dev/null
          mkdir -p "$RUNNER_TEMP/v7/input" "$RUNNER_TEMP/v7/prior-report" wear7-v7-report

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-V6-Bootchain
          path: '${{ runner.temp }}/v7/input'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          repository: '${{ github.repository }}'
          run-id: '35146642220'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-V6-Super
          path: '${{ runner.temp }}/v7/input'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          repository: '${{ github.repository }}'
          run-id: '35146642220'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-V6-Offline-Analysis
          path: '${{ runner.temp }}/v7/prior-report'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          repository: '${{ github.repository }}'
          run-id: '35146642220'

      - name: Inject pinned stock379 ARM32 compatibility and validate final image
        run: sudo env RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_SHA="$GITHUB_SHA" bash wear7/v7/repair_and_validate.sh

      - name: Preserve V7 analysis even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-V7-Offline-Analysis
          path: wear7-v7-report/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve gated V7 bootchain
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-V7-Bootchain
          path: |
            wear7-v7-candidate/boot.img
            wear7-v7-candidate/init_boot.img
            wear7-v7-candidate/vendor_boot.img
            wear7-v7-candidate/dtbo.img
            wear7-v7-candidate/vbmeta.img
            wear7-v7-candidate/vbmeta_system.img
            wear7-v7-candidate/CANDIDATE.json
            wear7-v7-candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Preserve gated V7 super
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-V7-Super
          path: wear7-v7-candidate/super.img
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
