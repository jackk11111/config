name: TicWatch MAX-LTS 5.15.220 - Final Build V5 KMI Preserved

on:
  workflow_dispatch:
  push:
    branches:
      - ticwatch-max-lts-220
    paths:
      - '.github/workflows/ticwatch-max-lts-220-final-build-v5-kmi.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ticwatch-max-lts-220-final-v5-kmi
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  LLVM_VERSION: '20.1.0'
  LLVM_ARCHIVE: 'LLVM-20.1.0-Linux-X64.tar.xz'
  BASE_KERNEL_SHA: '3929c55fbc7559af6df290d2c0f66dc551af161a'
  AOSP_ASB_TIP: '56cdb4d13a91efb666d571084ab82de351cc4900'
  TARGET_STABLE_TAG: 'v5.15.220'
  UPLIFT_ORCHESTRATOR_SHA: 'ba33c66c36981cd024e48326b459684605c667a9'
  EXPECTED_UTS_PREFIX: '5.15.220-Xinran_StarBai-Test'
  PREVIOUS_ANYKERNEL: 'TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter.zip'
  KSU_NEXT_MANAGER_SIZE: '0x3c2'
  KSU_NEXT_MANAGER_HASH: '3bc9938c38106bcf618bbe1d37ad4adde8a49c659e2860709bbfc341f7e749f2'
  CHECKPOINT_RUN_ID: '34757911119'
  CHECKPOINT_NAME: 'TicWatch-5.15.220-precompile-checkpoint'
  KMI_CRC_MAP_REL: '.github/data/ticwatch-stock379-kmi-crc-overrides-337.tsv'

jobs:
  compile:
    name: Build KMI-preserved 5.15.220 from verified checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout latest final-build branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-max-lts-220
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc python3 python-is-python3 \
            libssl-dev libelf-dev dwarves make cmake zip unzip curl wget \
            gnupg gawk gcc-multilib g++-multilib ccache rsync file zstd \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf >/dev/null

      - name: Install exact LLVM 20.1.0
        shell: bash
        run: |
          set -Eeuo pipefail
          wget -q "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_ARCHIVE}"
          tar -xJf "$LLVM_ARCHIVE"
          mv "LLVM-${LLVM_VERSION}-Linux-X64" "$GITHUB_WORKSPACE/aosp-clang"
          rm -f "$LLVM_ARCHIVE"
          echo "AOSP_CLANG_PATH=$GITHUB_WORKSPACE/aosp-clang" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/aosp-clang/bin/clang" --version | tee llvm-current.txt
          "$GITHUB_WORKSPACE/aosp-clang/bin/clang" --version | head -n1 | grep -Fq '20.1.0'

      - name: Download saved precompile checkpoint only
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p checkpoint
          gh run download "$CHECKPOINT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$CHECKPOINT_NAME" \
            --dir checkpoint
          test -s checkpoint/precompile-checkpoint.tar.zst
          test -s checkpoint/precompile-checkpoint.sha256

      - name: Restore and verify saved checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          cp checkpoint/precompile-checkpoint.tar.zst .
          cp checkpoint/precompile-checkpoint.sha256 .
          sha256sum -c precompile-checkpoint.sha256
          tar --zstd -xf precompile-checkpoint.tar.zst
          test -d .ticwatch-preflight/common/.git
          test -s .ticwatch-preflight/common/out/.config
          test -s previous/"$PREVIOUS_ANYKERNEL"
          test -s previous/wireless-flasher/busybox
          test -s previous/wireless-flasher/magiskboot
          test -s previous/wireless-flasher/flash.sh
          test -s previous/audit/Module.symvers
          test -s final.config
          test -s lts-merged-head.txt
          grep -Fqx 'CONFIG_KSU=y' final.config
          grep -Fqx 'CONFIG_KSU_SUSFS=y' final.config
          grep -Fqx 'CONFIG_SECCOMP_FILTER=y' final.config
          grep -Fqx 'CONFIG_MODVERSIONS=y' final.config
          cmp -s final.config .ticwatch-preflight/common/out/.config
          echo 'PRECOMPILE_CHECKPOINT_RESTORE=PASS'

      - name: Verify KMI override map provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          MAP="$GITHUB_WORKSPACE/$KMI_CRC_MAP_REL"
          test -s "$MAP"
          count="$(grep -vc '^#' "$MAP")"
          [ "$count" -eq 337 ] || { echo "Unexpected KMI override count: $count" >&2; exit 1; }
          awk 'BEGIN{FS="\t"} /^#/ {next} NF!=2 || $2 !~ /^0x[0-9a-fA-F]{8}$/ {bad=1} END{exit bad}' "$MAP"
          python3 - "$MAP" previous/audit/Module.symvers <<'PY'
          import sys
          mp, sp = sys.argv[1:]
          expected={}
          for line in open(mp):
              if not line.strip() or line.startswith('#'): continue
              s,c=line.split()[:2]; expected[s]=c.lower()
          old={}
          for line in open(sp):
              f=line.split()
              if len(f)>=2: old[f[1]]=f[0].lower()
          bad=[]
          for s,c in sorted(expected.items()):
              if old.get(s)!=c: bad.append((s,c,old.get(s)))
          if bad:
              print('KMI map disagrees with known-good 5.15.211:', bad[:20], file=sys.stderr)
              raise SystemExit(2)
          print(f'KMI_MAP_MATCHES_KNOWN_GOOD_211={len(expected)}')
          PY
          sha256sum "$MAP" | tee kmi-crc-map.sha256

      - name: Apply latest compile compatibility fixes
        shell: bash
        run: bash .github/scripts/ticwatch-5.15.220-compile-compat.sh .ticwatch-preflight/common

      - name: Install fail-closed KMI CRC preservation hook
        shell: bash
        run: |
          set -Eeuo pipefail
          K="$GITHUB_WORKSPACE/.ticwatch-preflight/common"
          F="$K/scripts/genksyms/genksyms.c"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          marker='static unsigned long ticwatch_kmi_crc_override(const char *name, unsigned long crc)'
          if marker in s:
              raise SystemExit('KMI preservation hook unexpectedly already present')
          anchor='void export_symbol(const char *name)\n{\n\tstruct symbol *sym;\n'
          if s.count(anchor) != 1:
              raise SystemExit('genksyms export_symbol anchor mismatch')
          helper=r'''static unsigned long ticwatch_kmi_crc_override(const char *name, unsigned long crc)
          {
          \tconst char *path = getenv("TICWATCH_KMI_CRC_MAP");
          \tFILE *f;
          \tchar line[512];
          \tchar sym[256];
          \tunsigned long expected;

          \tif (!path || !*path)
          \t\treturn crc;

          \tf = fopen(path, "r");
          \tif (!f) {
          \t\tperror(path);
          \t\texit(2);
          \t}

          \twhile (fgets(line, sizeof(line), f)) {
          \t\tif (line[0] == '#' || line[0] == '\n')
          \t\t\tcontinue;
          \t\tif (sscanf(line, "%255s %lx", sym, &expected) == 2 &&
          \t\t    strcmp(sym, name) == 0) {
          \t\t\tfclose(f);
          \t\t\treturn expected;
          \t\t}
          \t}
          \tfclose(f);
          \treturn crc;
          }

          '''
          s=s.replace(anchor, helper+anchor, 1)
          crc_anchor='\t\tcrc = expand_and_crc_sym(sym, 0xffffffff) ^ 0xffffffff;\n'
          if s.count(crc_anchor) != 1:
              raise SystemExit('genksyms CRC anchor mismatch')
          s=s.replace(crc_anchor, crc_anchor+'\t\tcrc = ticwatch_kmi_crc_override(name, crc);\n',1)
          p.write_text(s)
          PY
          grep -Fq 'ticwatch_kmi_crc_override' "$F"
          git -C "$K" diff -- scripts/genksyms/genksyms.c > "$GITHUB_WORKSPACE/genksyms-kmi-preserve.patch"
          test -s "$GITHUB_WORKSPACE/genksyms-kmi-preserve.patch"
          rm -f "$K/out/scripts/genksyms/genksyms" "$K/out/scripts/genksyms/"*.o 2>/dev/null || true

      - name: Compile real KMI-preserved 5.15.220 kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          export ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export PATH="$AOSP_CLANG_PATH/bin:$PATH" LLVM=1 LLVM_IAS=1
          export KCFLAGS='-Wno-error -Wno-deprecated-declarations'
          export KBUILD_BUILD_VERSION=0 KBUILD_BUILD_USER='XinRan♡' KBUILD_BUILD_HOST='Bai'
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export TICWATCH_KMI_CRC_MAP="$GITHUB_WORKSPACE/$KMI_CRC_MAP_REL"
          test -s "$TICWATCH_KMI_CRC_MAP"
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            KSU_NEXT_MANAGER_SIZE="$KSU_NEXT_MANAGER_SIZE" KSU_NEXT_MANAGER_HASH="$KSU_NEXT_MANAGER_HASH" \
            2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"
          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          test -s out/System.map
          test -s out/Module.symvers
          nm out/vmlinux > "$RUNNER_TEMP/vmlinux.nm"
          grep -Fq 'slatecom_nowarn_init' "$RUNNER_TEMP/vmlinux.nm"
          cmp -s out/.config "$GITHUB_WORKSPACE/final.config"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image"
          cp out/System.map "$GITHUB_WORKSPACE/System.map"
          cp out/Module.symvers "$GITHUB_WORKSPACE/Module.symvers"
          make -s O=out ARCH=arm64 kernelrelease | tee "$GITHUB_WORKSPACE/kernelrelease.txt"
          release="$(cat "$GITHUB_WORKSPACE/kernelrelease.txt")"
          case "$release" in ${EXPECTED_UTS_PREFIX}*) ;; *) echo "Unexpected release: $release" >&2; exit 1;; esac
          echo 'REAL_KMI_PRESERVED_KERNEL_BUILD=PASS'

      - name: Audit all 337 required CRC corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          MAP="$GITHUB_WORKSPACE/$KMI_CRC_MAP_REL"
          python3 - "$MAP" Module.symvers previous/audit/Module.symvers <<'PY' | tee kmi-crc-audit.txt
          import sys
          mp,newp,oldp=sys.argv[1:]
          exp={}
          for line in open(mp):
              if not line.strip() or line.startswith('#'): continue
              s,c=line.split()[:2]; exp[s]=c.lower()
          def symvers(p):
              d={}
              for line in open(p):
                  f=line.split()
                  if len(f)>=2:d[f[1]]=f[0].lower()
              return d
          new=symvers(newp); old=symvers(oldp)
          missing=[]; bad=[]
          for s,c in sorted(exp.items()):
              if s not in new: missing.append(s)
              elif new[s]!=c: bad.append((s,c,new[s]))
          common=set(new)&set(old)
          common_changed=[s for s in common if new[s]!=old[s]]
          print(f'KMI_OVERRIDE_EXPECTED={len(exp)}')
          print(f'KMI_OVERRIDE_MISSING={len(missing)}')
          print(f'KMI_OVERRIDE_MISMATCH={len(bad)}')
          print(f'KNOWN_GOOD_211_COMMON_EXPORTS={len(common)}')
          print(f'COMMON_EXPORTS_STILL_DIFFERENT={len(common_changed)}')
          print(f'FINAL_SYMVERS_SYMBOLS={len(new)}')
          if missing: print('MISSING=' + ','.join(missing[:50]))
          if bad: print('MISMATCH=' + ';'.join(f'{s}:{e}:{a}' for s,e,a in bad[:50]))
          if missing or bad:
              raise SystemExit(2)
          print('STOCK379_KMI_CRC_OVERRIDE_GATE=PASS')
          PY
          grep -Fqx 'STOCK379_KMI_CRC_OVERRIDE_GATE=PASS' kmi-crc-audit.txt

      - name: Static config and artifact audit
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s Image
          test -s Module.symvers
          test -s System.map
          test -s final.config
          grep -Fqx 'CONFIG_ARM64=y' final.config
          grep -Fqx 'CONFIG_COMPAT=y' final.config
          grep -Fqx 'CONFIG_ANDROID_BINDER_IPC=y' final.config
          grep -Fqx 'CONFIG_ANDROID_BINDERFS=y' final.config
          grep -Fqx 'CONFIG_MODVERSIONS=y' final.config
          awk 'NF < 4 { bad=1 } END { exit bad ? 1 : 0 }' Module.symvers
          symvers_lines="$(wc -l < Module.symvers | tr -d ' ')"
          [ "$symvers_lines" -gt 1000 ] || { echo "Suspicious Module.symvers size: $symvers_lines" >&2; exit 1; }
          cat > kmi-static-audit.txt <<EOF
          CONFIG_MODVERSIONS=PASS
          MODULE_SYMVERS_LINES=$symvers_lines
          KERNEL_RELEASE=$(cat kernelrelease.txt)
          UPLIFT_ORCHESTRATOR_SHA=$UPLIFT_ORCHESTRATOR_SHA
          UPLIFT_SOURCE_HEAD=$(cat lts-merged-head.txt)
          STOCK379_KMI_TARGETED_CRC_OVERRIDES=337
          STOCK379_KMI_CRC_OVERRIDE_GATE=PASS
          NOTE=Host-side full 260-module audit is still required against this final Module.symvers before flash; runtime load validation follows first boot.
          EOF
          cat kmi-static-audit.txt

      - name: Package final static-validation candidate without flashing
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bundle/wireless-flasher bundle/audit bundle/docs anykernel
          cp Image bundle/wireless-flasher/Image
          cp previous/wireless-flasher/busybox bundle/wireless-flasher/busybox
          cp previous/wireless-flasher/magiskboot bundle/wireless-flasher/magiskboot
          cp previous/wireless-flasher/flash.sh bundle/wireless-flasher/flash.sh
          chmod 0755 bundle/wireless-flasher/*
          IMAGE_SHA="$(sha256sum Image | awk '{print $1}')"
          python3 - "$IMAGE_SHA" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('bundle/wireless-flasher/flash.sh')
          s=p.read_text(); sha=sys.argv[1]
          s,n=re.subn(r'^EXPECTED_IMAGE_SHA="[0-9a-f]+"$',f'EXPECTED_IMAGE_SHA="{sha}"',s,count=1,flags=re.M)
          if n != 1: raise SystemExit('flasher SHA anchor missing')
          s,n=re.subn(r'^EXPECTED_RELEASE_PREFIX="[^"]+"$','EXPECTED_RELEASE_PREFIX="5.15.211-Xinran_StarBai-Test"',s,count=1,flags=re.M)
          if n != 1: raise SystemExit('flasher release anchor missing')
          p.write_text(s)
          PY
          sh -n bundle/wireless-flasher/flash.sh
          grep -Fqx 'EXPECTED_RELEASE_PREFIX="5.15.211-Xinran_StarBai-Test"' bundle/wireless-flasher/flash.sh
          (cd bundle/wireless-flasher && sha256sum Image busybox magiskboot flash.sh > SHA256SUMS && sha256sum -c SHA256SUMS)

          unzip -q "previous/$PREVIOUS_ANYKERNEL" -d anykernel
          cp Image anykernel/Image
          (cd anykernel && zip -qr9 "$GITHUB_WORKSPACE/TicWatch-MAX-LTS-5.15.220-KMI-PRESERVED.zip" .)
          unzip -p TicWatch-MAX-LTS-5.15.220-KMI-PRESERVED.zip Image > packaged-Image
          cmp -s Image packaged-Image
          rm packaged-Image

          cp Image TicWatch-MAX-LTS-5.15.220-KMI-PRESERVED.zip bundle/
          cp final.config System.map Module.symvers kernelrelease.txt kernel-build.log kmi-static-audit.txt kmi-crc-audit.txt llvm-current.txt lts-merged-head.txt genksyms-kmi-preserve.patch kmi-crc-map.sha256 bundle/audit/
          cp "$KMI_CRC_MAP_REL" bundle/audit/

          cat > bundle/PROVENANCE.txt <<EOF
          BASE_KERNEL_SHA=$BASE_KERNEL_SHA
          ANDROID_SECURITY_COMMIT=$AOSP_ASB_TIP
          STABLE_TARGET=$TARGET_STABLE_TAG
          UPLIFT_ORCHESTRATOR_SHA=$UPLIFT_ORCHESTRATOR_SHA
          UPLIFT_SOURCE_HEAD=$(cat lts-merged-head.txt)
          KERNEL_RELEASE=$(cat kernelrelease.txt)
          IMAGE_SHA256=$IMAGE_SHA
          CONFIG_MODVERSIONS=ENABLED
          STOCK379_KMI_CRC_OVERRIDES=337
          STOCK379_KMI_CRC_OVERRIDE_GATE=PASS
          KMI_REFERENCE=KNOWN_GOOD_5.15.211_MATCHING_STOCK379
          FLASH_ALLOWED_BASELINE=5.15.211-Xinran_StarBai-Test
          WEAR7_PROFILE=ENABLED
          KEXEC=ENABLED_CLASSIC
          KEXEC_FILE=DISABLED
          KSU_SAFE_MODE_KEYS=KEY_VOLUMEDOWN,KEY_MENU
          KSU_SAFE_MODE_REAL_KEYDOWN_ONLY=1
          TICWATCH_KEY_MENU=ROTATING_CROWN_PRESS
          SECCOMP_FILTER=PRESERVED
          FIRST_ZYGOTE_FIX=ENABLED
          ARM32_SUSFS_C_LONG_FIX=ENABLED
          SLATECOM_FIX=BUILTIN_FAIL_CLOSED_KPROBE
          FLASH_PERFORMED=NO
          EOF

          cat > bundle/docs/KERNEL_FINAL_REPORT.txt <<EOF
          TicWatch Pro 5 Enduro (dace) - 5.15.220 final static-validation candidate
          KERNEL_RELEASE=$(cat kernelrelease.txt)
          SOURCE_HEAD=$(cat lts-merged-head.txt)
          ORCHESTRATION_BRANCH_HEAD=$GITHUB_SHA
          CONFIG_MODVERSIONS=y
          CONFIG_ARM64=y
          CONFIG_COMPAT=y
          CONFIG_ANDROID_BINDER_IPC=y
          CONFIG_ANDROID_BINDERFS=y
          STOCK379_KMI_TARGETED_CRC_OVERRIDES=337
          STOCK379_KMI_CRC_OVERRIDE_GATE=PASS
          FLASH_ALLOWED_BASELINE=5.15.211-Xinran_StarBai-Test
          BOOT_IMG=NOT_PREBUILT_ANYKERNEL_REPLACES_KERNEL_ONLY
          VENDOR_BOOT_IMG=STOCK_379_UNCHANGED
          INIT_BOOT_IMG=STOCK_379_UNCHANGED
          DTBO_IMG=STOCK_379_UNCHANGED
          RUNTIME_MODULE_VALIDATION=PENDING_FIRST_CONTROLLED_BOOT
          FLASH_PERFORMED=NO
          EOF

          (cd bundle && sha256sum Image TicWatch-MAX-LTS-5.15.220-KMI-PRESERVED.zip PROVENANCE.txt audit/final.config audit/System.map audit/Module.symvers docs/KERNEL_FINAL_REPORT.txt > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Upload KMI-preserved final candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TicWatch-MAX-LTS-5.15.220-KMI-PRESERVED-V5
          path: bundle/
          if-no-files-found: error
          retention-days: 90
