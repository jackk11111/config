name: Wear7 clean final candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wear7-clean-final-candidate
  cancel-in-progress: true

env:
  PIXEL_FILE: solios-cp2a.260603.001.s1-factory-d203665c.zip
  PIXEL_SHA256: d203665c90bc06bf175dbb3cbd7fcc9d212c056a030f9c51b541129e8651fb7d
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d
  KERNEL_RUN_ID: '0'
  KERNEL_ARTIFACT: TicWatch-Wear7-Clean-Kernel-5.15.220-NoKSU
  KERNEL_BUILD_TOOLS_SHA: 010d8a83d84ced4beef7779453766350db8c08cd
  OTATOOLS_URL: https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
  OTATOOLS_SHA256: f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84
  VNDK33_SHA256: 5504070023e17e8a4dd3b23b9723366835bbcfc27d12f4039ac192b2894fb482
  VNDK33_SIZE: '15638528'
  SUPER_DEVICE_SIZE: '4294967296'
  DYNAMIC_GROUP_SIZE: '4284481536'
  SYSTEM_PARTITION_SIZE: '1741303808'
  SYSTEM_EXT_PARTITION_SIZE: '283598848'
  PRODUCT_PARTITION_SIZE: '1613258752'
  AVB_SALT: 29ee420fe79a48929c62ab7091d79c9575998f66d7f5e856987e7bbe578d5459
  BOOT_AVB_SALT: 8078f56b41ac2e6ebea1f428d5b574f02f57d480d916879b2b28628caed0e616
  TICWATCH_FIRST_API_LEVEL: '30'
  TICWATCH_VENDOR_SKU: monaco

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: wear7-clean-rebuild-20261003
          fetch-depth: 1

      - name: Prepare host
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$KERNEL_RUN_ID" != 0 || { echo 'KERNEL_RUN_ID_NOT_PINNED'; exit 2; }
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/share/boost /usr/local/lib/android/sdk/ndk || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl unzip zip e2fsprogs android-sdk-libsparse-utils attr libcap2-bin file python3 binutils >/dev/null
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/work" "$RUNNER_TEMP/hosttools" clean-report clean-candidate
          df -h

      - name: Pin Android filesystem AVB liblp tools
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --no-checkout https://android.googlesource.com/kernel/prebuilts/build-tools "$RUNNER_TEMP/kernel-build-tools"
          git -C "$RUNNER_TEMP/kernel-build-tools" fetch --depth=1 origin "$KERNEL_BUILD_TOOLS_SHA"
          git -C "$RUNNER_TEMP/kernel-build-tools" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/kernel-build-tools" rev-parse HEAD)" = "$KERNEL_BUILD_TOOLS_SHA"
          B="$RUNNER_TEMP/kernel-build-tools/linux-x86/bin"
          for c in mkuserimg_mke2fs mke2fs e2fsdroid simg2img img2simg tune2fs avbtool lpmake; do test -x "$B/$c"; done
          echo "$B" >> "$GITHUB_PATH"
          {
            echo "KERNEL_BUILD_TOOLS_SHA=$KERNEL_BUILD_TOOLS_SHA"
            for c in mkuserimg_mke2fs mke2fs e2fsdroid simg2img img2simg tune2fs avbtool lpmake; do sha256sum "$B/$c"; done
          } > clean-report/PINNED_BUILD_TOOLS_SHA256.txt

      - name: Pin official Android17 checkvintf APEX host tools
        shell: bash
        run: |
          set -Eeuo pipefail
          ZIP="$RUNNER_TEMP/hosttools/otatools.zip"
          curl -fL --retry 3 -sS -o "$ZIP" "$OTATOOLS_URL"
          echo "$OTATOOLS_SHA256  $ZIP" | sha256sum -c -
          python3 - "$ZIP" "$RUNNER_TEMP/hosttools/x" <<'PY'
          import pathlib,sys,zipfile
          z=zipfile.ZipFile(sys.argv[1]); out=pathlib.Path(sys.argv[2]).resolve()
          bins={'bin/checkvintf','bin/apexd_host','bin/deapexer','bin/debugfs','bin/debugfs_static','bin/fsck.erofs'}
          keep=[n for n in z.namelist() if n in bins or n.startswith(('lib64/','lib/'))]
          req={'bin/checkvintf','bin/apexd_host','bin/deapexer','bin/fsck.erofs'}
          miss=req-set(keep)
          if miss: raise SystemExit('missing host tools '+repr(sorted(miss)))
          for n in keep:
              p=(out/n).resolve()
              if not p.is_relative_to(out): raise SystemExit('unsafe path')
              z.extract(n,out)
          PY
          BIN="$RUNNER_TEMP/hosttools/x/bin"
          test -e "$BIN/debugfs" || ln -s debugfs_static "$BIN/debugfs"
          test -e "$BIN/debugfs_static" || ln -s debugfs "$BIN/debugfs_static"
          chmod +x "$BIN/"*
          echo "CHECKVINTF=$BIN/checkvintf" >> "$GITHUB_ENV"
          echo "APEXD_HOST=$BIN/apexd_host" >> "$GITHUB_ENV"
          echo "HOSTROOT=$RUNNER_TEMP/hosttools/x" >> "$GITHUB_ENV"
          sha256sum "$BIN/checkvintf" "$BIN/apexd_host" "$BIN/deapexer" > clean-report/PINNED_VINTF_TOOLS_SHA256.txt

      - name: Locate Android17 aapt2
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2=$(find "$SDK/build-tools" -type f -name aapt2 -perm -111 -print 2>/dev/null | sort -V | tail -n1)
          test -n "$AAPT2"
          "$AAPT2" version | tee clean-report/AAPT2_VERSION.txt
          sha256sum "$AAPT2" >> clean-report/AAPT2_VERSION.txt
          echo "AAPT2=$AAPT2" >> "$GITHUB_ENV"

      - name: Download exact Pixel17 TicWatch379 and clean kernel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/src"
          curl -fL --retry 3 --retry-delay 3 -sS -o "$PIXEL_FILE" "https://dl.google.com/dl/android/aosp/$PIXEL_FILE"
          echo "$PIXEL_SHA256  $PIXEL_FILE" | sha256sum -c -
          curl -fL --retry 3 --retry-delay 3 -sS -o ticwatch379.zip "$TIC_URL"
          echo "$TIC_SHA256  ticwatch379.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kernel-artifact"
          gh run download "$KERNEL_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$KERNEL_ARTIFACT" --dir "$RUNNER_TEMP/kernel-artifact"
          printf 'PIXEL_FACTORY_SHA256=%s\nTICWATCH379_OTA_SHA256=%s\nKERNEL_RUN_ID=%s\n' "$PIXEL_SHA256" "$TIC_SHA256" "$KERNEL_RUN_ID" > "$GITHUB_WORKSPACE/clean-report/INPUT_LOCK.txt"

      - name: Hard-gate clean no-KSU kernel artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          K="$RUNNER_TEMP/kernel-artifact"
          test -s "$K/Image"
          test -s "$K/CLEAN_KERNEL_REPORT.txt"
          test -s "$K/SHA256SUMS.txt"
          (cd "$K" && sha256sum -c SHA256SUMS.txt)
          grep -Fqx 'CONFIG_KSU=ABSENT' "$K/CLEAN_KERNEL_REPORT.txt"
          grep -Fqx 'KERNELSU_SOURCE=ABSENT' "$K/CLEAN_KERNEL_REPORT.txt"
          grep -Fqx 'SUSFS_SOURCE=ABSENT' "$K/CLEAN_KERNEL_REPORT.txt"
          grep -Fqx 'KEXEC_DIAGNOSTIC_PATCHES=ABSENT' "$K/CLEAN_KERNEL_REPORT.txt"
          grep -Fqx 'STOCK379_KMI_TARGETED_GATE=PASS_337_OF_337' "$K/CLEAN_KERNEL_REPORT.txt"
          ! grep -Eq '^CONFIG_KSU(=|_)' "$K/audit/final.config"
          grep -Fqx 'CONFIG_MODVERSIONS=y' "$K/audit/final.config"
          IMAGE_SHA=$(sha256sum "$K/Image" | awk '{print $1}')
          echo "KERNEL_IMAGE_SHA256=$IMAGE_SHA" >> "$GITHUB_ENV"
          cp "$K/CLEAN_KERNEL_REPORT.txt" clean-report/
          sha256sum "$K/Image" "$K/audit/final.config" "$K/audit/Module.symvers" > clean-report/KERNEL_INPUT_SHA256.txt

      - name: Extract Pixel software partitions
        shell: bash
        run: |
          set -Eeuo pipefail
          FACTORY="$RUNNER_TEMP/src/$PIXEL_FILE"; WORK="$RUNNER_TEMP/work"
          nested=$(unzip -Z1 "$FACTORY" | grep -E '(^|/)image-[^/]+\.zip$' | head -n1)
          test -n "$nested"
          unzip -p "$FACTORY" "$nested" > "$WORK/pixel-inner.zip"
          for p in system system_ext product; do
            unzip -p "$WORK/pixel-inner.zip" "$p.img" > "$WORK/$p.input"
            magic=$(od -An -tx4 -N4 "$WORK/$p.input" | tr -d ' \n')
            if test "$magic" = ed26ff3a; then simg2img "$WORK/$p.input" "$WORK/$p.pixel.raw"; else mv "$WORK/$p.input" "$WORK/$p.pixel.raw"; fi
            avbtool info_image --image "$WORK/$p.pixel.raw" > "clean-report/${p}_pixel_avb_before.txt"
            avbtool erase_footer --image "$WORK/$p.pixel.raw"
            e2fsck -fn "$WORK/$p.pixel.raw" > "clean-report/${p}_pixel_noavb_fsck.txt" 2>&1 || rc=$?
            rc=${rc:-0}; test "$rc" -lt 8; unset rc
          done

      - name: Reconstruct exact stock379 dynamic partitions
        shell: bash
        run: |
          set -Eeuo pipefail
          OTA="$RUNNER_TEMP/src/ticwatch379.zip"; WORK="$RUNNER_TEMP/work"
          : > clean-report/TICWATCH_DYNAMIC_SHA256.tsv
          for p in system system_ext product vendor vendor_dlkm system_dlkm; do
            python3 wear7/scripts/reconstruct_block_ota.py "$OTA" "$p" "$WORK/tic-$p.raw"
            printf '%s\t%s\t%s\n' "$p" "$(stat -c %s "$WORK/tic-$p.raw")" "$(sha256sum "$WORK/tic-$p.raw"|awk '{print $1}')" >> clean-report/TICWATCH_DYNAMIC_SHA256.tsv
            e2fsck -fn "$WORK/tic-$p.raw" > "clean-report/tic_${p}_fsck.txt" 2>&1 || rc=$?
            rc=${rc:-0}; test "$rc" -lt 8; unset rc
          done
          grep -qx $'vendor\t297361408\t150238505037c881b079b7c9de1adc231f2c4a94b64f8dd3a7694ebc7408371e' clean-report/TICWATCH_DYNAMIC_SHA256.tsv
          grep -qx $'vendor_dlkm\t63889408\te9b865fc3eeb54cf1519cda55efbd30b2921e31765f5d98a3060575f95892ab6' clean-report/TICWATCH_DYNAMIC_SHA256.tsv
          grep -qx $'system_dlkm\t348160\tfdd73e1603333b926424fa5526f015701e453b54349efd012f35c714b202d8de' clean-report/TICWATCH_DYNAMIC_SHA256.tsv

      - name: Extract exact stock379 bootchain
        shell: bash
        run: |
          set -Eeuo pipefail
          OTA="$RUNNER_TEMP/src/ticwatch379.zip"; WORK="$RUNNER_TEMP/work"
          : > clean-report/STOCK_BOOTCHAIN_SHA256.tsv
          extract_gate(){ f=$1 expected=$2 bytes=$3; unzip -p "$OTA" "$f" > "$WORK/$f"; test "$(stat -c %s "$WORK/$f")" = "$bytes"; echo "$expected  $WORK/$f" | sha256sum -c -; printf '%s\t%s\t%s\n' "$f" "$bytes" "$expected" >> clean-report/STOCK_BOOTCHAIN_SHA256.tsv; }
          extract_gate boot.img 251412139ac66fa20d6d93f0a65f95239f9f888b35dae20c866e92acc7daecac 100663296
          extract_gate init_boot.img c128f41b1e1fe4a2062b1b8464bf8e01650419f158ab7d412a3bf1f0099c9884 8388608
          extract_gate vendor_boot.img 9d7cd2a5f7a21e9554552e94aaf89c2fdc6d036f59c8e8abe355456f8a5f18cf 100663296
          extract_gate dtbo.img eb2a8d0028b6e22898b26e4bc71419190a4ea3431a2b66c6c57d9e280ade4c96 8388608
          extract_gate vbmeta.img 5354ece08d0c8fbc6ff51cf9e535970b0416c80132ead172a803e6b34dbf2118 8192
          extract_gate vbmeta_system.img 201e993b7a2c4979c94fece32de02e83d91e3ae1dc23258640473fbca69c9f5a 4096
          avbtool info_image --image "$WORK/vbmeta.img" > clean-report/STOCK_ROOT_VBMETA.txt
          avbtool info_image --image "$WORK/vbmeta_system.img" > clean-report/STOCK_SYSTEM_VBMETA.txt

      - name: Recreate exact Stage0 payload and stock VNDK33 APEX
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"; BUNDLE="$WORK/stage0-bundle"
          for p in system system_ext product vendor; do sudo mkdir -p "$WORK/tic-$p-mnt"; sudo mount -o loop,ro "$WORK/tic-$p.raw" "$WORK/tic-$p-mnt"; done
          mkdir -p "$BUNDLE/manifests" "$BUNDLE/payload/system/priv-app/TicCompanionWear" "$BUNDLE/payload/product/overlay/DaceEnduroFastPairOverlay" "$BUNDLE/payload/system_ext/lib"
          cp wear7/manifests/STAGE0_SOURCE_HASHES.tsv "$BUNDLE/manifests/SOURCE_HASHES.tsv"
          one_match(){ root=$1; name=$2; mapfile -t a < <(sudo find "$root" -type f -name "$name" -print); test "${#a[@]}" = 1; printf '%s\n' "${a[0]}"; }
          sudo cp "$(one_match "$WORK/tic-system-mnt" TicCompanionWear.apk)" "$BUNDLE/payload/system/priv-app/TicCompanionWear/TicCompanionWear.apk"
          sudo cp "$(one_match "$WORK/tic-product-mnt" DaceEnduroFastPairOverlay.apk)" "$BUNDLE/payload/product/overlay/DaceEnduroFastPairOverlay/DaceEnduroFastPairOverlay.apk"
          for f in libdisplayconfig.system.qti.so libgralloc.system.qti.so vendor.display.config@2.0.so android.hardware.radio@1.5.so android.hardware.radio@1.6.so vendor.google_clockwork.wristorientation@1.0.so; do
            sudo cp "$(one_match "$WORK/tic-system_ext-mnt" "$f")" "$BUNDLE/payload/system_ext/lib/$f"
          done
          if test -d "$WORK/tic-system-mnt/system"; then SS="$WORK/tic-system-mnt/system"; else SS="$WORK/tic-system-mnt"; fi
          mapfile -t A < <(sudo find "$SS/apex" -maxdepth 1 -type f \( -name 'com.android.vndk.v33*.apex' -o -name 'com.android.vndk.v33*.capex' \) -print)
          test "${#A[@]}" = 1
          sudo cp "${A[0]}" "$WORK/stock-vndk33.apex"
          sudo chown "$(id -u):$(id -g)" "$WORK/stock-vndk33.apex"
          test "$(stat -c %s "$WORK/stock-vndk33.apex")" = "$VNDK33_SIZE"
          echo "$VNDK33_SHA256  $WORK/stock-vndk33.apex" | sha256sum -c -
          printf 'SOURCE=%s\nSIZE=%s\nSHA256=%s\n' "${A[0]}" "$VNDK33_SIZE" "$VNDK33_SHA256" > clean-report/VNDK33_SOURCE.txt
          for p in system system_ext product vendor; do sudo umount "$WORK/tic-$p-mnt"; done
          sudo chown -R "$(id -u):$(id -g)" "$BUNDLE"
          python3 - <<'PY'
          import csv,hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'work/stage0-bundle'
          rows=list(csv.DictReader((root/'manifests/SOURCE_HASHES.tsv').open(),delimiter='\t'))
          assert len(rows)==8
          for r in rows:
              p=root/r['bundle_path']; data=p.read_bytes()
              assert len(data)==int(r['bytes']), (p,len(data),r['bytes'])
              assert hashlib.sha256(data).hexdigest()==r['sha256'], p
          print('STAGE0_8_OF_8=PASS')
          PY

      - name: Stage exact Pixel trees and apply minimal Dace bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"
          for p in system system_ext product; do
            sudo mkdir -p "$WORK/pixel-$p-mnt" "$WORK/stage-$p"
            sudo mount -o loop,ro "$WORK/$p.pixel.raw" "$WORK/pixel-$p-mnt"
            sudo cp -a "$WORK/pixel-$p-mnt/." "$WORK/stage-$p/"
            sudo umount "$WORK/pixel-$p-mnt"
          done
          sudo python3 wear7/scripts/apply_stage0_overlay_v8.py --system-root "$WORK/stage-system" --system-ext-root "$WORK/stage-system_ext" --product-root "$WORK/stage-product" --stage0-bundle "$WORK/stage0-bundle" --report clean-report/STAGE0_APPLY.txt
          grep -Fqx 'WEAR7_STAGE0_APPLY=PASS' clean-report/STAGE0_APPLY.txt
          sudo install -m 0644 "$WORK/stock-vndk33.apex" "$WORK/stage-system/system/apex/com.android.vndk.v33.apex"
          echo "$VNDK33_SHA256  $WORK/stage-system/system/apex/com.android.vndk.v33.apex" | sudo sha256sum -c -
          sudo python3 - "$WORK/stage-system/system/etc/vintf/manifest.xml" <<'PY'
          import sys,xml.etree.ElementTree as ET
          p=sys.argv[1]; t=ET.parse(p); r=t.getroot(); ndks=[x for x in r.findall('vendor-ndk') if x.findtext('version')=='33']
          if len(ndks)==0:
              x=ET.Element('vendor-ndk'); ET.SubElement(x,'version').text='33'; s=r.find('system-sdk'); r.insert(list(r).index(s) if s is not None else len(r),x)
          elif len(ndks)!=1: raise SystemExit('duplicate vendor-ndk 33')
          ET.indent(t,space='    '); t.write(p,encoding='unicode')
          PY
          sudo mkdir -p "$WORK/tic-vendor-mnt"
          sudo mount -o loop,ro "$WORK/tic-vendor.raw" "$WORK/tic-vendor-mnt"
          sudo python3 wear7/scripts/generate_framework_matrix_from_device_manifest.py --main "$WORK/tic-vendor-mnt/etc/vintf/manifest_monaco.xml" --fragments "$WORK/tic-vendor-mnt/etc/vintf/manifest" --out "$WORK/compatibility_matrix.dace.xml" --sepolicy-version 33.0 --kernel-sepolicy-version 30 --matrix-version 9.0 | tee clean-report/DACE_MATRIX_GENERATOR.txt
          sudo umount "$WORK/tic-vendor-mnt"
          sudo install -m 0644 "$WORK/compatibility_matrix.dace.xml" "$WORK/stage-system/system/etc/vintf/compatibility_matrix.dace.xml"

      - name: Pre-rebuild contamination and Pixel Assistant gates
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"; S="$WORK/stage-system"; X="$WORK/stage-system_ext"
          test ! -e "$S/system/app/KernelSUNextManager"
          test ! -e "$X/bin/ksud"
          test ! -e "$X/etc/init/wear7-dace-wireless-bootstrap.rc"
          test ! -e "$X/etc/init/wear7-v11-stage-marker.rc"
          test ! -e "$X/etc/wear7/96-wifi-adb-persistent.sh"
          ! sudo grep -RIl --exclude='*.apk' --exclude='*.jar' -E 'KernelSU|ksud|SuSFS|wear7-v11-stage-marker|wifi-adb-persistent|service\.adb\.tcp\.port 5555' "$S" "$X" 2>/dev/null | tee clean-report/CONTAMINATION_HITS.txt | grep -q .
          test ! -s clean-report/CONTAMINATION_HITS.txt
          for rel in \
            system/priv-app/AssistantWearPrebuilt/AssistantWearPrebuilt.apk \
            system/etc/permissions/privapp-permissions-pixel-watch-assistant.xml \
            system/etc/permissions/edoras_assistant_feature.xml; do
            f="$S/$rel"; test -f "$f"; sha256sum "$f"
          done | tee clean-report/ASSISTANT_STAGE_SHA256.txt
          grep -Fq '7833ed7be076917b2611928035af17045064837f9dc473f0bb1fb1adacf8eb47' clean-report/ASSISTANT_STAGE_SHA256.txt
          grep -Fq '57d7e69c543a13f7e60dc2ec9953dbef63c3a0ecd90befc5dc42422955b4cd08' clean-report/ASSISTANT_STAGE_SHA256.txt
          grep -Fq '1770505fa7df860321a9d6c1b0edb330ac6c9ef5bcdaa0372883cc334f15f67c' clean-report/ASSISTANT_STAGE_SHA256.txt

      - name: Generate exact filesystem metadata configs and contexts
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"
          sudo python3 wear7/scripts/generate_exact_fs_config.py "$WORK/stage-system" '' "$WORK/system.fs_config"
          sudo python3 wear7/scripts/generate_exact_fs_config.py "$WORK/stage-system_ext" system_ext "$WORK/system_ext.fs_config"
          sudo python3 wear7/scripts/generate_exact_fs_config.py "$WORK/stage-product" product "$WORK/product.fs_config"
          sudo cp "$WORK/stage-system/system/etc/selinux/plat_file_contexts" "$WORK/plat_file_contexts"
          sudo cp "$WORK/stage-system_ext/etc/selinux/system_ext_file_contexts" "$WORK/system_ext_file_contexts"
          sudo cp "$WORK/stage-product/etc/selinux/product_file_contexts" "$WORK/product_file_contexts"
          sudo sh -c "cat '$WORK/plat_file_contexts' '$WORK/system_ext_file_contexts' > '$WORK/system_ext_combined_file_contexts'"
          sudo sh -c "cat '$WORK/plat_file_contexts' '$WORK/product_file_contexts' > '$WORK/product_combined_file_contexts'"
          sudo chown "$(id -u):$(id -g)" "$WORK"/*.fs_config "$WORK"/*file_contexts

      - name: Rebuild Android17 software filesystems metadata-safe
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"; B="$RUNNER_TEMP/kernel-build-tools/linux-x86/bin"
          : > clean-report/W7_FILESYSTEM_SIZES.tsv
          build_one(){
            p=$1; mountp=$2; extra=$3; contexts=$4
            donor="$WORK/$p.pixel.raw"; stage="$WORK/stage-$p"; cfg="$WORK/$p.fs_config"; rebuilt="$WORK/$p.w7.raw"
            old=$(stat -c %s "$donor"); new=$(( (old + extra + 4095) / 4096 * 4096 ))
            uuid=$(tune2fs -l "$donor" | awk -F: '/Filesystem UUID:/ {gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2; exit}')
            hashseed=$(debugfs -R stats "$donor" 2>/dev/null | awk -F: '/Directory Hash Seed:/ {gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2; exit}')
            inode=$(tune2fs -l "$donor" | awk -F: '/Inode count:/ {gsub(/ /,"",$2); print $2; exit}'); inode=$((inode+256))
            args=("$stage" "$rebuilt" ext4 "$mountp" "$new" "$contexts" --journal_size 0 --timestamp 1230768000 --fs_config "$cfg" --label "$p" --inodes "$inode" --inode_size 256 --reserved_percent 0 --mke2fs_uuid "$uuid" --share_dup_blocks)
            if test -n "$hashseed"; then args+=(--mke2fs_hash_seed "$hashseed"); fi
            sudo env PATH="$B:$PATH" "$B/mkuserimg_mke2fs" "${args[@]}" | tee "clean-report/${p}_mkuserimg.log"
            sudo chown "$(id -u):$(id -g)" "$rebuilt"
            e2fsck -fn "$rebuilt" > "clean-report/${p}_w7_fsck.txt" 2>&1 || rc=$?; rc=${rc:-0}; test "$rc" -lt 8; unset rc
            printf '%s\t%s\n' "$p" "$(stat -c %s "$rebuilt")" >> clean-report/W7_FILESYSTEM_SIZES.tsv
          }
          build_one system / $((48*1024*1024)) "$WORK/plat_file_contexts"
          build_one system_ext /system_ext $((24*1024*1024)) "$WORK/system_ext_combined_file_contexts"
          build_one product /product $((8*1024*1024)) "$WORK/product_combined_file_contexts"

      - name: Mount finals and run clean static gates
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"
          for p in system system_ext product; do sudo mkdir -p "$WORK/final-$p"; sudo mount -o loop,ro "$WORK/$p.w7.raw" "$WORK/final-$p"; done
          sudo mkdir -p "$WORK/final-vendor"; sudo mount -o loop,ro "$WORK/tic-vendor.raw" "$WORK/final-vendor"
          if test -d "$WORK/final-system/system/etc/vintf"; then SYS="$WORK/final-system/system"; else SYS="$WORK/final-system"; fi
          SX="$WORK/final-system_ext"; PROD="$WORK/final-product"; VEN="$WORK/final-vendor"; ODM="$VEN/odm"
          echo "FINAL_SYS=$SYS" >> "$GITHUB_ENV"; echo "FINAL_SX=$SX" >> "$GITHUB_ENV"; echo "FINAL_PROD=$PROD" >> "$GITHUB_ENV"; echo "FINAL_VEN=$VEN" >> "$GITHUB_ENV"; echo "FINAL_ODM=$ODM" >> "$GITHUB_ENV"
          echo "$VNDK33_SHA256  $SYS/apex/com.android.vndk.v33.apex" | sudo sha256sum -c -
          test "$(sudo stat -c %s "$SYS/apex/com.android.vndk.v33.apex")" = "$VNDK33_SIZE"
          grep -q '<version>33</version>' <(sudo cat "$SYS/etc/vintf/manifest.xml")
          test -s "$SYS/etc/vintf/compatibility_matrix.dace.xml"
          test ! -e "$SYS/app/KernelSUNextManager"; test ! -e "$SX/bin/ksud"; test ! -e "$SX/etc/init/wear7-dace-wireless-bootstrap.rc"; test ! -e "$SX/etc/init/wear7-v11-stage-marker.rc"; test ! -e "$SX/etc/wear7/96-wifi-adb-persistent.sh"
          ! sudo grep -RIl --exclude='*.apk' --exclude='*.jar' -E 'KernelSU|ksud|SuSFS|wear7-v11-stage-marker|wifi-adb-persistent|service\.adb\.tcp\.port 5555' "$SYS" "$SX" 2>/dev/null | tee clean-report/FINAL_CONTAMINATION_HITS.txt | grep -q .
          test ! -s clean-report/FINAL_CONTAMINATION_HITS.txt
          for spec in \
            'priv-app/AssistantWearPrebuilt/AssistantWearPrebuilt.apk 7833ed7be076917b2611928035af17045064837f9dc473f0bb1fb1adacf8eb47' \
            'etc/permissions/privapp-permissions-pixel-watch-assistant.xml 57d7e69c543a13f7e60dc2ec9953dbef63c3a0ecd90befc5dc42422955b4cd08' \
            'etc/permissions/edoras_assistant_feature.xml 1770505fa7df860321a9d6c1b0edb330ac6c9ef5bcdaa0372883cc334f15f67c'; do
            rel=${spec% *}; hash=${spec##* }; echo "$hash  $SYS/$rel" | sudo sha256sum -c -
          done
          OVER="$PROD/overlay/DaceEnduroFastPairOverlay/DaceEnduroFastPairOverlay.apk"; test -f "$OVER"
          "$AAPT2" dump xmltree "$OVER" --file AndroidManifest.xml > clean-report/FASTPAIR_OVERLAY_MANIFEST.txt
          grep -q 'com.google.android.wearable.setupwizard' clean-report/FASTPAIR_OVERLAY_MANIFEST.txt
          sudo python3 wear7/scripts/fs_semantic_manifest.py "$WORK/final-system" clean-report/system_final_manifest.tsv
          sudo python3 wear7/scripts/fs_semantic_manifest.py "$WORK/final-system_ext" clean-report/system_ext_final_manifest.tsv
          sudo python3 wear7/scripts/fs_semantic_manifest.py "$WORK/final-product" clean-report/product_final_manifest.tsv
          sudo chown -R "$(id -u):$(id -g)" clean-report

      - name: Official Android17 APEX activation and checkvintf
        shell: bash
        run: |
          set -Eeuo pipefail
          APEXMAP="$RUNNER_TEMP/apexmap"; rm -rf "$APEXMAP"; mkdir -p "$APEXMAP"
          env LD_LIBRARY_PATH="$HOSTROOT/lib64:$HOSTROOT/lib" "$APEXD_HOST" --tool_path "$HOSTROOT" --apex_path "$APEXMAP" --system_path "$FINAL_SYS" --system_ext_path "$FINAL_SX" --product_path "$FINAL_PROD" --vendor_path "$FINAL_VEN" --odm_path "$FINAL_ODM" > clean-report/APEXD_HOST_STDOUT.txt 2> clean-report/APEXD_HOST_STDERR.txt
          test -s "$APEXMAP/apex-info-list.xml"
          cp "$APEXMAP/apex-info-list.xml" clean-report/APEX_INFO_LIST.xml
          grep -q 'com.android.vndk.v33' clean-report/APEX_INFO_LIST.xml
          test -s "$APEXMAP/com.android.vndk.v33/etc/vintf/manifest.xml"
          grep -q '<version>33</version>' "$APEXMAP/com.android.vndk.v33/etc/vintf/manifest.xml"
          set +e
          env LD_LIBRARY_PATH="$HOSTROOT/lib64:$HOSTROOT/lib" "$CHECKVINTF" --check-compat \
            --dirmap "/system:$FINAL_SYS" --dirmap "/system_ext:$FINAL_SX" --dirmap "/product:$FINAL_PROD" --dirmap "/vendor:$FINAL_VEN" --dirmap "/odm:$FINAL_ODM" --dirmap "/apex:$APEXMAP" \
            --property "ro.product.first_api_level=$TICWATCH_FIRST_API_LEVEL" --property 'ro.boot.product.hardware.sku=' --property "ro.boot.product.vendor.sku=$TICWATCH_VENDOR_SKU" \
            > clean-report/CHECKVINTF_STDOUT.txt 2> clean-report/CHECKVINTF_STDERR.txt
          rc=$?; set -e
          echo "CHECKVINTF_EXIT=$rc" | tee clean-report/CHECKVINTF_EXIT.txt
          test "$rc" = 0
          tail -n1 clean-report/CHECKVINTF_STDOUT.txt | grep -q '^COMPATIBLE$'
          cat > clean-report/VINTF_FINAL_VERDICT.txt <<'EOF'
          STOCK379_PACKAGED_VNDK33=PASS
          VNDK33_APEX_ACTIVATION=PASS
          DACE_SUPPLEMENTAL_FRAMEWORK_MATRIX=PASS
          OFFICIAL_ANDROID17_CHECKVINTF=PASS
          EOF

      - name: Unmount final filesystem audits
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"
          for p in system system_ext product vendor; do sudo umount "$WORK/final-$p"; done

      - name: Add unlocked-first-bringup AVB footers
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"; : > clean-report/AVB_LOGICAL_SIZES.tsv
          add_tree(){ p=$1; psz=$2; img="$WORK/$p.w7.raw"; max=$(avbtool add_hashtree_footer --partition_size "$psz" --calc_max_image_size); raw=$(stat -c %s "$img"); test "$raw" -le "$max"; avbtool add_hashtree_footer --image "$img" --partition_name "$p" --partition_size "$psz" --algorithm NONE --salt "$AVB_SALT"; test "$(stat -c %s "$img")" = "$psz"; avbtool info_image --image "$img" > "clean-report/${p}_bringup_avb.txt"; printf '%s\traw_before_avb=%s\tmax_payload=%s\tpartition=%s\n' "$p" "$raw" "$max" "$psz" >> clean-report/AVB_LOGICAL_SIZES.tsv; }
          add_tree system "$SYSTEM_PARTITION_SIZE"; add_tree system_ext "$SYSTEM_EXT_PARTITION_SIZE"; add_tree product "$PRODUCT_PARTITION_SIZE"

      - name: Repack stock379 boot v4 with clean no-KSU kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"; K="$RUNNER_TEMP/kernel-artifact/Image"
          cp "$WORK/boot.img" "$WORK/boot.payload.img"; avbtool erase_footer --image "$WORK/boot.payload.img"
          python3 - "$WORK/boot.payload.img" "$K" "$WORK/boot.w7.img" <<'PY'
          import pathlib,struct,sys
          src,kernel,out=map(pathlib.Path,sys.argv[1:]); b=src.read_bytes(); k=kernel.read_bytes()
          if b[:8]!=b'ANDROID!': raise SystemExit('bad stock boot magic')
          old=struct.unpack_from('<I',b,8)[0]; ram=struct.unpack_from('<I',b,12)[0]; hs=struct.unpack_from('<I',b,20)[0]; hv=struct.unpack_from('<I',b,40)[0]
          if (old,ram,hs,hv)!=(46959104,0,1584,4): raise SystemExit(f'unexpected stock boot v4 {(old,ram,hs,hv)}')
          hdr=bytearray(b[:4096]); struct.pack_into('<I',hdr,8,len(k)); raw=bytes(hdr)+k; raw+=b'\0'*((-len(raw))%4096); out.write_bytes(raw)
          print('BOOT_V4_REPACK=PASS old_kernel=%d new_kernel=%d payload=%d'%(old,len(k),len(raw)))
          PY
          avbtool add_hash_footer --image "$WORK/boot.w7.img" --partition_name boot --partition_size 100663296 --algorithm NONE --salt "$BOOT_AVB_SALT"
          test "$(stat -c %s "$WORK/boot.w7.img")" = 100663296
          avbtool info_image --image "$WORK/boot.w7.img" > clean-report/BOOT_W7_AVB.txt
          grep -q 'Partition Name:        boot' clean-report/BOOT_W7_AVB.txt

      - name: Generate unlocked first-bringup vbmeta pair
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"
          avbtool make_vbmeta_image --output "$WORK/vbmeta_system.w7.img" --padding_size 4096 --algorithm NONE --flags 3 --rollback_index 1730419200 --include_descriptors_from_image "$WORK/system.w7.raw" --include_descriptors_from_image "$WORK/system_ext.w7.raw" --include_descriptors_from_image "$WORK/product.w7.raw"
          avbtool make_vbmeta_image --output "$WORK/vbmeta.w7.img" --padding_size 8192 --algorithm NONE --flags 3 --rollback_index 0 --include_descriptors_from_image "$WORK/boot.w7.img" --include_descriptors_from_image "$WORK/init_boot.img" --include_descriptors_from_image "$WORK/vendor_boot.img" --include_descriptors_from_image "$WORK/dtbo.img" --include_descriptors_from_image "$WORK/tic-system_dlkm.raw" --include_descriptors_from_image "$WORK/tic-vendor.raw" --include_descriptors_from_image "$WORK/tic-vendor_dlkm.raw" --include_descriptors_from_image "$WORK/vbmeta_system.w7.img"
          avbtool info_image --image "$WORK/vbmeta_system.w7.img" > clean-report/VBMETA_SYSTEM_W7.txt
          avbtool info_image --image "$WORK/vbmeta.w7.img" > clean-report/VBMETA_ROOT_W7.txt
          grep -q 'Flags:                    3' clean-report/VBMETA_SYSTEM_W7.txt
          grep -q 'Flags:                    3' clean-report/VBMETA_ROOT_W7.txt
          for p in system system_ext product; do grep -q "Partition Name:        $p" clean-report/VBMETA_SYSTEM_W7.txt; grep -q "Partition Name:        $p" clean-report/VBMETA_ROOT_W7.txt; done
          for p in boot vendor vendor_dlkm system_dlkm; do grep -q "Partition Name:        $p" clean-report/VBMETA_ROOT_W7.txt; done
          cat > clean-report/AVB_MODE.txt <<'EOF'
          AVB_MODE=UNLOCKED_FIRST_BRINGUP_FLAGS_3
          AVB_HASHTREE_DISABLED=YES
          AVB_VERIFICATION_DISABLED=YES
          OEM_PRIVATE_KEYS_USED=NO
          BOOTLOADER_MUST_REMAIN_UNLOCKED=YES
          PRODUCTION_LOCKABLE_AVB=NO
          EOF

      - name: Build and verify sparse super geometry
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"
          SYS_SIZE=$(stat -c %s "$WORK/system.w7.raw"); SX_SIZE=$(stat -c %s "$WORK/system_ext.w7.raw"); PROD_SIZE=$(stat -c %s "$WORK/product.w7.raw"); VEN_SIZE=$(stat -c %s "$WORK/tic-vendor.raw"); VDLKM_SIZE=$(stat -c %s "$WORK/tic-vendor_dlkm.raw"); SDLKM_SIZE=$(stat -c %s "$WORK/tic-system_dlkm.raw")
          test "$SYS_SIZE" = "$SYSTEM_PARTITION_SIZE"; test "$SX_SIZE" = "$SYSTEM_EXT_PARTITION_SIZE"; test "$PROD_SIZE" = "$PRODUCT_PARTITION_SIZE"
          TOTAL=$((SYS_SIZE+SX_SIZE+PROD_SIZE+VEN_SIZE+VDLKM_SIZE+SDLKM_SIZE)); test "$TOTAL" -le "$DYNAMIC_GROUP_SIZE"; HEADROOM=$((DYNAMIC_GROUP_SIZE-TOTAL)); test "$HEADROOM" -gt $((128*1024*1024))
          printf 'super_device_size=%s\nqti_dynamic_partitions_max=%s\nallocated=%s\nheadroom=%s\nsystem=%s\nsystem_ext=%s\nproduct=%s\nvendor=%s\nvendor_dlkm=%s\nsystem_dlkm=%s\n' "$SUPER_DEVICE_SIZE" "$DYNAMIC_GROUP_SIZE" "$TOTAL" "$HEADROOM" "$SYS_SIZE" "$SX_SIZE" "$PROD_SIZE" "$VEN_SIZE" "$VDLKM_SIZE" "$SDLKM_SIZE" | tee clean-report/SUPER_GEOMETRY.txt
          lpmake --metadata-size 65536 --super-name super --metadata-slots 2 --device "super:$SUPER_DEVICE_SIZE" --group "qti_dynamic_partitions:$DYNAMIC_GROUP_SIZE" --partition "system:readonly:$SYS_SIZE:qti_dynamic_partitions" --image "system=$WORK/system.w7.raw" --partition "system_ext:readonly:$SX_SIZE:qti_dynamic_partitions" --image "system_ext=$WORK/system_ext.w7.raw" --partition "product:readonly:$PROD_SIZE:qti_dynamic_partitions" --image "product=$WORK/product.w7.raw" --partition "vendor:readonly:$VEN_SIZE:qti_dynamic_partitions" --image "vendor=$WORK/tic-vendor.raw" --partition "vendor_dlkm:readonly:$VDLKM_SIZE:qti_dynamic_partitions" --image "vendor_dlkm=$WORK/tic-vendor_dlkm.raw" --partition "system_dlkm:readonly:$SDLKM_SIZE:qti_dynamic_partitions" --image "system_dlkm=$WORK/tic-system_dlkm.raw" --sparse --output clean-candidate/super.img
          test -s clean-candidate/super.img
          simg2img clean-candidate/super.img "$WORK/super.raw"; test "$(stat -c %s "$WORK/super.raw")" = "$SUPER_DEVICE_SIZE"
          python3 - "$WORK/super.raw" <<'PY' | tee clean-report/SUPER_METADATA_STATIC.txt
          import pathlib,struct,sys
          data=pathlib.Path(sys.argv[1]).open('rb').read(2*1024*1024)
          if struct.pack('<I',0x616c4467) not in data or struct.pack('<I',0x414c5030) not in data: raise SystemExit('liblp magic missing')
          for s in [b'system\0',b'system_ext\0',b'product\0',b'vendor\0',b'vendor_dlkm\0',b'system_dlkm\0',b'qti_dynamic_partitions\0']:
              if s not in data: raise SystemExit('missing LP name '+repr(s))
          print('SUPER_LIBLP_STATIC=PASS')
          PY
          rm -f "$WORK/super.raw"

      - name: Assemble fail-closed clean candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/work"; OUT=clean-candidate
          cp "$WORK/boot.w7.img" "$OUT/boot.img"; cp "$WORK/init_boot.img" "$OUT/init_boot.img"; cp "$WORK/vendor_boot.img" "$OUT/vendor_boot.img"; cp "$WORK/dtbo.img" "$OUT/dtbo.img"; cp "$WORK/vbmeta.w7.img" "$OUT/vbmeta.img"; cp "$WORK/vbmeta_system.w7.img" "$OUT/vbmeta_system.img"
          cat > "$OUT/CANDIDATE_MANIFEST.txt" <<EOF
          DEVICE=TicWatch Pro 5 Enduro
          CODENAME=dace
          TARGET=Wear OS 7 / Android 17 / API37
          DONOR=Pixel Watch 3 solios CP2A.260603.001.S1
          PIXEL_FACTORY_SHA256=$PIXEL_SHA256
          TICWATCH379_OTA_SHA256=$TIC_SHA256
          KERNEL_RUN_ID=$KERNEL_RUN_ID
          KERNEL_IMAGE_SHA256=$KERNEL_IMAGE_SHA256
          KERNELSU=ABSENT
          SUSFS=ABSENT
          KEXEC_DIAGNOSTIC_PATCHES=ABSENT
          SYSTEM_SYSTEM_EXT_PRODUCT=PIXEL_WITH_MINIMAL_DACE_STAGE0_ONLY
          STAGE0_8_OF_8=PASS
          STOCK379_PACKAGED_VNDK33_SHA256=$VNDK33_SHA256
          STOCK379_VENDOR=EXACT
          STOCK379_VENDOR_DLKM=EXACT
          STOCK379_SYSTEM_DLKM=EXACT
          PIXEL_ASSISTANT_STACK=BYTE_EXACT
          BORINGSSL_DIAGNOSTIC_BYPASS=ABSENT
          WIRELESS_ROOT_BOOTSTRAP=ABSENT
          BOOT_MARKERS=ABSENT
          OFFICIAL_ANDROID17_CHECKVINTF=PASS
          AVB_MODE=UNLOCKED_FIRST_BRINGUP_FLAGS_3
          BOOTLOADER_MUST_REMAIN_UNLOCKED=YES
          RUNTIME_HARDWARE=UNTESTED_UNTIL_FIRST_BOOT
          EOF
          (cd "$OUT" && sha256sum boot.img init_boot.img vendor_boot.img dtbo.img vbmeta.img vbmeta_system.img super.img > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          cp "$OUT/CANDIDATE_MANIFEST.txt" clean-report/; cp "$OUT/SHA256SUMS.txt" clean-report/CANDIDATE_SHA256SUMS.txt
          cat > clean-report/FINAL_OFFLINE_VERDICT.txt <<'EOF'
          WEAR7_CLEAN_CANDIDATE=PASS
          NO_KSU_SUSFS=PASS
          NO_DIAGNOSTIC_INIT_PATCHES=PASS
          PIXEL_ASSISTANT_UNTOUCHED=PASS
          DACE_STAGE0_MINIMAL=PASS
          STOCK379_VNDK33=PASS
          STOCK379_HARDWARE_PARTITIONS=PASS
          OFFICIAL_ANDROID17_CHECKVINTF=PASS
          SUPER_ASSEMBLY=PASS
          AVB_UNLOCKED_BRINGUP=PASS_STATIC
          DEVICE_RUNTIME_TEST=REQUIRED_NEXT
          EOF
          find clean-report -maxdepth 1 -type f ! -name REPORT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > clean-report/REPORT_SHA256SUMS.txt

      - name: Cleanup mounts
        if: always()
        shell: bash
        run: |
          set +e
          for d in "$RUNNER_TEMP/work"/final-* "$RUNNER_TEMP/work"/tic-*-mnt "$RUNNER_TEMP/work"/pixel-*-mnt; do sudo umount "$d" 2>/dev/null || true; done
          sudo chown -R "$(id -u):$(id -g)" clean-report clean-candidate 2>/dev/null || true

      - name: Upload clean reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-Clean-Final-Reports
          path: clean-report/
          retention-days: 60
          compression-level: 9

      - name: Upload clean bootchain
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-Clean-Final-Bootchain
          path: |
            clean-candidate/boot.img
            clean-candidate/init_boot.img
            clean-candidate/vendor_boot.img
            clean-candidate/dtbo.img
            clean-candidate/vbmeta.img
            clean-candidate/vbmeta_system.img
            clean-candidate/CANDIDATE_MANIFEST.txt
            clean-candidate/SHA256SUMS.txt
          retention-days: 60
          compression-level: 0

      - name: Upload clean super
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-Clean-Final-Super
          path: clean-candidate/super.img
          retention-days: 30
          compression-level: 0
