name: Wear7 map core autoreboot
on:
  push:
    paths:
      - '.github/workflows/wear7-map-core-autoreboot-20261002.yml'
permissions:
  contents: write
  actions: write
jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Map exact DIAG3 core autoreboot lines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p parts work/tools work/parts
          gh release download wear7-diag3-final-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' --dir parts
          cat parts/super_WEAR7_V11_DIAG3_FINAL.img.part* > work/super.img
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  work/super.img' | sha256sum -c -
          ZIP=work/tools/otatools.zip
          curl -fL --retry 3 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          python3 - "$ZIP" work/tools/extracted <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n.startswith(('bin/','lib64/','lib/')):
                      p=(out/n).resolve()
                      if not p.is_relative_to(out): raise SystemExit('unsafe')
                      z.extract(n,out)
          PY
          T="$PWD/work/tools/extracted"
          chmod +x "$T/bin/"*
          export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          simg2img work/super.img work/super.raw
          lpunpack work/super.raw work/parts
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs >/dev/null
          python3 - <<'PY'
          import subprocess,pathlib,hashlib,re
          bs=4096
          raw=pathlib.Path('work/super.raw').read_bytes()
          targets=[
            ('LMKD_CRITICAL','system','/system/etc/init/lmkd.rc',rb'(?m)^\s+critical\s*$'),
            ('SERVICEMANAGER_CRITICAL','system','/system/etc/init/servicemanager.rc',rb'(?m)^\s+critical\s*$'),
            ('HWSERVICEMANAGER_CRITICAL','system_ext','/etc/init/hwservicemanager.rc',rb'(?m)^\s+critical\s*$'),
            ('APEXD_REBOOT','system','/system/etc/init/apexd.rc',rb'reboot_on_failure reboot,apexd-failed'),
          ]
          for name,part,path,regex in targets:
              img=pathlib.Path(f'work/parts/{part}.img')
              dump=pathlib.Path(f'work/{name}.bin')
              subprocess.run(['debugfs','-R',f'dump {path} {dump}',str(img)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              data=dump.read_bytes()
              m=re.search(regex,data)
              if not m: raise SystemExit(name+': pattern missing')
              # point to first non-whitespace byte so local patch can comment it
              line_start=data.rfind(b'\n',0,m.start())+1
              off=m.start()
              while off<m.end() and data[off:off+1] in (b' ',b'\t'): off+=1
              logical=off//bs; within=off%bs
              out=subprocess.check_output(['debugfs','-R',f'bmap {path} {logical}',str(img)],stderr=subprocess.DEVNULL,text=True)
              fsblk=int(out.strip().splitlines()[-1])
              simg=img.read_bytes(); block=simg[fsblk*bs:(fsblk+1)*bs]
              hits=[]; pos=0
              while True:
                  i=raw.find(block,pos)
                  if i<0: break
                  hits.append(i); pos=i+1
              print('NAME='+name)
              print('PART='+part)
              print('FILE='+path)
              print('FILE_OFFSET='+str(off))
              print('OFFSET_IN_BLOCK='+str(within))
              print('FS_BLOCK='+str(fsblk))
              print('BLOCK_SHA256='+hashlib.sha256(block).hexdigest())
              print('RAW_HITS='+str(hits))
              if len(hits)!=1 or hits[0]%bs: raise SystemExit(name+': ambiguous')
              print('RAW_BLOCK='+str(hits[0]//bs))
              print('LINE='+data[line_start:data.find(b'\n',line_start)].decode(errors='replace'))
              print('---')
          print('RESULT=CORE_AUTOREBOOT_MAP_PASS')
          PY
