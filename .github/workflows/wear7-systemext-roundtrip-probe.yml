name: Wear7 system_ext metadata-safe rebuild probe

on:
  push:
    branches: [wear7-rom-staging]
    paths:
      - '.github/workflows/wear7-systemext-roundtrip-probe.yml'
      - 'wear7/scripts/generate_exact_fs_config.py'
      - 'wear7/scripts/fs_semantic_manifest.py'
      - 'wear7/TRIGGER_SYSTEMEXT_ROUNDTRIP'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIXEL_FILE: solios-cp2a.260603.001.s1-factory-d203665c.zip
  PIXEL_SHA256: d203665c90bc06bf175dbb3cbd7fcc9d212c056a030f9c51b541129e8651fb7d
  KERNEL_BUILD_TOOLS_SHA: 010d8a83d84ced4beef7779453766350db8c08cd

jobs:
  roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install host helpers
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip e2fsprogs android-sdk-libsparse-utils attr libcap2-bin

      - name: Pin official Android filesystem tools
        shell: bash
        run: |
          set -euxo pipefail
          REPO='https://android.googlesource.com/kernel/prebuilts/build-tools'
          git clone --filter=blob:none --no-checkout "$REPO" "$RUNNER_TEMP/kernel-build-tools"
          git -C "$RUNNER_TEMP/kernel-build-tools" fetch --depth=1 origin "$KERNEL_BUILD_TOOLS_SHA"
          git -C "$RUNNER_TEMP/kernel-build-tools" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/kernel-build-tools" rev-parse HEAD)" = "$KERNEL_BUILD_TOOLS_SHA"
          B="$RUNNER_TEMP/kernel-build-tools/linux-x86/bin"
          for c in mkuserimg_mke2fs mke2fs e2fsdroid simg2img tune2fs avbtool; do
            test -x "$B/$c" || { echo "missing pinned tool: $c"; exit 20; }
          done
          echo "$B" >> "$GITHUB_PATH"

      - name: Download exact donor and extract system plus system_ext
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/work" wear7-systemext-roundtrip-report
          cd "$RUNNER_TEMP/src"
          curl -fL --retry 3 --retry-delay 3 -o "$PIXEL_FILE" "https://dl.google.com/dl/android/aosp/$PIXEL_FILE"
          echo "$PIXEL_SHA256  $PIXEL_FILE" | sha256sum -c -
          FACTORY="$RUNNER_TEMP/src/$PIXEL_FILE"
          nested=$(unzip -Z1 "$FACTORY" | grep -E '(^|/)image-[^/]+\.zip$' | head -n1)
          test -n "$nested"
          unzip -p "$FACTORY" "$nested" > "$RUNNER_TEMP/work/inner.zip"

          for p in system system_ext; do
            unzip -p "$RUNNER_TEMP/work/inner.zip" "$p.img" > "$RUNNER_TEMP/work/$p.input"
            magic=$(od -An -tx4 -N4 "$RUNNER_TEMP/work/$p.input" | tr -d ' \n')
            if test "$magic" = ed26ff3a; then
              simg2img "$RUNNER_TEMP/work/$p.input" "$RUNNER_TEMP/work/$p.donor.raw"
              rm -f "$RUNNER_TEMP/work/$p.input"
            else
              mv "$RUNNER_TEMP/work/$p.input" "$RUNNER_TEMP/work/$p.donor.raw"
            fi
            avbtool erase_footer --image "$RUNNER_TEMP/work/$p.donor.raw"
            e2fsck -fn "$RUNNER_TEMP/work/$p.donor.raw" > "$GITHUB_WORKSPACE/wear7-systemext-roundtrip-report/${p}_donor_e2fsck.txt" 2>&1 || rc=$?
            rc=${rc:-0}; test "$rc" -lt 8; unset rc
          done
          test "$(stat -c %s "$RUNNER_TEMP/work/system_ext.donor.raw")" = 233267200

      - name: Build exact fs_config and combined donor file_contexts
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-systemext-roundtrip-report"
          sudo mkdir -p "$WORK/system-mnt" "$WORK/systemext-mnt" "$WORK/stage"
          sudo mount -o loop,ro "$WORK/system.donor.raw" "$WORK/system-mnt"
          sudo mount -o loop,ro "$WORK/system_ext.donor.raw" "$WORK/systemext-mnt"

          sudo cp -a "$WORK/systemext-mnt/." "$WORK/stage/"
          sudo python3 wear7/scripts/generate_exact_fs_config.py \
            "$WORK/systemext-mnt" system_ext "$WORK/system_ext.fs_config"

          sudo cp "$WORK/system-mnt/system/etc/selinux/plat_file_contexts" "$WORK/plat_file_contexts"
          sudo cp "$WORK/systemext-mnt/etc/selinux/system_ext_file_contexts" "$WORK/system_ext_file_contexts"
          sudo sh -c "cat '$WORK/plat_file_contexts' '$WORK/system_ext_file_contexts' > '$WORK/system_ext_combined_file_contexts'"

          {
            echo '===== /system_ext rules from exact donor contexts ====='
            grep -n '/system_ext' "$WORK/system_ext_combined_file_contexts" || true
          } | tee "$OUT/system_ext_context_rules.txt"
          grep -q '/system_ext' "$WORK/system_ext_combined_file_contexts"

          sudo umount "$WORK/system-mnt" "$WORK/systemext-mnt"
          sudo chown -R "$(id -u):$(id -g)" \
            "$WORK/stage" "$WORK/system_ext.fs_config" \
            "$WORK/plat_file_contexts" "$WORK/system_ext_file_contexts" \
            "$WORK/system_ext_combined_file_contexts"
          chmod 0644 "$WORK/system_ext.fs_config" "$WORK/plat_file_contexts" \
            "$WORK/system_ext_file_contexts" "$WORK/system_ext_combined_file_contexts"
          sha256sum "$WORK/system_ext.fs_config" "$WORK/plat_file_contexts" \
            "$WORK/system_ext_file_contexts" "$WORK/system_ext_combined_file_contexts" \
            | tee "$OUT/rebuild_inputs_sha256.txt"

      - name: Rebuild unmodified system_ext with Android tools
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-systemext-roundtrip-report"
          UUID='b929aaa8-0d20-509e-a9c9-aea96b9f297e'
          HASHSEED='f53efb2c-9e4d-5005-9a00-622fedc36d54'
          SIZE=233267200
          mkuserimg_mke2fs \
            "$WORK/stage" "$WORK/system_ext.rebuilt.raw" ext4 /system_ext "$SIZE" \
            -j 0 -T 1230768000 -C "$WORK/system_ext.fs_config" -L system_ext \
            -i 640 -I 256 -M 0 -U "$UUID" -S "$HASHSEED" -c \
            "$WORK/system_ext_combined_file_contexts" \
            | tee "$OUT/mkuserimg_mke2fs.log"
          test "$(stat -c %s "$WORK/system_ext.rebuilt.raw")" = "$SIZE"
          e2fsck -fn "$WORK/system_ext.rebuilt.raw" > "$OUT/rebuilt_e2fsck.txt" 2>&1 || rc=$?
          rc=${rc:-0}; test "$rc" -lt 8; unset rc
          tune2fs -l "$WORK/system_ext.rebuilt.raw" > "$OUT/rebuilt_tune2fs.txt"
          debugfs -R stats "$WORK/system_ext.rebuilt.raw" > "$OUT/rebuilt_debugfs_stats.txt" 2>&1

      - name: Compare complete content and Android-relevant metadata semantically
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-systemext-roundtrip-report"
          sudo mkdir -p "$WORK/donor-mnt" "$WORK/rebuilt-mnt"
          sudo mount -o loop,ro "$WORK/system_ext.donor.raw" "$WORK/donor-mnt"
          sudo mount -o loop,ro "$WORK/system_ext.rebuilt.raw" "$WORK/rebuilt-mnt"
          sudo python3 wear7/scripts/fs_semantic_manifest.py "$WORK/donor-mnt" "$OUT/donor_manifest.tsv"
          sudo python3 wear7/scripts/fs_semantic_manifest.py "$WORK/rebuilt-mnt" "$OUT/rebuilt_manifest.tsv"
          sudo umount "$WORK/donor-mnt" "$WORK/rebuilt-mnt"
          sudo chown "$(id -u):$(id -g)" "$OUT/donor_manifest.tsv" "$OUT/rebuilt_manifest.tsv"
          if diff -u "$OUT/donor_manifest.tsv" "$OUT/rebuilt_manifest.tsv" > "$OUT/manifest.diff"; then
            echo 'SYSTEM_EXT_SEMANTIC_ROUNDTRIP=PASS' | tee "$OUT/VERDICT.txt"
          else
            echo 'SYSTEM_EXT_SEMANTIC_ROUNDTRIP=FAIL' | tee "$OUT/VERDICT.txt"
            sed -n '1,240p' "$OUT/manifest.diff"
            exit 30
          fi
          sha256sum "$WORK/system_ext.donor.raw" "$WORK/system_ext.rebuilt.raw" > "$OUT/image_sha256.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wear7-SystemExt-Roundtrip-Probe-Reports
          path: wear7-systemext-roundtrip-report/
          retention-days: 30
          compression-level: 9
