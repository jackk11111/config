name: Wear7 DIAG4 init-order audit 20261002

on:
  push:
    branches: [wear7-diag4-init-bisect-20261002]
    paths: ['.github/workflows/wear7-diag4-init-order-audit.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare disk
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          mkdir -p "$RUNNER_TEMP/w7/input" "$RUNNER_TEMP/w7/tools" "$RUNNER_TEMP/w7/parts" "$RUNNER_TEMP/w7/mnt" out-diag4-audit
          df -h /

      - name: Download exact DIAG3 final super
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-DIAG3-Final-Super-V2
          path: ${{ runner.temp }}/w7/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '36913721664'

      - name: Verify exact sparse super
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"
          S=$(find "$W/input" -type f -name 'super_WEAR7_V11_DIAG3_FINAL.img' -print -quit)
          test -n "$S"
          test "$(stat -c %s "$S")" = 3837889664
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  '"$S" | sha256sum -c -
          echo "SUPER=$S" >> "$GITHUB_ENV"
          echo 'SOURCE_SUPER_SHA256=75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329' | tee out-diag4-audit/SOURCE.txt

      - name: Fetch pinned sparse/lp tools
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"
          ZIP="$W/tools/otatools.zip"
          curl -fL --retry 2 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          echo "f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84  $ZIP" | sha256sum -c -
          python3 - "$ZIP" "$W/tools/extracted" <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]).resolve()
          wanted=('bin/simg2img','bin/lpunpack')
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n in wanted or n.startswith(('lib64/','lib/')):
                      p=(out/n).resolve()
                      if not p.is_relative_to(out): raise SystemExit('unsafe path')
                      z.extract(n,out)
          PY
          rm -f "$ZIP"
          chmod +x "$W/tools/extracted/bin/"*

      - name: Unpack exact DIAG3 super
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"
          export PATH="$W/tools/extracted/bin:$PATH" LD_LIBRARY_PATH="$W/tools/extracted/lib64:$W/tools/extracted/lib"
          simg2img "$SUPER" "$W/super.raw"
          test "$(stat -c %s "$W/super.raw")" = 4294967296
          lpunpack "$W/super.raw" "$W/parts"
          rm -f "$W/super.raw"
          ls -lh "$W/parts" | tee out-diag4-audit/PARTITIONS.txt
          df -h /

      - name: Mount relevant logical partitions read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"
          for p in system system_ext product vendor odm; do
            if [ -f "$W/parts/$p.img" ]; then
              mkdir -p "$W/mnt/$p"
              sudo mount -o loop,ro,noload "$W/parts/$p.img" "$W/mnt/$p"
              echo "$p=MOUNTED"
            else
              echo "$p=ABSENT"
            fi
          done | tee out-diag4-audit/MOUNTS.txt

      - name: Audit init action parse order
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"
          python3 - "$W/mnt" out-diag4-audit <<'PY'
          import pathlib,re,sys,json
          mnt=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])

          # Modern Android LoadBootScripts order: main system init.rc, system dir,
          # system_ext, product, odm, vendor. Directory files are processed in lexical order.
          sources=[]
          sysroot=mnt/'system'/'system'
          main=sysroot/'etc/init/hw/init.rc'
          if main.is_file(): sources.append(('system-main',main))
          dirs=[
              ('system',sysroot/'etc/init'),
              ('system_ext',mnt/'system_ext'/'etc/init'),
              ('product',mnt/'product'/'etc/init'),
              ('odm',mnt/'odm'/'etc/init'),
              ('vendor',mnt/'vendor'/'etc/init'),
          ]
          for part,d in dirs:
              if not d.is_dir(): continue
              for p in sorted(d.iterdir(), key=lambda x:x.name):
                  if p.is_file() and p.suffix=='.rc':
                      if p==main: continue
                      sources.append((part,p))

          section_re=re.compile(r'^(on\s+.+|service\s+.+|import\s+.+)$')
          blocks=[]
          parse_file_index=0
          for part,p in sources:
              parse_file_index+=1
              try: lines=p.read_text(errors='replace').splitlines()
              except Exception: continue
              i=0
              while i < len(lines):
                  s=lines[i].strip()
                  if not s.startswith('on '):
                      i+=1; continue
                  header=s
                  start=i+1
                  body=[]
                  i+=1
                  while i < len(lines):
                      raw=lines[i]
                      stripped=raw.strip()
                      if raw and not raw[0].isspace() and section_re.match(stripped):
                          break
                      body.append(raw)
                      i+=1
                  blocks.append({
                      'partition':part,
                      'file':str(p),
                      'name':p.name,
                      'parse_file_index':parse_file_index,
                      'line':start,
                      'trigger':header,
                      'body':body,
                  })

          init_blocks=[b for b in blocks if b['trigger']=='on init']
          early=[b for b in blocks if b['trigger']=='on early-init']
          late=[b for b in blocks if b['trigger']=='on late-init']

          marker_idx=None
          for idx,b in enumerate(init_blocks):
              if b['name']=='wear7-v11-stage-marker.rc':
                  marker_idx=idx
                  break

          def fmt_block(idx,b):
              rel=''
              if marker_idx is not None:
                  if idx<marker_idx: rel='BEFORE_MARKER'
                  elif idx==marker_idx: rel='MARKER'
                  else: rel='AFTER_MARKER'
              body='\n'.join('      '+x for x in b['body'] if x.strip())
              return f"[{idx:04d}] {rel} {b['partition']} {b['name']}:{b['line']}  {b['trigger']}\n{body}\n"

          text=[]
          text.append(f'TOTAL_ON_INIT_BLOCKS={len(init_blocks)}')
          text.append(f'MARKER_INDEX={marker_idx if marker_idx is not None else "NOT_FOUND"}')
          if marker_idx is not None:
              text.append(f'BLOCKS_AFTER_MARKER={len(init_blocks)-marker_idx-1}')
          text.append('')
          for idx,b in enumerate(init_blocks): text.append(fmt_block(idx,b))
          (out/'ON_INIT_ORDER.txt').write_text('\n'.join(text))

          # Compact map by partition/file for the region after the known-passed marker.
          after=init_blocks[marker_idx+1:] if marker_idx is not None else []
          rows=[]
          for j,b in enumerate(after, start=(marker_idx+1 if marker_idx is not None else 0)):
              cmds=[x.strip() for x in b['body'] if x.strip() and not x.lstrip().startswith('#')]
              rows.append({
                  'index':j,'partition':b['partition'],'file':b['name'],'line':b['line'],
                  'commands':cmds
              })
          (out/'AFTER_MARKER.json').write_text(json.dumps(rows,indent=2)+'\n')

          danger_words=('sys.powerctl','reboot','shutdown','exec','exec_start','start ','class_start','trigger ','wait ','mount ','insmod','modprobe','setprop ','write ')
          sus=[]
          for r in rows:
              hits=[c for c in r['commands'] if any(k in c for k in danger_words)]
              if hits:
                  sus.append(f"[{r['index']:04d}] {r['partition']} {r['file']}:{r['line']}")
                  sus += ['    '+x for x in hits]
          (out/'SUSPICIOUS_AFTER_MARKER.txt').write_text('\n'.join(sus)+'\n')

          # Boundaries useful for a one-shot DIAG4 bisection.
          bounds=[]
          last=None
          for r in rows:
              key=(r['partition'],r['file'])
              if key!=last:
                  bounds.append(f"[{r['index']:04d}] BEGIN {r['partition']}/{r['file']}")
                  last=key
          (out/'AFTER_MARKER_BOUNDARIES.txt').write_text('\n'.join(bounds)+'\n')

          summary={
              'total_on_init_blocks':len(init_blocks),
              'marker_index':marker_idx,
              'after_marker_count':len(after),
              'after_marker_partitions':sorted(set(r['partition'] for r in rows)),
              'early_init_blocks':len(early),
              'late_init_blocks':len(late),
          }
          (out/'SUMMARY.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          print('--- BOUNDARIES ---')
          print((out/'AFTER_MARKER_BOUNDARIES.txt').read_text())
          print('--- SUSPICIOUS ---')
          print((out/'SUSPICIOUS_AFTER_MARKER.txt').read_text()[:20000])
          PY

      - name: Cleanup mounts
        if: always()
        shell: bash
        run: |
          W="$RUNNER_TEMP/w7"
          for p in odm vendor product system_ext system; do
            sudo umount "$W/mnt/$p" 2>/dev/null || true
          done

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-DIAG4-InitOrder-Audit
          path: out-diag4-audit/
          if-no-files-found: error
          retention-days: 60
          compression-level: 9
