name: Wear7 apexd map only
on:
  push:
    paths:
      - '.github/workflows/wear7-apexd-map-only-20261002.yml'
  workflow_dispatch:

jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact DIAG3 and map apexd rc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p parts work/tools work/parts
          gh release download wear7-diag3-final-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' --dir parts
          cat parts/super_WEAR7_V11_DIAG3_FINAL.img.part* > work/super.img
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  work/super.img' | sha256sum -c -
          ZIP=work/tools/otatools.zip
          curl -fL --retry 2 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          python3 - "$ZIP" work/tools/extracted <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n.startswith(('bin/','lib64/','lib/')):
                      p=(out/n).resolve()
                      if not p.is_relative_to(out): raise SystemExit('unsafe')
                      z.extract(n,out)
          PY
          T="$PWD/work/tools/extracted"
          chmod +x "$T/bin/"*
          export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          simg2img work/super.img work/super.raw
          lpunpack work/super.raw work/parts
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs >/dev/null
          echo '===== STAT ====='
          debugfs -R 'stat /system/etc/init/apexd.rc' work/parts/system.img 2>&1
          FSBLK=$(debugfs -R 'bmap /system/etc/init/apexd.rc 0' work/parts/system.img 2>/dev/null | tail -n1 | tr -d '[:space:]')
          echo "FS_BLOCK=$FSBLK"
          python3 - "$FSBLK" <<'PY'
          import hashlib,pathlib,sys
          fsblk=int(sys.argv[1]); bs=4096; off=580
          s=pathlib.Path('work/parts/system.img').read_bytes()
          r=pathlib.Path('work/super.raw').read_bytes()
          block=s[fsblk*bs:(fsblk+1)*bs]
          print('SYSTEM_BLOCK_SHA256='+hashlib.sha256(block).hexdigest())
          print('FILE_OFFSET='+str(off))
          pat=b'reboot_on_failure reboot,bootloader,bootstrap-apexd-failed'
          print('PATTERN_OFFSET_IN_BLOCK='+str(block.find(pat)))
          hits=[]; pos=0
          while True:
              i=r.find(block,pos)
              if i<0: break
              hits.append(i); pos=i+1
          print('RAW_HITS='+str(hits))
          if len(hits)==1 and hits[0]%bs==0:
              print('RAW_BLOCK='+str(hits[0]//bs))
              print('RAW_BLOCK_SHA256='+hashlib.sha256(r[hits[0]:hits[0]+bs]).hexdigest())
          print('RESULT=APEXD_MAP_ONLY_PASS')
          PY
