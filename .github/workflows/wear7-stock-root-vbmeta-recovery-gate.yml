name: Wear7 stock root vbmeta recovery gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wear7-stock-root-vbmeta-recovery-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-stock-vbmeta:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download exact TicWatch 379 OTA and extract root vbmeta only
        shell: bash
        env:
          TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
          TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d
          STOCK_VBMETA_SHA256: 5354ece08d0c8fbc6ff51cf9e535970b0416c80132ead172a803e6b34dbf2118
        run: |
          set -Eeuo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 3 -o /tmp/ticwatch379.zip "$TIC_URL"
          echo "$TIC_SHA256  /tmp/ticwatch379.zip" | sha256sum -c -
          unzip -p /tmp/ticwatch379.zip vbmeta.img > out/vbmeta-STOCK379-EXACT.img
          test "$(stat -c %s out/vbmeta-STOCK379-EXACT.img)" = 8192
          echo "$STOCK_VBMETA_SHA256  out/vbmeta-STOCK379-EXACT.img" | sha256sum -c -
          cat > out/README.txt <<'EOF'
          TICWATCH PRO 5 DACE - STOCK 379 ROOT VBMETA RECOVERY GATE
          SOURCE=exact stock OTA TMDB.240925.002/379
          TEST_SCOPE=recovery AUTODATA only
          PURPOSE=isolate whether stock signed root AVB structure is required for the known metadata key
          DO_NOT_FLASH=boot,init_boot,vendor_boot,dtbo,vbmeta_system,super
          EXPECTED_SHA256=5354ece08d0c8fbc6ff51cf9e535970b0416c80132ead172a803e6b34dbf2118
          SIZE=8192
          RESTORE_CURRENT_HOTFIX_SHA256=a3c87f30d46df453c6ac3822c59fc61a622169fd75cd1efa5419e73db85ad3cd
          EOF
          sha256sum out/vbmeta-STOCK379-EXACT.img | tee out/SHA256SUMS.txt

      - name: Upload exact stock root vbmeta gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-Stock379-Root-VBMeta-Recovery-Gate
          path: out/
          if-no-files-found: error
          retention-days: 90
