name: TicWatch artifact purge once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tw-artifact-purge-once.yml'
permissions:
  contents: read
  actions: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only obsolete Wear 7 KEXEC diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10392601684"
