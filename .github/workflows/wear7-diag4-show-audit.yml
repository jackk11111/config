name: Wear7 DIAG4 show init audit

on:
  push:
    branches: [wear7-diag4-init-bisect-20261002]
    paths: ['.github/workflows/wear7-diag4-show-audit.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  show:
    runs-on: ubuntu-24.04
    steps:
      - name: Download init-order audit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-DIAG4-InitOrder-Audit
          path: audit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '36985510531'
      - name: Print decisive reports
        shell: bash
        run: |
          set -euo pipefail
          echo '===== SUMMARY ====='
          cat audit/SUMMARY.json
          echo '===== ON INIT ORDER ====='
          cat audit/ON_INIT_ORDER.txt
          echo '===== AFTER MARKER ====='
          cat audit/AFTER_MARKER.json
