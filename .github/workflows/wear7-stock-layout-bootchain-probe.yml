name: Wear7 stock379 bootchain and super layout probe

on:
  push:
    branches: [wear7-rom-staging]
    paths:
      - '.github/workflows/wear7-stock-layout-bootchain-probe.yml'
      - 'wear7/scripts/reconstruct_block_ota.py'
      - 'wear7/TRIGGER_STOCK_LAYOUT*'
  workflow_dispatch:

permissions:
  contents: read

env:
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d
  KERNEL_BUILD_TOOLS_SHA: 010d8a83d84ced4beef7779453766350db8c08cd

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install host helpers
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file python3 e2fsprogs android-sdk-libsparse-utils binutils

      - name: Pin proven Android image tools and inventory full tree
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://android.googlesource.com/kernel/prebuilts/build-tools "$RUNNER_TEMP/tools"
          git -C "$RUNNER_TEMP/tools" fetch --depth=1 origin "$KERNEL_BUILD_TOOLS_SHA"
          git -C "$RUNNER_TEMP/tools" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tools" rev-parse HEAD)" = "$KERNEL_BUILD_TOOLS_SHA"
          B="$RUNNER_TEMP/tools/linux-x86/bin"
          test -x "$B/avbtool"
          mkdir -p wear7-stock-layout-report
          {
            echo "TOOLS_SHA=$KERNEL_BUILD_TOOLS_SHA"
            echo '===== exact interesting files anywhere in pinned repo ====='
            find "$RUNNER_TEMP/tools" -type f \( -name 'mkbootimg*' -o -name 'unpack_bootimg*' -o -name 'lpmake' -o -name 'lpdump' -o -name 'lpunpack' -o -name 'checkvintf' -o -name 'idmap2' -o -name 'aapt2' -o -name 'avbtool' \) -print | sort
          } | tee wear7-stock-layout-report/PINNED_TOOL_PATHS.txt
          echo "$B" >> "$GITHUB_PATH"

      - name: Download exact stock379 OTA and inventory archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/work" wear7-stock-layout-report
          curl -fL --retry 3 --retry-delay 3 -o "$RUNNER_TEMP/src/ticwatch379.zip" "$TIC_URL"
          echo "$TIC_SHA256  $RUNNER_TEMP/src/ticwatch379.zip" | sha256sum -c -
          unzip -Z1 "$RUNNER_TEMP/src/ticwatch379.zip" | sort > wear7-stock-layout-report/OTA_FILE_LIST.txt
          grep -Ei '(^|/)(boot|init_boot|vendor_boot|dtbo|vbmeta|vbmeta_system|super|super_empty)(\.img)?$|dynamic_partitions|payload|transfer\.list|new\.dat' wear7-stock-layout-report/OTA_FILE_LIST.txt \
            > wear7-stock-layout-report/OTA_RELEVANT_FILES.txt || true
          cat wear7-stock-layout-report/OTA_RELEVANT_FILES.txt

      - name: Extract OTA metadata and exact direct bootchain images when present
        shell: bash
        run: |
          set -euxo pipefail
          OTA="$RUNNER_TEMP/src/ticwatch379.zip"
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-stock-layout-report"
          : > "$OUT/BOOTCHAIN_SHA256.tsv"
          for f in boot.img init_boot.img vendor_boot.img dtbo.img vbmeta.img vbmeta_system.img recovery.img super_empty.img; do
            member=$(unzip -Z1 "$OTA" | awk -v n="$f" '$0==n || $0 ~ ("/" n "$") {print; exit}')
            if test -n "$member"; then
              unzip -p "$OTA" "$member" > "$WORK/$f"
              printf '%s\t%s\t%s\n' "$f" "$(stat -c %s "$WORK/$f")" "$(sha256sum "$WORK/$f" | awk '{print $1}')" >> "$OUT/BOOTCHAIN_SHA256.tsv"
              file "$WORK/$f" >> "$OUT/BOOTCHAIN_FILE_TYPES.txt"
              if [[ "$f" == vbmeta*.img || "$f" == boot.img || "$f" == init_boot.img || "$f" == vendor_boot.img || "$f" == dtbo.img ]]; then
                avbtool info_image --image "$WORK/$f" > "$OUT/${f%.img}_avb_info.txt" 2>&1 || true
              fi
            else
              printf '%s\tMISSING_IN_OTA\n' "$f" >> "$OUT/BOOTCHAIN_SHA256.tsv"
            fi
          done

          for meta in dynamic_partitions_op_list META-INF/com/android/metadata META-INF/com/google/android/updater-script META-INF/com/google/android/update-binary; do
            member=$(unzip -Z1 "$OTA" | awk -v n="$meta" '$0==n || $0 ~ ("/" n "$") {print; exit}')
            if test -n "$member"; then
              safe=$(printf '%s' "$meta" | tr '/' '_')
              unzip -p "$OTA" "$member" > "$OUT/$safe"
            fi
          done

      - name: Reconstruct all six dynamic partitions exactly from block OTA
        shell: bash
        run: |
          set -euxo pipefail
          OTA="$RUNNER_TEMP/src/ticwatch379.zip"
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-stock-layout-report"
          : > "$OUT/DYNAMIC_PARTITION_IMAGES.tsv"
          for p in system system_ext product vendor vendor_dlkm system_dlkm; do
            python3 wear7/scripts/reconstruct_block_ota.py "$OTA" "$p" "$WORK/$p.stock.raw"
            bytes=$(stat -c %s "$WORK/$p.stock.raw")
            sha=$(sha256sum "$WORK/$p.stock.raw" | awk '{print $1}')
            printf '%s\t%s\t%s\n' "$p" "$bytes" "$sha" >> "$OUT/DYNAMIC_PARTITION_IMAGES.tsv"
            file "$WORK/$p.stock.raw" >> "$OUT/DYNAMIC_PARTITION_FILE_TYPES.txt"
            avbtool info_image --image "$WORK/$p.stock.raw" > "$OUT/${p}_stock_avb_info.txt" 2>&1 || true
            e2fsck -fn "$WORK/$p.stock.raw" > "$OUT/${p}_stock_e2fsck.txt" 2>&1 || rc=$?
            rc=${rc:-0}; test "$rc" -lt 8; unset rc
          done

      - name: Inspect stock vendor fstab and dynamic-partition contract
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-stock-layout-report"
          sudo mkdir -p "$WORK/vendor-mnt"
          sudo mount -o loop,ro "$WORK/vendor.stock.raw" "$WORK/vendor-mnt"
          sudo find "$WORK/vendor-mnt" -maxdepth 4 -type f \( -name 'fstab*' -o -name '*dynamic*partitions*' \) -print | sort | tee "$OUT/VENDOR_LAYOUT_FILES.txt"
          if sudo test -f "$WORK/vendor-mnt/etc/fstab.dace"; then
            sudo cat "$WORK/vendor-mnt/etc/fstab.dace" > "$OUT/fstab.dace"
          fi
          sudo umount "$WORK/vendor-mnt"

          {
            echo '===== transfer-list source image sizes ====='
            for p in system system_ext product vendor vendor_dlkm system_dlkm; do
              printf '%-16s %s\n' "$p" "$(stat -c %s "$WORK/$p.stock.raw")"
            done
            echo '===== dynamic_partitions_op_list ====='
            cat "$OUT/dynamic_partitions_op_list" 2>/dev/null || true
            echo '===== OTA metadata ====='
            cat "$OUT/META-INF_com_android_metadata" 2>/dev/null || true
          } > "$OUT/STOCK_LAYOUT_SUMMARY.txt"
          cat "$OUT/STOCK_LAYOUT_SUMMARY.txt"

      - name: Assert authoritative stock hashes where OTA exposes direct images
        shell: bash
        run: |
          set -euxo pipefail
          OUT=wear7-stock-layout-report/BOOTCHAIN_SHA256.tsv
          check_if_present() {
            n=$1 expected=$2
            line=$(awk -F '\t' -v n="$n" '$1==n {print; exit}' "$OUT")
            printf '%s\n' "$line"
            if ! printf '%s' "$line" | grep -q 'MISSING_IN_OTA'; then
              got=$(printf '%s' "$line" | awk -F '\t' '{print $3}')
              test "$got" = "$expected"
            fi
          }
          check_if_present boot.img 251412139ac66fa20d6d93f0a65f95239f9f888b35dae20c866e92acc7daecac
          check_if_present vbmeta.img 5354ece08d0c8fbc6ff51cf9e535970b0416c80132ead172a803e6b34dbf2118
          check_if_present vbmeta_system.img 201e993b7a2c4979c94fece32de02e83d91e3ae1dc23258640473fbca69c9f5a
          echo STOCK379_SOURCE_LAYOUT_PROBE=PASS | tee wear7-stock-layout-report/VERDICT.txt
          find wear7-stock-layout-report -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > wear7-stock-layout-report/REPORT_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wear7-Stock379-Bootchain-Super-Layout-Probe
          path: wear7-stock-layout-report/
          retention-days: 30
          compression-level: 9
