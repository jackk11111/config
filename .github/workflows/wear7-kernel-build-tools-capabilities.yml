name: Wear7 pinned image host tool inventory

on:
  push:
    branches: [wear7-rom-staging]
    paths: ['.github/workflows/wear7-kernel-build-tools-capabilities.yml','wear7/TRIGGER_IMAGE_TOOL_INVENTORY*']
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLS_SHA: 010d8a83d84ced4beef7779453766350db8c08cd

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact pinned kernel build tools and inventory
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://android.googlesource.com/kernel/prebuilts/build-tools "$RUNNER_TEMP/tools"
          git -C "$RUNNER_TEMP/tools" fetch --depth=1 origin "$TOOLS_SHA"
          git -C "$RUNNER_TEMP/tools" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tools" rev-parse HEAD)" = "$TOOLS_SHA"
          B="$RUNNER_TEMP/tools/linux-x86/bin"
          {
            echo "TOOLS_SHA=$TOOLS_SHA"
            for c in avbtool lpmake lpdump lpunpack simg2img img2simg e2fsdroid mkuserimg_mke2fs mke2fs tune2fs checkvintf idmap2 aapt2 sefcontext_compile; do
              if test -x "$B/$c"; then echo "$c=YES"; else echo "$c=NO"; fi
            done
          } | tee wear7_pinned_tool_inventory.txt
          test -x "$B/avbtool"
          test -x "$B/lpmake"
          test -x "$B/lpdump"
      - uses: actions/upload-artifact@v4
        with:
          name: Wear7-Pinned-Image-Tool-Inventory
          path: wear7_pinned_tool_inventory.txt
          retention-days: 30
