name: TicWatch Recovery ULTRA6 SEB Wakeup

on:
  push:
    branches:
      - ticwatch-recovery-ultra6-seb-wakeup-20260929
    paths:
      - .github/workflows/ticwatch-recovery-ultra6-seb-wakeup.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PREVIOUS_RUN_ID: "34655933953"
  PREVIOUS_ARTIFACT: TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter
  BASE_KERNEL_SHA: 3929c55fbc7559af6df290d2c0f66dc551af161a
  CAF_REF: 9da9a823e503b4f1874170b693eff58d16c18751
  TARGET_VERMAGIC_RELEASE: 5.15.144-g7f9d6c16b5cd-ab151
  AOSP_CLANG_REV: clang-r450784e
  TARGET_CFI_SLOWPATH_CRC: 0x4411a445

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout orchestration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-recovery-ultra6-seb-wakeup-20260929
          fetch-depth: 1

      - name: Install build tools and exact stock Android clang
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y --no-install-recommends build-essential flex bison bc python3 python-is-python3 libssl-dev libelf-dev dwarves make curl wget git kmod binutils-aarch64-linux-gnu zstd xz-utils >/dev/null
          git clone --depth=1 --single-branch --branch "$AOSP_CLANG_REV"             https://gitlab.com/Neebe3289/android_prebuilts_clang_host_linux-x86.git             "$GITHUB_WORKSPACE/aosp-clang"
          rm -rf "$GITHUB_WORKSPACE/aosp-clang/.git"
          test -x "$GITHUB_WORKSPACE/aosp-clang/bin/clang"
          echo "AOSP_CLANG_PATH=$GITHUB_WORKSPACE/aosp-clang" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"

      - name: Restore known-good TicWatch KMI material
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p previous
          gh run download "$PREVIOUS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PREVIOUS_ARTIFACT" --dir previous
          test -s previous/audit/kernel-source-lts211-clean.patch
          test -s previous/audit/Module.symvers
          test -s previous/audit/final.config
          echo KMI_ARTIFACT_RESTORE=PASS

      - name: Reconstruct known-good source
        shell: bash
        run: |
          set -Eeuo pipefail
          git init -q common
          git -C common remote add origin https://github.com/Winkmoon/android_kernel_TicWatch-Pro5.git
          git -C common fetch -q --depth=1 origin "$BASE_KERNEL_SHA"
          git -C common checkout -q --detach FETCH_HEAD
          git -C common apply --check "$GITHUB_WORKSPACE/previous/audit/kernel-source-lts211-clean.patch"
          git -C common apply "$GITHUB_WORKSPACE/previous/audit/kernel-source-lts211-clean.patch"
          test "$(make -s -C common kernelversion)" = 5.15.211
          echo K211_SOURCE_RECONSTRUCT=PASS

      - name: Toolchain info and stock compiler hard gate
        shell: bash
        run: |
          set -Eeuo pipefail
          clang --version | tee stock-clang-version.txt
          llvm-nm --version | head -n 1
          grep -Fq 'Android (8508608, based on r450784e) clang version 14.0.7' stock-clang-version.txt
          grep -Fq '4c603efb0cca074e9238af8b4106c30add4418f6' stock-clang-version.txt
          echo STOCK_CLANG_EXACT=PASS

      - name: Prepare stock-compatible KMI build
        shell: bash
        run: |
          set -Eeuo pipefail
          K="$GITHUB_WORKSPACE/common"
          mkdir -p "$K/out"
          cp previous/audit/final.config "$K/out/.config"
          "$K/scripts/config" --file "$K/out/.config" --set-str LOCALVERSION "-g7f9d6c16b5cd-ab151" -d LOCALVERSION_AUTO
          make -s -C "$K" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          make -s -C "$K" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules_prepare
          cp previous/audit/Module.symvers "$K/out/Module.symvers"
          grep -Fqx CONFIG_MODULES=y "$K/out/.config"
          grep -Fqx CONFIG_MODVERSIONS=y "$K/out/.config"
          grep -Fqx CONFIG_CFI_CLANG=y "$K/out/.config"
          grep -Fqx CONFIG_LTO_CLANG=y "$K/out/.config"
          grep -Fqx CONFIG_LTO_CLANG_THIN=y "$K/out/.config"
          grep -E "^CONFIG_(SMP|PREEMPT|MODULE_UNLOAD|MODVERSIONS|CFI_CLANG|LTO_CLANG|LTO_CLANG_THIN)=" "$K/out/.config"
          echo KMI_BUILD_PREPARE=PASS

      - name: Generate qcom SSR provider CRC
        shell: bash
        run: |
          set -Eeuo pipefail
          K="$GITHUB_WORKSPACE/common"
          mkdir -p qcom-provider
          printf '%s\n'             '#include <linux/module.h>'             '#include <linux/notifier.h>'             'void *qcom_register_ssr_notifier(const char *name, struct notifier_block *nb) { return NULL; }'             'EXPORT_SYMBOL_GPL(qcom_register_ssr_notifier);'             'MODULE_LICENSE("GPL");'             > qcom-provider/rproc_qcom_common.c
          printf '%s\n' 'obj-m += rproc_qcom_common.o' > qcom-provider/Makefile
          make -s -C "$K" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 M="$GITHUB_WORKSPACE/qcom-provider" modules
          test -s qcom-provider/Module.symvers
          grep -E "[[:space:]]qcom_register_ssr_notifier[[:space:]]" qcom-provider/Module.symvers > qcom-provider.symvers
          cat qcom-provider.symvers

      - name: Materialize and patch SEB source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p seb/include/linux/soc/qcom
          BASE="https://raw.githubusercontent.com/arter97-mirror/caf_msm-5.15/$CAF_REF"
          curl -fsSL "$BASE/drivers/soc/qcom/slate_events_bridge.c" -o seb/slate_events_bridge.c
          curl -fsSL "$BASE/drivers/soc/qcom/slate_events_bridge.h" -o seb/slate_events_bridge.h
          curl -fsSL "$BASE/drivers/soc/qcom/slate_events_bridge_rpmsg.c" -o seb/slate_events_bridge_rpmsg.c
          curl -fsSL "$BASE/drivers/soc/qcom/slate_events_bridge_rpmsg.h" -o seb/slate_events_bridge_rpmsg.h
          curl -fsSL "$BASE/include/linux/soc/qcom/slate_events_bridge_intf.h" -o seb/include/linux/soc/qcom/slate_events_bridge_intf.h
          cp seb/slate_events_bridge.c seb/slate_events_bridge.ORIGINAL.c
          python3 .github/scripts/ultra6_patch_seb.py seb/slate_events_bridge.c
          diff -u seb/slate_events_bridge.ORIGINAL.c seb/slate_events_bridge.c > seb-wakeup.patch || true
          grep -Fq "wake_up(&dev->link_state_wait);" seb/slate_events_bridge.c
          test "$(grep -Fc "wake_up(&dev->link_state_wait);" seb/slate_events_bridge.c)" -eq 2
          printf '%s\n' "obj-m += slate_events_bridge_rpmsg.o" "obj-m += slate_events_bridge.o" 'ccflags-y += -I$(src)/include' 'ccflags-y += -DCONFIG_QCOM_RPROC_COMMON=1' > seb/Makefile
          echo SEB_SOURCE_PATCH=PASS

      - name: Compile patched SEB
        shell: bash
        run: |
          set -Eeuo pipefail
          K="$GITHUB_WORKSPACE/common"
          make -C "$K" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 M="$GITHUB_WORKSPACE/seb" KBUILD_EXTRA_SYMBOLS="$GITHUB_WORKSPACE/qcom-provider.symvers" KBUILD_MODPOST_WARN=1 modules 2>&1 | tee seb-build.log
          test -s seb/slate_events_bridge.ko
          test -s seb/slate_events_bridge_rpmsg.ko
          echo SEB_COMPILE=PASS

      - name: Normalize vermagic and audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/ultra6_patch_vermagic.py "$TARGET_VERMAGIC_RELEASE" seb/slate_events_bridge.ko
          mkdir -p out-artifact
          cp seb/slate_events_bridge.ko out-artifact/slate_events_bridge.ULTRA6_WAKEUP.ko
          cp seb-wakeup.patch seb-build.log qcom-provider.symvers stock-clang-version.txt out-artifact/
          modinfo out-artifact/slate_events_bridge.ULTRA6_WAKEUP.ko > out-artifact/modinfo.txt
          modprobe --dump-modversions out-artifact/slate_events_bridge.ULTRA6_WAKEUP.ko | sort > out-artifact/modversions.txt
          llvm-nm -u out-artifact/slate_events_bridge.ULTRA6_WAKEUP.ko | sort -u > out-artifact/undefined-symbols.txt
          llvm-objdump -dr out-artifact/slate_events_bridge.ULTRA6_WAKEUP.ko > out-artifact/disassembly.txt
          sha256sum out-artifact/slate_events_bridge.ULTRA6_WAKEUP.ko > out-artifact/SHA256SUMS
          python3 .github/scripts/ultra6_compare_kmi.py previous/audit/Module.symvers out-artifact/slate_events_bridge.ULTRA6_WAKEUP.ko | tee out-artifact/KMI_COMPARE.txt
          modinfo -F vermagic out-artifact/slate_events_bridge.ULTRA6_WAKEUP.ko | grep -Fq "$TARGET_VERMAGIC_RELEASE SMP preempt mod_unload modversions aarch64"
          modinfo -F depends out-artifact/slate_events_bridge.ULTRA6_WAKEUP.ko | tee out-artifact/depends.txt
          grep -q __wake_up out-artifact/modversions.txt
          grep -q qcom_register_ssr_notifier out-artifact/modversions.txt
          grep -q seb_channel_init out-artifact/modversions.txt
          grep -q seb_rpmsg_tx_msg out-artifact/modversions.txt
          grep -q __cfi_slowpath_diag out-artifact/modversions.txt
          awk -v want="$TARGET_CFI_SLOWPATH_CRC" '$2=="__cfi_slowpath_diag"{got=tolower($1); w=tolower(want); if(got!=w){print "CFI_CRC_BAD",got,w; exit 2} found=1} END{if(!found) exit 3}' out-artifact/modversions.txt
          echo CFI_SLOWPATH_IMPORT=PASS | tee out-artifact/CFI_RESULT.txt
          echo RESULT=ULTRA6_SEB_MODULE_BUILD_PASS_CLANG14 | tee out-artifact/RESULT.txt

      - name: Upload patched module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TicWatch-Recovery-ULTRA6-SEB-WAKEUP-CLANG14
          path: out-artifact/
          if-no-files-found: error
          retention-days: 90
