name: TicWatch SELFHEAL OEM 5.15.220

on:
  workflow_dispatch:
  push:
    branches: [ticwatch-selfheal-oem-20260925]
    paths:
      - '.github/workflows/ticwatch-selfheal-oem-20260925.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ticwatch-selfheal-oem-20260925
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  LLVM_VERSION: '20.1.0'
  LLVM_ARCHIVE: 'LLVM-20.1.0-Linux-X64.tar.xz'
  BASE_KERNEL_SHA: '3929c55fbc7559af6df290d2c0f66dc551af161a'
  AOSP_ASB_TIP: '56cdb4d13a91efb666d571084ab82de351cc4900'
  TARGET_STABLE_TAG: 'v5.15.220'
  UPLIFT_ORCHESTRATOR_SHA: 'ba33c66c36981cd024e48326b459684605c667a9'
  EXPECTED_UTS_PREFIX: '5.15.220-Xinran_StarBai-Test'
  PREVIOUS_RUN_ID: '34655933953'
  PREVIOUS_ARTIFACT: 'TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter'
  PREVIOUS_ANYKERNEL: 'TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter.zip'
  MANAGER_APK: 'KernelSU_Next_v3.3.0-spoofed-TicWatch-armeabi-v7a-release.apk'
  MANAGER_APK_SHA256: '8310faebd2b592ccddd6a15a6d996c70d89cd679eb51835e84d18f531471357b'
  KSU_NEXT_MANAGER_SIZE: '0x3c2'
  KSU_NEXT_MANAGER_HASH: '3bc9938c38106bcf618bbe1d37ad4adde8a49c659e2860709bbfc341f7e749f2'
  KMI_CRC_MAP_REL: '.github/data/ticwatch-stock379-kmi-crc-overrides-337.tsv'
  HISTORICAL_V2_COMMIT: 'be11c389636d0d7fadd9c258e1895b42c8b85a2d'
  FINAL_KNOWN_GOOD_REPO_COMMIT: 'c0c32179666db0f318ab7f9d14ed7e540696c907'
  CURRENT_BASELINE_COMMIT: 'b8e04cbb8962990296fbefb8bbffb4155ab3d118'
  CURRENT_BASELINE_RUN_ID: '34957108624'
  CURRENT_BASELINE_ARTIFACT: 'TicWatch-KEXEC-ARM64-RELOC-INTERNAL-PROBE-CANDIDATE'
  CURRENT_BASELINE_IMAGE_SHA256: '976c4b7a27679bf7afb1c62ed3937f5f8f494d09860ff2d8d04b6132889aed18'
  CURRENT_BASELINE_SOURCE_DELTA_SHA256: 'b416e989cd01011ce394e5ffc7edfeec0801a4538b44558947e8031a2c627c17'
  CURRENT_BASELINE_FINAL_CONFIG_SHA256: '9e63ad86d97fa6d6ce1914efeb8035dafb9043819796f0784a1bdf10a2557b54'
  CURRENT_BASELINE_MODULE_SYMVERS_SHA256: '39c1019ed73a00b2ba8a9ab5f3a057d8cb0a8be1e285762b7cd56cb0bf95cea0'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout SELFHEAL branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-selfheal-oem-20260925
          fetch-depth: 1

      - name: Pin exact historical build recipes
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$HISTORICAL_V2_COMMIT" "$FINAL_KNOWN_GOOD_REPO_COMMIT" "$CURRENT_BASELINE_COMMIT"
          git cat-file -e "${HISTORICAL_V2_COMMIT}^{commit}"
          git cat-file -e "${FINAL_KNOWN_GOOD_REPO_COMMIT}^{commit}"
          git cat-file -e "${CURRENT_BASELINE_COMMIT}^{commit}"

          git show "$HISTORICAL_V2_COMMIT:.github/workflows/ticwatch-max-lts-220-final-build-v2.yml" > /tmp/v2.yml
          git show "$FINAL_KNOWN_GOOD_REPO_COMMIT:.github/workflows/ticwatch-max-lts-220-final-build-v5kmi-fixed.yml" > /tmp/final.yml
          git show "$CURRENT_BASELINE_COMMIT:.github/workflows/ticwatch-kexec-arm64-reloc-internal-probe.yml" > /tmp/current.yml

          test -s /tmp/v2.yml
          test -s /tmp/final.yml
          test -s /tmp/current.yml

          git checkout --detach "$FINAL_KNOWN_GOOD_REPO_COMMIT"

          cat > /tmp/run-step.py <<'PY'
          from pathlib import Path
          import subprocess, sys

          workflow, step = sys.argv[1], sys.argv[2]
          lines = Path(workflow).read_text().splitlines()
          marker = f"      - name: {step}"
          matches = [i for i, line in enumerate(lines) if line == marker]
          if len(matches) != 1:
              raise SystemExit(f"step anchor mismatch: {step}: {len(matches)}")

          i = matches[0] + 1
          run_i = None
          while i < len(lines):
              line = lines[i]
              if line.startswith("      - name: ") or line.startswith("      - uses: "):
                  break
              if line.startswith("        run:"):
                  run_i = i
                  break
              i += 1

          if run_i is None:
              raise SystemExit(f"run directive not found inside step: {step}")

          stripped = lines[run_i].strip()
          if stripped == "run: |":
              i = run_i + 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith("      - name: ") or line.startswith("      - uses: "):
                      break
                  if line and not line.startswith("          "):
                      raise SystemExit(f"unexpected indentation in {step}: {line!r}")
                  out.append(line[10:] if line else "")
                  i += 1
              script = "\n".join(out) + "\n"
          elif stripped.startswith("run: "):
              script = stripped[len("run: "):] + "\n"
          else:
              raise SystemExit(f"unsupported run syntax in {step}: {stripped!r}")

          subprocess.run(["bash", "-Eeuo", "pipefail", "-c", script], check=True)
          PY

          grep -Fq "      - name: Dependencies and known-good bundle" /tmp/v2.yml
          echo "HISTORICAL_RECIPES_PINNED=PASS"

      - name: Dependencies and known-good bundle
        shell: bash
        run: python3 /tmp/run-step.py /tmp/v2.yml "Dependencies and known-good bundle"

      - name: Install exact LLVM 20.1.0
        shell: bash
        run: python3 /tmp/run-step.py /tmp/v2.yml "Install exact LLVM 20.1.0"

      - name: Materialize exact proven uplift engine
        shell: bash
        run: python3 /tmp/run-step.py /tmp/v2.yml "Materialize exact proven uplift engine"

      - name: Reproduce verified source uplift to 5.15.220
        shell: bash
        run: python3 /tmp/run-step.py /tmp/v2.yml "Reproduce verified source uplift to 5.15.220"

      - name: Resume proven KSU Next and SuSFS integration
        shell: bash
        run: python3 /tmp/run-step.py /tmp/v2.yml "Resume proven KSU Next and SuSFS integration"

      - name: Apply proven KSU SuSFS Seccomp and hardened SafeKey fixes
        shell: bash
        run: python3 /tmp/run-step.py /tmp/v2.yml "Apply proven KSU SuSFS Seccomp and hardened SafeKey fixes"

      - name: Keep proven Slatecom PM fix
        shell: bash
        run: python3 /tmp/run-step.py /tmp/v2.yml "Keep proven Slatecom PM fix"

      - name: Configure Wear7-ready final kernel
        shell: bash
        run: python3 /tmp/run-step.py /tmp/v2.yml "Configure Wear7-ready final kernel"

      - name: Reproduce exact installed 976c KEXEC baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf current-baseline
          mkdir -p current-baseline
          gh run download "$CURRENT_BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$CURRENT_BASELINE_ARTIFACT" --dir current-baseline

          test -s current-baseline/Image
          test -s current-baseline/audit/probe-source-delta.patch
          echo "$CURRENT_BASELINE_IMAGE_SHA256  current-baseline/Image" | sha256sum -c -
          echo "$CURRENT_BASELINE_SOURCE_DELTA_SHA256  current-baseline/audit/probe-source-delta.patch" | sha256sum -c -
          echo "$CURRENT_BASELINE_FINAL_CONFIG_SHA256  current-baseline/audit/final.config" | sha256sum -c -
          echo "$CURRENT_BASELINE_MODULE_SYMVERS_SHA256  current-baseline/audit/Module.symvers" | sha256sum -c -

          K="$GITHUB_WORKSPACE/.ticwatch-preflight/common"
          git -C "$K" apply --check "$GITHUB_WORKSPACE/current-baseline/audit/probe-source-delta.patch"
          git -C "$K" apply "$GITHUB_WORKSPACE/current-baseline/audit/probe-source-delta.patch"

          grep -Fq 'TWKEXEC_PROBE: ENTRY BEFORE' "$K/arch/arm64/kernel/machine_kexec.c"
          grep -Fq 'TWKEXEC_PROBE: ENTRY RETURNED' "$K/arch/arm64/kernel/machine_kexec.c"
          grep -Fq 'TWKEXEC_PROBE: TTBR1_SWITCH BEFORE' "$K/arch/arm64/kernel/machine_kexec.c"
          grep -Fq 'TWKEXEC_PROBE: TTBR1_SWITCH RETURNED' "$K/arch/arm64/kernel/machine_kexec.c"
          grep -Fq 'kernel_reloc(kimage, 0);' "$K/arch/arm64/kernel/machine_kexec.c"
          grep -Fq 'Lticwatch_probe_ttbr1' "$K/arch/arm64/kernel/relocate_kernel.S"
          grep -Fq 'TWKEXEC: GENI UART platform shutdown skipped' "$K/drivers/base/platform.c"
          grep -Fq 'TWKEXEC: MMC0 card shutdown skipped' "$K/drivers/mmc/core/bus.c"
          grep -Fq 'TWKEXEC: BT541 I2C shutdown skipped' "$K/drivers/i2c/i2c-core-base.c"
          grep -Fq 'TWKEXEC_PATH: MACHINE_KEXEC BEFORE' "$K/kernel/kexec_core.c"
          grep -Fq 'del_timer_sync(&uap->dmarx.timer);' "$K/drivers/tty/serial/amba-pl011.c"
          ! grep -Fq 'timer_delete_sync(&uap->dmarx.timer);' "$K/drivers/tty/serial/amba-pl011.c"

          echo "$CURRENT_BASELINE_FINAL_CONFIG_SHA256  final.config" | sha256sum -c -
          echo "CURRENT_INSTALLED_976C_SOURCE_GATE=PASS"

      - name: Install targeted genksyms CRC preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          F="$GITHUB_WORKSPACE/.ticwatch-preflight/common/scripts/genksyms/genksyms.c"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys

          p=Path(sys.argv[1]); s=p.read_text()
          marker='static unsigned long ticwatch_kmi_crc_override('
          call='\t\tcrc = ticwatch_kmi_crc_override(name, crc);\n'
          helper='''static unsigned long ticwatch_kmi_crc_override(const char *name, unsigned long crc)\n{\n    const char *path = getenv("TICWATCH_KMI_CRC_MAP");\n    FILE *f;\n    char line[512];\n    char sym[256];\n    unsigned long expected;\n\n    if (!path || !*path)\n        return crc;\n    f = fopen(path, "r");\n    if (!f) {\n        perror(path);\n        exit(2);\n    }\n    while (fgets(line, sizeof(line), f)) {\n        if (line[0] == '#' || line[0] == '\\n')\n            continue;\n        if (sscanf(line, "%255s %lx", sym, &expected) == 2 && strcmp(sym, name) == 0) {\n            fclose(f);\n            return expected;\n        }\n    }\n    fclose(f);\n    return crc;\n}\n\n'''

          state=(s.count(marker), s.count(call))
          if state == (0, 0):
              print('KMI_PRESTATE=CLEAN')
          elif state == (1, 1):
              if s.count(helper) != 1:
                  raise SystemExit('KMI preexisting helper differs from historical helper')
              s=s.replace(helper,'',1)
              s=s.replace(call,'',1)
              if s.count(marker) or s.count(call):
                  raise SystemExit('KMI normalization failed')
              p.write_text(s)
              print('KMI_PRESTATE=NORMALIZED_TO_HISTORICAL_INPUT')
          else:
              raise SystemExit(f'KMI prestate ambiguous={state}')
          PY

          python3 /tmp/run-step.py /tmp/final.yml "Install targeted genksyms CRC preservation"
          grep -Fq 'ticwatch_kmi_crc_override' "$F"
          [ "$(grep -c 'static unsigned long ticwatch_kmi_crc_override' "$F")" -eq 1 ]
          [ "$(grep -c 'crc = ticwatch_kmi_crc_override(name, crc);' "$F")" -eq 1 ]
          echo "KMI_CRC_OVERRIDE_FINAL_COUNT=PASS"

      - name: Compile exact installed 976c baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 /tmp/run-step.py /tmp/current.yml "Compile internal-probe kernel"
          echo "$CURRENT_BASELINE_IMAGE_SHA256  Image" | sha256sum -c -
          echo "$CURRENT_BASELINE_FINAL_CONFIG_SHA256  final.config" | sha256sum -c -
          echo "$CURRENT_BASELINE_MODULE_SYMVERS_SHA256  Module.symvers" | sha256sum -c -
          echo "CURRENT_INSTALLED_976C_BINARY_REPRODUCTION=PASS"

      - name: Patch only SELFHEAL static KSU init RC
        shell: bash
        run: |
          set -Eeuo pipefail
          F="$GITHUB_WORKSPACE/.ticwatch-preflight/common/KernelSU-Next/kernel/runtime/ksud_integration.c"
          test -s "$F"
          cp "$F" /tmp/ksud_integration.before.c

          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys

          p=Path(sys.argv[1])
          s=p.read_text()

          old='''static const char KERNEL_SU_RC[] =
              "\\n"
              "on post-fs-data\\n"
              "    start logd\\n"
          '''
          new='''static const char KERNEL_SU_RC[] =
              "\\n"
              "on post-fs-data\\n"
              "    exec u:r:" KERNEL_SU_DOMAIN ":s0 root -- /system/bin/sh /oem/ticwatch-selfheal/bootstrap.sh\\n"
              "    start logd\\n"
          '''

          if s.count(old) != 1:
              raise SystemExit(f"SELFHEAL_RC_ANCHOR_MISMATCH count={s.count(old)}")

          s=s.replace(old,new,1)
          p.write_text(s)

          marker='/oem/ticwatch-selfheal/bootstrap.sh'
          if s.count(marker) != 1:
              raise SystemExit("SELFHEAL_MARKER_COUNT_BAD")

          print("SELFHEAL_RC_PATCH=PASS")
          PY

          grep -n -A12 -B2 'static const char KERNEL_SU_RC' "$F" | tee selfheal-rc-source.txt
          grep -Fq '/oem/ticwatch-selfheal/bootstrap.sh' selfheal-rc-source.txt
          diff -u /tmp/ksud_integration.before.c "$F" > selfheal-rc.patch || [ "$?" -eq 1 ]
          test -s selfheal-rc.patch
          grep -Fq '/oem/ticwatch-selfheal/bootstrap.sh' selfheal-rc.patch

      - name: Compile SELFHEAL kernel
        shell: bash
        run: python3 /tmp/run-step.py /tmp/current.yml "Compile internal-probe kernel"

      - name: KMI and config hard gate
        shell: bash
        run: python3 /tmp/run-step.py /tmp/current.yml "Exact KMI and config hard gate"

      - name: SELFHEAL binary and delta gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s Image
          test -s Module.symvers
          test -s final.config

          MARKER='/oem/ticwatch-selfheal/bootstrap.sh'
          COUNT="$(grep -aoF "$MARKER" Image | wc -l | tr -d ' ')"
          [ "$COUNT" = "1" ] || { echo "BAD_SELFHEAL_MARKER_COUNT=$COUNT"; exit 70; }

          grep -Fqx 'CONFIG_KSU=y' final.config
          grep -Fqx 'CONFIG_KSU_SUSFS=y' final.config
          grep -Fqx 'CONFIG_MODVERSIONS=y' final.config
          grep -Fqx 'CONFIG_SECCOMP=y' final.config
          grep -Fqx 'CONFIG_SECCOMP_FILTER=y' final.config
          echo "$CURRENT_BASELINE_FINAL_CONFIG_SHA256  final.config" | sha256sum -c -
          echo "$CURRENT_BASELINE_MODULE_SYMVERS_SHA256  Module.symvers" | sha256sum -c -

          echo "SELFHEAL_MARKER_COUNT=$COUNT"
          echo "CURRENT_INSTALLED_976C_KMI_CONFIG_GATE=PASS"
          sha256sum Image final.config Module.symvers System.map kernelrelease.txt selfheal-rc.patch selfheal-rc-source.txt kmi-crc-audit.txt > SELFHEAL_SHA256SUMS.txt
          echo "SELFHEAL_BINARY_GATE=PASS"

      - name: Package SELFHEAL audit artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bundle/audit
          cp Image bundle/
          cp final.config Module.symvers System.map kernelrelease.txt bundle/audit/
          cp selfheal-rc.patch selfheal-rc-source.txt kmi-crc-audit.txt SELFHEAL_SHA256SUMS.txt bundle/audit/
          cp current-baseline/audit/probe-source-delta.patch bundle/audit/current-baseline-probe-source-delta.patch
          cp "$KMI_CRC_MAP_REL" bundle/audit/

          cat > bundle/README_SELFHEAL.txt <<EOF
          DEVICE=TicWatch Pro 5 Enduro (dace)
          BASE_REPO_COMMIT=$CURRENT_BASELINE_COMMIT
          BASE_INSTALLED_IMAGE_SHA256=$CURRENT_BASELINE_IMAGE_SHA256
          BASE_SOURCE_DELTA_SHA256=$CURRENT_BASELINE_SOURCE_DELTA_SHA256
          KERNEL_RELEASE=$(cat kernelrelease.txt)
          CHANGE=one static KernelSU init.rc exec before normal ksud post-fs-data
          EXEC=/system/bin/sh /oem/ticwatch-selfheal/bootstrap.sh
          OEM_PAYLOAD_REQUIRED=YES
          VENDOR_BOOT_CHANGE=NONE
          INIT_BOOT_CHANGE=NONE
          SUPER_CHANGE=NONE
          UID2000_RESCUE_BYPASS=NO
          STOCK379_KMI_TARGETED_GATE=PASS
          CURRENT_INSTALLED_976C_SOURCE_GATE=PASS
          CURRENT_INSTALLED_976C_BINARY_REPRODUCTION=PASS
          CURRENT_INSTALLED_976C_KMI_CONFIG_GATE=PASS
          FLASH_PERFORMED=NO
          TEST_PLAN=REPACK_KNOWN_GOOD_BOOT_AND_FASTBOOT_BOOT_TEMPORARILY_FIRST
          EOF

          (cd bundle && sha256sum Image README_SELFHEAL.txt audit/* > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Upload SELFHEAL artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TicWatch-SELFHEAL-OEM-5.15.220-CURRENT976C
          path: bundle/
          if-no-files-found: error
          retention-days: 90
