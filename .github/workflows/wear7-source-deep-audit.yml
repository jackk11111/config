name: Wear7 source deep audit

on:
  push:
    branches: [wear7-rom-staging]
    paths:
      - '.github/workflows/wear7-source-deep-audit.yml'
      - 'wear7/TRIGGER_SOURCE_AUDIT*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install host analysis tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip zip python3 e2fsprogs android-sdk-libsparse-utils
          command -v simg2img
          command -v debugfs
          command -v e2fsck

      - name: Download exact public source packages and verify hashes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/wear7src" "$RUNNER_TEMP/wear7work" wear7-audit-report
          cd "$RUNNER_TEMP/wear7src"

          PIXEL_SHA=d203665c90bc06bf175dbb3cbd7fcc9d212c056a030f9c51b541129e8651fb7d
          PIXEL_FILE=solios-cp2a.260603.001.s1-factory-d203665c.zip
          ok=0
          for url in \
            "https://dl.google.com/dl/android/aosp/$PIXEL_FILE" \
            "https://googledownloads.cn/dl/android/aosp/$PIXEL_FILE"; do
            echo "Trying Pixel source: $url"
            rm -f "$PIXEL_FILE"
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 30 -o "$PIXEL_FILE" "$url"; then
              got=$(sha256sum "$PIXEL_FILE" | awk '{print $1}')
              if [ "$got" = "$PIXEL_SHA" ]; then
                printf '%s  %s\n' "$got" "$url" | tee "$GITHUB_WORKSPACE/wear7-audit-report/pixel_factory_verified.txt"
                ok=1
                break
              fi
              echo "Pixel SHA mismatch: $got"
            fi
          done
          [ "$ok" = 1 ] || { echo 'Exact Pixel factory could not be retrieved'; exit 20; }

          TIC_URL='https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip'
          TIC_SHA='ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d'
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 30 -o ticwatch379.zip "$TIC_URL"
          got=$(sha256sum ticwatch379.zip | awk '{print $1}')
          [ "$got" = "$TIC_SHA" ] || { echo "TicWatch OTA SHA mismatch: $got"; exit 21; }
          printf '%s  %s\n' "$got" "$TIC_URL" | tee "$GITHUB_WORKSPACE/wear7-audit-report/ticwatch_ota_verified.txt"

      - name: Extract only Pixel software images
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/wear7src"
          WORK="$RUNNER_TEMP/wear7work"
          FACTORY="$SRC/solios-cp2a.260603.001.s1-factory-d203665c.zip"
          nested=$(unzip -Z1 "$FACTORY" | grep -E '(^|/)image-[^/]+\.zip$' | head -n1)
          [ -n "$nested" ]
          unzip -p "$FACTORY" "$nested" > "$WORK/pixel-inner.zip"
          unzip -tq "$WORK/pixel-inner.zip"
          unzip -p "$WORK/pixel-inner.zip" system.img > "$WORK/pixel-system.sparse"
          unzip -p "$WORK/pixel-inner.zip" system_ext.img > "$WORK/pixel-system_ext.sparse"
          unzip -p "$WORK/pixel-inner.zip" product.img > "$WORK/pixel-product.sparse"
          rm -f "$WORK/pixel-inner.zip" "$FACTORY"

          for p in system system_ext product; do
            simg2img "$WORK/pixel-$p.sparse" "$WORK/pixel-$p.raw"
            rm -f "$WORK/pixel-$p.sparse"
            sha256sum "$WORK/pixel-$p.raw" >> "$GITHUB_WORKSPACE/wear7-audit-report/pixel_raw_image_hashes.txt"
            stat -c "$p raw_bytes=%s" "$WORK/pixel-$p.raw" >> "$GITHUB_WORKSPACE/wear7-audit-report/pixel_raw_image_sizes.txt"
            debugfs -R stats "$WORK/pixel-$p.raw" > "$GITHUB_WORKSPACE/wear7-audit-report/pixel_${p}_ext4_stats.txt" 2>&1
            e2fsck -fn "$WORK/pixel-$p.raw" > "$GITHUB_WORKSPACE/wear7-audit-report/pixel_${p}_e2fsck_readonly.txt" 2>&1 || rc=$?
            rc=${rc:-0}; if [ "$rc" -ge 8 ]; then exit "$rc"; fi; unset rc
            python3 - "$WORK/pixel-$p.raw" "$p" >> "$GITHUB_WORKSPACE/wear7-audit-report/pixel_avb_footer_probe.txt" <<'PY'
import sys, pathlib, struct
path=pathlib.Path(sys.argv[1]); name=sys.argv[2]
b=path.read_bytes()[-64:]
print(name, 'tail64_magic=', b[:4], 'contains_AVBf=', b.find(b'AVBf') >= 0, 'file_bytes=', path.stat().st_size)
PY
          done

      - name: Capture exact Pixel inode metadata for patch targets and siblings
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/wear7work"
          OUT="$GITHUB_WORKSPACE/wear7-audit-report/pixel_patch_target_metadata.txt"
          : > "$OUT"
          stat_first() {
            local img="$1"; shift
            local p
            for p in "$@"; do
              if debugfs -R "stat $p" "$img" 2>&1 | grep -q 'Inode:'; then
                echo "===== $img :: $p =====" >> "$OUT"
                debugfs -R "stat $p" "$img" >> "$OUT" 2>&1
                debugfs -R "ea_list $p" "$img" >> "$OUT" 2>&1 || true
                return 0
              fi
            done
            echo "MISSING in $img: $*" >> "$OUT"
            return 1
          }
          SYS="$WORK/pixel-system.raw"
          SX="$WORK/pixel-system_ext.raw"
          PROD="$WORK/pixel-product.raw"
          stat_first "$SYS" /system/build.prop /build.prop
          stat_first "$SYS" /system/etc/vintf/wear_compatibility_matrix.7.xml /etc/vintf/wear_compatibility_matrix.7.xml
          stat_first "$SYS" /system/priv-app/ClockworkSetupWizard/ClockworkSetupWizard.apk /priv-app/ClockworkSetupWizard/ClockworkSetupWizard.apk
          stat_first "$SYS" /system/etc/permissions/com.google.android.wearable.xml /etc/permissions/com.google.android.wearable.xml
          stat_first "$SX" /lib/libc++.so /system_ext/lib/libc++.so
          stat_first "$SX" /etc/permissions/display_offload_feature.xml /system_ext/etc/permissions/display_offload_feature.xml
          stat_first "$SX" /etc/vintf/compatibility_matrix_google_battery.xml /system_ext/etc/vintf/compatibility_matrix_google_battery.xml
          stat_first "$PROD" /overlay /product/overlay
          stat_first "$PROD" /priv-app/PrebuiltGmsCoreForClockworkWearable /product/priv-app/PrebuiltGmsCoreForClockworkWearable

      - name: Reconstruct exact TicWatch stock hardware logical images
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/wear7src/ticwatch379.zip"
          WORK="$RUNNER_TEMP/wear7work"
          cat > "$WORK/reconstruct_block.py" <<'PY'
import sys, zipfile
zp, part, out = sys.argv[1:4]
BS=4096

def rangeset(s):
    a=[int(x) for x in s.split(',') if x]
    if not a: raise RuntimeError('empty rangeset')
    n=a[0]; r=a[1:]
    if n != len(r) or n % 2: raise RuntimeError('bad rangeset')
    return [(r[i],r[i+1]) for i in range(0,len(r),2)]

with zipfile.ZipFile(zp) as z:
    lines=z.read(part+'.transfer.list').decode().splitlines()
    version=int(lines[0]); total=int(lines[1]); cmds=lines[2:] if version==1 else lines[4:]
    ops=[]
    for line in cmds:
        if not line.strip(): continue
        op,*rest=line.split()
        if op=='new': ops.append(rangeset(rest[0]))
        elif op in ('zero','erase'): continue
        else: raise RuntimeError(f'{part}: source-dependent op {op}')
    with z.open(part+'.new.dat') as src, open(out,'wb') as dst:
        dst.truncate(total*BS)
        for rs in ops:
            for s,e in rs:
                dst.seek(s*BS); left=(e-s)*BS
                while left:
                    b=src.read(min(left,8*1024*1024))
                    if not b: raise RuntimeError('premature EOF')
                    dst.write(b); left-=len(b)
        if src.read(1): raise RuntimeError('trailing bytes')
PY
          for p in vendor vendor_dlkm system_dlkm; do
            python3 "$WORK/reconstruct_block.py" "$SRC" "$p" "$WORK/ticwatch-$p.raw"
            sha256sum "$WORK/ticwatch-$p.raw" >> "$GITHUB_WORKSPACE/wear7-audit-report/ticwatch_raw_image_hashes.txt"
            stat -c "$p raw_bytes=%s" "$WORK/ticwatch-$p.raw" >> "$GITHUB_WORKSPACE/wear7-audit-report/ticwatch_raw_image_sizes.txt"
            debugfs -R stats "$WORK/ticwatch-$p.raw" > "$GITHUB_WORKSPACE/wear7-audit-report/ticwatch_${p}_ext4_stats.txt" 2>&1
            e2fsck -fn "$WORK/ticwatch-$p.raw" > "$GITHUB_WORKSPACE/wear7-audit-report/ticwatch_${p}_e2fsck_readonly.txt" 2>&1 || rc=$?
            rc=${rc:-0}; if [ "$rc" -ge 8 ]; then exit "$rc"; fi; unset rc
          done
          unzip -p "$SRC" META-INF/com/android/metadata > "$GITHUB_WORKSPACE/wear7-audit-report/ticwatch_metadata.txt"
          unzip -p "$SRC" dynamic_partitions_op_list > "$GITHUB_WORKSPACE/wear7-audit-report/ticwatch_dynamic_partitions_op_list.txt"
          rm -f "$SRC"

      - name: Compute Stage0 capacity gate from real donor filesystems
        shell: bash
        run: |
          set -euxo pipefail
          python3 - "$RUNNER_TEMP/wear7work" "$GITHUB_WORKSPACE/wear7-audit-report" <<'PY'
from pathlib import Path
import re, sys
work=Path(sys.argv[1]); out=Path(sys.argv[2])
add={'system':5446025,'system_ext':2325472,'product':8542}
rows=[]
for p in ('system','system_ext','product'):
    txt=(out/f'pixel_{p}_ext4_stats.txt').read_text(errors='replace')
    bs=int(re.search(r'Block size:\s+(\d+)',txt).group(1))
    fb=int(re.search(r'Free blocks:\s+(\d+)',txt).group(1))
    fi=int(re.search(r'Free inodes:\s+(\d+)',txt).group(1))
    free=bs*fb
    rows.append((p,bs,fb,free,fi,add[p],free-add[p]))
with (out/'stage0_capacity_gate.tsv').open('w') as f:
    f.write('partition\tblock_size\tfree_blocks\tfree_bytes\tfree_inodes\tstage0_payload_bytes\traw_headroom_after_payload\n')
    for r in rows: f.write('\t'.join(map(str,r))+'\n')
with (out/'stage0_capacity_verdict.txt').open('w') as f:
    for p,bs,fb,free,fi,need,after in rows:
        verdict='IN_PLACE_SPACE_OK' if after>=0 else 'RESIZE_OR_REBUILD_REQUIRED'
        f.write(f'{p}: free={free} payload={need} raw_after={after} inodes={fi} => {verdict}\n')
    f.write('NOTE: raw byte fit is not a final filesystem-build verdict; shared_blocks, metadata, alignment and AVB still require a controlled image build.\n')
PY

      - name: Generate source audit summary
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo 'TicWatch Pro 5 Enduro / Wear7 source deep audit'
            echo "run=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo
            cat wear7-audit-report/pixel_factory_verified.txt
            cat wear7-audit-report/ticwatch_ota_verified.txt
            echo
            cat wear7-audit-report/stage0_capacity_verdict.txt
            echo
            echo 'Only text reports are uploaded; proprietary source/images are not uploaded as artifacts.'
          } > wear7-audit-report/SUMMARY.txt
          find wear7-audit-report -type f -maxdepth 1 -print0 | sort -z | xargs -0 sha256sum > wear7-audit-report/REPORT_SHA256SUMS.txt
          cat wear7-audit-report/SUMMARY.txt

      - name: Upload text-only audit reports
        uses: actions/upload-artifact@v4
        with:
          name: Wear7-Source-Deep-Audit-Reports
          path: wear7-audit-report/
          retention-days: 7
          compression-level: 9
