name: Wear7 clean exact non-base diff audit

on:
  push:
    branches: [wear7-clean-rebuild-20261003]
    paths:
      - '.github/workflows/wear7-clean-nonbase-diff-20261003.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIXEL_FILE: solios-cp2a.260603.001.s1-factory-d203665c.zip
  PIXEL_SHA256: d203665c90bc06bf175dbb3cbd7fcc9d212c056a030f9c51b541129e8651fb7d
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d
  DIAG3_SHA256: 75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329

jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip e2fsprogs erofs-utils file binutils >/dev/null
          W="$RUNNER_TEMP/w7diff"; mkdir -p "$W/src" "$W/pixel" "$W/tic" "$W/diag" "$W/mnt" "$W/tools" report/diffs report/custom
          ZIP="$W/tools/otatools.zip"
          curl -fL --retry 3 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          echo 'f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84  '"$ZIP" | sha256sum -c -
          python3 - "$ZIP" "$W/tools/x" <<'PY'
          import pathlib,sys,zipfile
          z=zipfile.ZipFile(sys.argv[1]); out=pathlib.Path(sys.argv[2]).resolve()
          wanted={'bin/lpunpack','bin/simg2img'}
          missing=wanted-set(z.namelist())
          if missing: raise SystemExit('missing tools: '+','.join(sorted(missing)))
          for n in z.namelist():
              if n in wanted or n.startswith(('lib64/','lib/')):
                  p=(out/n).resolve()
                  if not p.is_relative_to(out): raise SystemExit('unsafe')
                  z.extract(n,out)
          PY
          chmod +x "$W/tools/x/bin/"*
          echo "W=$W" >> "$GITHUB_ENV"
          echo "HOST=$W/tools/x" >> "$GITHUB_ENV"
      - name: Download exact sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd "$W/src"
          curl -fL --retry 3 -sS -o "$PIXEL_FILE" "https://dl.google.com/dl/android/aosp/$PIXEL_FILE"
          echo "$PIXEL_SHA256  $PIXEL_FILE" | sha256sum -c -
          curl -fL --retry 3 -sS -o ticwatch379.zip "$TIC_URL"
          echo "$TIC_SHA256  ticwatch379.zip" | sha256sum -c -
          mkdir parts; gh release download wear7-diag3-final-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' --dir parts
          cat parts/super_WEAR7_V11_DIAG3_FINAL.img.part* > diag3.img
          echo "$DIAG3_SHA256  diag3.img" | sha256sum -c -
      - name: Extract source partitions
        shell: bash
        run: |
          set -Eeuo pipefail
          export LD_LIBRARY_PATH="$HOST/lib64:$HOST/lib"
          F="$W/src/$PIXEL_FILE"; nested=$(unzip -Z1 "$F" | grep -E '(^|/)image-[^/]+\.zip$' | head -n1); test -n "$nested"
          unzip -p "$F" "$nested" > "$W/pixel-inner.zip"
          for p in system system_ext; do
            unzip -p "$W/pixel-inner.zip" "$p.img" > "$W/pixel/$p.in"
            magic=$(od -An -tx4 -N4 "$W/pixel/$p.in" | tr -d ' \n')
            if [ "$magic" = ed26ff3a ]; then "$HOST/bin/simg2img" "$W/pixel/$p.in" "$W/pixel/$p.img"; else mv "$W/pixel/$p.in" "$W/pixel/$p.img"; fi
          done
          for p in system system_ext vendor; do python3 wear7/scripts/reconstruct_block_ota.py "$W/src/ticwatch379.zip" "$p" "$W/tic/$p.img"; done
          "$HOST/bin/simg2img" "$W/src/diag3.img" "$W/diag/super.raw"
          "$HOST/bin/lpunpack" "$W/diag/super.raw" "$W/diag"
          rm "$W/diag/super.raw"
      - name: Mount sources
        shell: bash
        run: |
          set -Eeuo pipefail
          m(){ img=$1 d=$2; mkdir -p "$d"; t=$(blkid -s TYPE -o value "$img" || true); case "$t" in ext4) sudo mount -o loop,ro,noload "$img" "$d";; erofs) sudo mount -t erofs -o loop,ro "$img" "$d";; *) exit 2;; esac; }
          for p in system system_ext; do m "$W/pixel/$p.img" "$W/mnt/pixel-$p"; m "$W/tic/$p.img" "$W/mnt/tic-$p"; m "$W/diag/$p.img" "$W/mnt/diag-$p"; done
          m "$W/tic/vendor.img" "$W/mnt/tic-vendor"; m "$W/diag/vendor.img" "$W/mnt/diag-vendor"
      - name: Produce exact text diffs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$W" "$GITHUB_WORKSPACE/report" <<'PY'
          import pathlib,subprocess,sys,hashlib
          W=pathlib.Path(sys.argv[1]); R=pathlib.Path(sys.argv[2])
          cases=[
            ('system','system/build.prop'),
            ('system','system/etc/init/hw/init.boringssl.zygote64_32.rc'),
            ('system','system/etc/init/hw/init.boringssl.zygote64.rc'),
            ('system','system/etc/init/hw/init.rc'),
            ('system','system/etc/vintf/wear_compatibility_matrix.7.xml'),
            ('system','system/etc/vintf/manifest.xml'),
            ('system_ext','etc/selinux/system_ext_property_contexts'),
            ('vendor','etc/init/boringssl_self_test.rc'),
          ]
          def h(p):
              if not p.is_file(): return '-'
              return hashlib.sha256(p.read_bytes()).hexdigest()
          with (R/'TEXT_DIFF_SHA256.tsv').open('w') as tab:
            tab.write('partition\tpath\tdiag\tpixel\ttic\n')
            for part,rel in cases:
              d=W/'mnt'/f'diag-{part}'/rel; p=W/'mnt'/f'pixel-{part}'/rel; t=W/'mnt'/f'tic-{part}'/rel
              tab.write(f'{part}\t/{part}/{rel}\t{h(d)}\t{h(p)}\t{h(t)}\n')
              for label,src in [('PIXEL',p),('TIC',t)]:
                out=R/'diffs'/f'{part}__{rel.replace("/","__")}__vs_{label}.diff'
                if not src.is_file() or not d.is_file(): out.write_text(f'MISSING source={src.exists()} diag={d.exists()}\n'); continue
                cp=subprocess.run(['diff','-u','--label',label,'--label','DIAG3',str(src),str(d)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                out.write_bytes(cp.stdout)
          PY
          cat report/TEXT_DIFF_SHA256.tsv
          for f in report/diffs/*.diff; do echo "===== $f ====="; sed -n '1,220p' "$f"; done
      - name: Dump custom text and hash custom binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          D="$W/mnt/diag-system"; E="$W/mnt/diag-system_ext"
          for SPEC in \
            "$D:system/etc/permissions/privapp-permissions-mobvoi-companion.xml" \
            "$D:system/etc/vintf/compatibility_matrix.dace.xml" \
            "$E:etc/init/wear7-v11-stage-marker.rc" \
            "$E:etc/init/wear7-dace-wireless-bootstrap.rc" \
            "$E:etc/wear7/96-wifi-adb-persistent.sh"; do
              root=${SPEC%%:*}; rel=${SPEC#*:}; f="$root/$rel"; o="report/custom/${rel//\//__}.txt"; sudo cat "$f" > "$o"; done
          for SPEC in \
            "$D:system/apex/com.android.vndk.v33.apex" \
            "$D:system/app/KernelSUNextManager/KernelSUNextManager.apk" \
            "$E:bin/ksud"; do
              root=${SPEC%%:*}; rel=${SPEC#*:}; f="$root/$rel"; printf '%s\t%s\t%s\n' "$rel" "$(sudo stat -c %s "$f")" "$(sudo sha256sum "$f" | awk '{print $1}')" >> report/CUSTOM_BINARY_SHA256.tsv; done
          cat report/CUSTOM_BINARY_SHA256.tsv
          for f in report/custom/*.txt; do echo "===== $f ====="; sed -n '1,220p' "$f"; done
      - name: Assistant provenance proof
        shell: bash
        run: |
          set -Eeuo pipefail
          for rel in \
            system/priv-app/AssistantWearPrebuilt/AssistantWearPrebuilt.apk \
            system/etc/permissions/privapp-permissions-pixel-watch-assistant.xml \
            system/etc/permissions/edoras_assistant_feature.xml; do
            d="$W/mnt/diag-system/$rel"; p="$W/mnt/pixel-system/$rel"; printf '%s\tDIAG=%s\tPIXEL=%s\n' "$rel" "$(sudo sha256sum "$d"|awk '{print $1}')" "$(sudo sha256sum "$p"|awk '{print $1}')"; done | tee report/ASSISTANT_PROVENANCE.tsv
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e; for d in "$W"/mnt/*; do sudo umount "$d" 2>/dev/null || true; done; sudo chown -R "$(id -u):$(id -g)" report 2>/dev/null || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wear7-Clean-Nonbase-Diff-20261003
          path: report/
          retention-days: 60
          compression-level: 9
