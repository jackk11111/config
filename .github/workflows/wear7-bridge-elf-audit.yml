name: Wear7 exact bridge ELF dependency audit

on:
  push:
    branches: [wear7-rom-staging]
    paths:
      - '.github/workflows/wear7-bridge-elf-audit.yml'
      - 'wear7/scripts/reconstruct_block_ota.py'
      - 'wear7/manifests/STAGE0_SOURCE_HASHES.tsv'
      - 'wear7/TRIGGER_BRIDGE_ELF_AUDIT*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIXEL_FILE: solios-cp2a.260603.001.s1-factory-d203665c.zip
  PIXEL_SHA256: d203665c90bc06bf175dbb3cbd7fcc9d212c056a030f9c51b541129e8651fb7d
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip e2fsprogs android-sdk-libsparse-utils binutils file python3

      - name: Download exact sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/work" wear7-bridge-elf-report
          cd "$RUNNER_TEMP/src"
          curl -fL --retry 3 --retry-delay 3 -o "$PIXEL_FILE" "https://dl.google.com/dl/android/aosp/$PIXEL_FILE"
          echo "$PIXEL_SHA256  $PIXEL_FILE" | sha256sum -c -
          curl -fL --retry 3 --retry-delay 3 -o ticwatch379.zip "$TIC_URL"
          echo "$TIC_SHA256  ticwatch379.zip" | sha256sum -c -

      - name: Extract Pixel system system_ext and product
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          FACTORY="$RUNNER_TEMP/src/$PIXEL_FILE"
          nested=$(unzip -Z1 "$FACTORY" | grep -E '(^|/)image-[^/]+\.zip$' | head -n1)
          unzip -p "$FACTORY" "$nested" > "$WORK/pixel-inner.zip"
          for p in system system_ext product; do
            unzip -p "$WORK/pixel-inner.zip" "$p.img" > "$WORK/$p.input"
            magic=$(od -An -tx4 -N4 "$WORK/$p.input" | tr -d ' \n')
            if test "$magic" = ed26ff3a; then simg2img "$WORK/$p.input" "$WORK/pixel-$p.raw"; else mv "$WORK/$p.input" "$WORK/pixel-$p.raw"; fi
            sudo mkdir -p "$WORK/pixel-$p-mnt"
            sudo mount -o loop,ro "$WORK/pixel-$p.raw" "$WORK/pixel-$p-mnt"
          done

      - name: Reconstruct TicWatch system_ext and vendor
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          OTA="$RUNNER_TEMP/src/ticwatch379.zip"
          for p in system_ext vendor; do
            python3 wear7/scripts/reconstruct_block_ota.py "$OTA" "$p" "$WORK/tic-$p.raw"
            e2fsck -fn "$WORK/tic-$p.raw" >/dev/null 2>&1 || rc=$?
            rc=${rc:-0}; test "$rc" -lt 8; unset rc
            sudo mkdir -p "$WORK/tic-$p-mnt"
            sudo mount -o loop,ro "$WORK/tic-$p.raw" "$WORK/tic-$p-mnt"
          done

      - name: Audit exact bridge class machine NEEDED and symbol dependencies
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          OUT="$GITHUB_WORKSPACE/wear7-bridge-elf-report"
          SX="$WORK/tic-system_ext-mnt"
          PSYS="$WORK/pixel-system-mnt"
          PSX="$WORK/pixel-system_ext-mnt"
          PPROD="$WORK/pixel-product-mnt"
          TV="$WORK/tic-vendor-mnt"
          bridges=(
            libdisplayconfig.system.qti.so
            libgralloc.system.qti.so
            vendor.display.config@2.0.so
            android.hardware.radio@1.5.so
            android.hardware.radio@1.6.so
            vendor.google_clockwork.wristorientation@1.0.so
          )
          : > "$OUT/BRIDGE_NEEDED.tsv"
          : > "$OUT/UNRESOLVED_SONAMES.txt"
          : > "$OUT/BRIDGE_INFO.txt"
          for b in "${bridges[@]}"; do
            src="$SX/lib/$b"
            sudo test -f "$src"
            sudo file "$src" | tee -a "$OUT/BRIDGE_INFO.txt"
            sudo readelf -h "$src" | grep -E 'Class:|Machine:' | sed "s#^#$b\t#" >> "$OUT/BRIDGE_INFO.txt"
            while read -r soname; do
              printf '%s\t%s\n' "$b" "$soname" >> "$OUT/BRIDGE_NEEDED.tsv"
              found=0
              for root in "$PSYS" "$PSX" "$PPROD" "$TV"; do
                if sudo find "$root" -type f -name "$soname" -print -quit | grep -q .; then found=1; break; fi
              done
              if test "$found" = 0; then printf '%s\t%s\n' "$b" "$soname" >> "$OUT/UNRESOLVED_SONAMES.txt"; fi
            done < <(sudo readelf -d "$src" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
          done
          test "$(grep -c 'ELF 32-bit' "$OUT/BRIDGE_INFO.txt")" = 6
          if test -s "$OUT/UNRESOLVED_SONAMES.txt"; then
            echo 'BRIDGE_SONAME_EXISTENCE=FAIL' | tee "$OUT/VERDICT.txt"
            cat "$OUT/UNRESOLVED_SONAMES.txt"
            exit 42
          fi
          echo 'BRIDGE_SONAME_EXISTENCE=PASS' | tee "$OUT/VERDICT.txt"

      - name: Verify exact frozen bridge hashes
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"
          python3 - <<'PY'
          import csv, hashlib, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'work/tic-system_ext-mnt/lib'
          rows=list(csv.DictReader(pathlib.Path('wear7/manifests/STAGE0_SOURCE_HASHES.tsv').open(), delimiter='\t'))
          rows=[r for r in rows if r['bundle_path'].startswith('payload/system_ext/lib/')]
          if len(rows)!=6: raise SystemExit('expected six bridge rows')
          for r in rows:
              p=root/pathlib.Path(r['bundle_path']).name
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=r['sha256']: raise SystemExit(f'{p.name}: {got} != {r["sha256"]}')
          print('BRIDGE_HASH_LOCK=PASS')
          PY

      - name: Final report
        shell: bash
        run: |
          set -euxo pipefail
          OUT=wear7-bridge-elf-report
          {
            echo 'BRIDGE_ELF_AUDIT=PASS'
            echo 'BRIDGE_COUNT=6'
            echo 'BRIDGE_CLASS=ELF32_ARM'
            echo 'SONAME_EXISTENCE_ACROSS_PIXEL17_PLUS_TICWATCH_VENDOR=PASS'
          } > "$OUT/SUMMARY.txt"
          find "$OUT" -type f -maxdepth 1 -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wear7-Bridge-ELF-Audit
          path: wear7-bridge-elf-report/
          retention-days: 30
          compression-level: 9
