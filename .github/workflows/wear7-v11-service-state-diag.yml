name: Wear7 V11 service-state diagnostic

on:
  push:
    branches: [wear7-v11-service-state-diag]
    paths:
      - '.github/workflows/wear7-v11-service-state-diag.yml'
      - 'wear7/v11/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare V11 environment
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/share/boost /usr/local/lib/android/sdk/ndk || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs android-sdk-libsparse-utils erofs-utils unzip curl python3-yaml python3-pyelftools secilc qemu-user-static apksigner binutils >/dev/null
          mkdir -p "$RUNNER_TEMP/v11/input" "$RUNNER_TEMP/v11/prior-report" wear7-v11-report

      - name: Download exact V7 bootchain
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-V7-Bootchain
          path: ${{ runner.temp }}/v11/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '35198609607'

      - name: Download exact V7 super
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-V7-Super
          path: ${{ runner.temp }}/v11/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '35198609607'

      - name: Download exact V7 reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-V7-Offline-Analysis
          path: ${{ runner.temp }}/v11/prior-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '35198609607'

      - name: Build filesystem-aware service-state target
        shell: bash
        run: sudo env RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_SHA="$GITHUB_SHA" bash wear7/v11/build_and_validate.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-V11-ServiceState-Reports
          path: wear7-v11-report/
          if-no-files-found: error
          retention-days: 60
          compression-level: 9

      - name: Upload service-state super
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-V11-ServiceState-Super
          path: wear7-v11-candidate/super.img
          if-no-files-found: error
          retention-days: 60
          compression-level: 0
