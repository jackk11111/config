name: Wear7 source deep audit V2

on:
  push:
    branches: [wear7-rom-staging]
    paths:
      - '.github/workflows/wear7-source-deep-audit-v2.yml'
      - 'wear7/scripts/reconstruct_block_ota.py'
      - 'wear7/scripts/stage0_capacity_report.py'
      - 'wear7/TRIGGER_SOURCE_AUDIT_V2*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip python3 e2fsprogs android-sdk-libsparse-utils

      - name: Exact sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/work" wear7-audit-v2
          cd "$RUNNER_TEMP/src"
          PIX='solios-cp2a.260603.001.s1-factory-d203665c.zip'
          curl -fL --retry 3 -o "$PIX" "https://dl.google.com/dl/android/aosp/$PIX"
          echo 'd203665c90bc06bf175dbb3cbd7fcc9d212c056a030f9c51b541129e8651fb7d  solios-cp2a.260603.001.s1-factory-d203665c.zip' | sha256sum -c -
          printf '%s\n' 'd203665c90bc06bf175dbb3cbd7fcc9d212c056a030f9c51b541129e8651fb7d' > "$GITHUB_WORKSPACE/wear7-audit-v2/pixel_factory_sha256.txt"
          curl -fL --retry 3 -o ticwatch379.zip 'https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip'
          echo 'ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d  ticwatch379.zip' | sha256sum -c -
          printf '%s\n' 'ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d' > "$GITHUB_WORKSPACE/wear7-audit-v2/ticwatch_ota_sha256.txt"

      - name: Pixel images + ext4 audit
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/src"; WORK="$RUNNER_TEMP/work"; OUT="$GITHUB_WORKSPACE/wear7-audit-v2"
          FACTORY="$SRC/solios-cp2a.260603.001.s1-factory-d203665c.zip"
          nested=$(unzip -Z1 "$FACTORY" | grep -E '(^|/)image-[^/]+\.zip$' | head -n1)
          unzip -p "$FACTORY" "$nested" > "$WORK/inner.zip"
          for p in system system_ext product; do
            unzip -p "$WORK/inner.zip" "$p.img" > "$WORK/$p.input"
            magic=$(od -An -tx4 -N4 "$WORK/$p.input" | tr -d ' \n')
            if [ "$magic" = ed26ff3a ]; then simg2img "$WORK/$p.input" "$WORK/$p.raw"; else mv "$WORK/$p.input" "$WORK/$p.raw"; fi
            sha256sum "$WORK/$p.raw" >> "$OUT/pixel_raw_sha256.txt"
            stat -c "$p raw_bytes=%s" "$WORK/$p.raw" >> "$OUT/pixel_raw_sizes.txt"
            debugfs -R stats "$WORK/$p.raw" > "$OUT/pixel_${p}_ext4_stats.txt" 2>&1
            e2fsck -fn "$WORK/$p.raw" > "$OUT/pixel_${p}_e2fsck.txt" 2>&1 || rc=$?
            rc=${rc:-0}; [ "$rc" -lt 8 ]; unset rc
          done
          rm -f "$WORK/inner.zip" "$FACTORY"

      - name: Pixel path inventory and inode metadata
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/work"; OUT="$GITHUB_WORKSPACE/wear7-audit-v2"
          META="$OUT/pixel_inode_metadata.txt"; : > "$META"
          for p in system system_ext product; do
            echo "===== ROOT $p =====" >> "$OUT/pixel_directory_inventory.txt"
            debugfs -R 'ls -l /' "$WORK/$p.raw" >> "$OUT/pixel_directory_inventory.txt" 2>&1 || true
            for d in /system /system_ext /product /lib /lib64 /priv-app /overlay /etc /etc/vintf /etc/permissions; do
              echo "===== $p $d =====" >> "$OUT/pixel_directory_inventory.txt"
              debugfs -R "ls -l $d" "$WORK/$p.raw" >> "$OUT/pixel_directory_inventory.txt" 2>&1 || true
            done
          done
          stat_try() {
            img=$1; path=$2; label=$3
            echo "===== $label :: $path =====" >> "$META"
            debugfs -R "stat $path" "$img" >> "$META" 2>&1 || true
            debugfs -R "ea_list $path" "$img" >> "$META" 2>&1 || true
          }
          SYS="$WORK/system.raw"; SX="$WORK/system_ext.raw"; PROD="$WORK/product.raw"
          stat_try "$SYS" /system/build.prop system_build_prop
          stat_try "$SYS" /system/etc/vintf/wear_compatibility_matrix.7.xml wear_matrix_7
          stat_try "$SYS" /system/priv-app/ClockworkSetupWizard/ClockworkSetupWizard.apk setupwizard_apk
          stat_try "$SYS" /system/priv-app/ClockworkSetupWizard setupwizard_dir
          stat_try "$SYS" /system/priv-app system_privapp_dir
          stat_try "$SX" /lib system_ext_lib_dir
          stat_try "$SX" /lib64 system_ext_lib64_dir
          stat_try "$SX" /etc/permissions/display_offload_feature.xml display_offload_feature
          stat_try "$SX" /etc/vintf/compatibility_matrix_google_battery.xml google_battery_matrix
          stat_try "$PROD" /overlay product_overlay_dir
          stat_try "$PROD" /priv-app product_privapp_dir
          stat_try "$PROD" /priv-app/PrebuiltGmsCoreForClockworkWearable gms_dir

      - name: TicWatch stock hardware images
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/src/ticwatch379.zip"; WORK="$RUNNER_TEMP/work"; OUT="$GITHUB_WORKSPACE/wear7-audit-v2"
          for p in vendor vendor_dlkm system_dlkm; do
            python3 wear7/scripts/reconstruct_block_ota.py "$SRC" "$p" "$WORK/tic_$p.raw"
            sha256sum "$WORK/tic_$p.raw" >> "$OUT/ticwatch_raw_sha256.txt"
            stat -c "$p raw_bytes=%s" "$WORK/tic_$p.raw" >> "$OUT/ticwatch_raw_sizes.txt"
            debugfs -R stats "$WORK/tic_$p.raw" > "$OUT/ticwatch_${p}_ext4_stats.txt" 2>&1
            e2fsck -fn "$WORK/tic_$p.raw" > "$OUT/ticwatch_${p}_e2fsck.txt" 2>&1 || rc=$?
            rc=${rc:-0}; [ "$rc" -lt 8 ]; unset rc
          done
          unzip -p "$SRC" META-INF/com/android/metadata > "$OUT/ticwatch_metadata.txt"
          unzip -p "$SRC" dynamic_partitions_op_list > "$OUT/ticwatch_dynamic_partitions_op_list.txt"

      - name: Capacity gate
        shell: bash
        run: |
          set -euxo pipefail
          python3 wear7/scripts/stage0_capacity_report.py wear7-audit-v2 --tsv wear7-audit-v2/stage0_capacity.tsv | tee wear7-audit-v2/stage0_capacity.txt
          {
            echo "run=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            cat wear7-audit-v2/stage0_capacity.txt
          } > wear7-audit-v2/SUMMARY.txt
          find wear7-audit-v2 -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > wear7-audit-v2/REPORT_SHA256SUMS.txt
          cat wear7-audit-v2/SUMMARY.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Wear7-Source-Deep-Audit-V2-Reports
          path: wear7-audit-v2/
          retention-days: 7
          compression-level: 9
