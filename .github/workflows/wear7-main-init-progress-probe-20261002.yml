name: Wear7 main init progress raw block probe

on:
  push:
    branches: [wear7-diag4-init-bisect-20261002]
    paths:
      - '.github/workflows/wear7-main-init-progress-probe-20261002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download exact DIAG3 release super
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p parts
          gh release download wear7-diag3-final-20261002 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' \
            --dir parts
          cat parts/super_WEAR7_V11_DIAG3_FINAL.img.part* > super.img
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  super.img' | sha256sum -c -

      - name: Locate true system init checkpoints and build raw block patch map
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import mmap, struct, hashlib, pathlib

          p = pathlib.Path('super.img')
          with p.open('rb') as f:
              mm = mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ)
              try:
                  magic, major, minor, file_hdr_sz, chunk_hdr_sz, blk_sz, total_blks, total_chunks, checksum = struct.unpack('<IHHHHIIII', mm[:28])
                  if magic != 0xED26FF3A or blk_sz != 4096:
                      raise SystemExit(f'BAD_SPARSE_HEADER magic={magic:#x} blk={blk_sz}')

                  def padded(new_line, old_line):
                      if not new_line.endswith(b'\n') or not old_line.endswith(b'\n'):
                          raise SystemExit('LINE_FORMAT')
                      if len(new_line) > len(old_line):
                          raise SystemExit(f'REPLACEMENT_TOO_LONG new={len(new_line)} old={len(old_line)}')
                      return new_line[:-1] + b' ' * (len(old_line)-len(new_line)) + b'\n'

                  # Each prefix anchors the exact checkpoint in the real /system/etc/init/hw/init.rc.
                  old_after_logd = b'    # Start lmkd before any other services run so that it can register them\n'
                  anchor_after_logd = b'    start logd\n' + old_after_logd

                  old_after_lmkd = b'    # Start essential services.\n'
                  anchor_after_lmkd = b'    start lmkd\n\n' + old_after_lmkd + b'    start servicemanager\n'

                  old_after_mgrs = b'    # Mount /mnt/vm ASAP to allow early VMs to run.\n'
                  anchor_after_mgrs = b'    start vndservicemanager\n\n' + old_after_mgrs

                  specs = []
                  for name, anchor, old, rel, new in [
                      ('AFTER_LOGD', anchor_after_logd, old_after_logd, len(b'    start logd\n'), b'    chmod 0777 /metadata/vold/d/04\n'),
                      ('AFTER_LMKD', anchor_after_lmkd, old_after_lmkd, len(b'    start lmkd\n\n'), b'    chmod 701 /metadata/vold/d\n'),
                      ('AFTER_MANAGERS', anchor_after_mgrs, old_after_mgrs, len(b'    start vndservicemanager\n\n'), b'    chmod 0777 /metadata/vold/d/06\n'),
                  ]:
                      base = mm.find(anchor)
                      if base < 0:
                          raise SystemExit(f'{name}_ANCHOR_NOT_FOUND')
                      if mm.find(anchor, base + 1) >= 0:
                          raise SystemExit(f'{name}_ANCHOR_NOT_UNIQUE')
                      off = base + rel
                      if mm[off:off+len(old)] != old:
                          raise SystemExit(f'{name}_SOURCE_MISMATCH')
                      specs.append((name, off, old, padded(new, old)))

                  def sparse_to_raw(sp):
                      pos = file_hdr_sz
                      raw_block = 0
                      for _ in range(total_chunks):
                          typ, reserved, count, total_sz = struct.unpack('<HHII', mm[pos:pos+12])
                          data = pos + chunk_hdr_sz
                          if typ == 0xCAC1:  # RAW
                              end = data + count * blk_sz
                              if data <= sp < end:
                                  raw_off = raw_block * blk_sz + (sp - data)
                                  return raw_off, data, raw_block, count
                          pos += total_sz
                          raw_block += count
                      raise SystemExit(f'SPARSE_OFFSET_NOT_IN_RAW_CHUNK={sp}')

                  per_block = {}
                  resolved = []
                  for name, sp, old, new in specs:
                      raw_off, chunk_data, chunk_raw_start, chunk_count = sparse_to_raw(sp)
                      block, in_block = divmod(raw_off, blk_sz)
                      if in_block + len(old) > blk_sz:
                          raise SystemExit(f'{name}_CROSSES_RAW_BLOCK')
                      sparse_block = chunk_data + (block - chunk_raw_start) * blk_sz
                      resolved.append((name, sp, raw_off, block, in_block, old, new, sparse_block))
                      per_block.setdefault(block, {'sparse_block': sparse_block, 'patches': []})['patches'].append((name, in_block, old, new))

                  print('===== MAIN INIT DIRECT PROGRESS PROBE =====')
                  for name, sp, raw_off, block, in_block, old, new, sparse_block in resolved:
                      print(f'{name}_SPARSE_OFFSET={sp}')
                      print(f'{name}_RAW_BLOCK={block}')
                      print(f'{name}_OFFSET_IN_BLOCK={in_block}')
                      print(f'{name}_OLD_HEX={old.hex()}')
                      print(f'{name}_NEW_HEX={new.hex()}')

                  print(f'CHANGED_RAW_BLOCKS={len(per_block)}')
                  for block in sorted(per_block):
                      ent = per_block[block]
                      original = bytearray(mm[ent['sparse_block']:ent['sparse_block']+blk_sz])
                      if len(original) != blk_sz:
                          raise SystemExit(f'SHORT_BLOCK={block}')
                      patched = bytearray(original)
                      for name, off, old, new in ent['patches']:
                          if patched[off:off+len(old)] != old:
                              raise SystemExit(f'{name}_BLOCK_SOURCE_MISMATCH')
                          patched[off:off+len(old)] = new
                      h0 = hashlib.sha256(original).hexdigest()
                      h1 = hashlib.sha256(patched).hexdigest()
                      names = ','.join(x[0] for x in ent['patches'])
                      print(f'BLOCK_{block}_SEMANTICS={names}')
                      print(f'BLOCK_{block}_ORIGINAL_SHA256={h0}')
                      print(f'BLOCK_{block}_PATCHED_SHA256={h1}')

                  print('MARKER_04=direct_after_start_logd')
                  print('PARENT_MODE_701=direct_after_start_lmkd')
                  print('MARKER_06=direct_after_start_servicemanager_hwservicemanager_vndservicemanager')
                  print('RESULT=MAIN_INIT_PROGRESS_PROBE_PASS')
              finally:
                  mm.close()
          PY
