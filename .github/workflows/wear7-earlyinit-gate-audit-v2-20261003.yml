name: Wear7 early-init gate audit V2

on:
  push:
    branches:
      - wear7-diag4-init-bisect-20261002
    paths:
      - '.github/workflows/wear7-earlyinit-gate-audit-v2-20261003.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Unpack exact DIAG3 super
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs >/dev/null
          mkdir -p audit/parts audit/lp audit/tools audit/mnt/{system,system_ext,product,vendor}
          cd audit
          gh release download wear7-diag3-final-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' --dir parts
          cat parts/super_WEAR7_V11_DIAG3_FINAL.img.part* > super_sparse.img
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  super_sparse.img' | sha256sum -c -
          simg2img super_sparse.img super.raw.img
          ZIP=tools/otatools.zip
          curl -fL --retry 3 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          python3 - "$ZIP" tools/x <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n == 'bin/lpunpack' or n.startswith(('lib64/','lib/')):
                      p=(out/n).resolve()
                      if not p.is_relative_to(out): raise SystemExit('unsafe path')
                      z.extract(n,out)
          PY
          chmod +x tools/x/bin/lpunpack
          LD_LIBRARY_PATH="$PWD/tools/x/lib64:$PWD/tools/x/lib" tools/x/bin/lpunpack super.raw.img lp
          for p in system system_ext product vendor; do
            img=$(find lp -maxdepth 1 -type f \( -name "$p.img" -o -name "${p}_a.img" \) | head -n1 || true)
            [ -n "$img" ] && sudo mount -o loop,ro,noload "$img" "mnt/$p"
          done

      - name: Build persistent gate report
        shell: bash
        run: |
          set -Eeuo pipefail
          cd audit
          python3 - <<'PY' > earlyinit-gate-report.txt
          import pathlib,re
          roots=[pathlib.Path('mnt/system'),pathlib.Path('mnt/system_ext'),pathlib.Path('mnt/product'),pathlib.Path('mnt/vendor')]
          files=[]
          for root in roots:
              if root.exists(): files.extend(root.rglob('*.rc'))
          def rel(p): return str(p).replace('mnt/','/',1)
          def blocks_for(trigger):
              out=[]
              for p in files:
                  try: lines=p.read_text(errors='replace').splitlines()
                  except: continue
                  i=0
                  while i<len(lines):
                      if re.match(r'^on\s+'+re.escape(trigger)+r'(?:\s|$)', lines[i]):
                          b=[lines[i]]; j=i+1
                          while j<len(lines):
                              x=lines[j]
                              if x and not x[0].isspace() and not x.startswith('#'): break
                              b.append(x); j+=1
                          out.append((rel(p),i+1,b))
                          i=j
                      else: i+=1
              return out
          print('===== EXACT IMAGE =====')
          print('release=wear7-diag3-final-20261002')
          print('sparse_sha256=75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329')
          print('\n===== STAGE MARKER RC =====')
          for p in files:
              if p.name=='wear7-v11-stage-marker.rc':
                  print(f'--- {rel(p)} ---')
                  print(p.read_text(errors='replace'))
          print('\n===== LOAD_DLKM PROPERTY DEFINITIONS =====')
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.stat().st_size>8_000_000: continue
                  if p.suffix in ('.ko','.so','.apk','.jar','.dex','.odex','.vdex'): continue
                  try: txt=p.read_text(errors='ignore')
                  except: continue
                  if 'ro.vendor.qti.load_dlkm.service' in txt:
                      for n,line in enumerate(txt.splitlines(),1):
                          if 'ro.vendor.qti.load_dlkm.service' in line:
                              print(f'{rel(p)}:{n}:{line}')
          print('\n===== INIT.RC IMPORTS =====')
          for p in files:
              try: lines=p.read_text(errors='replace').splitlines()
              except: continue
              hits=[(n,x) for n,x in enumerate(lines,1) if re.match(r'^import\s+',x)]
              if hits:
                  print(f'--- {rel(p)} ---')
                  for n,x in hits: print(f'{n}:{x}')
          print('\n===== ALL EARLY-INIT BLOCKS (PATH/LINE) =====')
          for p,n,b in sorted(blocks_for('early-init'), key=lambda x:(x[0],x[1])):
              print(f'--- {p}:{n} ---')
              print('\n'.join(b))
          starts=set()
          for _,_,b in blocks_for('early-init'):
              for x in b[1:]:
                  m=re.match(r'^\s*(?:start|exec_start)\s+(\S+)',x)
                  if m: starts.add(m.group(1))
          print('\n===== SERVICES STARTED BY EARLY-INIT =====')
          for p in files:
              try: lines=p.read_text(errors='replace').splitlines()
              except: continue
              i=0
              while i<len(lines):
                  m=re.match(r'^service\s+(\S+)\s+(.+)$',lines[i])
                  if not m or m.group(1) not in starts:
                      i+=1; continue
                  name=m.group(1); b=[lines[i]]; j=i+1
                  while j<len(lines):
                      x=lines[j]
                      if x and not x[0].isspace() and not x.startswith('#'): break
                      b.append(x); j+=1
                  print(f'--- {name} @ {rel(p)}:{i+1} ---')
                  print('\n'.join(b))
                  i=j
          print('\n===== EARLY-INIT RISK TOKENS =====')
          risk=('critical','reboot_on_failure','sys.powerctl','shutdown critical','exec ','exec_start','wait_for_prop','wait ')
          for p,n,b in blocks_for('early-init'):
              for off,x in enumerate(b):
                  if any(k in x for k in risk): print(f'{p}:{n+off}:{x}')
          print('\n===== GLOBAL LOAD_DLKM / MODULE READY REFERENCES =====')
          for p in files:
              try: lines=p.read_text(errors='replace').splitlines()
              except: continue
              for n,x in enumerate(lines,1):
                  if any(k in x for k in ('load_dlkm','vendor.all.modules.ready','gki.modprobe','vendor.modprobe')):
                      print(f'{rel(p)}:{n}:{x}')
          print('\nRESULT=EARLYINIT_GATE_AUDIT_V2_COMPLETE')
          PY
          cat earlyinit-gate-report.txt

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear7-earlyinit-gate-audit-v2
          path: audit/earlyinit-gate-report.txt
          if-no-files-found: error
          retention-days: 30
