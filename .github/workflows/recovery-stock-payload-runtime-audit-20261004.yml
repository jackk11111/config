name: Recovery stock-payload A13 runtime audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-stock-payload-runtime-audit-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_COMMIT: 0402bd118a891fd5802214dd2c64f1855aed4f73
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d

jobs:
  audit-stock-recovery-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Prepare exact stock source
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl e2fsprogs cpio lz4 file git python3 >/dev/null
          git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
          mkdir -p "$RUNNER_TEMP/recovery-audit" "$GITHUB_WORKSPACE/recovery-stock-runtime-report"
          git show "$BASE_COMMIT:wear7/scripts/reconstruct_block_ota.py" > "$RUNNER_TEMP/recovery-audit/reconstruct_block_ota.py"
          cd "$RUNNER_TEMP/recovery-audit"
          curl -fL --retry 3 --retry-delay 3 -o ticwatch379.zip "$TIC_URL"
          echo "$TIC_SHA256  ticwatch379.zip" | sha256sum -c -
          python3 reconstruct_block_ota.py ticwatch379.zip vendor vendor.raw
          echo '150238505037c881b079b7c9de1adc231f2c4a94b64f8dd3a7694ebc7408371e  vendor.raw' | sha256sum -c -

      - name: Extract immutable stock recovery payload from vendor
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/recovery-audit"
          R="$GITHUB_WORKSPACE/recovery-stock-runtime-report"
          debugfs -R "dump -p /etc/recovery.img $W/stock-recovery.img" "$W/vendor.raw" >/dev/null 2>&1
          test -s "$W/stock-recovery.img"
          sha256sum "$W/stock-recovery.img" | tee "$R/STOCK_VENDOR_RECOVERY_IMAGE_SHA256.txt"
          stat -c 'STOCK_VENDOR_RECOVERY_IMAGE_BYTES=%s' "$W/stock-recovery.img" | tee "$R/STOCK_VENDOR_RECOVERY_IMAGE_SIZE.txt"

          python3 - "$W/stock-recovery.img" "$W/ramdisk.bin" "$R/BOOT_HEADER.txt" <<'PY'
          import pathlib, struct, sys
          img = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          rep = pathlib.Path(sys.argv[3])
          b = img.read_bytes()
          if b[:8] != b'ANDROID!':
              raise SystemExit('not Android boot image')
          kernel_size = struct.unpack_from('<I', b, 8)[0]
          ramdisk_size = struct.unpack_from('<I', b, 16)[0]
          page_size = struct.unpack_from('<I', b, 36)[0]
          header_version = struct.unpack_from('<I', b, 40)[0]
          if page_size <= 0 or page_size & (page_size - 1):
              raise SystemExit(f'bad page size {page_size}')
          align = lambda n: (n + page_size - 1) // page_size * page_size
          ramdisk_off = page_size + align(kernel_size)
          if ramdisk_off + ramdisk_size > len(b):
              raise SystemExit('ramdisk outside image')
          out.write_bytes(b[ramdisk_off:ramdisk_off + ramdisk_size])
          rep.write_text(
              f'HEADER_VERSION={header_version}\nPAGE_SIZE={page_size}\n'
              f'KERNEL_SIZE={kernel_size}\nRAMDISK_OFFSET={ramdisk_off}\n'
              f'RAMDISK_SIZE={ramdisk_size}\nIMAGE_SIZE={len(b)}\n'
          )
          PY
          file "$W/ramdisk.bin" | tee "$R/RAMDISK_FILE.txt"

      - name: Extract stock recovery ramdisk
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/recovery-audit"
          R="$GITHUB_WORKSPACE/recovery-stock-runtime-report"
          rm -rf "$W/ramdisk-root"
          mkdir -p "$W/ramdisk-root"
          MAGIC=$(od -An -tx1 -N4 "$W/ramdisk.bin" | tr -d ' \n')
          echo "RAMDISK_MAGIC=$MAGIC" | tee "$R/RAMDISK_MAGIC.txt"
          case "$MAGIC" in
            1f8b*)
              (cd "$W/ramdisk-root" && gzip -dc "$W/ramdisk.bin" | cpio -idmu --quiet)
              ;;
            04224d18|02214c18)
              (cd "$W/ramdisk-root" && lz4 -dc "$W/ramdisk.bin" | cpio -idmu --quiet)
              ;;
            *)
              echo "unsupported ramdisk compression: $MAGIC" >&2
              exit 31
              ;;
          esac
          find "$W/ramdisk-root" -maxdepth 4 -type f -o -type l | sort > "$R/RAMDISK_PATHS.txt"

      - name: Audit exact qualified A13 runtime bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/recovery-audit/ramdisk-root"
          R="$GITHUB_WORKSPACE/recovery-stock-runtime-report"

          python3 - "$W" "$R" <<'PY'
          from pathlib import Path
          import hashlib, sys

          root = Path(sys.argv[1])
          report = Path(sys.argv[2])

          expected = {
              'hwservicemanager': 'c22b20ceb0f14f0199bed1711a5670d93bf9a6cd1360f99bf9d2791eeac98080',
              'servicemanager': '28a04317efbb42b61fbc34a925e6b76988b6457f01738b4959f95dd45f1f8a15',
              'service': 'b716af680963e7ac627a5d755869c090d8927530ba368604bec9b872b6e691c7',
              'keystore2': '3c4a26761cc46afe341ee68b70d098933375a2c73a7da91e5ae35050efac6831',
              'vold': '5e0248d119dd6fb319bf3e1f210935a003d9f18ed14822f133f1b0fa85eb0f5f',
              'vdc': '32ba2708fb8e5ab6c484cd3548691f6bcd459b1dbcb118e3abfa2a9e3775f7ae',
              'libbinder.so': '9b00066d989f11fba12a11f1f675a6e757355e234c4c35a8c8a8d0550e6c5803',
              'android.hidl.token@1.0.so': '227196890e0e1f8bc826dd4716e91324e6379f14e69a18df8fa8465f4ea8759a',
          }

          rows = []
          exact = 0
          for name, want in expected.items():
              hits = [p for p in root.rglob(name) if p.is_file()]
              if len(hits) != 1:
                  rows.append(f'{name}\tHITS={len(hits)}\tEXPECTED={want}')
                  continue
              p = hits[0]
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              ok = got == want
              exact += int(ok)
              rows.append(f'{name}\t{"PASS" if ok else "MISMATCH"}\t{got}\t{p.relative_to(root)}')

          vintf = [p for p in root.rglob('vintf') if p.is_dir()]
          selinux = [p for p in root.rglob('selinux') if p.is_dir()]
          token = [p for p in root.rglob('android.hidl.token@1.0.so') if p.is_file()]
          lib_count = sum(1 for p in root.rglob('*.so') if p.is_file())
          lib_bytes = sum(p.stat().st_size for p in root.rglob('*.so') if p.is_file())

          (report / 'QUALIFIED_RUNTIME_HASH_AUDIT.tsv').write_text('\n'.join(rows) + '\n')
          (report / 'STOCK_RECOVERY_RUNTIME_SUMMARY.txt').write_text(
              f'EXACT_HASHES={exact}_OF_{len(expected)}\n'
              f'VINTF_DIRS={len(vintf)}\nSELINUX_DIRS={len(selinux)}\n'
              f'TOKEN_LIBS={len(token)}\nSO_FILE_COUNT={lib_count}\nSO_TOTAL_BYTES={lib_bytes}\n'
              f'STOCK_VENDOR_RECOVERY_RUNTIME_EXACT={"PASS" if exact == len(expected) and vintf and selinux else "NO"}\n'
          )
          print((report / 'QUALIFIED_RUNTIME_HASH_AUDIT.tsv').read_text(), end='')
          print((report / 'STOCK_RECOVERY_RUNTIME_SUMMARY.txt').read_text(), end='')
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Recovery-Stock-Payload-A13-Runtime-Audit
          path: recovery-stock-runtime-report/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
