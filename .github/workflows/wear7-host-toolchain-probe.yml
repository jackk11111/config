name: Wear7 host toolchain probe

on:
  push:
    branches: [wear7-rom-staging]
    paths:
      - '.github/workflows/wear7-host-toolchain-probe.yml'
      - 'wear7/TRIGGER_TOOLCHAIN_PROBE*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe Ubuntu/AOSP image tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y e2fsprogs attr libcap2-bin unzip zip curl python3
          sudo apt-get install -y android-sdk-libsparse-utils
          sudo apt-get install -y selinux-utils secilc
          sudo apt-get install -y google-android-build-tools-34.0.0-installer || true
          echo '===== COMMANDS ====='
          for c in simg2img img2simg e2fsdroid make_ext4fs ext2simg avbtool lpmake lpdump lpunpack checkvintf idmap2 aapt2 secilc sefcontext_compile debugfs e2fsck resize2fs tune2fs getfattr setfattr getcap setcap; do
            printf '%-24s ' "$c"
            command -v "$c" || true
          done
          echo '===== SEARCH INSTALL TREE ====='
          sudo find /usr /opt -type f \( -name simg2img -o -name img2simg -o -name e2fsdroid -o -name avbtool -o -name lpmake -o -name lpdump -o -name lpunpack -o -name checkvintf -o -name idmap2 -o -name aapt2 -o -name secilc \) -print 2>/dev/null | sort || true
          echo '===== PACKAGE SEARCH ====='
          apt-cache search 'lpmake|liblp|checkvintf|idmap2|avbtool|e2fsdroid' || true
