name: Wear7 host toolchain probe

on:
  push:
    branches: [wear7-rom-staging]
    paths:
      - '.github/workflows/wear7-host-toolchain-probe.yml'
      - 'wear7/TRIGGER_TOOLCHAIN_PROBE*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install basic host analysis tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y e2fsprogs attr libcap2-bin unzip zip curl python3 android-sdk-libsparse-utils selinux-utils secilc

      - name: Probe official AOSP Android 17 build-tools prebuilt
        shell: bash
        run: |
          set -euxo pipefail
          TAG='android-17.0.0_r1'
          URL="https://android.googlesource.com/platform/prebuilts/build-tools/+archive/refs/tags/${TAG}/linux-x86.tar.gz"
          mkdir -p "$RUNNER_TEMP/aosp17-tools"
          curl -fL --retry 3 --retry-delay 3 -o "$RUNNER_TEMP/aosp17-tools.tar.gz" "$URL"
          tar -xzf "$RUNNER_TEMP/aosp17-tools.tar.gz" -C "$RUNNER_TEMP/aosp17-tools"
          printf 'tag=%s\nurl=%s\narchive_sha256=%s\n' "$TAG" "$URL" "$(sha256sum "$RUNNER_TEMP/aosp17-tools.tar.gz" | awk '{print $1}')" | tee wear7_aosp17_toolchain.txt
          echo '===== AOSP17 TOOLS =====' | tee -a wear7_aosp17_toolchain.txt
          for c in simg2img img2simg e2fsdroid make_ext4fs ext2simg avbtool lpmake lpdump lpunpack checkvintf idmap2 aapt2 secilc sefcontext_compile mkuserimg_mke2fs; do
            matches=$(find "$RUNNER_TEMP/aosp17-tools" -type f -name "$c" -print | sort || true)
            printf '%-24s %s\n' "$c" "${matches:-MISSING}" | tee -a wear7_aosp17_toolchain.txt
          done
          echo '===== BIN TOP =====' >> wear7_aosp17_toolchain.txt
          find "$RUNNER_TEMP/aosp17-tools/bin" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort >> wear7_aosp17_toolchain.txt || true

      - name: Smoke-test selected AOSP17 host tools
        shell: bash
        run: |
          set -euxo pipefail
          B="$RUNNER_TEMP/aosp17-tools/bin"
          export PATH="$B:$PATH"
          for c in simg2img img2simg e2fsdroid avbtool lpmake lpdump lpunpack checkvintf idmap2 sefcontext_compile; do
            if [ -x "$B/$c" ]; then
              echo "===== $c ====="
              ldd "$B/$c" || true
              "$B/$c" --help >/dev/null 2>&1 || "$B/$c" -h >/dev/null 2>&1 || true
            fi
          done
          cat wear7_aosp17_toolchain.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Wear7-AOSP17-Toolchain-Probe
          path: wear7_aosp17_toolchain.txt
          retention-days: 7
