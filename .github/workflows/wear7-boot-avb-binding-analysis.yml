name: Wear7 boot AVB binding analysis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wear7-boot-avb-binding-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RUN16_RUN_ID: 37287348856
  RUN16_BOOTCHAIN_ARTIFACT: Wear7-Dace-Clean-V1-RecoverySafe-Bootchain

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download exact Run16 bootchain
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-Dace-Clean-V1-RecoverySafe-Bootchain
          path: ${{ runner.temp }}/run16
          github-token: ${{ github.token }}
          repository: jackk11111/ticwatch-pro5-dace
          run-id: 37287348856

      - name: Pin same qualified avbtool used for Run16
        shell: bash
        run: |
          set -Eeuo pipefail
          Z="$RUNNER_TEMP/otatools.zip"
          D="$RUNNER_TEMP/otatools"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$Z" \
            'https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip'
          echo 'f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84  '"$Z" | sha256sum -c -
          mkdir -p "$D"
          unzip -q "$Z" 'bin/avbtool' -d "$D"
          chmod +x "$D/bin/avbtool"
          "$D/bin/avbtool" version | grep -q 'avbtool 1.4.0'
          echo "AVBTOOL=$D/bin/avbtool" >> "$GITHUB_ENV"

      - name: Inspect exact Run16 boot AVB and boot header
        shell: bash
        run: |
          set -Eeuo pipefail
          B="$RUNNER_TEMP/run16"
          R="$GITHUB_WORKSPACE/report"
          mkdir -p "$R"
          echo '5557bce09dab368413ca07a88ae08810baf7cff682162fc7e5e3dec89c7208fe  '"$B/boot.img" | sha256sum -c -
          "$AVBTOOL" info_image --image "$B/boot.img" > "$R/RUN16_BOOT_AVB.txt"
          "$AVBTOOL" info_image --image "$B/vbmeta.img" > "$R/RUN16_ROOT_VBMETA.txt"
          "$AVBTOOL" info_image --image "$B/vbmeta_system.img" > "$R/RUN16_SYSTEM_VBMETA.txt"
          python3 - "$B/boot.img" > "$R/RUN16_BOOT_HEADER.txt" <<'PY'
          import pathlib, struct, sys
          b=pathlib.Path(sys.argv[1]).read_bytes()[:4096]
          assert b[:8] == b'ANDROID!'
          raw=struct.unpack_from('<I',b,16)[0]
          a=(raw>>25)&0x7f; m=(raw>>18)&0x7f; d=(raw>>11)&0x7f
          y=((raw>>4)&0x7f)+2000; mon=raw&0xf
          print(f'RAW_OS_VERSION=0x{raw:08x}')
          print(f'HEADER_OS_VERSION={a}.{m}.{d}')
          print(f'HEADER_SECURITY_PATCH={y:04d}-{mon:02d}')
          PY
          strings -a "$B/boot.img" | grep -E 'com\.android\.build\.(boot|vendor)\.(os_version|security_patch|fingerprint)' | sort -u > "$R/RUN16_BOOT_BINDING_STRINGS.txt" || true

      - name: Decide next candidate from actual boot image
        shell: bash
        run: |
          set -Eeuo pipefail
          R="$GITHUB_WORKSPACE/report"
          python3 - "$R/RUN16_BOOT_AVB.txt" "$R/RUN16_ROOT_VBMETA.txt" "$R/RUN16_BOOT_HEADER.txt" <<'PY'
          from pathlib import Path
          import sys
          boot=Path(sys.argv[1]).read_text()
          root=Path(sys.argv[2]).read_text()
          header=Path(sys.argv[3]).read_text()
          props=('com.android.build.boot.os_version','com.android.build.boot.security_patch')
          mb=[p for p in props if p not in boot]
          mr=[p for p in props if p not in root]
          out=[
              'RUN16_BOOT_BINDING_PROPS=' + ('PASS' if not mb else 'MISSING:' + ','.join(mb)),
              'RUN16_ROOT_BINDING_PROPS=' + ('PASS' if not mr else 'MISSING:' + ','.join(mr)),
              'RUN16_BOOT_HEADER=' + header.replace('\n',';').rstrip(';'),
          ]
          if mb:
              out.append('NEXT=BOOT_FOOTER_FULLDATE_CANDIDATE')
              out.append('SCOPE=BOOT_AVB_FOOTER_ONLY;KERNEL_AND_BOOT_HEADER_BYTES_UNCHANGED')
          elif mr:
              out.append('NEXT=ROOT_VBMETA_ONLY')
          else:
              out.append('NEXT=NO_AVB_BINDING_GAP')
          Path('report/VERDICT.txt').write_text('\n'.join(out)+'\n')
          print(Path('report/VERDICT.txt').read_text(),end='')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-Boot-AVB-Binding-Analysis
          path: report/
          if-no-files-found: error
          retention-days: 30
