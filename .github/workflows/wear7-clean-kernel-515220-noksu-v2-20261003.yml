name: Wear7 clean kernel 5.15.220 no-KSU V2

on:
  push:
    branches: [wear7-clean-rebuild-20261003]
    paths:
      - '.github/workflows/wear7-clean-kernel-515220-noksu-v2-20261003.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wear7-clean-kernel-515220-noksu-v2
  cancel-in-progress: true

env:
  LLVM_VERSION: '20.1.0'
  LLVM_ARCHIVE: 'LLVM-20.1.0-Linux-X64.tar.xz'
  BASE_KERNEL_SHA: '3929c55fbc7559af6df290d2c0f66dc551af161a'
  AOSP_ASB_TIP: '56cdb4d13a91efb666d571084ab82de351cc4900'
  UPLIFT_ORCHESTRATOR_SHA: 'ba33c66c36981cd024e48326b459684605c667a9'
  KERNEL_TOOLING_COMMIT: 'b8e04cbb8962990296fbefb8bbffb4155ab3d118'
  BASELINE_RUN_ID: '34957108624'
  BASELINE_ARTIFACT: 'TicWatch-KEXEC-ARM64-RELOC-INTERNAL-PROBE-CANDIDATE'
  BASELINE_IMAGE_SHA: '976c4b7a27679bf7afb1c62ed3937f5f8f494d09860ff2d8d04b6132889aed18'
  BASELINE_CONFIG_SHA: '9e63ad86d97fa6d6ce1914efeb8035dafb9043819796f0784a1bdf10a2557b54'
  BASELINE_SYMVERS_SHA: '39c1019ed73a00b2ba8a9ab5f3a057d8cb0a8be1e285762b7cd56cb0bf95cea0'
  EXPECTED_UTS_PREFIX: '5.15.220-Xinran_StarBai-Test'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Install dependencies and LLVM
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential flex bison bc python3 python-is-python3 libssl-dev libelf-dev dwarves make cmake zip unzip curl wget gnupg gawk gcc-multilib g++-multilib ccache rsync file zstd binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf >/dev/null
          wget -q "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_ARCHIVE}"
          tar -xJf "$LLVM_ARCHIVE"
          mv "LLVM-${LLVM_VERSION}-Linux-X64" "$GITHUB_WORKSPACE/aosp-clang"
          rm -f "$LLVM_ARCHIVE"
          echo "AOSP_CLANG_PATH=$GITHUB_WORKSPACE/aosp-clang" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          clang --version | tee llvm-version.txt
          grep -Fq '20.1.0' llvm-version.txt

      - name: Download known-good audit baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.BASELINE_ARTIFACT }}
          path: ${{ runner.temp }}/baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASELINE_RUN_ID }}

      - name: Gate baseline config and KMI
        shell: bash
        run: |
          set -Eeuo pipefail
          B="$RUNNER_TEMP/baseline"
          echo "$BASELINE_IMAGE_SHA  $B/Image" | sha256sum -c -
          echo "$BASELINE_CONFIG_SHA  $B/audit/final.config" | sha256sum -c -
          echo "$BASELINE_SYMVERS_SHA  $B/audit/Module.symvers" | sha256sum -c -
          grep -Fqx 'CONFIG_MODVERSIONS=y' "$B/audit/final.config"
          grep -Fqx 'CONFIG_SECCOMP_FILTER=y' "$B/audit/final.config"
          grep -Fqx 'CONFIG_KSU=y' "$B/audit/final.config"
          echo BASELINE_ONLY_FOR_CONFIG_AND_KMI=PASS

      - name: Fetch immutable KMI and compile tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p pinned
          BASE="https://raw.githubusercontent.com/jackk11111/config/$KERNEL_TOOLING_COMMIT"
          curl -fLsS "$BASE/.github/data/ticwatch-stock379-kmi-crc-overrides-337.tsv" -o pinned/kmi.tsv
          curl -fLsS "$BASE/.github/scripts/ticwatch-5.15.220-compile-compat.sh" -o pinned/compile-compat.sh
          chmod +x pinned/compile-compat.sh
          test "$(grep -vc '^#' pinned/kmi.tsv)" -eq 337
          sha256sum pinned/* | tee PINNED_TOOLING_SHA256.txt
          python3 - pinned/kmi.tsv "$RUNNER_TEMP/baseline/audit/Module.symvers" <<'PY'
          import sys
          exp={}
          for l in open(sys.argv[1]):
              if l.strip() and not l.startswith('#'):
                  s,c=l.split()[:2]; exp[s]=c.lower()
          old={f[1]:f[0].lower() for l in open(sys.argv[2]) if len((f:=l.split()))>=2}
          bad=[(s,c,old.get(s)) for s,c in exp.items() if old.get(s)!=c]
          print('KMI_MAP_SYMBOLS',len(exp),'BAD',len(bad))
          if bad: print(bad[:30]); raise SystemExit(2)
          print('KMI_MAP_VS_KNOWN_GOOD=PASS')
          PY

      - name: Materialize exact historical uplift engine
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$UPLIFT_ORCHESTRATOR_SHA"
          git cat-file -e "${UPLIFT_ORCHESTRATOR_SHA}^{commit}"
          git show "$UPLIFT_ORCHESTRATOR_SHA:.github/workflows/ticwatch-max-lts-220-incremental-uplift.yml" > /tmp/uplift-v1.yml
          git show "$UPLIFT_ORCHESTRATOR_SHA:.github/workflows/ticwatch-max-lts-220-incremental-uplift-v2.yml" > /tmp/uplift-v2.yml
          for f in ticwatch-uplift-v3-overlay.py ticwatch-uplift-v3-resume-ledger.py ticwatch-uplift-v3-ipv4-android.py ticwatch-uplift-v3-lsm-default.py ticwatch-uplift-v3-bpf-fork.py ticwatch-uplift-v3-mptcp-join.py; do
            git show "$UPLIFT_ORCHESTRATOR_SHA:.github/scripts/$f" > "/tmp/$f"
          done
          python3 <<'PY'
          from pathlib import Path
          src=Path('/tmp/uplift-v2.yml').read_text()
          def extract_run(name):
              ls=src.splitlines(); marker=f'      - name: {name}'; i=ls.index(marker)
              while i < len(ls) and ls[i].strip() != 'run: |': i += 1
              if i==len(ls): raise SystemExit('run block not found: '+name)
              i+=1; out=[]
              while i<len(ls):
                  line=ls[i]
                  if line.startswith('      - name: '): break
                  if line and not line.startswith('          '): raise SystemExit('indentation '+repr(line))
                  out.append(line[10:] if line else ''); i+=1
              return '\n'.join(out)+'\n'
          text=extract_run('Build ABI-aware scripts from proven workflow')
          old="Path('.github/workflows/ticwatch-max-lts-220-incremental-uplift.yml').read_text()"
          new="Path('/tmp/uplift-v1.yml').read_text()"
          if text.count(old)!=1: raise SystemExit('historical V1 source anchor mismatch')
          text=text.replace(old,new,1)
          Path('/tmp/v2-build-scripts.sh').write_text(text)
          PY
          bash -n /tmp/v2-build-scripts.sh
          bash /tmp/v2-build-scripts.sh
          for f in overlay resume-ledger ipv4-android lsm-default bpf-fork mptcp-join; do python3 "/tmp/ticwatch-uplift-v3-$f.py" /tmp/uplift.sh; done
          bash -n /tmp/prepare.sh
          bash -n /tmp/uplift.sh
          sha256sum /tmp/uplift-v1.yml /tmp/uplift-v2.yml /tmp/prepare.sh /tmp/uplift.sh | tee UPLIFT_ENGINE_SHA256.txt

      - name: Reproduce clean 5.15.211 to 5.15.220 source uplift
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf kernel .ticwatch-clean
          bash /tmp/prepare.sh
          test -d kernel/.git
          git -C kernel cat-file -e "${BASE_KERNEL_SHA}^{commit}"
          git -C kernel cat-file -e "${AOSP_ASB_TIP}^{commit}"
          git -C kernel merge-base --is-ancestor "$BASE_KERNEL_SHA" HEAD
          git -C kernel merge-base --is-ancestor "$AOSP_ASB_TIP" HEAD
          test -z "$(git -C kernel status --porcelain)"
          printf '%s\n' 211 > kernel/.git/ticwatch-last-complete
          if git -C kernel remote get-url stable >/dev/null 2>&1; then git -C kernel remote remove stable; fi
          bash /tmp/uplift.sh
          test "$(make -s -C kernel kernelversion)" = '5.15.220'
          test "$(cat kernel/.git/ticwatch-last-complete)" = '220'
          test -z "$(git -C kernel status --porcelain)"
          git -C kernel rev-parse HEAD | tee lts-merged-head.txt
          mkdir -p .ticwatch-clean
          mv kernel .ticwatch-clean/common
          test ! -e .ticwatch-clean/common/KernelSU-Next
          ! find .ticwatch-clean/common -path '*/.git/*' -prune -o -iname '*susfs*' -print | grep -q .
          ! grep -RIl --exclude-dir=.git 'TWKEXEC' .ticwatch-clean/common 2>/dev/null | grep -q .
          echo CLEAN_UPLIFT_SOURCE_NO_KSU_SUSFS_TWKEXEC=PASS

      - name: Apply only generic compile compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          K=.ticwatch-clean/common
          bash pinned/compile-compat.sh "$K"
          P="$K/kernel/sched/psi.c"
          python3 - "$P" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old='timer_shutdown_sync(&cgroup->psi.poll_timer);'
          new='del_timer_sync(&cgroup->psi.poll_timer);'
          old_n=s.count(old); new_n=s.count(new)
          if old_n == 1 and new_n == 0:
              s=s.replace(old,new,1)
          elif old_n == 0 and new_n == 1:
              pass
          else:
              raise SystemExit(f'PSI timer compat anchor invalid: shutdown={old_n} del_sync={new_n}')
          p.write_text(s)
          PY
          grep -Fq 'del_timer_sync(&cgroup->psi.poll_timer);' "$P"
          ! grep -Fq 'timer_shutdown_sync(&cgroup->psi.poll_timer);' "$P"
          test ! -e "$K/KernelSU-Next"
          ! grep -RIl --exclude-dir=.git -E 'TWKEXEC|KSU Next|KernelSU|SuSFS' "$K" 2>/dev/null | grep -q .
          echo PSI_TIMER_515_COMPAT=PASS
          echo GENERIC_COMPILE_COMPAT_ONLY=PASS

      - name: Seed known-good config and strip KSU
        shell: bash
        run: |
          set -Eeuo pipefail
          K=.ticwatch-clean/common; mkdir -p "$K/out"
          cp "$RUNNER_TEMP/baseline/audit/final.config" "$K/out/.config"
          sed -i -E '/^(# )?CONFIG_KSU([_= ].*)?$/d' "$K/out/.config"
          export ARCH=arm64 PATH="$AOSP_CLANG_PATH/bin:$PATH" LLVM=1 LLVM_IAS=1
          make -C "$K" -s O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          cp "$K/out/.config" CLEAN_NOKSU_CONFIG.txt
          ! grep -Eq '^CONFIG_KSU(=|_)' CLEAN_NOKSU_CONFIG.txt
          grep -Fqx 'CONFIG_MODVERSIONS=y' CLEAN_NOKSU_CONFIG.txt
          grep -Fqx 'CONFIG_SECCOMP_FILTER=y' CLEAN_NOKSU_CONFIG.txt
          grep -Fqx 'CONFIG_LOCALVERSION="-Xinran_StarBai-Test"' CLEAN_NOKSU_CONFIG.txt
          echo CLEAN_CONFIG_NO_KSU=PASS

      - name: Install targeted stock379 KMI CRC preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          K="$GITHUB_WORKSPACE/.ticwatch-clean/common"; F="$K/scripts/genksyms/genksyms.c"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          anchor='void export_symbol(const char *name)\n{\n\tstruct symbol *sym;\n'
          crc='\t\tcrc = expand_and_crc_sym(sym, 0xffffffff) ^ 0xffffffff;\n'
          if s.count(anchor)!=1 or s.count(crc)!=1: raise SystemExit('genksyms anchor mismatch')
          helper='''static unsigned long ticwatch_kmi_crc_override(const char *name, unsigned long crc)\n{\n    const char *path = getenv("TICWATCH_KMI_CRC_MAP");\n    FILE *f; char line[512]; char sym[256]; unsigned long expected;\n    if (!path || !*path) return crc;\n    f=fopen(path,"r"); if(!f){perror(path);exit(2);}\n    while(fgets(line,sizeof(line),f)){\n        if(line[0]=='#'||line[0]=='\\n') continue;\n        if(sscanf(line,"%255s %lx",sym,&expected)==2 && strcmp(sym,name)==0){fclose(f);return expected;}\n    }\n    fclose(f); return crc;\n}\n\n'''
          s=s.replace(anchor,helper+anchor,1)
          s=s.replace(crc,crc+'\t\tcrc = ticwatch_kmi_crc_override(name, crc);\n',1)
          p.write_text(s)
          PY
          grep -Fq ticwatch_kmi_crc_override "$F"
          rm -f "$K/out/scripts/genksyms/genksyms" "$K/out/scripts/genksyms/"*.o 2>/dev/null || true
          git -C "$K" diff --name-only HEAD | sort | tee CLEAN_SOURCE_DIFF_FILES.txt
          python3 - CLEAN_SOURCE_DIFF_FILES.txt <<'PY'
          import sys
          got={x.strip() for x in open(sys.argv[1]) if x.strip()}
          allowed={'fs/f2fs/data.c','drivers/tty/serial/amba-pl011.c','kernel/sched/psi.c','scripts/genksyms/genksyms.c'}
          extra=sorted(got-allowed); missing=sorted({'scripts/genksyms/genksyms.c'}-got)
          print('SOURCE_DIFF_FILES',sorted(got))
          if extra or missing: raise SystemExit(f'unexpected source diff extra={extra} missing={missing}')
          print('CLEAN_SOURCE_DIFF_GATE=PASS')
          PY

      - name: Compile clean kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          K="$GITHUB_WORKSPACE/.ticwatch-clean/common"; cd "$K"
          export ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export PATH="$AOSP_CLANG_PATH/bin:$PATH" LLVM=1 LLVM_IAS=1 KCFLAGS='-Wno-error -Wno-deprecated-declarations'
          export KBUILD_BUILD_VERSION=0 KBUILD_BUILD_USER='Wear7Clean' KBUILD_BUILD_HOST='Dace' SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export TICWATCH_KMI_CRC_MAP="$GITHUB_WORKSPACE/pinned/kmi.tsv"
          set +e
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 > "$GITHUB_WORKSPACE/kernel-build.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '=== FIRST COMPILER ERRORS ==='
            grep -n -m 80 -E 'fatal error:|error:|undefined reference|No rule to make target|ld\.lld: error:|make(\[[0-9]+\])?: \*\*\*' "$GITHUB_WORKSPACE/kernel-build.log" || true
            echo '=== BUILD LOG TAIL ==='
            tail -n 160 "$GITHUB_WORKSPACE/kernel-build.log" || true
            exit "$rc"
          fi
          test -s out/arch/arm64/boot/Image; test -s out/vmlinux; test -s out/System.map; test -s out/Module.symvers
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image"; cp out/System.map "$GITHUB_WORKSPACE/System.map"; cp out/Module.symvers "$GITHUB_WORKSPACE/Module.symvers"; cp out/.config "$GITHUB_WORKSPACE/final.config"
          make -s O=out ARCH=arm64 kernelrelease | tee "$GITHUB_WORKSPACE/kernelrelease.txt"
          case "$(cat "$GITHUB_WORKSPACE/kernelrelease.txt")" in ${EXPECTED_UTS_PREFIX}*) ;; *) exit 3;; esac
          nm out/vmlinux > "$GITHUB_WORKSPACE/vmlinux.nm"
          ! grep -Ei '(^|[[:space:]])(ksu_|susfs_|ksud)' "$GITHUB_WORKSPACE/vmlinux.nm" | grep -q .
          ! grep -Eq '^CONFIG_KSU(=|_)' "$GITHUB_WORKSPACE/final.config"

      - name: Stock379 KMI hard gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - pinned/kmi.tsv Module.symvers <<'PY' | tee KMI_AUDIT.txt
          import sys
          exp={}
          for l in open(sys.argv[1]):
              if l.strip() and not l.startswith('#'):
                  s,c=l.split()[:2]; exp[s]=c.lower()
          new={f[1]:f[0].lower() for l in open(sys.argv[2]) if len((f:=l.split()))>=2}
          missing=[s for s in exp if s not in new]; bad=[(s,exp[s],new.get(s)) for s in exp if new.get(s)!=exp[s]]
          print('EXPECTED',len(exp),'MISSING',len(missing),'MISMATCH',len(bad))
          if missing or bad: print('MISSING_LIST',missing[:50]); print('BAD_LIST',bad[:50]); raise SystemExit(2)
          print('STOCK379_KMI_TARGETED_GATE=PASS_337_OF_337')
          PY
          grep -Fq 'STOCK379_KMI_TARGETED_GATE=PASS_337_OF_337' KMI_AUDIT.txt
          sha256sum Image final.config Module.symvers System.map kernelrelease.txt | tee CLEAN_KERNEL_SHA256.txt

      - name: Package clean kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact/audit
          cp Image artifact/
          cp final.config Module.symvers System.map kernelrelease.txt KMI_AUDIT.txt CLEAN_KERNEL_SHA256.txt PINNED_TOOLING_SHA256.txt UPLIFT_ENGINE_SHA256.txt CLEAN_SOURCE_DIFF_FILES.txt llvm-version.txt kernel-build.log artifact/audit/
          cat > artifact/CLEAN_KERNEL_REPORT.txt <<EOF
          DEVICE=TicWatch Pro 5 Enduro dace
          PURPOSE=WEAR7_CLEAN_FIRST_BOOT_KERNEL
          KERNEL_RELEASE=$(cat kernelrelease.txt)
          SOURCE=DETERMINISTIC_5.15.211_TO_5.15.220_UPLIFT
          BASELINE_CONFIG_FROM_RUN=$BASELINE_RUN_ID
          CONFIG_KSU=ABSENT
          KERNELSU_SOURCE=ABSENT
          SUSFS_SOURCE=ABSENT
          KEXEC_DIAGNOSTIC_PATCHES=ABSENT
          CONFIG_MODVERSIONS=YES
          STOCK379_KMI_TARGETED_GATE=PASS_337_OF_337
          UPLIFT_ORCHESTRATOR_SHA=$UPLIFT_ORCHESTRATOR_SHA
          FLASH_PERFORMED=NO
          IMAGE_ONLY_NOT_BOOT_IMAGE=YES
          EOF
          (cd artifact && sha256sum Image CLEAN_KERNEL_REPORT.txt audit/final.config audit/Module.symvers > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Upload clean kernel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TicWatch-Wear7-Clean-Kernel-5.15.220-NoKSU-V2
          path: artifact/
          retention-days: 90
          compression-level: 6
