name: Wear7 inspect stock379 flattened VNDK33

on:
  workflow_dispatch:
  push:
    branches: [wear7-rom-staging]
    paths: ['.github/workflows/wear7-inspect-flattened-vndk33.yml']

permissions:
  contents: read

env:
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: wear7-rom-staging
          fetch-depth: 1
      - name: Inspect exact flattened VNDK payload
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null; sudo apt-get install -y curl unzip e2fsprogs file protobuf-compiler >/dev/null
          mkdir -p "$RUNNER_TEMP/mnt" report
          curl -fL --retry 3 --retry-delay 3 -o "$RUNNER_TEMP/tic379.zip" "$TIC_URL"
          echo "$TIC_SHA256  $RUNNER_TEMP/tic379.zip" | sha256sum -c -
          python3 wear7/scripts/reconstruct_block_ota.py "$RUNNER_TEMP/tic379.zip" system "$RUNNER_TEMP/system.raw"
          sudo mount -o loop,ro "$RUNNER_TEMP/system.raw" "$RUNNER_TEMP/mnt"
          if test -d "$RUNNER_TEMP/mnt/system"; then SYS="$RUNNER_TEMP/mnt/system"; else SYS="$RUNNER_TEMP/mnt"; fi
          V="$SYS/apex/com.android.vndk.current"; test -d "$V"
          sudo find "$V" -maxdepth 6 -printf '%y\t%p\t%l\n' | sed "s#$SYS/##" | sort > report/VNDK_TREE.txt
          sudo du -sb "$V" | tee report/VNDK_BYTES.txt
          sudo find "$V" -type f -print0 | sort -z | xargs -0 sha256sum | sed "s#$SYS/##" > report/VNDK_FILE_SHA256.txt
          sudo find "$V" -type f -printf '%p\t%s\n' | sed "s#$SYS/##" | sort > report/VNDK_FILE_SIZES.tsv
          test -s "$V/etc/vintf/manifest.xml"
          sudo cat "$V/etc/vintf/manifest.xml" | tee report/VNDK_VINTF_MANIFEST.xml
          grep -q '<vendor-ndk>' report/VNDK_VINTF_MANIFEST.xml
          grep -q '<version>33</version>' report/VNDK_VINTF_MANIFEST.xml
          file "$V/apex_manifest.pb" "$V/apex_pubkey" | tee report/VNDK_TOP_FILES.txt
          sha256sum "$V/apex_manifest.pb" "$V/apex_pubkey" | tee report/VNDK_TOP_SHA256.txt
          echo FLATTENED_VNDK33_PAYLOAD=PASS | tee report/VERDICT.txt
      - name: Cleanup
        if: always()
        run: |
          sudo umount "$RUNNER_TEMP/mnt" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" report 2>/dev/null || true
          find report -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > report/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Wear7-Stock379-Flattened-VNDK33
          path: report/
          retention-days: 30
          compression-level: 9
