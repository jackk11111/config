name: TicWatch MAX-LTS 5.15.220 - Final Build V2
# Retrigger after false-positive timer validator fix 488bfed

on:
  workflow_dispatch:
  push:
    branches:
      - ticwatch-max-lts-220
    paths:
      - '.github/workflows/ticwatch-max-lts-220-final-build-v2.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ticwatch-max-lts-220-final-v2
  cancel-in-progress: true

env:
  LLVM_VERSION: '20.1.0'
  LLVM_ARCHIVE: 'LLVM-20.1.0-Linux-X64.tar.xz'
  BASE_KERNEL_SHA: '3929c55fbc7559af6df290d2c0f66dc551af161a'
  AOSP_ASB_TIP: '56cdb4d13a91efb666d571084ab82de351cc4900'
  TARGET_STABLE_TAG: 'v5.15.220'
  UPLIFT_ORCHESTRATOR_SHA: 'ba33c66c36981cd024e48326b459684605c667a9'
  EXPECTED_UTS_PREFIX: '5.15.220-Xinran_StarBai-Test'
  PREVIOUS_RUN_ID: '34655933953'
  PREVIOUS_ARTIFACT: 'TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter'
  PREVIOUS_ANYKERNEL: 'TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter.zip'
  MANAGER_APK: 'KernelSU_Next_v3.3.0-spoofed-TicWatch-armeabi-v7a-release.apk'
  MANAGER_APK_SHA256: '8310faebd2b592ccddd6a15a6d996c70d89cd679eb51835e84d18f531471357b'
  KSU_NEXT_MANAGER_SIZE: '0x3c2'
  KSU_NEXT_MANAGER_HASH: '3bc9938c38106bcf618bbe1d37ad4adde8a49c659e2860709bbfc341f7e749f2'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout final-build branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-max-lts-220
          fetch-depth: 1

      - name: Dependencies and known-good bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc python3 python-is-python3 \
            libssl-dev libelf-dev dwarves make cmake zip unzip curl wget \
            gnupg gawk gcc-multilib g++-multilib ccache rsync file \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf >/dev/null
          mkdir -p previous
          gh run download "$PREVIOUS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PREVIOUS_ARTIFACT" --dir previous
          test -s "previous/$MANAGER_APK"
          printf '%s  %s\n' "$MANAGER_APK_SHA256" "previous/$MANAGER_APK" | sha256sum -c -
          cp "previous/$MANAGER_APK" "$GITHUB_WORKSPACE/$MANAGER_APK"
          test -s "previous/$PREVIOUS_ANYKERNEL"
          test -s previous/wireless-flasher/busybox
          test -s previous/wireless-flasher/magiskboot
          test -s previous/wireless-flasher/flash.sh
          echo 'KNOWN_GOOD_BUNDLE=PASS'

      - name: Install exact LLVM 20.1.0
        shell: bash
        run: |
          set -Eeuo pipefail
          wget -q "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_ARCHIVE}"
          tar -xJf "$LLVM_ARCHIVE"
          mv "LLVM-${LLVM_VERSION}-Linux-X64" "$GITHUB_WORKSPACE/aosp-clang"
          rm -f "$LLVM_ARCHIVE"
          echo "AOSP_CLANG_PATH=$GITHUB_WORKSPACE/aosp-clang" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/aosp-clang/bin/clang" --version | tee llvm-version.txt
          "$GITHUB_WORKSPACE/aosp-clang/bin/clang" --version | head -n1 | grep -Fq '20.1.0'

      - name: Materialize exact proven uplift engine
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$UPLIFT_ORCHESTRATOR_SHA"
          git cat-file -e "${UPLIFT_ORCHESTRATOR_SHA}^{commit}"

          # Materialize the exact workflow/scripts that produced successful uplift run #20.
          git show "$UPLIFT_ORCHESTRATOR_SHA:.github/workflows/ticwatch-max-lts-220-incremental-uplift.yml" \
            > .github/workflows/ticwatch-max-lts-220-incremental-uplift.yml
          git show "$UPLIFT_ORCHESTRATOR_SHA:.github/workflows/ticwatch-max-lts-220-incremental-uplift-v2.yml" \
            > /tmp/uplift-v2.yml
          for f in \
            ticwatch-uplift-v3-overlay.py \
            ticwatch-uplift-v3-resume-ledger.py \
            ticwatch-uplift-v3-ipv4-android.py \
            ticwatch-uplift-v3-lsm-default.py \
            ticwatch-uplift-v3-bpf-fork.py \
            ticwatch-uplift-v3-mptcp-join.py; do
            git show "$UPLIFT_ORCHESTRATOR_SHA:.github/scripts/$f" > "/tmp/$f"
          done
          git show "$UPLIFT_ORCHESTRATOR_SHA:ticwatch-ultimate/wear7-kernel-profile.sh" > /tmp/wear7-kernel-profile.sh
          git show "$UPLIFT_ORCHESTRATOR_SHA:ticwatch-ultimate/fix-ksu-safekey-ticwatch.sh" > /tmp/fix-ksu-safekey-ticwatch.sh
          chmod +x /tmp/wear7-kernel-profile.sh /tmp/fix-ksu-safekey-ticwatch.sh

          python3 <<'PY'
          from pathlib import Path
          src = Path('/tmp/uplift-v2.yml').read_text()
          def extract_run(step_name: str) -> str:
              ls = src.splitlines()
              marker = f'      - name: {step_name}'
              i = ls.index(marker)
              while i < len(ls) and ls[i].strip() != 'run: |':
                  i += 1
              if i == len(ls):
                  raise SystemExit(f'run block not found: {step_name}')
              i += 1
              out = []
              while i < len(ls):
                  line = ls[i]
                  if line.startswith('      - name: '):
                      break
                  if line and not line.startswith('          '):
                      raise SystemExit(f'unexpected indentation in {step_name}: {line!r}')
                  out.append(line[10:] if line else '')
                  i += 1
              return '\n'.join(out) + '\n'
          Path('/tmp/v2-build-scripts.sh').write_text(extract_run('Build ABI-aware scripts from proven workflow'))
          PY
          bash -n /tmp/v2-build-scripts.sh
          bash /tmp/v2-build-scripts.sh
          python3 /tmp/ticwatch-uplift-v3-overlay.py /tmp/uplift.sh
          python3 /tmp/ticwatch-uplift-v3-resume-ledger.py /tmp/uplift.sh
          python3 /tmp/ticwatch-uplift-v3-ipv4-android.py /tmp/uplift.sh
          python3 /tmp/ticwatch-uplift-v3-lsm-default.py /tmp/uplift.sh
          python3 /tmp/ticwatch-uplift-v3-bpf-fork.py /tmp/uplift.sh
          python3 /tmp/ticwatch-uplift-v3-mptcp-join.py /tmp/uplift.sh
          bash -n /tmp/prepare.sh
          bash -n /tmp/uplift.sh
          echo "UPLIFT_ENGINE_PINNED=$UPLIFT_ORCHESTRATOR_SHA"

      - name: Reproduce verified source uplift to 5.15.220
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf kernel .ticwatch-preflight/common
          bash /tmp/prepare.sh
          test -d kernel/.git
          git -C kernel cat-file -e "${BASE_KERNEL_SHA}^{commit}"
          git -C kernel cat-file -e "${AOSP_ASB_TIP}^{commit}"
          git -C kernel merge-base --is-ancestor "$BASE_KERNEL_SHA" HEAD
          git -C kernel merge-base --is-ancestor "$AOSP_ASB_TIP" HEAD
          test -z "$(git -C kernel status --porcelain)"
          printf '%s\n' 211 > kernel/.git/ticwatch-last-complete
          if git -C kernel remote get-url stable >/dev/null 2>&1; then
            git -C kernel remote remove stable
          fi
          bash /tmp/uplift.sh

          version="$(make -s -C kernel kernelversion)"
          [ "$version" = '5.15.220' ] || { echo "FAIL_FINAL_KERNELVERSION=$version" >&2; exit 64; }
          [ "$(cat kernel/.git/ticwatch-last-complete)" = '220' ] || { echo 'FAIL_FINAL_RESUME_POINT' >&2; exit 64; }
          test -z "$(git -C kernel status --porcelain)"
          UPLIFT_HEAD="$(git -C kernel rev-parse HEAD)"
          printf '%s\n' "$UPLIFT_HEAD" > lts-merged-head.txt
          echo "FINAL_LTS=$version"
          echo "UPLIFT_FINAL_HEAD=$UPLIFT_HEAD"

          mkdir -p .ticwatch-preflight
          mv kernel .ticwatch-preflight/common
          test -d .ticwatch-preflight/common/.git

      - name: Resume proven KSU Next and SuSFS integration
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- ticwatch-ultimate/preflight.sh
          sed -i \
            -e "s|^KSUN_MANAGER=.*|KSUN_MANAGER=\"$MANAGER_APK\"|" \
            -e "s|^KSUN_MANAGER_SHA256=.*|KSUN_MANAGER_SHA256=\"$MANAGER_APK_SHA256\"|" \
            ticwatch-ultimate/preflight.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ticwatch-ultimate/preflight.sh')
          s=p.read_text()
          old='''mkdir -p "$(dirname "$REPORT")"\nrm -rf "$ROOT"\nmkdir -p "$ROOT"\n: > "$REPORT"\n'''
          new='''mkdir -p "$(dirname "$REPORT")"\n[ -d "$ROOT/common/.git" ] || { echo "FAIL: verified 5.15.220 common tree missing" >&2; exit 1; }\n: >> "$REPORT"\n'''
          if s.count(old) != 1:
              raise SystemExit('preflight resume anchor changed')
          s=s.replace(old,new,1)
          start=s.index('log "TicWatch Ultimate 5.15 / KernelSU Next v3.3.0 + SuSFS v2.2.0 preflight"')
          end=s.index('log "[2/11] Fetch exact KernelSU Next v3.3.0 source"')
          intro='''log "TicWatch FINAL 5.15.220 / KSU Next 3.3.0 + SuSFS 2.2.0"\nlog "REUSE_VERIFIED_INCREMENTAL_UPLIFT=1"\nlog ""\n'''
          p.write_text(s[:start] + intro + s[end:])
          PY
          bash ticwatch-ultimate/preflight.sh
          grep -Fqx 'RESULT=PASS' ticwatch-ultimate-results/preflight.txt
          test "$(make -s -C .ticwatch-preflight/common kernelversion)" = '5.15.220'
          echo 'KSU_SUSFS_PREFLIGHT_RESULT=PASS'

      - name: Apply proven KSU SuSFS Seccomp and hardened SafeKey fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ticwatch-ultimate/fix-ksun330-susfs-first-zygote.sh
          python3 - <<'PY'
          from pathlib import Path

          p=Path('.ticwatch-preflight/common/KernelSU-Next/kernel/hook/setuid_hook.c')
          s=p.read_text()
          old='''    if (likely(ksu_is_manager_appid_valid()) && unlikely(is_uid_manager(ruid))) {\n        disable_seccomp();\n        pr_info("install fd for manager: %d\\n", ruid);\n        ksu_install_fd();\n        return 0;\n    }\n'''
          new='''    if (likely(ksu_is_manager_appid_valid()) && unlikely(is_uid_manager(ruid))) {\n        /* Keep Android seccomp FILTER; allow only the KSU reboot supercall. */\n        if (current->seccomp.mode == SECCOMP_MODE_FILTER && current->seccomp.filter) {\n            spin_lock_irq(&current->sighand->siglock);\n            ksu_seccomp_allow_cache(current->seccomp.filter, __NR_reboot);\n            spin_unlock_irq(&current->sighand->siglock);\n        }\n        pr_info("install fd for manager: %d\\n", ruid);\n        ksu_install_fd();\n        return 0;\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit('seccomp manager anchor changed')
          p.write_text(s.replace(old,new,1))

          p=Path('.ticwatch-preflight/common/KernelSU-Next/userspace/ksud/src/susfsd.rs')
          s=p.read_text()
          old='use libc::{syscall, SYS_reboot, c_char};'
          if old not in s:
              raise SystemExit('ARM32 susfs import anchor changed')
          s=s.replace(old,'use libc::{syscall, SYS_reboot, c_char, c_long};',1)
          repl={
            'syscall(SYS_reboot, KSU_INSTALL_MAGIC1, SUSFS_MAGIC, CMD_SUSFS_SHOW_VERSION, &mut cmd as *mut _);':'syscall(SYS_reboot as c_long, KSU_INSTALL_MAGIC1 as c_long, SUSFS_MAGIC as c_long, CMD_SUSFS_SHOW_VERSION as c_long, &mut cmd as *mut _);',
            'syscall(SYS_reboot, KSU_INSTALL_MAGIC1, SUSFS_MAGIC, CMD_SUSFS_SHOW_VARIANT, &mut cmd as *mut _);':'syscall(SYS_reboot as c_long, KSU_INSTALL_MAGIC1 as c_long, SUSFS_MAGIC as c_long, CMD_SUSFS_SHOW_VARIANT as c_long, &mut cmd as *mut _);',
            'syscall(SYS_reboot, KSU_INSTALL_MAGIC1, SUSFS_MAGIC, CMD_SUSFS_SHOW_ENABLED_FEATURES, &mut cmd as *mut _);':'syscall(SYS_reboot as c_long, KSU_INSTALL_MAGIC1 as c_long, SUSFS_MAGIC as c_long, CMD_SUSFS_SHOW_ENABLED_FEATURES as c_long, &mut cmd as *mut _);'
          }
          for a,b in repl.items():
              if a not in s:
                  raise SystemExit('ARM32 susfs syscall anchor changed')
              s=s.replace(a,b,1)
          p.write_text(s)
          PY

          bash /tmp/fix-ksu-safekey-ticwatch.sh .ticwatch-preflight/common/KernelSU-Next/kernel
          F=.ticwatch-preflight/common/KernelSU-Next/kernel/runtime/ksud_integration.c
          grep -Fq 'DEFINE_STATIC_KEY_TRUE(is_first_zygote);' "$F"
          grep -Fq 'static_branch_disable(&is_first_zygote);' "$F"
          grep -Fq '(*code == KEY_VOLUMEDOWN || *code == KEY_MENU)' "$F"
          grep -Fq 'if (val == 1)' "$F"
          echo 'KSU_SAFEKEY_HARDENED=PASS'

      - name: Keep proven Slatecom PM fix
        shell: bash
        run: |
          set -Eeuo pipefail
          K=.ticwatch-preflight/common
          cat > "$K/kernel/slatecom_pm_nowarn.c" <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/init.h>
          #include <linux/kernel.h>
          #include <linux/kprobes.h>
          #include <linux/suspend.h>
          #include <linux/workqueue.h>
          #include <asm/ptrace.h>
          #define SLATECOM_SYMBOL       "slatecom_pm_notifier"
          #define SLATECOM_PROBE_OFF    0xf8UL
          #define SLATECOM_RETURN_OFF   0x74UL
          #define SLATECOM_OPCODE_MOV   0x52800029U
          #define SLATECOM_MAX_RETRIES  120
          static bool slatecom_armed;
          static bool slatecom_terminal;
          static unsigned int slatecom_retries;
          static int __kprobes slatecom_nowarn_pre(struct kprobe *p, struct pt_regs *regs)
          {
              unsigned long event = regs->regs[19];
              if (event != PM_SUSPEND_PREPARE && event != PM_POST_SUSPEND) return 0;
              instruction_pointer_set(regs, (unsigned long)p->addr - (SLATECOM_PROBE_OFF - SLATECOM_RETURN_OFF));
              return 1;
          }
          static struct kprobe slatecom_kp = {
              .symbol_name = SLATECOM_SYMBOL,
              .offset = SLATECOM_PROBE_OFF,
              .pre_handler = slatecom_nowarn_pre,
          };
          static void slatecom_arm_workfn(struct work_struct *work);
          static DECLARE_DELAYED_WORK(slatecom_arm_work, slatecom_arm_workfn);
          static void slatecom_arm_workfn(struct work_struct *work)
          {
              int ret;
              if (slatecom_armed || slatecom_terminal) return;
              ret = register_kprobe(&slatecom_kp);
              if (ret == -ENOENT) {
                  if (++slatecom_retries < SLATECOM_MAX_RETRIES) schedule_delayed_work(&slatecom_arm_work, HZ / 4 ?: 1);
                  else { slatecom_terminal = true; pr_warn("slatecom_pm_nowarn: target symbol not found; inactive\n"); }
                  return;
              }
              if (ret) { slatecom_terminal = true; pr_warn("slatecom_pm_nowarn: register_kprobe failed: %d\n", ret); return; }
              if ((u32)slatecom_kp.opcode != SLATECOM_OPCODE_MOV) {
                  u32 got=(u32)slatecom_kp.opcode;
                  unregister_kprobe(&slatecom_kp);
                  slatecom_terminal=true;
                  pr_warn("slatecom_pm_nowarn: vendor signature mismatch opcode=0x%08x; inactive\n", got);
                  return;
              }
              slatecom_armed=true;
              pr_info("slatecom_pm_nowarn: armed %s+0x%lx for PM events 3/4\n", SLATECOM_SYMBOL, SLATECOM_PROBE_OFF);
          }
          static int __init slatecom_nowarn_init(void)
          {
              schedule_delayed_work(&slatecom_arm_work, 0);
              return 0;
          }
          late_initcall(slatecom_nowarn_init);
          EOF
          grep -Fq 'slatecom_pm_nowarn.o' "$K/kernel/Makefile" || printf '\n# TicWatch Mobvoi slatecom PM notifier quirk\nobj-y += slatecom_pm_nowarn.o\n' >> "$K/kernel/Makefile"

      - name: Configure Wear7-ready final kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          rm -rf out
          sed -i 's/ -dirty//g' scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' scripts/setlocalversion
          export ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export PATH="$AOSP_CLANG_PATH/bin:$PATH" LLVM=1 LLVM_IAS=1
          export KBUILD_BUILD_VERSION=0 KBUILD_BUILD_USER='XinRan♡' KBUILD_BUILD_HOST='Bai'
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC=clang BUILD_CONFIG=build.config.gki.aarch64 O=out DEPMOD=depmod gki_defconfig
          scripts/config --file out/.config -e LTO_CLANG -d LTO_NONE -e LTO_CLANG_THIN -d LTO_CLANG_FULL -e THINLTO
          bash /tmp/wear7-kernel-profile.sh "$PWD" "$PWD/out/.config"
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC=clang O=out olddefconfig

          grep -Fqx 'CONFIG_KSU=y' out/.config
          grep -Fqx 'CONFIG_KSU_SUSFS=y' out/.config
          grep -Fqx 'CONFIG_SECCOMP=y' out/.config
          grep -Fqx 'CONFIG_SECCOMP_FILTER=y' out/.config
          grep -Fqx 'CONFIG_MODVERSIONS=y' out/.config
          grep -Fqx 'CONFIG_COMPAT=y' out/.config
          grep -Fqx 'CONFIG_KEXEC=y' out/.config
          grep -Fqx '# CONFIG_KEXEC_FILE is not set' out/.config
          grep -Fqx '# CONFIG_KEXEC_SIG is not set' out/.config || true
          grep -Fqx 'CONFIG_LRU_GEN=y' out/.config
          grep -Fqx 'CONFIG_LRU_GEN_ENABLED=y' out/.config
          grep -Fqx 'CONFIG_DEFAULT_BBR=y' out/.config
          grep -Fqx 'CONFIG_NET_SCH_FQ=y' out/.config
          grep -Fqx 'CONFIG_PSTORE=y' out/.config
          grep -Fqx 'CONFIG_PSTORE_RAM=y' out/.config
          grep -Fqx 'CONFIG_PSTORE_CONSOLE=y' out/.config
          grep -Fqx 'CONFIG_PSTORE_PMSG=y' out/.config
          cp out/.config "$GITHUB_WORKSPACE/final.config"
          echo 'FINAL_CONFIG_AUDIT=PASS'

      - name: Compile real 5.15.220 kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          export ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export PATH="$AOSP_CLANG_PATH/bin:$PATH" LLVM=1 LLVM_IAS=1
          export KCFLAGS='-Wno-error -Wno-deprecated-declarations'
          export KBUILD_BUILD_VERSION=0 KBUILD_BUILD_USER='XinRan♡' KBUILD_BUILD_HOST='Bai'
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            KSU_NEXT_MANAGER_SIZE="$KSU_NEXT_MANAGER_SIZE" KSU_NEXT_MANAGER_HASH="$KSU_NEXT_MANAGER_HASH" \
            2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"
          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          test -s out/System.map
          test -s out/Module.symvers
          nm out/vmlinux | grep -Fq 'slatecom_nowarn_init'
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image"
          cp out/System.map "$GITHUB_WORKSPACE/System.map"
          cp out/Module.symvers "$GITHUB_WORKSPACE/Module.symvers"
          make -s O=out ARCH=arm64 kernelrelease | tee "$GITHUB_WORKSPACE/kernelrelease.txt"
          release="$(cat "$GITHUB_WORKSPACE/kernelrelease.txt")"
          case "$release" in ${EXPECTED_UTS_PREFIX}*) ;; *) echo "Unexpected release: $release" >&2; exit 1;; esac
          echo 'REAL_KERNEL_BUILD=PASS'

      - name: Static modversions and artifact audit
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s Image
          test -s Module.symvers
          grep -Fqx 'CONFIG_MODVERSIONS=y' final.config
          awk 'NF < 4 { bad=1 } END { exit bad ? 1 : 0 }' Module.symvers
          symvers_lines="$(wc -l < Module.symvers | tr -d ' ')"
          [ "$symvers_lines" -gt 1000 ] || { echo "Suspicious Module.symvers size: $symvers_lines" >&2; exit 1; }
          cat > kmi-static-audit.txt <<EOF
          CONFIG_MODVERSIONS=PASS
          MODULE_SYMVERS_LINES=$symvers_lines
          KERNEL_RELEASE=$(cat kernelrelease.txt)
          UPLIFT_ORCHESTRATOR_SHA=$UPLIFT_ORCHESTRATOR_SHA
          UPLIFT_SOURCE_HEAD=$(cat lts-merged-head.txt)
          NOTE=Stock vendor .ko CRC compatibility still requires dedicated comparison/runtime validation before flash.
          EOF
          cat kmi-static-audit.txt

      - name: Package final candidate without flashing
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bundle/wireless-flasher bundle/audit anykernel
          cp Image bundle/wireless-flasher/Image
          cp previous/wireless-flasher/busybox bundle/wireless-flasher/busybox
          cp previous/wireless-flasher/magiskboot bundle/wireless-flasher/magiskboot
          cp previous/wireless-flasher/flash.sh bundle/wireless-flasher/flash.sh
          chmod 0755 bundle/wireless-flasher/*
          IMAGE_SHA="$(sha256sum Image | awk '{print $1}')"
          python3 - "$IMAGE_SHA" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('bundle/wireless-flasher/flash.sh')
          s=p.read_text(); sha=sys.argv[1]
          s,n=re.subn(r'^EXPECTED_IMAGE_SHA="[0-9a-f]+"$',f'EXPECTED_IMAGE_SHA="{sha}"',s,count=1,flags=re.M)
          if n != 1: raise SystemExit('flasher SHA anchor missing')
          s,n=re.subn(r'^EXPECTED_RELEASE_PREFIX="[^"]+"$','EXPECTED_RELEASE_PREFIX="5.15.220-Xinran_StarBai-Test"',s,count=1,flags=re.M)
          if n != 1: raise SystemExit('flasher release anchor missing')
          p.write_text(s)
          PY
          sh -n bundle/wireless-flasher/flash.sh
          (cd bundle/wireless-flasher && sha256sum Image busybox magiskboot flash.sh > SHA256SUMS && sha256sum -c SHA256SUMS)

          unzip -q "previous/$PREVIOUS_ANYKERNEL" -d anykernel
          cp Image anykernel/Image
          (cd anykernel && zip -qr9 "$GITHUB_WORKSPACE/TicWatch-MAX-LTS-5.15.220-FINAL-CANDIDATE.zip" .)
