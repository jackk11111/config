name: Wear7 AOSP17 otatools locator

on:
  workflow_dispatch:
  push:
    branches: [wear7-rom-staging]
    paths: ['.github/workflows/wear7-aosp17-otatools-locator.yml']

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect public Android CI branch-grid frontend and API
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          BASE='https://ci.android.com'
          PAGE="$BASE/builds/branches/aosp-android-latest-release/grid"
          curl -fLsS "$PAGE" -o out/grid.html
          CACHE=$(sed -n 's/.*grid_page_bin_mashed.js?c=\([0-9]*\).*/\1/p' out/grid.html | head -n1)
          test -n "$CACHE"
          JS="$BASE/public_builds/elements/grid_page/grid_page_bin_mashed.js?c=$CACHE"
          curl -fLsS "$JS" -o out/grid.js
          echo "CACHE=$CACHE" | tee out/frontend.txt
          echo "JS_BYTES=$(wc -c < out/grid.js)" | tee -a out/frontend.txt
          grep -Eo '.{0,100}(fetch|xhr|XMLHttpRequest|builds/branches|public_builds|branch[^ ]{0,80}).{0,180}' out/grid.js | head -n 1000 > out/api_strings.txt || true
          grep -Eo '/[^"'\'' ]{3,200}' out/grid.js | sort -u | grep -E '(build|branch|target|grid|api)' | head -n 500 > out/path_strings.txt || true
          cat out/api_strings.txt
          echo '--- PATHS ---'
          cat out/path_strings.txt

      - name: Upload locator report
        uses: actions/upload-artifact@v4
        with:
          name: Wear7-AOSP17-Otatools-Locator
          path: out/
          retention-days: 7
