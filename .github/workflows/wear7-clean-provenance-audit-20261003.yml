name: Wear7 clean provenance audit

on:
  push:
    branches: [wear7-clean-rebuild-20261003]
    paths:
      - '.github/workflows/wear7-clean-provenance-audit-20261003.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIXEL_FILE: solios-cp2a.260603.001.s1-factory-d203665c.zip
  PIXEL_SHA256: d203665c90bc06bf175dbb3cbd7fcc9d212c056a030f9c51b541129e8651fb7d
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d
  DIAG3_SHA256: 75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare tools and workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip e2fsprogs erofs-utils file binutils android-sdk-libsparse-utils >/dev/null
          W="$RUNNER_TEMP/w7clean"
          mkdir -p "$W/src" "$W/tools" "$W/pixel" "$W/tic" "$W/diag" "$W/mnt" report
          ZIP="$W/tools/otatools.zip"
          curl -fL --retry 3 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          echo 'f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84  '"$ZIP" | sha256sum -c -
          python3 - "$ZIP" "$W/tools/x" <<'PY'
          import pathlib,sys,zipfile
          z=zipfile.ZipFile(sys.argv[1]); out=pathlib.Path(sys.argv[2]).resolve()
          wanted={'bin/lpunpack','bin/simg2img'}
          names=set(z.namelist()); missing=wanted-names
          if missing: raise SystemExit('missing tools: '+','.join(sorted(missing)))
          for n in z.namelist():
              if n in wanted or n.startswith(('lib64/','lib/')):
                  p=(out/n).resolve()
                  if not p.is_relative_to(out): raise SystemExit('unsafe')
                  z.extract(n,out)
          PY
          chmod +x "$W/tools/x/bin/"*
          echo "W=$W" >> "$GITHUB_ENV"
          echo "HOST=$W/tools/x" >> "$GITHUB_ENV"

      - name: Download hash-locked source images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd "$W/src"
          curl -fL --retry 3 --retry-delay 2 -o "$PIXEL_FILE" "https://dl.google.com/dl/android/aosp/$PIXEL_FILE"
          echo "$PIXEL_SHA256  $PIXEL_FILE" | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 -o ticwatch379.zip "$TIC_URL"
          echo "$TIC_SHA256  ticwatch379.zip" | sha256sum -c -
          mkdir -p diagparts
          gh release download wear7-diag3-final-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' --dir diagparts
          cat diagparts/super_WEAR7_V11_DIAG3_FINAL.img.part* > diag3.img
          echo "$DIAG3_SHA256  diag3.img" | sha256sum -c -
          sha256sum "$PIXEL_FILE" ticwatch379.zip diag3.img | tee "$GITHUB_WORKSPACE/report/SOURCE_SHA256.txt"

      - name: Extract Pixel Wear7 logical sources
        shell: bash
        run: |
          set -Eeuo pipefail
          F="$W/src/$PIXEL_FILE"
          nested=$(unzip -Z1 "$F" | grep -E '(^|/)image-[^/]+\.zip$' | head -n1)
          test -n "$nested"
          unzip -p "$F" "$nested" > "$W/pixel-inner.zip"
          for p in system system_ext product; do
            unzip -p "$W/pixel-inner.zip" "$p.img" > "$W/pixel/$p.input"
            magic=$(od -An -tx4 -N4 "$W/pixel/$p.input" | tr -d ' \n')
            if [ "$magic" = ed26ff3a ]; then "$HOST/bin/simg2img" "$W/pixel/$p.input" "$W/pixel/$p.img"; else mv "$W/pixel/$p.input" "$W/pixel/$p.img"; fi
            file "$W/pixel/$p.img" | tee -a report/FILESYSTEMS.txt
          done

      - name: Reconstruct exact TicWatch379 logical sources
        shell: bash
        run: |
          set -Eeuo pipefail
          OTA="$W/src/ticwatch379.zip"
          for p in system system_ext product vendor vendor_dlkm system_dlkm; do
            python3 wear7/scripts/reconstruct_block_ota.py "$OTA" "$p" "$W/tic/$p.img"
            printf 'tic_%s\t%s\t%s\n' "$p" "$(stat -c %s "$W/tic/$p.img")" "$(sha256sum "$W/tic/$p.img" | awk '{print $1}')" | tee -a report/PARTITION_SHA256.tsv
          done

      - name: Unpack exact DIAG3
        shell: bash
        run: |
          set -Eeuo pipefail
          "$HOST/bin/simg2img" "$W/src/diag3.img" "$W/diag/super.raw"
          test "$(stat -c %s "$W/diag/super.raw")" = 4294967296
          "$HOST/bin/lpunpack" "$W/diag/super.raw" "$W/diag"
          rm -f "$W/diag/super.raw"
          for p in system system_ext product vendor vendor_dlkm system_dlkm; do
            printf 'diag_%s\t%s\t%s\n' "$p" "$(stat -c %s "$W/diag/$p.img")" "$(sha256sum "$W/diag/$p.img" | awk '{print $1}')" | tee -a report/PARTITION_SHA256.tsv
          done

      - name: Mount all comparable partitions read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          mount_one(){ img=$1 dir=$2; mkdir -p "$dir"; t=$(blkid -s TYPE -o value "$img" || true); case "$t" in ext4) sudo mount -o loop,ro,noload "$img" "$dir";; erofs) sudo mount -t erofs -o loop,ro "$img" "$dir";; *) echo "unsupported:$img:$t"; exit 2;; esac; }
          for p in system system_ext product; do mount_one "$W/pixel/$p.img" "$W/mnt/pixel-$p"; done
          for p in system system_ext product vendor vendor_dlkm system_dlkm; do mount_one "$W/tic/$p.img" "$W/mnt/tic-$p"; mount_one "$W/diag/$p.img" "$W/mnt/diag-$p"; done

      - name: File-by-file provenance classification
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo python3 - "$W" "$GITHUB_WORKSPACE/report" <<'PY'
          import os,sys,hashlib,pathlib,collections
          W=pathlib.Path(sys.argv[1]); R=pathlib.Path(sys.argv[2])
          parts=['system','system_ext','product','vendor']
          def sig(p):
              try:
                  if p.is_symlink(): return ('L',os.readlink(p))
                  if p.is_file():
                      h=hashlib.sha256()
                      with open(p,'rb') as f:
                          for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
                      return ('F',h.hexdigest(),p.stat().st_size)
              except Exception as e: return ('E',repr(e))
              return None
          summary={}
          with (R/'PROVENANCE.tsv').open('w') as out:
              out.write('partition\tclass\tpath\n')
              for part in parts:
                  D=W/'mnt'/f'diag-{part}'; P=W/'mnt'/f'pixel-{part}'; T=W/'mnt'/f'tic-{part}'
                  c=collections.Counter()
                  for root,dirs,files in os.walk(D,followlinks=False):
                      rp=pathlib.Path(root)
                      names=list(files)+[d for d in dirs if (rp/d).is_symlink()]
                      for n in names:
                          q=rp/n; rel=q.relative_to(D); ds=sig(q); ps=sig(P/rel) if P.exists() else None; ts=sig(T/rel)
                          pe=(ds is not None and ds==ps); te=(ds is not None and ds==ts)
                          if pe and te: cls='PIXEL_AND_TIC_EXACT'
                          elif pe: cls='PIXEL_EXACT'
                          elif te: cls='TIC_EXACT'
                          elif ps is not None and ts is not None: cls='MODIFIED_FROM_BOTH'
                          elif ps is not None: cls='MODIFIED_FROM_PIXEL'
                          elif ts is not None: cls='MODIFIED_FROM_TIC'
                          else: cls='CUSTOM_ADDED'
                          c[cls]+=1; out.write(f'{part}\t{cls}\t/{part}/{rel.as_posix()}\n')
                  summary[part]=c
          with (R/'PROVENANCE_SUMMARY.txt').open('w') as out:
              for p,c in summary.items():
                  out.write('['+p+']\n')
                  for k,v in sorted(c.items()): out.write(f'{k}={v}\n')
          PY
          cat report/PROVENANCE_SUMMARY.txt
          awk -F '\t' '$2=="CUSTOM_ADDED" || $2 ~ /^MODIFIED_/ {print}' report/PROVENANCE.tsv > report/PROVENANCE_NONBASE.tsv
          wc -l report/PROVENANCE_NONBASE.tsv

      - name: Scan custom integration fingerprints
        shell: bash
        run: |
          set -Eeuo pipefail
          : > report/CUSTOM_FINGERPRINTS.txt
          for p in system system_ext product vendor; do
            D="$W/mnt/diag-$p"
            echo "===== $p NAMES =====" >> report/CUSTOM_FINGERPRINTS.txt
            sudo find "$D" -xdev \( -type f -o -type l \) -printf '%P\n' 2>/dev/null | grep -iE 'gemini|assistant|kernelsu|ksu|susfs|brene|wear7|diag|marker|ticwatch|dace|wireless|root' >> report/CUSTOM_FINGERPRINTS.txt || true
            echo "===== $p INIT/PROP CONTENT =====" >> report/CUSTOM_FINGERPRINTS.txt
            sudo grep -RInaE 'Gemini|wearable\.assistant|KernelSU|SuSFS|BRENE|wear7-v11|stage-marker|ticwatch|dace|wireless|adb\.tcp|load_dlkm|cold_boot' "$D/etc" "$D/system/etc" "$D/vendor/etc" 2>/dev/null | head -n 2000 >> report/CUSTOM_FINGERPRINTS.txt || true
          done
          sed -n '1,300p' report/CUSTOM_FINGERPRINTS.txt

      - name: Audit vendor identity, module ABI and load lists
        shell: bash
        run: |
          set -Eeuo pipefail
          V="$W/mnt/diag-vendor"; K="$W/mnt/diag-vendor_dlkm"
          {
            echo '===== VENDOR BUILD PROPS ====='
            sudo grep -RhsE '^(ro\.(product|vendor|board|hardware|soc)|ro\.build\.fingerprint|ro\.vendor\.build)' "$V"/*build.prop "$V"/etc/*prop* 2>/dev/null | sort -u || true
            echo '===== VINTF DEVICE MANIFESTS ====='
            sudo grep -RhnE '<manifest|target-level=|<name>|<version>' "$V/etc/vintf" 2>/dev/null | head -n 800 || true
          } > report/VENDOR_IDENTITY.txt
          : > report/MODULE_VERMAGIC.txt
          while IFS= read -r -d '' f; do
            v=$(strings "$f" 2>/dev/null | grep -m1 '^vermagic=' || true)
            printf '%s\t%s\n' "${f#$K/}" "$v" >> report/MODULE_VERMAGIC.txt
          done < <(sudo find "$K" -type f -name '*.ko' -print0 2>/dev/null)
          cut -f2 report/MODULE_VERMAGIC.txt | sort | uniq -c > report/MODULE_VERMAGIC_UNIQUE.txt
          sudo find "$K" -type f \( -name 'modules.load*' -o -name 'modules.dep*' -o -name 'modules.alias*' \) -print -exec sh -c 'echo ---$1; cat "$1"' _ {} \; > report/MODULE_LOAD_METADATA.txt 2>/dev/null || true
          cat report/MODULE_VERMAGIC_UNIQUE.txt

      - name: Audit firmware and RFS symlinks
        shell: bash
        run: |
          set -Eeuo pipefail
          V="$W/mnt/diag-vendor"
          : > report/FIRMWARE_SYMLINKS.tsv
          : > report/FIRMWARE_BROKEN_OFFLINE.tsv
          while IFS= read -r -d '' f; do
            t=$(readlink "$f")
            printf '%s\t%s\n' "${f#$V}" "$t" >> report/FIRMWARE_SYMLINKS.tsv
            if ! sudo test -e "$f"; then printf '%s\t%s\n' "${f#$V}" "$t" >> report/FIRMWARE_BROKEN_OFFLINE.tsv; fi
          done < <(sudo find "$V" -type l \( -path '*/firmware/*' -o -path '*/rfs/*' \) -print0 2>/dev/null)
          echo "SYMLINKS=$(wc -l < report/FIRMWARE_SYMLINKS.tsv)"
          echo "BROKEN_OFFLINE=$(wc -l < report/FIRMWARE_BROKEN_OFFLINE.tsv)"
          cat report/FIRMWARE_BROKEN_OFFLINE.tsv

      - name: Extract high-value non-base changes
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Ei '(/etc/init/|/etc/vintf/|/etc/selinux/|build\.prop|prop\.default|ueventd|fstab|apex|gemini|assistant|dace|ticwatch|marker|dlkm)' report/PROVENANCE_NONBASE.tsv > report/HIGH_VALUE_NONBASE.tsv || true
          sed -n '1,500p' report/HIGH_VALUE_NONBASE.tsv

      - name: Cleanup mounts
        if: always()
        shell: bash
        run: |
          set +e
          for d in "$W"/mnt/*; do sudo umount "$d" 2>/dev/null || true; done
          sudo chown -R "$(id -u):$(id -g)" report 2>/dev/null || true

      - name: Upload provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wear7-Clean-Provenance-Audit-20261003
          path: report/
          if-no-files-found: error
          retention-days: 60
          compression-level: 9
