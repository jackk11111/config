name: Wear7 final pre-recovery candidate V4 driver

on:
  workflow_dispatch:
  push:
    branches: [wear7-rom-staging]
    paths:
      - '.github/workflows/wear7-final-candidate-v4-driver.yml'

permissions:
  contents: read
  actions: read

env:
  PIXEL_FILE: solios-cp2a.260603.001.s1-factory-d203665c.zip
  PIXEL_SHA256: d203665c90bc06bf175dbb3cbd7fcc9d212c056a030f9c51b541129e8651fb7d
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d
  KERNEL_BUILD_TOOLS_SHA: 010d8a83d84ced4beef7779453766350db8c08cd
  KERNEL_RUN_ID: '35050732231'
  KERNEL_ARTIFACT: TicWatch-Wear7-Integration-Kernel-ADBRoot-V3
  KSU_RUN_ID: '34563994675'
  KSU_ARTIFACT: TicWatch-Ultimate-KSUNext-3.3.0-Spoofed-PAIRED
  KSU_MANAGER_SHA256: 8310faebd2b592ccddd6a15a6d996c70d89cd679eb51835e84d18f531471357b
  KSU_CERT_SHA256: 3bc9938c38106bcf618bbe1d37ad4adde8a49c659e2860709bbfc341f7e749f2
  KSU_CERT_SIZE: '962'
  KSUD_SHA256: c196de59c82030cf14f19c0b170d0ef09203370b533fcbf57dd0d3725d477dca
  SUPER_DEVICE_SIZE: '4294967296'
  DYNAMIC_GROUP_SIZE: '4284481536'
  SYSTEM_PARTITION_SIZE: '1741303808'
  SYSTEM_EXT_PARTITION_SIZE: '283598848'
  PRODUCT_PARTITION_SIZE: '1613258752'
  AVB_SALT: 29ee420fe79a48929c62ab7091d79c9575998f66d7f5e856987e7bbe578d5459
  BOOT_AVB_SALT: 8078f56b41ac2e6ebea1f428d5b574f02f57d480d916879b2b28628caed0e616

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: wear7-rom-staging
          fetch-depth: 1

      - name: Download verified Wear7 integration kernel V3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.KERNEL_ARTIFACT }}
          path: ${{ runner.temp }}/kernel-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.KERNEL_RUN_ID }}

      - name: Download exact paired KernelSU userspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.KSU_ARTIFACT }}
          path: ${{ runner.temp }}/ksu-paired
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.KSU_RUN_ID }}

      - name: Execute fail-closed V2 assembly run steps with V3 inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y python3-yaml >/dev/null
          python3 - <<'PY'
          import os, pathlib, subprocess, yaml

          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          wf = workspace / '.github/workflows/wear7-final-candidate-v2.yml'
          data = yaml.safe_load(wf.read_text())
          steps = data['jobs']['assemble']['steps']

          env = os.environ.copy()
          env_file = pathlib.Path(env['RUNNER_TEMP']) / 'v4-driver-github-env'
          path_file = pathlib.Path(env['RUNNER_TEMP']) / 'v4-driver-github-path'
          env_file.write_text('')
          path_file.write_text('')
          env['GITHUB_ENV'] = str(env_file)
          env['GITHUB_PATH'] = str(path_file)
          env_pos = 0
          path_pos = 0

          def absorb_env():
              global env_pos, path_pos
              text = env_file.read_text()
              chunk = text[env_pos:]
              env_pos = len(text)
              for line in chunk.splitlines():
                  if not line or '=' not in line:
                      continue
                  k, v = line.split('=', 1)
                  env[k] = v
              ptext = path_file.read_text()
              pchunk = ptext[path_pos:]
              path_pos = len(ptext)
              new_paths = [x for x in pchunk.splitlines() if x]
              if new_paths:
                  env['PATH'] = ':'.join(reversed(new_paths)) + ':' + env.get('PATH', '')

          executed = 0
          expression_marker = '$' + '{{'
          for idx, step in enumerate(steps, 1):
              script = step.get('run')
              if not script:
                  continue
              if expression_marker in script:
                  raise SystemExit(f'GitHub expression unexpectedly present in run step {idx}: {step.get("name")}')
              name = step.get('name', f'run-step-{idx}')
              print(f'\n===== V2 CORE STEP {idx}: {name} =====', flush=True)
              subprocess.run(['bash', '-Eeuo', 'pipefail', '-c', script], cwd=workspace, env=env, check=True)
              absorb_env()
              executed += 1

          if executed < 10:
              raise SystemExit(f'unexpectedly few run steps executed: {executed}')
          print(f'V2_CORE_RUN_STEPS_EXECUTED={executed}')
          PY

      - name: Add companion-agnostic pairing acceptance and pre-recovery gate
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=wear7-final-v2-candidate
          REP=wear7-final-v2-report
          test -s "$OUT/CANDIDATE_MANIFEST.txt"
          test -s "$OUT/super.img"
          cat >> "$OUT/CANDIDATE_MANIFEST.txt" <<'EOF'
          PAIRING_ACCEPTANCE_POLICY=ANY_WORKING_COMPANION
          PAIRING_PATH_ALLOWED=MOBVOI_OR_GOOGLE_PIXEL_WATCH_OR_OTHER_WORKING_COMPANION
          PHONE_DISCOVERY_RUNTIME_REQUIRED=YES
          BLUETOOTH_PAIRING_RUNTIME_REQUIRED=YES
          SETUP_WIZARD_COMPLETE_RUNTIME_REQUIRED=YES
          GOOGLE_ACCOUNT_TRANSFER_RUNTIME_REQUIRED=YES
          NOTIFICATION_BRIDGE_RUNTIME_REQUIRED=YES
          PHONE_WATCH_RECONNECT_AFTER_REBOOT_RUNTIME_REQUIRED=YES
          EOF
          cp "$OUT/CANDIDATE_MANIFEST.txt" "$REP/CANDIDATE_MANIFEST.txt"
          cat > "$REP/PRE_RECOVERY_GATE.txt" <<'EOF'
          WEAR7_OFFLINE_ASSEMBLY=PASS
          VERIFIED_KERNEL_V3=PASS
          KEXEC_RUNTIME_PROVEN_PREVIOUSLY=PASS
          STOCK379_KMI_337_OF_337=PASS
          ROOTED_CLEAN_WIPE_BOOTSTRAP=PASS_STATIC
          WIFI_ADB_TCP_5555=PASS_STATIC
          STAGE0_COMPATIBILITY_PAYLOAD=PASS
          VINTF_STATIC_EXACT_CONTRACT=PASS
          PAIRING_STATIC_PREP=PASS
          PAIRING_ACCEPTANCE_POLICY=ANY_WORKING_COMPANION
          AVB_UNLOCKED_BRINGUP=PASS_STATIC
          SUPER_GEOMETRY=PASS
          RECOVERY_ROLLBACK_READY_FOR_FIRST_WEAR7_FLASH=NO
          FIRST_WEAR7_FLASH=FORBIDDEN_UNTIL_RECOVERY_READY
          OFFICIAL_CHECKVINTF_FINAL_GATE=PENDING_SEPARATE_HOST_VERIFICATION
          EOF
          find "$REP" -maxdepth 1 -type f ! -name REPORT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$REP/REPORT_SHA256SUMS.txt"

      - name: Upload V4 final reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Wear7-Final-V4-Reports
          path: wear7-final-v2-report/
          retention-days: 30
          compression-level: 9

      - name: Upload V4 final bootchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: Wear7-Final-V4-Bootchain
          path: |
            wear7-final-v2-candidate/boot.img
            wear7-final-v2-candidate/init_boot.img
            wear7-final-v2-candidate/vendor_boot.img
            wear7-final-v2-candidate/dtbo.img
            wear7-final-v2-candidate/vbmeta.img
            wear7-final-v2-candidate/vbmeta_system.img
            wear7-final-v2-candidate/CANDIDATE_MANIFEST.txt
            wear7-final-v2-candidate/SHA256SUMS.txt
          retention-days: 30
          compression-level: 0

      - name: Upload V4 final super
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: Wear7-Final-V4-Super
          path: wear7-final-v2-candidate/super.img
          retention-days: 14
          compression-level: 0
