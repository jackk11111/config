name: Wear7 map ueventd prng
on: push
jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Map exact DIAG3 ueventd and prng
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p parts work/tools work/parts
          gh release download wear7-diag3-final-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' --dir parts
          cat parts/super_WEAR7_V11_DIAG3_FINAL.img.part* > work/super.img
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  work/super.img' | sha256sum -c -
          ZIP=work/tools/otatools.zip
          curl -fL --retry 3 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          python3 - "$ZIP" work/tools/extracted <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n.startswith(('bin/','lib64/','lib/')):
                      p=(out/n).resolve()
                      if not p.is_relative_to(out): raise SystemExit('unsafe')
                      z.extract(n,out)
          PY
          T="$PWD/work/tools/extracted"
          chmod +x "$T/bin/"*
          export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          simg2img work/super.img work/super.raw
          lpunpack work/super.raw work/parts
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs >/dev/null
          python3 - <<'PY'
          import subprocess, pathlib, hashlib
          sysimg=pathlib.Path('work/parts/system.img')
          raw=pathlib.Path('work/super.raw').read_bytes(); simg=sysimg.read_bytes(); bs=4096
          targets=[
            ('UEVENTD','/system/etc/init/hw/init.rc',b'start ueventd'),
            ('PRNG','/system/etc/init/prng_seeder.rc',b'start prng_seeder'),
          ]
          for name,path,pat in targets:
              dump=pathlib.Path(f'work/{name}.bin')
              subprocess.run(['debugfs','-R',f'dump {path} {dump}',str(sysimg)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              data=dump.read_bytes(); off=data.find(pat)
              print('NAME='+name); print('FILE='+path); print('FILE_OFFSET='+str(off))
              if off<0: raise SystemExit(name+': pattern missing')
              logical=off//bs; within=off%bs
              out=subprocess.check_output(['debugfs','-R',f'bmap {path} {logical}',str(sysimg)],stderr=subprocess.DEVNULL,text=True)
              fsblk=int(out.strip().splitlines()[-1])
              block=simg[fsblk*bs:(fsblk+1)*bs]
              hits=[]; pos=0
              while True:
                  i=raw.find(block,pos)
                  if i<0: break
                  hits.append(i); pos=i+1
              print('OFFSET_IN_BLOCK='+str(within))
              print('FS_BLOCK='+str(fsblk))
              print('BLOCK_SHA256='+hashlib.sha256(block).hexdigest())
              print('RAW_HITS='+str(hits))
              if len(hits)!=1 or hits[0]%bs: raise SystemExit(name+': ambiguous')
              print('RAW_BLOCK='+str(hits[0]//bs))
              print('RAW_OFFSET='+str(hits[0]))
              print('---')
          for path in ['/system/etc/init/ueventd.rc','/system/etc/init/prng_seeder.rc','/system/etc/init/hw/init.rc']:
              print('===== '+path+' =====')
              try:
                  out=subprocess.check_output(['debugfs','-R','cat '+path,str(sysimg)],stderr=subprocess.DEVNULL)
                  text=out.decode(errors='replace')
                  for line in text.splitlines():
                      if ('service ueventd ' in line or 'service prng_seeder ' in line or 'critical' in line or 'reboot_on_failure' in line or 'onrestart' in line):
                          print(line)
              except Exception as e:
                  print('READ_FAIL',e)
          print('RESULT=UEVENTD_PRNG_MAP_PASS')
          PY