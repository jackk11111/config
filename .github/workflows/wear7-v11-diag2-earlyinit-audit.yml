name: Wear7 V11 DIAG2 early-init audit

on:
  push:
    branches: [wear7-v11-diag2-earlyinit-audit]
    paths: ['.github/workflows/wear7-v11-diag2-earlyinit-audit.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          mkdir -p "$RUNNER_TEMP/audit/super" "$RUNNER_TEMP/audit/tools" "$RUNNER_TEMP/audit/parts" "$RUNNER_TEMP/audit/mnt" out

      - name: Download exact installed DIAG2 super
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-V11-DIAG2-Super
          path: ${{ runner.temp }}/audit/super
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '35444837392'

      - name: Extract exact partitions and early-init evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/audit"
          ZIP="$W/tools/otatools.zip"
          curl -fL --retry 2 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          echo "f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84  $ZIP" | sha256sum -c -
          python3 - "$ZIP" "$W/tools/extracted" <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n.startswith(('bin/','lib64/','lib/')):
                      p=(out/n).resolve()
                      if not p.is_relative_to(out): raise SystemExit('unsafe path')
                      z.extract(n,out)
          PY
          rm "$ZIP"
          chmod +x "$W/tools/extracted/bin/"*
          export PATH="$W/tools/extracted/bin:$PATH" LD_LIBRARY_PATH="$W/tools/extracted/lib64:$W/tools/extracted/lib"

          simg2img "$W/super/super.img" "$W/super.raw"
          lpunpack "$W/super.raw" "$W/parts"
          rm -f "$W/super.raw" "$W/super/super.img"

          for p in system system_ext vendor product; do
            mkdir -p "$W/mnt/$p"
            sudo mount -o loop,ro,noload "$W/parts/$p.img" "$W/mnt/$p"
          done

          python3 - "$W/mnt" out/EARLY_INIT_AUDIT.txt <<'PY'
          import pathlib,re,sys,os,hashlib
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          parts=['system','system_ext','vendor','product']
          lines=[]
          def add(s=''): lines.append(s)
          add('=== EXACT V11-DIAG2 EARLY-INIT AUDIT ===')
          add()
          for part in parts:
              base=root/part
              candidates=[]
              if part=='system':
                  candidates += [base/'system/etc/init/hw/init.rc']
                  initdir=base/'system/etc/init'
              else:
                  initdir=base/'etc/init'
              if initdir.is_dir():
                  candidates += sorted(initdir.glob('*.rc'))
              add(f'### {part.upper()} EARLY-INIT ACTIONS ###')
              found=0
              for f in candidates:
                  if not f.is_file(): continue
                  txt=f.read_text(errors='replace').splitlines()
                  i=0
                  while i < len(txt):
                      s=txt[i].strip()
                      if s.startswith('on ') and ('early-init' in s):
                          found+=1
                          add(f'FILE={f.relative_to(base)} LINE={i+1}')
                          add(txt[i])
                          j=i+1
                          while j < len(txt):
                              st=txt[j].strip()
                              if st.startswith('on ') or st.startswith('service ') or st.startswith('import '):
                                  break
                              add(txt[j])
                              j+=1
                          add('---')
                          i=j
                      else:
                          i+=1
              if not found: add('(none)')
              add()

          add('### UEVENTD SERVICE DEFINITIONS ###')
          for part in parts:
              base=root/part
              searchroot=(base/'system/etc/init') if part=='system' else (base/'etc/init')
              if not searchroot.exists(): continue
              for f in searchroot.rglob('*.rc'):
                  txt=f.read_text(errors='replace').splitlines()
                  for i,line in enumerate(txt):
                      if re.match(r'\s*service\s+ueventd\b',line):
                          add(f'FILE={part}/{f.relative_to(base)} LINE={i+1}')
                          j=i
                          while j<len(txt):
                              st=txt[j].strip()
                              if j>i and (st.startswith('service ') or st.startswith('on ') or st.startswith('import ')): break
                              add(txt[j]); j+=1
                          add('---')
          add()

          add('### UEVENTD BINARY ###')
          for p in [root/'system/system/bin/ueventd', root/'system/system/bin/init']:
              if p.exists() or p.is_symlink():
                  add(f'{p}: symlink={p.is_symlink()} target={os.readlink(p) if p.is_symlink() else ""}')
                  try:
                      data=p.resolve().read_bytes()
                      add(f'bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
                  except Exception as e: add(f'read_error={e}')
          add()

          add('### UEVENTD CONFIG FILES ###')
          for part in parts:
              base=root/part
              roots=[]
              if part=='system':
                  roots=[base/'system/etc']
              else:
                  roots=[base/'etc',base]
              seen=set()
              for rr in roots:
                  if not rr.exists(): continue
                  for f in rr.glob('ueventd*.rc'):
                      if f in seen: continue
                      seen.add(f)
                      add(f'FILE={part}/{f.relative_to(base)}')
                      content=f.read_text(errors='replace')
                      add(content[:30000])
                      add('---')

          out.write_text('\n'.join(lines)+'\n')
          PY

          for p in product vendor system_ext system; do sudo umount "$W/mnt/$p"; done
          cat out/EARLY_INIT_AUDIT.txt

      - name: Upload tiny audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-V11-DIAG2-EarlyInit-Audit
          path: out/
          if-no-files-found: error
          retention-days: 60
          compression-level: 9
