name: TicWatch MAX-LTS 5.15.220 Incremental Uplift V2

on:
  workflow_dispatch:
  push:
    branches:
      - ticwatch-max-lts-220-incremental
    paths:
      - '.github/workflows/ticwatch-max-lts-220-incremental-uplift-v2.yml'

permissions:
  contents: read

concurrency:
  group: ticwatch-max-lts-220-incremental-v2
  cancel-in-progress: true

jobs:
  uplift:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-max-lts-220-incremental

      - name: Build ABI-aware scripts from proven workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/ticwatch-max-lts-220-incremental-uplift.yml').read_text()

          def extract_run(step_name: str) -> str:
              ls = src.splitlines()
              marker = f'      - name: {step_name}'
              i = ls.index(marker)
              while i < len(ls) and ls[i].strip() != 'run: |':
                  i += 1
              if i == len(ls):
                  raise SystemExit(f'run block not found: {step_name}')
              i += 1
              out = []
              while i < len(ls):
                  line = ls[i]
                  if line.startswith('      - name: '):
                      break
                  if line and not line.startswith('          '):
                      raise SystemExit(f'unexpected indentation in {step_name}: {line!r}')
                  out.append(line[10:] if line else '')
                  i += 1
              return '\n'.join(out) + '\n'

          prepare = extract_run('Prepare exact TicWatch 5.15.211 + September ASB')
          uplift = extract_run('Apply missing stable commits with Android resolutions')

          start_marker = '    # 87177497 is a one-line security hardening'
          end_marker = '    if resolve_known_android_515212 '
          start = uplift.index(start_marker)
          end = uplift.index(end_marker, start)

          replacement = r'''    # Android intentionally merged around c1c74584 and its BPF prerequisite
              # chain because those changes break Android's frozen ABI. 87177497 is a
              # dependent follow-up, so there is no compatible storage-cookie target
              # in this ABI-preserving tree. Skip only this exact commit/file after
              # proving the official Android decision and expected layout.
              if [ "$tag" = 'v5.15.212' ] && [ "$c" = '87177497cca90bf4fcfb759eb898560eb5b46a10' ] && [ "$conflicts" = 'kernel/bpf/core.c' ]; then
                android_bpf_skip='dc37dbdfb169e0364a21abe482f909bb764afb31'
                git cherry-pick --abort
                git cat-file -e "${android_bpf_skip}^{commit}" || { echo "FAIL_ANDROID_BPF_SKIP_OBJECT=$android_bpf_skip" >&2; exit 47; }
                note="$(git show -s --format=%B "$android_bpf_skip")"
                grep -Fq 'due to abi breakages' <<< "$note" || { echo 'FAIL_ANDROID_BPF_SKIP_REASON' >&2; exit 47; }
                grep -Fq 'c1c74584b9b4 bpf: Fix oob access in cgroup local storage' <<< "$note" || { echo 'FAIL_ANDROID_BPF_SKIP_PREREQ' >&2; exit 47; }
                grep -Fq 'bool bpf_prog_array_compatible(struct bpf_array *array,' kernel/bpf/core.c || { echo 'FAIL_ANDROID_BPF_LAYOUT' >&2; exit 47; }
                if grep -Fq 'storage_cookie' include/linux/bpf.h || grep -Fq 'map->owner->storage_cookie' kernel/bpf/core.c; then
                  echo 'FAIL_ANDROID_BPF_UNEXPECTED_STABLE_LAYOUT' >&2
                  exit 47
                fi
                echo "ANDROID_ABI_SKIP_DEPENDENT_BPF=$c PREREQ_SKIPPED=c1c74584b9b4 OFFICIAL=$android_bpf_skip"
                continue
              fi

              # 5e6ec0ba7027 adds RTNL_FLAG_DUMP_UNLOCKED with value BIT(2).
              # The TicWatch/Android base keeps the older enum layout with
              # RTNL_FLAG_DOIT_UNLOCKED = 1 and without the bulk-delete flag,
              # so preserve that layout and apply only this commit's semantic delta.
              if [ "$tag" = 'v5.15.212' ] && [ "$c" = '5e6ec0ba70276c9d95a68768da20a7e427011bc0' ] && [ "$conflicts" = 'include/net/rtnetlink.h' ]; then
                f='include/net/rtnetlink.h'
                git checkout --ours -- "$f"
                python3 - "$f" <<'PYRTNL'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = "enum rtnl_link_flags {\n\tRTNL_FLAG_DOIT_UNLOCKED = 1,\n};"
          new = "enum rtnl_link_flags {\n\tRTNL_FLAG_DOIT_UNLOCKED = 1,\n\tRTNL_FLAG_DUMP_UNLOCKED = BIT(2),\n};"
          if s.count(old) != 1:
              start = s.find('enum rtnl_link_flags {')
              end = s.find('\n};', start)
              block = s[start:end + 3] if start >= 0 and end >= 0 else '<enum not found>'
              raise SystemExit('FAIL_RTNL_DUMP_UNLOCKED_LAYOUT:\n' + block)
          if 'RTNL_FLAG_DUMP_UNLOCKED' in s or 'RTNL_FLAG_BULK_DEL_SUPPORTED' in s:
              raise SystemExit('FAIL_RTNL_DUMP_UNLOCKED_UNEXPECTED_FLAGS')
          s = s.replace(old, new, 1)
          if any(x in s for x in ('<<<<<<<', '=======', '>>>>>>>')):
              raise SystemExit('FAIL_RTNL_DUMP_UNLOCKED_MARKERS')
          p.write_text(s)
          PYRTNL
                git add -- "$f"
                git diff --cached --check || exit 48
                git -c user.name='TicWatch LTS CI' -c user.email='ci@local' cherry-pick --continue || exit 48
                grep -Fq 'RTNL_FLAG_DUMP_UNLOCKED = BIT(2),' "$f" || exit 48
                echo "ANDROID_TICWATCH_RTNL_DUMP_UNLOCKED_RESOLVED=$c $f"
                continue
              fi

              # 2a2e5f7393b2 is officially merged by Android 13 5.15 LTS with
              # conflicts in these same two XFRM files. Preserve Android's
              # untranslated-format wrapper and apply only the upstream ABI guard.
              if [ "$tag" = 'v5.15.212' ] && [ "$c" = '2a2e5f7393b260944b18c019a9715da749114038' ] && [ "$conflicts" = $'net/xfrm/xfrm_state.c\nnet/xfrm/xfrm_user.c' ]; then
                sfile='net/xfrm/xfrm_state.c'
                ufile='net/xfrm/xfrm_user.c'
                git checkout --ours -- "$sfile" "$ufile"
                python3 - "$sfile" "$ufile" <<'PYXFRM'
          from pathlib import Path
          import sys

          targets = (
              (Path(sys.argv[1]), 'int xfrm_user_policy('),
              (Path(sys.argv[2]), 'static int xfrm_user_rcv_msg('),
          )
          outer = 'if (!IS_ENABLED(CONFIG_ANDROID) || IS_ENABLED(CONFIG_XFRM_USER_COMPAT)) {'
          old = 'if (in_compat_syscall()) {'
          new = 'if (IS_ENABLED(CONFIG_COMPAT_FOR_U64_ALIGNMENT) && in_compat_syscall()) {'

          for p, sig in targets:
              text = p.read_text()
              start = text.find(sig)
              if start < 0:
                  raise SystemExit(f'FAIL_XFRM_U64_GUARD_FUNCTION={p}:{sig}')
              end = text.find('\n}\n', start)
              if end < 0:
                  raise SystemExit(f'FAIL_XFRM_U64_GUARD_END={p}:{sig}')
              fn = text[start:end]
              if fn.count(outer) != 1:
                  raise SystemExit(f'FAIL_XFRM_U64_GUARD_ANDROID_WRAPPER={p}:count={fn.count(outer)}')
              if fn.count(old) != 1:
                  raise SystemExit(f'FAIL_XFRM_U64_GUARD_TARGET={p}:count={fn.count(old)}')
              if new in fn:
                  raise SystemExit(f'FAIL_XFRM_U64_GUARD_ALREADY_PRESENT={p}')
              fn = fn.replace(old, new, 1)
              text = text[:start] + fn + text[end:]
              if any(x in text for x in ('<<<<<<<', '=======', '>>>>>>>')):
                  raise SystemExit(f'FAIL_XFRM_U64_GUARD_MARKERS={p}')
              p.write_text(text)
          PYXFRM
                git add -- "$sfile" "$ufile"
                staged="$(git diff --cached --name-only | sort)"
                expected="$(printf '%s\n' "$sfile" "$ufile" | sort)"
                [ "$staged" = "$expected" ] || {
                  echo 'FAIL_XFRM_U64_GUARD_STAGED_FILES' >&2
                  printf 'EXPECTED:\n%s\nACTUAL:\n%s\n' "$expected" "$staged" >&2
                  exit 49
                }
                git diff --cached --check || exit 49
                git -c user.name='TicWatch LTS CI' -c user.email='ci@local' cherry-pick --continue || exit 49
                grep -Fq 'if (IS_ENABLED(CONFIG_COMPAT_FOR_U64_ALIGNMENT) && in_compat_syscall()) {' "$sfile" || exit 49
                grep -Fq 'if (IS_ENABLED(CONFIG_COMPAT_FOR_U64_ALIGNMENT) && in_compat_syscall()) {' "$ufile" || exit 49
                echo "ANDROID_TICWATCH_XFRM_U64_GUARD_RESOLVED=$c FILES=$sfile,$ufile"
                continue
              fi

          '''
          uplift = uplift[:start] + replacement + uplift[end:]

          Path('/tmp/prepare.sh').write_text(prepare)
          Path('/tmp/uplift.sh').write_text(uplift)
          PY
          bash -n /tmp/prepare.sh
          bash -n /tmp/uplift.sh

      - name: Prepare exact TicWatch 5.15.211 + September ASB
        shell: bash
        run: bash /tmp/prepare.sh

      - name: Apply missing stable commits with Android ABI-aware resolutions
        shell: bash
        run: bash /tmp/uplift.sh
