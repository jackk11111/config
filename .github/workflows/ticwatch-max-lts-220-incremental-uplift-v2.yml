name: TicWatch MAX-LTS 5.15.220 Incremental Uplift V2

on:
  workflow_dispatch:
  push:
    branches:
      - ticwatch-max-lts-220-incremental
    paths:
      - '.github/workflows/ticwatch-max-lts-220-incremental-uplift-v2.yml'

permissions:
  contents: read

concurrency:
  group: ticwatch-max-lts-220-incremental-v2
  cancel-in-progress: true

jobs:
  uplift:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-max-lts-220-incremental

      - name: Build ABI-aware scripts from proven workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/ticwatch-max-lts-220-incremental-uplift.yml').read_text()

          def extract_run(step_name: str) -> str:
              ls = src.splitlines()
              marker = f'      - name: {step_name}'
              i = ls.index(marker)
              while i < len(ls) and ls[i].strip() != 'run: |':
                  i += 1
              if i == len(ls):
                  raise SystemExit(f'run block not found: {step_name}')
              i += 1
              out = []
              while i < len(ls):
                  line = ls[i]
                  if line.startswith('      - name: '):
                      break
                  if line and not line.startswith('          '):
                      raise SystemExit(f'unexpected indentation in {step_name}: {line!r}')
                  out.append(line[10:] if line else '')
                  i += 1
              return '\n'.join(out) + '\n'

          prepare = extract_run('Prepare exact TicWatch 5.15.211 + September ASB')
          uplift = extract_run('Apply missing stable commits with Android resolutions')

          start_marker = '    # 87177497 is a one-line security hardening'
          end_marker = '    if resolve_known_android_515212 '
          start = uplift.index(start_marker)
          end = uplift.index(end_marker, start)

          replacement = r'''    # Android intentionally merged around c1c74584 and its BPF prerequisite
              # chain because those changes break Android's frozen ABI. 87177497 is a
              # dependent follow-up, so there is no compatible storage-cookie target
              # in this ABI-preserving tree. Skip only this exact commit/file after
              # proving the official Android decision and expected layout.
              if [ "$tag" = 'v5.15.212' ] && [ "$c" = '87177497cca90bf4fcfb759eb898560eb5b46a10' ] && [ "$conflicts" = 'kernel/bpf/core.c' ]; then
                android_bpf_skip='dc37dbdfb169e0364a21abe482f909bb764afb31'
                git cherry-pick --abort
                git cat-file -e "${android_bpf_skip}^{commit}" || { echo "FAIL_ANDROID_BPF_SKIP_OBJECT=$android_bpf_skip" >&2; exit 47; }
                note="$(git show -s --format=%B "$android_bpf_skip")"
                grep -Fq 'due to abi breakages' <<< "$note" || { echo 'FAIL_ANDROID_BPF_SKIP_REASON' >&2; exit 47; }
                grep -Fq 'c1c74584b9b4 bpf: Fix oob access in cgroup local storage' <<< "$note" || { echo 'FAIL_ANDROID_BPF_SKIP_PREREQ' >&2; exit 47; }
                grep -Fq 'bool bpf_prog_array_compatible(struct bpf_array *array,' kernel/bpf/core.c || { echo 'FAIL_ANDROID_BPF_LAYOUT' >&2; exit 47; }
                if grep -Fq 'storage_cookie' include/linux/bpf.h || grep -Fq 'map->owner->storage_cookie' kernel/bpf/core.c; then
                  echo 'FAIL_ANDROID_BPF_UNEXPECTED_STABLE_LAYOUT' >&2
                  exit 47
                fi
                echo "ANDROID_ABI_SKIP_DEPENDENT_BPF=$c PREREQ_SKIPPED=c1c74584b9b4 OFFICIAL=$android_bpf_skip"
                continue
              fi

          '''
          uplift = uplift[:start] + replacement + uplift[end:]

          Path('/tmp/prepare.sh').write_text(prepare)
          Path('/tmp/uplift.sh').write_text(uplift)
          PY
          bash -n /tmp/prepare.sh
          bash -n /tmp/uplift.sh

      - name: Prepare exact TicWatch 5.15.211 + September ASB
        shell: bash
        run: bash /tmp/prepare.sh

      - name: Apply missing stable commits with Android ABI-aware resolutions
        shell: bash
        run: bash /tmp/uplift.sh
