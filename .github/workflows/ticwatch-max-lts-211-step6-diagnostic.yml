name: TicWatch MAX-LTS 5.15.211 - Step 6 Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - ticwatch-max-lts-211
    paths:
      - '.github/workflows/ticwatch-max-lts-211-step6-diagnostic.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ticwatch-max-lts-211-step6-diagnostic
  cancel-in-progress: true

env:
  LLVM_VERSION: '20.1.0'
  LLVM_ARCHIVE: 'LLVM-20.1.0-Linux-X64.tar.xz'
  MANAGER_RUN_ID: '34563469731'
  MANAGER_ARTIFACT: 'KernelSU-Next-v3.3.0-Spoofed-TicWatch-armv7'
  MANAGER_APK: 'KernelSU_Next_v3.3.0-spoofed-TicWatch-armeabi-v7a-release.apk'
  MANAGER_APK_SHA256: '8310faebd2b592ccddd6a15a6d996c70d89cd679eb51835e84d18f531471357b'
  KSU_NEXT_MANAGER_SIZE: '0x3c2'
  KSU_NEXT_MANAGER_HASH: '3bc9938c38106bcf618bbe1d37ad4adde8a49c659e2860709bbfc341f7e749f2'
  BASE_KERNEL_SHA: '3929c55fbc7559af6df290d2c0f66dc551af161a'
  AOSP_LTS_TIP: '7dfb6fc41ea7e4dd2c49fffcba48e86979ad5508'
  EXPECTED_MERGE_BASE: 'fc88a7504f0f262cc5b2e8a7f58b2a1108034856'

jobs:
  step6-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout MAX-LTS orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-max-lts-211

      - name: Free space and install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc python3 python-is-python3 \
            libssl-dev libelf-dev dwarves make cmake zip unzip curl wget \
            gnupg gawk gcc-multilib g++-multilib ccache rsync file \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf >/dev/null

      - name: Retrieve exact crowned spoofed Manager
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p paired-manager
          gh run download "$MANAGER_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$MANAGER_ARTIFACT" --dir paired-manager
          test -s "paired-manager/$MANAGER_APK"
          test -s paired-manager/manager-cert.txt
          test -s paired-manager/manager-provenance.txt
          printf '%s  %s\n' "$MANAGER_APK_SHA256" "paired-manager/$MANAGER_APK" | sha256sum -c -
          grep -Fqx "MANAGER_CERT_SIZE_HEX=$KSU_NEXT_MANAGER_SIZE" paired-manager/manager-cert.txt
          grep -Fqx "MANAGER_CERT_SHA256=$KSU_NEXT_MANAGER_HASH" paired-manager/manager-cert.txt
          cp "paired-manager/$MANAGER_APK" "$GITHUB_WORKSPACE/$MANAGER_APK"

      - name: Install exact LLVM 20.1.0
        shell: bash
        run: |
          set -Eeuo pipefail
          wget -q "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_ARCHIVE}"
          tar -xJf "$LLVM_ARCHIVE"
          mv "LLVM-${LLVM_VERSION}-Linux-X64" "$GITHUB_WORKSPACE/aosp-clang"
          rm -f "$LLVM_ARCHIVE"
          echo "AOSP_CLANG_PATH=$GITHUB_WORKSPACE/aosp-clang" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/aosp-clang/bin/clang" --version | head -n1

      - name: S6.1 Prepare TicWatch base up to LTS insertion point
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -i \
            -e "s|^KSUN_MANAGER=.*|KSUN_MANAGER=\"$MANAGER_APK\"|" \
            -e "s|^KSUN_MANAGER_SHA256=.*|KSUN_MANAGER_SHA256=\"$MANAGER_APK_SHA256\"|" \
            ticwatch-ultimate/preflight.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ticwatch-ultimate/preflight.sh')
          s=p.read_text()
          anchor='pass "LOCALVERSION matches installed Xinran_StarBai-Test baseline"\n'
          replacement=anchor + 'printf "DIAG_BASE_READY=1\\n" | tee -a "$REPORT"\nexit 0\n'
          if s.count(anchor) != 1:
              raise SystemExit('preflight LTS insertion anchor changed')
          p.write_text(s.replace(anchor, replacement, 1))
          PY
          bash ticwatch-ultimate/preflight.sh
          test -d .ticwatch-preflight/common/.git
          grep -Fqx 'DIAG_BASE_READY=1' ticwatch-ultimate-results/preflight.txt

      - name: S6.2 Fetch pinned Android-common 5.15.211 tip
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch -q --unshallow origin
          fi
          git remote remove aosp >/dev/null 2>&1 || true
          git remote add aosp https://android.googlesource.com/kernel/common
          git fetch -q aosp "$AOSP_LTS_TIP"
          git cat-file -e "$AOSP_LTS_TIP^{commit}"
          echo "AOSP_TIP_FETCHED=$AOSP_LTS_TIP"

      - name: S6.3 Verify expected merge base
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          merge_base="$(git merge-base HEAD "$AOSP_LTS_TIP")"
          echo "MERGE_BASE=$merge_base"
          test "$merge_base" = "$EXPECTED_MERGE_BASE"

      - name: S6.4 Merge Android-common 5.15.211
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          if ! git -c user.name='TicWatch LTS CI' -c user.email='ci@local' \
              merge --no-ff --no-edit "$AOSP_LTS_TIP" >"$GITHUB_WORKSPACE/lts-merge-summary.txt" 2>&1; then
            echo 'MERGE_RESULT=FAIL'
            echo 'UNMERGED_PATHS:'
            git diff --name-only --diff-filter=U | head -n 50 || true
            echo 'MERGE_TAIL:'
            tail -n 20 "$GITHUB_WORKSPACE/lts-merge-summary.txt" || true
            exit 1
          fi
          echo 'MERGE_RESULT=PASS'
          tail -n 8 "$GITHUB_WORKSPACE/lts-merge-summary.txt" || true

      - name: S6.5 Verify merge completeness and ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          test -z "$(git diff --name-only --diff-filter=U)"
          git merge-base --is-ancestor "$AOSP_LTS_TIP" HEAD
          echo 'MERGE_COMPLETENESS=PASS'

      - name: S6.6 Verify Makefile version is 5.15.211
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          version="$(awk '$1=="VERSION"{v=$3} $1=="PATCHLEVEL"{p=$3} $1=="SUBLEVEL"{s=$3} END{print v"."p"."s}' Makefile)"
          echo "MAKEFILE_VERSION=$version"
          test "$version" = '5.15.211'

      - name: S6.7 Check LTS merge whitespace
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          if ! git diff --check HEAD^ HEAD >"$GITHUB_WORKSPACE/lts-whitespace.txt" 2>&1; then
            echo 'WHITESPACE_RESULT=FAIL'
            head -n 40 "$GITHUB_WORKSPACE/lts-whitespace.txt" || true
            exit 1
          fi
          echo 'WHITESPACE_RESULT=PASS'

      - name: S6.8 Save merged head and source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/lts-merged-head.txt"
          git diff "$BASE_KERNEL_SHA" --binary > "$GITHUB_WORKSPACE/kernel-source-lts211.patch"
          test -s "$GITHUB_WORKSPACE/kernel-source-lts211.patch"
          echo 'STEP6_DIAGNOSTIC_RESULT=PASS'
