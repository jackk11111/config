name: Wear7 DLKM early-boot gate audit V2

on:
  push:
    branches:
      - wear7-diag4-init-bisect-20261002
    paths:
      - '.github/workflows/wear7-dlkm-boot-gate-audit-v2-20261003.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Download, verify and unpack exact DIAG3 super
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs kmod binutils >/dev/null

          mkdir -p audit_dlkm/parts audit_dlkm/lp audit_dlkm/m_vendor audit_dlkm/m_vendor_dlkm audit_dlkm/m_system_dlkm
          cd audit_dlkm

          gh release download wear7-diag3-final-20261002 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' \
            --dir parts

          cat parts/super_WEAR7_V11_DIAG3_FINAL.img.part* > super_sparse.img
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  super_sparse.img' | sha256sum -c -
          simg2img super_sparse.img super_WEAR7_V11_DIAG3_FINAL.raw.img
          echo '725df162529100ddb924caa22a1f72db77189b00620d27a2450da4e9351e913e  super_WEAR7_V11_DIAG3_FINAL.raw.img' | sha256sum -c -

          if command -v lpunpack >/dev/null 2>&1; then
            lpunpack super_WEAR7_V11_DIAG3_FINAL.raw.img lp
          else
            ZIP=otatools.zip
            curl -fL --retry 3 -sS -o "$ZIP" \
              https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
            python3 - "$ZIP" tools <<'PY'
          import pathlib, sys, zipfile
          out = pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n == 'bin/lpunpack' or n.startswith(('lib64/', 'lib/')):
                      p = (out / n).resolve()
                      if not p.is_relative_to(out):
                          raise SystemExit('unsafe path in otatools')
                      z.extract(n, out)
          PY
            chmod +x tools/bin/lpunpack
            LD_LIBRARY_PATH="$PWD/tools/lib64:$PWD/tools/lib" \
              tools/bin/lpunpack super_WEAR7_V11_DIAG3_FINAL.raw.img lp
          fi

          ls -lh lp

      - name: Mount vendor and DLKM images read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd audit_dlkm

          VENDOR_IMG=$(find lp -maxdepth 1 -type f \( -name 'vendor_a.img' -o -name 'vendor.img' \) | head -n1)
          VENDOR_DLKM_IMG=$(find lp -maxdepth 1 -type f \( -name 'vendor_dlkm_a.img' -o -name 'vendor_dlkm.img' \) | head -n1 || true)
          SYSTEM_DLKM_IMG=$(find lp -maxdepth 1 -type f \( -name 'system_dlkm_a.img' -o -name 'system_dlkm.img' \) | head -n1 || true)

          test -n "$VENDOR_IMG"
          sudo mount -o loop,ro,noload "$VENDOR_IMG" m_vendor
          if [ -n "$VENDOR_DLKM_IMG" ]; then
            sudo mount -o loop,ro,noload "$VENDOR_DLKM_IMG" m_vendor_dlkm
          fi
          if [ -n "$SYSTEM_DLKM_IMG" ]; then
            sudo mount -o loop,ro,noload "$SYSTEM_DLKM_IMG" m_system_dlkm
          fi
          mount | grep audit_dlkm || true

      - name: Audit loader selection and module ABI
        shell: bash
        run: |
          set -o pipefail
          cd audit_dlkm
          {
            echo "=== CURRENT DEVICE KERNEL BASE ==="
            echo "5.15.220"

            echo "=== PROP REFERENCES TO DLKM / MODPROBE ==="
            grep -RnaE 'ro\.vendor\.qti\.load_dlkm\.service|dlkm|modprobe' m_vendor/* 2>/dev/null | head -n 300 || true

            echo "=== INIT QTI KERNEL RC ==="
            find m_vendor -type f -name 'init.qti.kernel.rc' -print -exec sed -n '1,320p' {} \; 2>/dev/null || true

            echo "=== POSSIBLE LOADER SCRIPTS ==="
            for f in m_vendor/bin/load_dlkm m_vendor/bin/system_dlkm_modprobe.sh m_vendor/bin/vendor_modprobe.sh; do
              if [ -f "$f" ]; then
                echo "----- $f -----"
                file "$f" || true
                if head -c2 "$f" 2>/dev/null | grep -q '#!'; then
                  sed -n '1,320p' "$f" 2>/dev/null || true
                else
                  strings "$f" | grep -Ei 'module|modprobe|dlkm|uname|kernel' | head -n 320 || true
                fi
              else
                echo "MISSING $f"
              fi
            done

            echo "=== VENDOR_DLKM MODULE CONTROL FILES ==="
            find m_vendor_dlkm -maxdepth 5 -type f \
              \( -name 'modules.load*' -o -name 'modules.dep*' -o -name 'modules.alias*' -o -name 'modules.order*' -o -name 'modules.softdep*' \) \
              -print -exec sh -c 'echo "----- $1 -----"; sed -n "1,400p" "$1"' sh {} \; 2>/dev/null || true

            echo "=== SYSTEM_DLKM MODULE CONTROL FILES ==="
            find m_system_dlkm -maxdepth 5 -type f \
              \( -name 'modules.load*' -o -name 'modules.dep*' -o -name 'modules.alias*' -o -name 'modules.order*' -o -name 'modules.softdep*' \) \
              -print -exec sh -c 'echo "----- $1 -----"; sed -n "1,400p" "$1"' sh {} \; 2>/dev/null || true

            echo "=== VERMAGIC vendor_dlkm UNIQUE SUMMARY ==="
            find m_vendor_dlkm -type f -name '*.ko' -print0 \
              | xargs -0 -r -n1 modinfo -F vermagic 2>/dev/null \
              | sort | uniq -c | sort -nr || true

            echo "=== VERMAGIC system_dlkm UNIQUE SUMMARY ==="
            find m_system_dlkm -type f -name '*.ko' -print0 \
              | xargs -0 -r -n1 modinfo -F vermagic 2>/dev/null \
              | sort | uniq -c | sort -nr || true

            echo "=== FIRST 160 MODULES WITH VERMAGIC vendor_dlkm ==="
            find m_vendor_dlkm -type f -name '*.ko' | sort | head -n 160 | while read -r ko; do
              printf '%s :: ' "$ko"
              modinfo -F vermagic "$ko" 2>/dev/null || true
            done

            echo "=== KERNEL RELEASE STRINGS IN DLKM ==="
            grep -RaoE '5\.15\.[0-9]+[^[:space:]]*' m_vendor_dlkm m_system_dlkm 2>/dev/null \
              | sort | uniq -c | sort -nr | head -n 300 || true

            echo "RESULT=DLKM_BOOT_GATE_AUDIT_V2_COMPLETE"
          } 2>&1 | tee dlkm_audit_report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear7-dlkm-audit-v2
          path: audit_dlkm/dlkm_audit_report.txt
          if-no-files-found: error
          retention-days: 30
