name: Wear7 V5B final candidate package fix

on:
  workflow_dispatch:
  push:
    branches: [wear7-rom-staging]
    paths: ['.github/workflows/wear7-final-candidate-v5b-package-fix.yml']

permissions:
  contents: read
  actions: read

env:
  PIXEL_FILE: solios-cp2a.260603.001.s1-factory-d203665c.zip
  PIXEL_SHA256: d203665c90bc06bf175dbb3cbd7fcc9d212c056a030f9c51b541129e8651fb7d
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d
  KERNEL_BUILD_TOOLS_SHA: 010d8a83d84ced4beef7779453766350db8c08cd
  KERNEL_RUN_ID: '35050732231'
  KERNEL_ARTIFACT: TicWatch-Wear7-Integration-Kernel-ADBRoot-V3
  KSU_RUN_ID: '34563994675'
  KSU_ARTIFACT: TicWatch-Ultimate-KSUNext-3.3.0-Spoofed-PAIRED
  KSU_MANAGER_SHA256: 8310faebd2b592ccddd6a15a6d996c70d89cd679eb51835e84d18f531471357b
  KSU_CERT_SHA256: 3bc9938c38106bcf618bbe1d37ad4adde8a49c659e2860709bbfc341f7e749f2
  KSU_CERT_SIZE: '962'
  KSUD_SHA256: c196de59c82030cf14f19c0b170d0ef09203370b533fcbf57dd0d3725d477dca
  SUPER_DEVICE_SIZE: '4294967296'
  DYNAMIC_GROUP_SIZE: '4284481536'
  SYSTEM_PARTITION_SIZE: '1741303808'
  SYSTEM_EXT_PARTITION_SIZE: '283598848'
  PRODUCT_PARTITION_SIZE: '1613258752'
  AVB_SALT: 29ee420fe79a48929c62ab7091d79c9575998f66d7f5e856987e7bbe578d5459
  BOOT_AVB_SALT: 8078f56b41ac2e6ebea1f428d5b574f02f57d480d916879b2b28628caed0e616

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: wear7-rom-staging, fetch-depth: 1}
      - name: Download verified Wear7 integration kernel V3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: '${{ env.KERNEL_ARTIFACT }}', path: '${{ runner.temp }}/kernel-artifact', github-token: '${{ secrets.GITHUB_TOKEN }}', repository: '${{ github.repository }}', run-id: '${{ env.KERNEL_RUN_ID }}'}
      - name: Download exact paired KernelSU userspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: '${{ env.KSU_ARTIFACT }}', path: '${{ runner.temp }}/ksu-paired', github-token: '${{ secrets.GITHUB_TOKEN }}', repository: '${{ github.repository }}', run-id: '${{ env.KSU_RUN_ID }}'}
      - name: Execute V2 core with VNDK33 Dace bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y python3-yaml >/dev/null
          python3 - <<'PY'
          import os,pathlib,subprocess,yaml
          workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          steps=yaml.safe_load((workspace/'.github/workflows/wear7-final-candidate-v2.yml').read_text())['jobs']['assemble']['steps']
          env=os.environ.copy(); ef=pathlib.Path(env['RUNNER_TEMP'])/'v5b-env'; pf=pathlib.Path(env['RUNNER_TEMP'])/'v5b-path'; ef.write_text(''); pf.write_text(''); ep=pp=0
          def absorb():
              global ep,pp
              t=ef.read_text(); c=t[ep:]; ep=len(t)
              for l in c.splitlines():
                  if l and '=' in l:
                      k,v=l.split('=',1); env[k]=v
              t=pf.read_text(); c=t[pp:]; pp=len(t); a=[x for x in c.splitlines() if x]
              if a: env['PATH']=':'.join(reversed(a))+':'+env.get('PATH','')
          env['GITHUB_ENV']=str(ef); env['GITHUB_PATH']=str(pf); injected=False; executed=0
          for idx,step in enumerate(steps,1):
              script=step.get('run'); name=step.get('name',f'step-{idx}')
              if not script: continue
              if '${{' in script: raise SystemExit('unexpected expression in '+name)
              if name=='Generate exact filesystem metadata configs and contexts':
                  W=pathlib.Path(env['RUNNER_TEMP'])/'work'; stage=W/'stage-system'; mnt=W/'v5b-stock-system'; vmnt=W/'v5b-stock-vendor'
                  subprocess.run(['sudo','mkdir','-p',str(mnt),str(vmnt)],check=True)
                  subprocess.run(['sudo','mount','-o','loop,ro',str(W/'tic-system.raw'),str(mnt)],check=True)
                  subprocess.run(['sudo','mount','-o','loop,ro',str(W/'tic-vendor.raw'),str(vmnt)],check=True)
                  ss=mnt/'system' if (mnt/'system').is_dir() else mnt; src=ss/'apex/com.android.vndk.current'; dst=stage/'system/apex/com.android.vndk.current'
                  if not (src/'apex_manifest.pb').is_file(): raise SystemExit('stock flattened VNDK33 missing')
                  subprocess.run(['sudo','rm','-rf',str(dst)],check=True); subprocess.run(['sudo','cp','-a',str(src),str(dst)],check=True)
                  manifest=stage/'system/etc/vintf/manifest.xml'
                  code="""import sys,xml.etree.ElementTree as E\np=sys.argv[1];t=E.parse(p);r=t.getroot()\nif not any(x.findtext('version')=='33' for x in r.findall('vendor-ndk')):\n x=E.Element('vendor-ndk');E.SubElement(x,'version').text='33';s=r.find('system-sdk');r.insert(list(r).index(s) if s is not None else len(r),x)\nE.indent(t,space='    ');t.write(p,encoding='unicode')\n"""
                  subprocess.run(['sudo','python3','-c',code,str(manifest)],check=True)
                  matrix=stage/'system/etc/vintf/compatibility_matrix.dace.xml'
                  subprocess.run(['sudo','python3',str(workspace/'wear7/scripts/generate_framework_matrix_from_device_manifest.py'),'--main',str(vmnt/'etc/vintf/manifest_monaco.xml'),'--fragments',str(vmnt/'etc/vintf/manifest'),'--out',str(matrix),'--sepolicy-version','33.0','--kernel-sepolicy-version','30','--matrix-version','9.0'],check=True)
                  rep=workspace/'wear7-final-v2-report/VNDK33_DACE_REAL_BRIDGE.txt'
                  subprocess.run(['sudo','sh','-c',f"printf 'STOCK379_FLATTENED_VNDK33_INSTALLED=YES\\nFRAMEWORK_MANIFEST_VENDOR_NDK_33=YES\\nDACE_SUPPLEMENTAL_MATRIX_INSTALLED=YES\\n' > '{rep}'"],check=True)
                  subprocess.run(['sudo','umount',str(mnt)],check=True); subprocess.run(['sudo','umount',str(vmnt)],check=True); injected=True
              print('===== V5B CORE',idx,name,'=====',flush=True)
              subprocess.run(['bash','-Eeuo','pipefail','-c',script],cwd=workspace,env=env,check=True); absorb(); executed+=1
          if not injected or executed<10: raise SystemExit('V5B injection/core incomplete')
          PY
      - name: Finalize fail-closed pre-recovery package
        run: |
          set -Eeuo pipefail
          OUT=wear7-final-v2-candidate; REP=wear7-final-v2-report
          sudo chown -R "$(id -u):$(id -g)" "$REP" "$OUT"
          grep -q '^STOCK379_FLATTENED_VNDK33_INSTALLED=YES$' "$REP/VNDK33_DACE_REAL_BRIDGE.txt"
          cat >> "$OUT/CANDIDATE_MANIFEST.txt" <<'EOF'
          VNDK33_BRIDGE=STOCK379_FLATTENED_APEX_PLUS_FRAMEWORK_VENDOR_NDK_DECLARATION
          DACE_SUPPLEMENTAL_FRAMEWORK_MATRIX=INSTALLED_IN_SYSTEM
          PAIRING_ACCEPTANCE_POLICY=ANY_WORKING_COMPANION
          PAIRING_PATH_ALLOWED=MOBVOI_OR_GOOGLE_PIXEL_WATCH_OR_OTHER_WORKING_COMPANION
          PHONE_DISCOVERY_RUNTIME_REQUIRED=YES
          BLUETOOTH_PAIRING_RUNTIME_REQUIRED=YES
          SETUP_WIZARD_COMPLETE_RUNTIME_REQUIRED=YES
          GOOGLE_ACCOUNT_TRANSFER_RUNTIME_REQUIRED=YES
          NOTIFICATION_BRIDGE_RUNTIME_REQUIRED=YES
          PHONE_WATCH_RECONNECT_AFTER_REBOOT_RUNTIME_REQUIRED=YES
          RECOVERY_ROLLBACK_READY_FOR_FIRST_WEAR7_FLASH=NO
          FIRST_WEAR7_FLASH=FORBIDDEN_UNTIL_RECOVERY_READY
          EOF
          cp "$OUT/CANDIDATE_MANIFEST.txt" "$REP/CANDIDATE_MANIFEST.txt"
          rm -f "$OUT/SHA256SUMS.txt"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
          sha256sum -c "$OUT/SHA256SUMS.txt"
          find "$REP" -maxdepth 1 -type f ! -name REPORT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$REP/REPORT_SHA256SUMS.txt"
      - name: Upload V5B reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Wear7-Final-V5B-Reports
          path: wear7-final-v2-report/
          retention-days: 30
          compression-level: 9
      - name: Upload V5B bootchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: Wear7-Final-V5B-Bootchain
          path: |
            wear7-final-v2-candidate/boot.img
            wear7-final-v2-candidate/init_boot.img
            wear7-final-v2-candidate/vendor_boot.img
            wear7-final-v2-candidate/dtbo.img
            wear7-final-v2-candidate/vbmeta.img
            wear7-final-v2-candidate/vbmeta_system.img
            wear7-final-v2-candidate/CANDIDATE_MANIFEST.txt
            wear7-final-v2-candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload V5B super
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: Wear7-Final-V5B-Super
          path: wear7-final-v2-candidate/super.img
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
