name: Wear7 DIAG5 no-DLKM-start bisect

on:
  push:
    branches: [wear7-diag4-init-bisect-20261002]
    paths: ['.github/workflows/wear7-diag5-nodlkmstart-20261003.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare exact DIAG3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs >/dev/null
          W="$RUNNER_TEMP/w7"; mkdir -p "$W/parts_in" "$W/tools" "$W/parts" out-diag5

          gh release download wear7-diag3-final-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' --dir "$W/parts_in"
          cat "$W"/parts_in/super_WEAR7_V11_DIAG3_FINAL.img.part* > "$W/source.sparse"
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  '"$W/source.sparse" | sha256sum -c -

          ZIP="$W/tools/otatools.zip"
          curl -fL --retry 3 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          echo "f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84  $ZIP" | sha256sum -c -
          python3 - "$ZIP" "$W/tools/extracted" <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]).resolve()
          wanted=('bin/simg2img','bin/lpunpack','bin/lpmake')
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n in wanted or n.startswith(('lib64/','lib/')):
                      p=(out/n).resolve()
                      if not p.is_relative_to(out): raise SystemExit('unsafe path')
                      z.extract(n,out)
          PY
          rm -f "$ZIP"; chmod +x "$W/tools/extracted/bin/"*
          T="$W/tools/extracted"; export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          simg2img "$W/source.sparse" "$W/source.raw"
          echo '725df162529100ddb924caa22a1f72db77189b00620d27a2450da4e9351e913e  '"$W/source.raw" | sha256sum -c -
          lpunpack "$W/source.raw" "$W/parts"
          cp "$W/parts/vendor.img" "$W/vendor.orig.img"

      - name: Patch only the two DLKM starts
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"
          python3 - "$W/parts/vendor.img" "$W/vendor.orig.img" out-diag5 <<'PY'
          import pathlib,subprocess,re,sys,hashlib,json
          vendor=pathlib.Path(sys.argv[1]); orig=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3]); BS=4096
          rel='/etc/init/hw/init.qti.kernel.rc'
          dump=pathlib.Path('/tmp/init.qti.kernel.rc')
          subprocess.run(['debugfs','-R',f'dump {rel} {dump}',str(vendor)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          old=dump.read_bytes(); new=bytearray(old)
          replacements=[(b'    start gki.modprobe\n',b'    #tart gki.modprobe\n'),(b'    start vendor.modprobe\n',b'    #tart vendor.modprobe\n')]
          offsets=[]
          for a,b in replacements:
              if len(a)!=len(b): raise SystemExit('replacement length mismatch')
              if old.count(a)!=1: raise SystemExit(f'pattern count {a!r} = {old.count(a)}')
              pos=old.index(a); new[pos:pos+len(a)]=b; offsets.append(pos+4)
          new=bytes(new)
          diffs=[i for i,(a,b) in enumerate(zip(old,new)) if a!=b]
          if diffs!=offsets: raise SystemExit(f'unexpected file diffs {diffs} expected {offsets}')

          txt=subprocess.check_output(['debugfs','-R',f'blocks {rel}',str(vendor)],text=True,stderr=subprocess.DEVNULL)
          maxblk=vendor.stat().st_size//BS
          blocks=[int(x) for x in re.findall(r'\b\d+\b',txt) if 0<int(x)<maxblk]
          need=(len(old)+BS-1)//BS
          if len(blocks)<need: raise SystemExit(f'block map short {blocks} need={need}')
          blocks=blocks[-need:]
          with vendor.open('r+b',buffering=0) as f:
              for off in offsets:
                  logical=off//BS; within=off%BS; fsblk=blocks[logical]
                  f.seek(fsblk*BS+within); got=f.read(1)
                  if got!=b's': raise SystemExit(f'old byte mismatch at {off}: {got!r}')
                  f.seek(fsblk*BS+within); f.write(b'#')

          check=pathlib.Path('/tmp/init.qti.kernel.patched.rc')
          subprocess.run(['debugfs','-R',f'dump {rel} {check}',str(vendor)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          got=check.read_bytes()
          if got!=new: raise SystemExit('runtime file differs from intended target')
          if got.count(b'    start gki.modprobe\n') or got.count(b'    start vendor.modprobe\n'): raise SystemExit('DLKM starts still active')
          if got.count(b'    #tart gki.modprobe\n')!=1 or got.count(b'    #tart vendor.modprobe\n')!=1: raise SystemExit('neutralized lines missing')

          # Prove vendor image changed only at the two corresponding data bytes.
          vo=orig.read_bytes(); vp=vendor.read_bytes()
          imgdiff=[i for i,(a,b) in enumerate(zip(vo,vp)) if a!=b]
          expected=[]
          for off in offsets:
              expected.append(blocks[off//BS]*BS+(off%BS))
          if imgdiff!=expected: raise SystemExit(f'vendor image diffs={imgdiff} expected={expected}')
          info={'file':rel,'old_sha256':hashlib.sha256(old).hexdigest(),'new_sha256':hashlib.sha256(new).hexdigest(),'file_offsets':offsets,'vendor_image_offsets':expected,'vendor_image_diff_count':len(imgdiff)}
          (out/'DLKM_BISECT.json').write_text(json.dumps(info,indent=2)+'\n')
          (out/'INIT_QTI_KERNEL_PATCHED.txt').write_bytes(got)
          print(json.dumps(info,indent=2))
          print('RESULT=EXACTLY_TWO_VENDOR_BYTES_CHANGED')
          PY
          e2fsck -fn "$W/parts/vendor.img" | tee out-diag5/VENDOR_E2FSCK.txt

      - name: Reproduce LP layout and build target raw
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"; T="$W/tools/extracted"; export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          build() { lpmake --metadata-size 65536 --metadata-slots 2 --super-name super --device super:4294967296 --group qti_dynamic_partitions:4284481536 --partition system:readonly:1741303808:qti_dynamic_partitions --image system="$W/parts/system.img" --partition system_ext:readonly:283598848:qti_dynamic_partitions --image system_ext="$W/parts/system_ext.img" --partition product:readonly:1613258752:qti_dynamic_partitions --image product="$W/parts/product.img" --partition vendor:readonly:297361408:qti_dynamic_partitions --image vendor="$1" --partition vendor_dlkm:readonly:63889408:qti_dynamic_partitions --image vendor_dlkm="$W/parts/vendor_dlkm.img" --partition system_dlkm:readonly:348160:qti_dynamic_partitions --image system_dlkm="$W/parts/system_dlkm.img" --output "$2"; }
          build "$W/vendor.orig.img" "$W/rebuilt.raw"
          R=$(sha256sum "$W/rebuilt.raw"|awk '{print $1}')
          test "$R" = 725df162529100ddb924caa22a1f72db77189b00620d27a2450da4e9351e913e
          cmp "$W/source.raw" "$W/rebuilt.raw"
          rm "$W/rebuilt.raw"
          build "$W/parts/vendor.img" "$W/target.raw"
          TARGET_RAW_SHA=$(sha256sum "$W/target.raw"|awk '{print $1}')
          echo "TARGET_RAW_SHA=$TARGET_RAW_SHA" >> "$GITHUB_ENV"
          printf '%s\n' \
            'SOURCE_RELEASE=wear7-diag3-final-20261002' \
            'SOURCE_SPARSE_SHA256=75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329' \
            'SOURCE_RAW_SHA256=725df162529100ddb924caa22a1f72db77189b00620d27a2450da4e9351e913e' \
            'SOURCE_LAYOUT_REPRODUCTION=PASS' \
            'PATCH=disable only start gki.modprobe + start vendor.modprobe' \
            "TARGET_RAW_SHA256=$TARGET_RAW_SHA" > out-diag5/MANIFEST.txt

      - name: Derive sparse patch and prove target
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"; T="$W/tools/extracted"; export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          python3 - "$W/source.raw" "$W/target.raw" "$W/source.sparse" "$W/target.sparse" out-diag5 <<'PY'
          import pathlib,sys,struct,hashlib,json,base64,shutil
          a=pathlib.Path(sys.argv[1]); b=pathlib.Path(sys.argv[2]); sp=pathlib.Path(sys.argv[3]); outsp=pathlib.Path(sys.argv[4]); out=pathlib.Path(sys.argv[5]); BS=4096
          changed=[]
          with a.open('rb',buffering=0) as fa,b.open('rb',buffering=0) as fb:
              n=0
              while True:
                  x=fa.read(BS); y=fb.read(BS)
                  if not x and not y: break
                  if x!=y: changed.append((n,x,y))
                  n+=1
          wanted={n for n,_,_ in changed}; mp={}
          with sp.open('rb') as f:
              magic,maj,minv,fhs,chs,bs,total,nc,ck=struct.unpack('<IHHHHIIII',f.read(28))
              if (magic,bs,fhs,chs)!=(0xED26FF3A,BS,28,12): raise SystemExit('bad sparse')
              rb=0
              for _ in range(nc):
                  typ,res,cnt,ts=struct.unpack('<HHII',f.read(12)); payload=f.tell()
                  for q in wanted:
                      if rb<=q<rb+cnt:
                          if typ!=0xCAC1: raise SystemExit(f'raw block {q} maps to non-RAW chunk {typ:#x}')
                          mp[q]=payload+(q-rb)*BS
                  if typ==0xCAC1:f.seek(cnt*BS,1)
                  elif typ in (0xCAC2,0xCAC4):f.seek(4,1)
                  elif typ==0xCAC3:pass
                  else:raise SystemExit('unknown sparse chunk')
                  rb+=cnt
          if len(mp)!=len(changed): raise SystemExit('sparse map incomplete')
          rec=[]
          for n,x,y in changed:
              i=0
              while i<BS:
                  if x[i]==y[i]: i+=1; continue
                  j=i+1
                  while j<BS and x[j]!=y[j]: j+=1
                  rec.append({'raw_block':n,'sparse_offset':mp[n]+i,'length':j-i,'old_b64':base64.b64encode(x[i:j]).decode(),'new_b64':base64.b64encode(y[i:j]).decode()}); i=j
          shutil.copyfile(sp,outsp)
          with outsp.open('r+b',buffering=0) as f:
              for r in rec:
                  o=base64.b64decode(r['old_b64']); nn=base64.b64decode(r['new_b64']); f.seek(r['sparse_offset']); got=f.read(len(o))
                  if got!=o: raise SystemExit('source sparse byte mismatch')
                  f.seek(r['sparse_offset']); f.write(nn)
          d={'format':1,'source_sparse_sha256':'75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329','target_sparse_sha256':hashlib.sha256(outsp.read_bytes()).hexdigest(),'target_raw_sha256':hashlib.sha256(b.read_bytes()).hexdigest(),'changed_raw_blocks':len(changed),'records':rec}
          (out/'DIAG5_PATCH.json').write_text(json.dumps(d,indent=2)+'\n')
          print('CHANGED_RAW_BLOCKS='+str(len(changed)))
          print('PATCH_RECORDS='+str(len(rec)))
          print('TARGET_SPARSE_SHA256='+d['target_sparse_sha256'])
          PY
          simg2img "$W/target.sparse" "$W/check.raw"
          echo "$TARGET_RAW_SHA  $W/check.raw" | sha256sum -c -
          cmp "$W/check.raw" "$W/target.raw"
          TARGET_SPARSE_SHA=$(sha256sum "$W/target.sparse"|awk '{print $1}')
          echo "TARGET_SPARSE_SHA256=$TARGET_SPARSE_SHA" >> out-diag5/MANIFEST.txt
          echo 'SPARSE_ROUNDTRIP=PASS' >> out-diag5/MANIFEST.txt
          cp "$W/target.sparse" out-diag5/super_WEAR7_V11_DIAG5_NODLKMSTART.img

      - name: Split and publish diagnostic release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd out-diag5
          sha256sum super_WEAR7_V11_DIAG5_NODLKMSTART.img > super_WEAR7_V11_DIAG5_NODLKMSTART.img.sha256
          split -b 1900m -d -a 2 super_WEAR7_V11_DIAG5_NODLKMSTART.img super_WEAR7_V11_DIAG5_NODLKMSTART.img.part
          sha256sum super_WEAR7_V11_DIAG5_NODLKMSTART.img.part* > PARTS.sha256
          rm super_WEAR7_V11_DIAG5_NODLKMSTART.img
          TAG=wear7-diag5-nodlkmstart-20261003
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title 'Wear7 DIAG5 no-DLKM-start bisect' --notes 'Diagnostic only. Exact DIAG3 base; only start gki.modprobe and start vendor.modprobe are neutralized during early-init. No kernel, QCV, system, system_ext, product, vendor_dlkm or system_dlkm changes.' \
            super_WEAR7_V11_DIAG5_NODLKMSTART.img.part* PARTS.sha256 super_WEAR7_V11_DIAG5_NODLKMSTART.img.sha256 MANIFEST.txt DLKM_BISECT.json DIAG5_PATCH.json INIT_QTI_KERNEL_PATCHED.txt VENDOR_E2FSCK.txt

      - name: Summary
        shell: bash
        run: |
          set -Eeuo pipefail
          cat out-diag5/MANIFEST.txt
          cat out-diag5/DLKM_BISECT.json
          cat out-diag5/DIAG5_PATCH.json
          echo 'RESULT=DIAG5_NODLKMSTART_READY'
