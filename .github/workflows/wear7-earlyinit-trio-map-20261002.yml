name: Wear7 PATCH6 QCV before-after mapper
on: [push]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - name: Map exact DIAG3 QCV block and PATCH6 byte runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs >/dev/null
          mkdir -p parts work/tools work/parts
          gh release download wear7-diag3-final-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' --dir parts
          cat parts/super_WEAR7_V11_DIAG3_FINAL.img.part* > work/super.img
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  work/super.img' | sha256sum -c -
          ZIP=work/tools/otatools.zip
          curl -fL --retry 3 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          python3 - "$ZIP" work/tools/extracted <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n.startswith(('bin/','lib64/','lib/')):
                      p=(out/n).resolve()
                      if not p.is_relative_to(out): raise SystemExit('unsafe')
                      z.extract(n,out)
          PY
          T="$PWD/work/tools/extracted"; chmod +x "$T/bin/"*; export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          simg2img work/super.img work/super.raw
          echo '725df162529100ddb924caa22a1f72db77189b00620d27a2450da4e9351e913e  work/super.raw' | sha256sum -c -
          lpunpack work/super.raw work/parts
          python3 - <<'PY'
          import pathlib,subprocess,re,hashlib,json,base64
          BS=4096; vendor=pathlib.Path('work/parts/vendor.img'); raw=pathlib.Path('work/super.raw').read_bytes()
          rel='/etc/init/init.qti.qcv.rc'; dump=pathlib.Path('work/qcv.rc')
          subprocess.run(['debugfs','-R',f'dump {rel} {dump}',str(vendor)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          old=dump.read_bytes(); print('===== ORIGINAL QCV RC ====='); print(old.decode(errors='replace'))
          ex=b'    exec u:r:vendor_qti_init_shell:s0 -- /vendor/bin/init.qti.qcv.sh\n'
          if old.count(ex)!=1: raise SystemExit(f'QCV_EXEC_COUNT={old.count(ex)}')
          a=b'    chmod 0777 /metadata/vold/a\n'; b=b'    chmod 0777 /metadata/vold/b\n'
          out=[]; inserted=False
          for line in old.splitlines(keepends=True):
              if line.strip()==b'# Set ro.boot.product.vendor.sku to soc_name': continue
              if line==ex: out.extend((a,line,b)); inserted=True
              else: out.append(line)
          if not inserted: raise SystemExit('INSERT_FAILED')
          new=b''.join(out)
          if len(new)>len(old):
              new=b''.join((b' '+x.lstrip() if x[:1] in (b' ',b'\t') else x) for x in new.splitlines(keepends=True))
          if len(new)>len(old): raise SystemExit(f'PATCH_TOO_LONG old={len(old)} new={len(new)}')
          new += b' '*(len(old)-len(new))
          def cmds(x): return [z.strip() for z in x.splitlines() if z.strip() and not z.lstrip().startswith(b'#') and not z.startswith(b'on ')]
          if cmds(old)!=[z for z in cmds(new) if not z.startswith(b'chmod 0777 /metadata/vold/')]: raise SystemExit('SEMANTICS_CHANGED')
          txt=subprocess.check_output(['debugfs','-R',f'blocks {rel}',str(vendor)],text=True,stderr=subprocess.DEVNULL)
          maxblk=vendor.stat().st_size//BS; blocks=[int(x) for x in re.findall(r'\b\d+\b',txt) if 0<int(x)<maxblk]
          need=(len(old)+BS-1)//BS
          if need!=1 or len(blocks)<1: raise SystemExit(f'BAD_BLOCK_MAP need={need} blocks={blocks}')
          fsblk=blocks[-1]
          with vendor.open('rb') as f: f.seek(fsblk*BS); oldblk=f.read(BS)
          patched=bytearray(oldblk); patched[:len(new)]=new; newblk=bytes(patched)
          hits=[]; p=0
          while True:
              i=raw.find(oldblk,p)
              if i<0: break
              hits.append(i); p=i+1
          if len(hits)!=1 or hits[0]%BS: raise SystemExit(f'RAW_HITS={hits}')
          rb=hits[0]//BS
          runs=[]; i=0
          while i<BS:
              if oldblk[i]==newblk[i]: i+=1; continue
              j=i+1
              while j<BS and oldblk[j]!=newblk[j]: j+=1
              runs.append({'offset':i,'old_b64':base64.b64encode(oldblk[i:j]).decode(),'new_b64':base64.b64encode(newblk[i:j]).decode()}); i=j
          print('===== PATCH6_QCV =====')
          print(f'RAW_BLOCK={rb}')
          print(f'RAW_OFFSET={hits[0]}')
          print('SOURCE_BLOCK_SHA256='+hashlib.sha256(oldblk).hexdigest())
          print('PATCHED_BLOCK_SHA256='+hashlib.sha256(newblk).hexdigest())
          print('PATCH_RUNS='+json.dumps(runs,separators=(',',':')))
          print('MARKER_A=BEFORE_QCV_EXEC')
          print('MARKER_B=AFTER_QCV_EXEC')
          print('EXECUTABLE_COMMANDS_PRESERVED=PASS')
          print('RESULT=PATCH6_QCV_MAP_PASS')
          PY
