name: TicWatch MAX-LTS 5.15.220 Incremental Uplift

on:
  workflow_dispatch:
  push:
    branches:
      - ticwatch-max-lts-220-incremental
    paths:
      - '.github/workflows/ticwatch-max-lts-220-incremental-uplift.yml'

permissions:
  contents: read

concurrency:
  group: ticwatch-max-lts-220-incremental
  cancel-in-progress: true

jobs:
  uplift:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-max-lts-220-incremental

      - name: Prepare exact TicWatch 5.15.211 + September ASB
        shell: bash
        run: |
          set -Eeuo pipefail
          git init -q kernel
          git -C kernel remote add origin https://github.com/Winkmoon/android_kernel_TicWatch-Pro5.git
          git -C kernel fetch -q --depth=1 origin 3929c55fbc7559af6df290d2c0f66dc551af161a
          git -C kernel checkout -q --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = 3929c55fbc7559af6df290d2c0f66dc551af161a
          git -C kernel fetch -q --unshallow origin || true
          git -C kernel remote add aosp https://android.googlesource.com/kernel/common
          git -C kernel fetch -q aosp refs/tags/ASB-2026-09-08_13-5.15:refs/tags/ASB-2026-09-08_13-5.15
          test "$(git -C kernel rev-list -n1 refs/tags/ASB-2026-09-08_13-5.15)" = 56cdb4d13a91efb666d571084ab82de351cc4900
          git -C kernel -c user.name='TicWatch LTS CI' -c user.email='ci@local' merge --no-ff --no-edit refs/tags/ASB-2026-09-08_13-5.15
          ver="$(awk '$1=="VERSION"{v=$3} $1=="PATCHLEVEL"{p=$3} $1=="SUBLEVEL"{s=$3} END{print v"."p"."s}' kernel/Makefile)"
          test "$ver" = 5.15.211
          echo "BASE_READY=$ver + SEP-ASB"

      - name: Apply only missing stable commits 5.15.212 to 5.15.220
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git fetch -q stable refs/tags/v5.15.211:refs/tags/v5.15.211
          prev='v5.15.211'

          resolve_nfsd_515212_android_conflict() {
            local c="$1"
            local expected='5540899da89461cf3bf17227d37cc9c0b73fe256'
            local f='fs/nfsd/nfs4recover.c'
            local conflicts
            conflicts="$(git diff --name-only --diff-filter=U)"

            [ "$c" = "$expected" ] || return 1
            [ "$conflicts" = "$f" ] || {
              echo "REFUSE_AUTO_RESOLVE: unexpected conflicts for $c" >&2
              printf '%s\n' "$conflicts" >&2
              return 1
            }

            # Start from the Android/ASB side of the one conflicted file. All
            # clean changes from this stable commit (notably nfs4state.c) stay staged.
            git checkout --ours -- "$f"

            python3 - "$f" <<'PY'
          from pathlib import Path
          import re, sys

          p = Path(sys.argv[1])
          s = p.read_text()

          def sub_once(pattern, repl, label, flags=0):
              global s
              ns, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"FAIL {label}: expected exactly one match, got {n}")
              s = ns

          # 5.15.212 changes nfs4_client_to_reclaim() to duplicate/own its data.
          # Therefore these callers must stop allocating memory for the callee.
          sub_once(
              r'''static void\n__nfsd4_create_reclaim_record_grace\(struct nfs4_client \*clp,\n\s*const char \*dname, int len, struct nfsd_net \*nn\)\n\{\n\s*struct xdr_netobj name;\n\s*struct xdr_netobj princhash = \{ \.len = 0, \.data = NULL \};\n\s*struct nfs4_client_reclaim \*crp;\n\n\s*name\.data = kmemdup\(dname, len, GFP_KERNEL\);\n\s*if \(!name\.data\) \{\n\s*dprintk\("%s: failed to allocate memory for name\.data!\\\\n",\n\s*__func__\);\n\s*return;\n\s*\}\n\s*name\.len = len;\n\s*crp = nfs4_client_to_reclaim\(name, princhash, nn\);\n\s*if \(!crp\) \{\n\s*kfree\(name\.data\);\n\s*return;\n\s*\}\n\s*crp->cr_clp = clp;\n\}''',
              '''static void
          __nfsd4_create_reclaim_record_grace(struct nfs4_client *clp,
                                              char *dname, struct nfsd_net *nn)
          {
                  struct xdr_netobj name = { .len = strlen(dname), .data = dname };
                  struct xdr_netobj princhash = { .len = 0, .data = NULL };
                  struct nfs4_client_reclaim *crp;

                  crp = nfs4_client_to_reclaim(name, princhash, nn);
                  if (!crp)
                          return;
                  crp->cr_clp = clp;
          }''',
              'create_reclaim_record')

          sub_once(
              r'''__nfsd4_create_reclaim_record_grace\(clp, dname,\n\s*HEXDIR_LEN, nn\);''',
              '''__nfsd4_create_reclaim_record_grace(clp, dname, nn);''',
              'create_reclaim_call')

          sub_once(
              r'''struct xdr_netobj name;\n(\s*struct xdr_netobj princhash = \{ \.len = 0, \.data = NULL \};\n\n\s*if \(strlen\(cname\) != HEXDIR_LEN - 1\) \{.*?return 0;\n\s*\}\n)\s*name\.data = kstrdup\(cname, GFP_KERNEL\);\n\s*if \(!name\.data\) \{\n\s*dprintk\("%s: failed to allocate memory for name\.data!\\\\n",\n\s*__func__\);\n\s*goto out;\n\s*\}\n\s*name\.len = HEXDIR_LEN;\n\s*if \(!nfs4_client_to_reclaim\(name, princhash, nn\)\)\n\s*kfree\(name\.data\);\nout:\n''',
              r'''struct xdr_netobj name = { .len = HEXDIR_LEN, .data = cname };
          \1        nfs4_client_to_reclaim(name, princhash, nn);
          ''',
              'load_recdir', re.S)

          # Keep Android's stronger IS_ERR_OR_NULL checks while adopting the stable
          # ownership model. Cleanup variables preserve the original allocation even
          # when name.data is advanced past the legacy "hash:" prefix.
          sub_once(
              r'''(struct xdr_netobj name, princhash = \{ \.len = 0, \.data = NULL \};\n)''',
              r'''\1        char *namecopy __free(kfree) = NULL;
                  char *princhashcopy __free(kfree) = NULL;
          ''',
              'cleanup_declarations')

          # First name allocation (v2 client info).
          sub_once(
              r'''name\.data = memdup_user\(&ci->cc_name\.cn_id, namelen\);\n\s*if \(IS_ERR_OR_NULL\(name\.data\)\)\n\s*return -EFAULT;''',
              '''namecopy = memdup_user(&ci->cc_name.cn_id, namelen);
                          if (IS_ERR_OR_NULL(namecopy))
                                  return -EFAULT;
                          name.data = namecopy;''',
              'namecopy_v2')

          sub_once(
              r'''princhash\.data = memdup_user\(\n\s*&ci->cc_princhash\.cp_data,\n\s*princhashlen\);\n\s*if \(IS_ERR_OR_NULL\(princhash\.data\)\) \{\n\s*kfree\(name\.data\);\n\s*return -EFAULT;\n\s*\}\n\s*princhash\.len = princhashlen;''',
              '''princhashcopy = memdup_user(
                                          &ci->cc_princhash.cp_data,
                                          princhashlen);
                                  if (IS_ERR_OR_NULL(princhashcopy))
                                          return -EFAULT;
                                  princhash.data = princhashcopy;
                                  princhash.len = princhashlen;''',
              'princhashcopy')

          # Legacy name allocation.
          sub_once(
              r'''name\.data = memdup_user\(&cnm->cn_id, namelen\);\n\s*if \(IS_ERR_OR_NULL\(name\.data\)\)\n\s*return -EFAULT;''',
              '''namecopy = memdup_user(&cnm->cn_id, namelen);
                          if (IS_ERR_OR_NULL(namecopy))
                                  return -EFAULT;
                          name.data = namecopy;''',
              'namecopy_legacy')

          sub_once(
              r'''memmove\(name\.data, name\.data \+ 5, name\.len\);''',
              '''name.data = name.data + 5;''',
              'legacy_hash_pointer')

          sub_once(
              r'''if \(!nfs4_client_to_reclaim\(name, princhash, nn\)\) \{\n\s*kfree\(name\.data\);\n\s*kfree\(princhash\.data\);\n\s*return -EFAULT;\n\s*\}''',
              '''if (!nfs4_client_to_reclaim(name, princhash, nn))
                          return -EFAULT;''',
              'callee_owns_copy')

          if '<<<<<<<' in s or '=======' in s or '>>>>>>>' in s:
              raise SystemExit('FAIL: conflict markers remain')
          p.write_text(s)
          PY

            # Semantic guards: keep Android hardening and ensure stable ownership
            # conversion was actually installed before continuing the cherry-pick.
            grep -Fq 'IS_ERR_OR_NULL(namecopy)' "$f"
            grep -Fq 'IS_ERR_OR_NULL(princhashcopy)' "$f"
            grep -Fq 'name.data = name.data + 5;' "$f"
            grep -Fq 'struct xdr_netobj name = { .len = strlen(dname), .data = dname };' "$f"
            grep -Fq 'name.data = kmemdup(name.data, name.len, GFP_KERNEL);' fs/nfsd/nfs4state.c

            git add -- "$f"
            git -c user.name='TicWatch LTS CI' -c user.email='ci@local' cherry-pick --continue
            echo "RESOLVED_ANDROID_AWARE=$c $f"
          }

          for n in 212 213 214 215 216 217 218 219 220; do
            tag="v5.15.$n"
            echo "=== CHECK MISSING COMMITS $prev -> $tag ==="
            git fetch -q stable "refs/tags/$tag:refs/tags/$tag"

            # Compare stable commits by patch-id against the current Android/ASB tree.
            # '-' means an equivalent patch already exists and must not be reapplied.
            missing="$(git cherry HEAD "$tag" "$prev" | awk '$1=="+"{print $2}')"
            total="$(git rev-list --count "$prev..$tag")"
            missing_count="$(printf '%s\n' "$missing" | sed '/^$/d' | wc -l)"
            echo "POINT_RELEASE=$tag TOTAL_COMMITS=$total MISSING_COMMITS=$missing_count"

            while read -r c; do
              [ -n "$c" ] || continue
              if ! grep -Fqx "$c" <<< "$missing"; then
                continue
              fi

              subject="$(git show -s --format=%s "$c")"
              echo "APPLY_COMMIT=$c $subject"
              if ! git -c user.name='TicWatch LTS CI' -c user.email='ci@local' cherry-pick -x "$c"; then
                conflicts="$(git diff --name-only --diff-filter=U)"

                if [ "$c" = '5540899da89461cf3bf17227d37cc9c0b73fe256' ]; then
                  if resolve_nfsd_515212_android_conflict "$c"; then
                    continue
                  fi
                fi

                if [ -z "$conflicts" ] && git diff --cached --quiet; then
                  echo "SKIP_EMPTY=$c"
                  git cherry-pick --skip
                  continue
                fi

                echo "FIRST_CONFLICT_TAG=$tag"
                echo "FIRST_CONFLICT_COMMIT=$c"
                echo "FIRST_CONFLICT_SUBJECT=$subject"
                echo "CONFLICT_FILES_BEGIN"
                printf '%s\n' "$conflicts"
                echo "CONFLICT_FILES_END"
                exit 42
              fi
            done < <(git rev-list --reverse --no-merges "$prev..$tag")

            current="$(awk '$1=="VERSION"{v=$3} $1=="PATCHLEVEL"{p=$3} $1=="SUBLEVEL"{s=$3} END{print v"."p"."s}' Makefile)"
            test "$current" = "5.15.$n"
            echo "POINT_RELEASE_COMPLETE=$current"
            prev="$tag"
          done

          final="$(awk '$1=="VERSION"{v=$3} $1=="PATCHLEVEL"{p=$3} $1=="SUBLEVEL"{s=$3} END{print v"."p"."s}' Makefile)"
          test "$final" = 5.15.220
          echo "UPLIFT_COMPLETE=$final"
