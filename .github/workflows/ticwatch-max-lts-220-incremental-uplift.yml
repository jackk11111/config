name: TicWatch MAX-LTS 5.15.220 Incremental Uplift

on:
  workflow_dispatch:
  push:
    branches:
      - ticwatch-max-lts-220-incremental
    paths:
      - '.github/workflows/ticwatch-max-lts-220-incremental-uplift.yml'

permissions:
  contents: read

concurrency:
  group: ticwatch-max-lts-220-incremental
  cancel-in-progress: true

jobs:
  uplift:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-max-lts-220-incremental

      - name: Prepare exact TicWatch 5.15.211 + September ASB
        shell: bash
        run: |
          set -Eeuo pipefail
          git init -q kernel
          git -C kernel remote add origin https://github.com/Winkmoon/android_kernel_TicWatch-Pro5.git
          git -C kernel fetch -q --depth=1 origin 3929c55fbc7559af6df290d2c0f66dc551af161a
          git -C kernel checkout -q --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = 3929c55fbc7559af6df290d2c0f66dc551af161a
          git -C kernel fetch -q --unshallow origin || true
          git -C kernel remote add aosp https://android.googlesource.com/kernel/common
          git -C kernel fetch -q aosp refs/tags/ASB-2026-09-08_13-5.15:refs/tags/ASB-2026-09-08_13-5.15
          test "$(git -C kernel rev-list -n1 refs/tags/ASB-2026-09-08_13-5.15)" = 56cdb4d13a91efb666d571084ab82de351cc4900
          git -C kernel -c user.name='TicWatch LTS CI' -c user.email='ci@local' merge --no-ff --no-edit refs/tags/ASB-2026-09-08_13-5.15
          ver="$(awk '$1=="VERSION"{v=$3} $1=="PATCHLEVEL"{p=$3} $1=="SUBLEVEL"{s=$3} END{print v"."p"."s}' kernel/Makefile)"
          test "$ver" = 5.15.211
          echo "BASE_READY=$ver + SEP-ASB"

      - name: Incremental stable uplift 5.15.212 to 5.15.220
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          for n in 212 213 214 215 216 217 218 219 220; do
            tag="v5.15.$n"
            echo "=== TRY $tag ==="
            git fetch -q stable "refs/tags/$tag:refs/tags/$tag"
            if ! git -c user.name='TicWatch LTS CI' -c user.email='ci@local' merge --no-ff --no-commit "refs/tags/$tag"; then
              echo "FIRST_CONFLICT=$tag"
              echo "CONFLICT_FILES_BEGIN"
              git diff --name-only --diff-filter=U
              echo "CONFLICT_FILES_END"
              exit 42
            fi
            git -c user.name='TicWatch LTS CI' -c user.email='ci@local' commit -m "TicWatch Android-compatible uplift to $tag"
            current="$(awk '$1=="VERSION"{v=$3} $1=="PATCHLEVEL"{p=$3} $1=="SUBLEVEL"{s=$3} END{print v"."p"."s}' Makefile)"
            echo "MERGED=$current"
          done
          final="$(awk '$1=="VERSION"{v=$3} $1=="PATCHLEVEL"{p=$3} $1=="SUBLEVEL"{s=$3} END{print v"."p"."s}' Makefile)"
          test "$final" = 5.15.220
          echo "UPLIFT_COMPLETE=$final"
