name: Wear7 DIAG4 build in-place patch V3

on:
  push:
    branches: [wear7-diag4-init-bisect-20261002]
    paths: ['.github/workflows/wear7-diag4-build-inplace-patch-v3.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs >/dev/null
          mkdir -p "$RUNNER_TEMP/w7/input" "$RUNNER_TEMP/w7/tools" "$RUNNER_TEMP/w7/parts" "$RUNNER_TEMP/w7/mnt" out-diag4
      - name: Download exact DIAG3 final super
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-DIAG3-Final-Super-V2
          path: ${{ runner.temp }}/w7/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '36913721664'
      - name: Fetch pinned tools
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"; ZIP="$W/tools/otatools.zip"
          curl -fL --retry 2 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          echo "f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84  $ZIP" | sha256sum -c -
          python3 - "$ZIP" "$W/tools/extracted" <<'PY'
          import pathlib,sys,zipfile
          o=pathlib.Path(sys.argv[2]).resolve(); wanted=('bin/simg2img','bin/lpunpack','bin/lpmake')
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n in wanted or n.startswith(('lib64/','lib/')):
                      p=(o/n).resolve()
                      if not p.is_relative_to(o): raise SystemExit('unsafe')
                      z.extract(n,o)
          PY
          rm -f "$ZIP"; chmod +x "$W/tools/extracted/bin/"*
      - name: Expand exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"; T="$W/tools/extracted"; export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          S=$(find "$W/input" -type f -name super_WEAR7_V11_DIAG3_FINAL.img -print -quit)
          test "$(stat -c %s "$S")" = 3837889664
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  '"$S" | sha256sum -c -
          simg2img "$S" "$W/source.raw"
          echo '725df162529100ddb924caa22a1f72db77189b00620d27a2450da4e9351e913e  '"$W/source.raw" | sha256sum -c -
          lpunpack "$W/source.raw" "$W/parts"
          cp "$W/parts/vendor.img" "$W/vendor.orig.img"
          echo "SOURCE_SPARSE=$S" >> "$GITHUB_ENV"
          printf '%s\n' 'SOURCE_SPARSE_SHA256=75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329' 'SOURCE_RAW_SHA256=725df162529100ddb924caa22a1f72db77189b00620d27a2450da4e9351e913e' > out-diag4/MANIFEST.txt
      - name: Insert markers preserving every original rc byte
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"; mkdir -p "$W/mnt/vendor"
          sudo mount -o loop,ro,noload "$W/parts/vendor.img" "$W/mnt/vendor"
          python3 - "$W/parts/vendor.img" "$W/mnt/vendor" "$W" out-diag4 <<'PY'
          import pathlib,subprocess,sys,re,hashlib,json
          vendor=pathlib.Path(sys.argv[1]); root=pathlib.Path(sys.argv[2]); w=pathlib.Path(sys.argv[3]); out=pathlib.Path(sys.argv[4])
          specs=[
            ('etc/init/android.hardware.keymaster@4.1-service-qti.rc',b'start vendor.keymaster-4-1',b'/metadata/vold/d/04','AFTER_KEYMASTER_START'),
            ('etc/init/qseecomd.rc',b'start vendor.qseecomd',b'/metadata/vold/d/12','AFTER_QSEECOMD_START'),
            ('etc/init/vendor.qti.hardware.qseecom@1.0-service.rc',b'start qseecom-service',b'/metadata/vold/d/17','AFTER_QSEECOM_SERVICE_START'),
          ]
          info=subprocess.check_output(['tune2fs','-l',str(vendor)],text=True,stderr=subprocess.STDOUT)
          bs=int(re.search(r'^Block size:\s*(\d+)',info,re.M).group(1)); maxblk=vendor.stat().st_size//bs
          rows=[]
          for rel,start,mpath,label in specs:
              old=(root/rel).read_bytes()
              # Locate exact line ending; preserve all old bytes verbatim and insert one command after it.
              pat=re.compile(rb'(^[ \t]*'+re.escape(start)+rb'[ \t]*\r?\n)',re.M)
              ms=list(pat.finditer(old))
              if len(ms)!=1: raise SystemExit(f'{rel}: start line hits={len(ms)}')
              marker=b'    chmod 0777 '+mpath+b'\n'
              pos=ms[0].end(); new=old[:pos]+marker+old[pos:]
              if new[:pos]!=old[:pos] or new[pos+len(marker):]!=old[pos:]: raise SystemExit('old byte preservation failed')
              proc=subprocess.run(['debugfs','-R',f'blocks /{rel}',str(vendor)],text=True,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=True)
              blocks=[int(x) for x in re.findall(r'\b\d+\b',proc.stdout) if 0<int(x)<maxblk]
              need=(len(new)+bs-1)//bs
              if len(blocks)<need: raise SystemExit(f'{rel}: needs new data block oldsize={len(old)} newsize={len(new)} blocks={blocks}')
              # Write new file data into the same already allocated ext4 blocks.
              with vendor.open('r+b',buffering=0) as f:
                  p=0
                  for block in blocks[:need]:
                      take=min(bs,len(new)-p); f.seek(block*bs); f.write(new[p:p+take]); p+=take
              # Only inode size changes; debugfs/libext2fs updates the inode checksum correctly.
              subprocess.run(['debugfs','-w','-R',f'set_inode_field /{rel} size {len(new)}',str(vendor)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,check=True)
              rows.append({'label':label,'file':rel,'marker':mpath.decode(),'old_size':len(old),'new_size':len(new),'old_sha256':hashlib.sha256(old).hexdigest(),'new_sha256':hashlib.sha256(new).hexdigest(),'fs_blocks':blocks[:need]})
          (out/'MARKERS.json').write_text(json.dumps(rows,indent=2)+'\n')
          (out/'MARKERS.txt').write_text('\n'.join(f"{r['marker']} {r['label']} old={r['old_size']} new={r['new_size']}" for r in rows)+'\n')
          print((out/'MARKERS.txt').read_text())
          PY
          sudo umount "$W/mnt/vendor"
          e2fsck -fn "$W/parts/vendor.img" | tee out-diag4/VENDOR_E2FSCK.txt
      - name: Verify rc byte preservation and markers
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"; mkdir -p "$W/mnt/vendor"
          sudo mount -o loop,ro,noload "$W/parts/vendor.img" "$W/mnt/vendor"
          grep -Fq 'chmod 0777 /metadata/vold/d/04' "$W/mnt/vendor/etc/init/android.hardware.keymaster@4.1-service-qti.rc"
          grep -Fq 'chmod 0777 /metadata/vold/d/12' "$W/mnt/vendor/etc/init/qseecomd.rc"
          grep -Fq 'chmod 0777 /metadata/vold/d/17' "$W/mnt/vendor/etc/init/vendor.qti.hardware.qseecom@1.0-service.rc"
          python3 - "$W/vendor.orig.img" "$W/parts/vendor.img" "$W/mnt/vendor" out-diag4/MARKERS.json <<'PY'
          import sys,json,pathlib,hashlib
          rows=json.load(open(sys.argv[4])); root=pathlib.Path(sys.argv[3])
          for r in rows:
              b=(root/r['file']).read_bytes()
              assert len(b)==r['new_size'] and hashlib.sha256(b).hexdigest()==r['new_sha256']
          print('RC_RUNTIME_VIEW=PASS')
          PY
          sudo umount "$W/mnt/vendor"
      - name: Prove exact LP layout and build target raw
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"; T="$W/tools/extracted"; export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          build() { lpmake --metadata-size 65536 --metadata-slots 2 --super-name super --device super:4294967296 --group qti_dynamic_partitions:4284481536 --partition system:readonly:1741303808:qti_dynamic_partitions --image system="$W/parts/system.img" --partition system_ext:readonly:283598848:qti_dynamic_partitions --image system_ext="$W/parts/system_ext.img" --partition product:readonly:1613258752:qti_dynamic_partitions --image product="$W/parts/product.img" --partition vendor:readonly:297361408:qti_dynamic_partitions --image vendor="$1" --partition vendor_dlkm:readonly:63889408:qti_dynamic_partitions --image vendor_dlkm="$W/parts/vendor_dlkm.img" --partition system_dlkm:readonly:348160:qti_dynamic_partitions --image system_dlkm="$W/parts/system_dlkm.img" --output "$2"; }
          build "$W/vendor.orig.img" "$W/rebuilt.raw"
          R=$(sha256sum "$W/rebuilt.raw"|awk '{print $1}'); echo "REBUILT_SOURCE_RAW_SHA256=$R" | tee -a out-diag4/MANIFEST.txt
          test "$R" = 725df162529100ddb924caa22a1f72db77189b00620d27a2450da4e9351e913e
          cmp "$W/source.raw" "$W/rebuilt.raw"; rm "$W/rebuilt.raw"
          echo 'SOURCE_LAYOUT_REPRODUCTION=PASS' | tee -a out-diag4/MANIFEST.txt
          build "$W/parts/vendor.img" "$W/target.raw"
          TGT=$(sha256sum "$W/target.raw"|awk '{print $1}'); echo "TARGET_RAW_SHA256=$TGT" | tee -a out-diag4/MANIFEST.txt; echo "TARGET_RAW_SHA=$TGT" >> "$GITHUB_ENV"
      - name: Derive and prove sparse in-place patch
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7"; T="$W/tools/extracted"; export PATH="$T/bin:$PATH" LD_LIBRARY_PATH="$T/lib64:$T/lib"
          python3 - "$W/source.raw" "$W/target.raw" "$SOURCE_SPARSE" "$W/patched.sparse" out-diag4 <<'PY'
          import pathlib,sys,struct,hashlib,json,base64,shutil
          a=pathlib.Path(sys.argv[1]); b=pathlib.Path(sys.argv[2]); sp=pathlib.Path(sys.argv[3]); outsp=pathlib.Path(sys.argv[4]); out=pathlib.Path(sys.argv[5]); BS=4096
          changed=[]
          with a.open('rb',buffering=0) as fa,b.open('rb',buffering=0) as fb:
              n=0
              while True:
                  x=fa.read(BS); y=fb.read(BS)
                  if not x and not y: break
                  if x!=y: changed.append((n,x,y))
                  n+=1
          wanted={n for n,_,_ in changed}; mp={}
          with sp.open('rb') as f:
              magic,maj,minv,fhs,chs,bs,total,nc,ck=struct.unpack('<IHHHHIIII',f.read(28))
              if (magic,bs,fhs,chs)!=(0xED26FF3A,BS,28,12): raise SystemExit('bad sparse')
              rb=0
              for _ in range(nc):
                  typ,res,cnt,ts=struct.unpack('<HHII',f.read(12)); payload=f.tell()
                  for q in wanted:
                      if rb<=q<rb+cnt:
                          if typ!=0xCAC1: raise SystemExit(f'raw block {q} maps to non-RAW chunk {typ:#x}')
                          mp[q]=payload+(q-rb)*BS
                  if typ==0xCAC1:f.seek(cnt*BS,1)
                  elif typ in (0xCAC2,0xCAC4):f.seek(4,1)
                  elif typ==0xCAC3:pass
                  else:raise SystemExit('chunk')
                  rb+=cnt
          if len(mp)!=len(changed): raise SystemExit('map incomplete')
          rec=[]
          for n,x,y in changed:
              i=0
              while i<BS:
                  if x[i]==y[i]:i+=1;continue
                  j=i+1
                  while j<BS and x[j]!=y[j]:j+=1
                  rec.append({'raw_block':n,'sparse_offset':mp[n]+i,'length':j-i,'old_b64':base64.b64encode(x[i:j]).decode(),'new_b64':base64.b64encode(y[i:j]).decode()});i=j
          shutil.copyfile(sp,outsp)
          with outsp.open('r+b',buffering=0) as f:
              for r in rec:
                  o=base64.b64decode(r['old_b64']); nn=base64.b64decode(r['new_b64']); f.seek(r['sparse_offset']); g=f.read(len(o));
                  if g!=o:raise SystemExit('old mismatch')
                  f.seek(r['sparse_offset']);f.write(nn)
          tsha=hashlib.sha256(outsp.read_bytes()).hexdigest()
          d={'format':1,'source_sparse_sha256':'75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329','target_sparse_sha256':tsha,'target_raw_sha256':hashlib.sha256(b.read_bytes()).hexdigest(),'changed_raw_blocks':len(changed),'records':rec}
          (out/'DIAG4_PATCH.json').write_text(json.dumps(d,indent=2)+'\n')
          print('CHANGED_RAW_BLOCKS='+str(len(changed)));print('PATCH_RECORDS='+str(len(rec)));print('TARGET_SPARSE_SHA256='+tsha)
          PY
          simg2img "$W/patched.sparse" "$W/patched.raw"
          echo "$TARGET_RAW_SHA  $W/patched.raw" | sha256sum -c -
          cmp "$W/patched.raw" "$W/target.raw"
          TS=$(sha256sum "$W/patched.sparse"|awk '{print $1}'); echo "TARGET_SPARSE_SHA256=$TS" | tee -a out-diag4/MANIFEST.txt; echo 'PATCHED_SPARSE_ROUNDTRIP=PASS' | tee -a out-diag4/MANIFEST.txt
      - name: Print results
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '===== MANIFEST ====='; cat out-diag4/MANIFEST.txt
          echo '===== MARKERS ====='; cat out-diag4/MARKERS.txt
          echo '===== PATCH_JSON ====='; cat out-diag4/DIAG4_PATCH.json
      - name: Upload compact patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wear7-DIAG4-InPlace-Patch-V3
          path: out-diag4/
          if-no-files-found: error
          retention-days: 60
          compression-level: 9
