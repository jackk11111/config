name: Wear7 signed vbmeta flags0 recovery gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wear7-signed-vbmeta-flags0-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-signed-vbmeta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download exact previously-tested hotfix vbmeta
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Wear7-Run16-VBMeta-Stock-HW-Bindings-Hotfix
          path: ${{ runner.temp }}/src
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '37311472755'

      - name: Pin qualified avbtool
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --no-checkout https://android.googlesource.com/kernel/prebuilts/build-tools "$RUNNER_TEMP/build-tools"
          git -C "$RUNNER_TEMP/build-tools" fetch --depth=1 origin 010d8a83d84ced4beef7779453766350db8c08cd
          git -C "$RUNNER_TEMP/build-tools" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/build-tools" rev-parse HEAD)" = 010d8a83d84ced4beef7779453766350db8c08cd
          echo "$RUNNER_TEMP/build-tools/linux-x86/bin" >> "$GITHUB_PATH"

      - name: Build one-variable signed flags0 vbmeta gate
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="$RUNNER_TEMP/src/vbmeta-W7-STOCK-HW-BINDINGS.img"
          OUT="$GITHUB_WORKSPACE/vbmeta-W7-SIGNED-FLAGS0.img"
          KEY="$RUNNER_TEMP/w7-test-rsa4096.pem"

          test -s "$SRC"
          echo 'a3c87f30d46df453c6ac3822c59fc61a622169fd75cd1efa5419e73db85ad3cd  '"$SRC" | sha256sum -c -

          avbtool info_image --image "$SRC" > old.txt
          grep -q '^Algorithm:[[:space:]]*NONE$' old.txt
          grep -q '^Flags:[[:space:]]*3$' old.txt
          grep -q "com.android.build.boot.os_version -> '13'" old.txt
          grep -q "com.android.build.boot.security_patch -> '2024-11-01'" old.txt

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$KEY" >/dev/null 2>&1

          avbtool make_vbmeta_image \
            --output "$OUT" \
            --algorithm SHA256_RSA4096 \
            --key "$KEY" \
            --flags 0 \
            --padding_size 8192 \
            --include_descriptors_from_image "$SRC"

          test "$(stat -c %s "$OUT")" = 8192
          avbtool info_image --image "$OUT" > new.txt
          grep -q '^Algorithm:[[:space:]]*SHA256_RSA4096$' new.txt
          grep -q '^Flags:[[:space:]]*0$' new.txt
          grep -q "com.android.build.boot.os_version -> '13'" new.txt
          grep -q "com.android.build.boot.security_patch -> '2024-11-01'" new.txt

          awk '/^Descriptors:/{f=1} f' old.txt > old.desc
          awk '/^Descriptors:/{f=1} f' new.txt > new.desc
          cmp old.desc new.desc

          set +e
          avbtool verify_image --image "$OUT" --key "$KEY" > verify.txt 2>&1
          VRC=$?
          set -e
          grep -q 'Successfully verified SHA256_RSA4096 vbmeta struct' verify.txt
          grep -q "No such file or directory: .*boot.img" verify.txt
          echo "VERIFY_EXPECTED_REFERENCED_IMAGE_RC=$VRC" >> verify.txt

          sha256sum "$OUT" | tee SHA256SUMS.txt
          {
            echo 'SOURCE_VBMETA_SHA256=a3c87f30d46df453c6ac3822c59fc61a622169fd75cd1efa5419e73db85ad3cd'
            echo 'SOURCE_ALGORITHM=NONE'
            echo 'SOURCE_FLAGS=3'
            echo 'NEW_ALGORITHM=SHA256_RSA4096'
            echo 'NEW_FLAGS=0'
            echo 'DESCRIPTORS_BYTE_TEXT=IDENTICAL'
            echo 'VBMETA_SIGNATURE=PASS'
            echo 'PURPOSE=single-variable recovery mountFstab gate'
          } > README.txt

      - name: Upload signed vbmeta gate
        uses: actions/upload-artifact@v4
        with:
          name: Wear7-Run16-Signed-Flags0-VBMeta-Gate
          path: |
            vbmeta-W7-SIGNED-FLAGS0.img
            SHA256SUMS.txt
            README.txt
            verify.txt
          if-no-files-found: error
