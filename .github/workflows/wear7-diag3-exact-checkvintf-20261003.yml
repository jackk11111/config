name: Wear7 exact DIAG3 official checkvintf

on:
  push:
    paths:
      - '.github/workflows/wear7-diag3-exact-checkvintf-20261003.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs erofs-utils >/dev/null
          W="$RUNNER_TEMP/w7vintf"
          mkdir -p "$W/input" "$W/tools" "$W/parts" "$W/mnt" "$W/apex" report

      - name: Download exact DIAG3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7vintf"
          gh release download wear7-diag3-final-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' --dir "$W/input"
          cat "$W"/input/super_WEAR7_V11_DIAG3_FINAL.img.part* > "$W/super.img"
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  '"$W/super.img" | sha256sum -c -
          sha256sum "$W/super.img" | tee report/SOURCE_SHA256.txt

      - name: Pin Android17 host tools
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7vintf"
          ZIP="$W/tools/otatools.zip"
          curl -fL --retry 3 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
          echo 'f1da1fb14ad810835679abd5f8a30c0e4f4c5b6210d355b7e1995bc51d739d84  '"$ZIP" | sha256sum -c -
          python3 - "$ZIP" "$W/tools/x" <<'PY'
          import pathlib,sys,zipfile
          z=zipfile.ZipFile(sys.argv[1]); out=pathlib.Path(sys.argv[2]).resolve()
          wanted={'bin/checkvintf','bin/lpunpack','bin/apexd_host','bin/fsck.erofs','bin/simg2img'}
          keep=[n for n in z.namelist() if n in wanted or n.startswith(('lib64/','lib/'))]
          if wanted-set(keep): raise SystemExit('missing host tools: '+','.join(sorted(wanted-set(keep))))
          for n in keep:
              p=(out/n).resolve()
              if not p.is_relative_to(out): raise SystemExit('unsafe')
              z.extract(n,out)
          PY
          chmod +x "$W/tools/x/bin/"*
          echo "HOST=$W/tools/x" >> "$GITHUB_ENV"

      - name: Unpack and mount exact DIAG3
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7vintf"
          export PATH="$HOST/bin:$PATH" LD_LIBRARY_PATH="$HOST/lib64:$HOST/lib"
          "$HOST/bin/simg2img" "$W/super.img" "$W/super.raw"
          test "$(stat -c %s "$W/super.raw")" = 4294967296
          "$HOST/bin/lpunpack" "$W/super.raw" "$W/parts"
          rm -f "$W/super.raw"
          for p in system system_ext product vendor; do
            mkdir -p "$W/mnt/$p"
            fstype=$(blkid -s TYPE -o value "$W/parts/$p.img" || true)
            echo "$p=$fstype" | tee -a report/FILESYSTEMS.txt
            case "$fstype" in
              ext4) sudo mount -o loop,ro,noload "$W/parts/$p.img" "$W/mnt/$p" ;;
              erofs) sudo mount -t erofs -o loop,ro "$W/parts/$p.img" "$W/mnt/$p" ;;
              *) echo "unsupported $p:$fstype"; exit 1 ;;
            esac
          done
          if [ -d "$W/mnt/system/system/etc/vintf" ]; then SYS="$W/mnt/system/system"; else SYS="$W/mnt/system"; fi
          SX="$W/mnt/system_ext"; PROD="$W/mnt/product"; VEN="$W/mnt/vendor"; ODM="$VEN/odm"
          printf 'SYS=%s\nSX=%s\nPROD=%s\nVEN=%s\nODM=%s\n' "$SYS" "$SX" "$PROD" "$VEN" "$ODM" >> "$GITHUB_ENV"
          ls -la "$SYS/etc/vintf" | tee report/SYSTEM_VINTF_LIST.txt
          grep -R -n -E 'vendor-ndk|<version>33</version>|level="|target-level=' "$SYS/etc/vintf" "$VEN/etc/vintf" 2>/dev/null | tee report/VINTF_KEY_LINES.txt || true
          find "$SYS/apex" "$SX/apex" "$PROD/apex" "$VEN/apex" -maxdepth 2 -type f -o -type d 2>/dev/null | grep -E 'vndk|apex$' | tee report/VNDK_APEX_PATHS.txt || true

      - name: Activate exact DIAG3 APEX set
        shell: bash
        run: |
          set -Eeuo pipefail
          W="$RUNNER_TEMP/w7vintf"
          export LD_LIBRARY_PATH="$HOST/lib64:$HOST/lib"
          rm -rf "$W/apex"; mkdir -p "$W/apex"
          "$HOST/bin/apexd_host" --tool_path "$HOST" --apex_path "$W/apex" --system_path "$SYS" --system_ext_path "$SX" --product_path "$PROD" --vendor_path "$VEN" --odm_path "$ODM" > report/APEXD_HOST_STDOUT.txt 2> report/APEXD_HOST_STDERR.txt
          test -s "$W/apex/apex-info-list.xml"
          cp "$W/apex/apex-info-list.xml" report/APEX_INFO_LIST.xml
          grep -E 'vndk|moduleName=' report/APEX_INFO_LIST.xml | tee report/APEX_VNDK_LINES.txt || true
          echo "APEXMAP=$W/apex" >> "$GITHUB_ENV"

      - name: Official Android17 checkvintf exact gate
        shell: bash
        run: |
          set -Eeuo pipefail
          export LD_LIBRARY_PATH="$HOST/lib64:$HOST/lib"
          set +e
          "$HOST/bin/checkvintf" --check-compat \
            --dirmap "/system:$SYS" \
            --dirmap "/system_ext:$SX" \
            --dirmap "/product:$PROD" \
            --dirmap "/vendor:$VEN" \
            --dirmap "/odm:$ODM" \
            --dirmap "/apex:$APEXMAP" \
            --property 'ro.product.first_api_level=30' \
            --property 'ro.boot.product.hardware.sku=' \
            --property 'ro.boot.product.vendor.sku=monaco' \
            > report/CHECKVINTF_STDOUT.txt 2> report/CHECKVINTF_STDERR.txt
          rc=$?
          set -e
          echo "CHECKVINTF_EXIT=$rc" | tee report/CHECKVINTF_EXIT.txt
          cat report/CHECKVINTF_STDOUT.txt
          cat report/CHECKVINTF_STDERR.txt >&2
          if [ "$rc" = 0 ] && tail -n1 report/CHECKVINTF_STDOUT.txt | grep -q '^COMPATIBLE$'; then
            echo EXACT_DIAG3_CHECKVINTF=PASS | tee report/VERDICT.txt
          else
            echo EXACT_DIAG3_CHECKVINTF=FAIL | tee report/VERDICT.txt
            exit 1
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          W="$RUNNER_TEMP/w7vintf"
          for p in system system_ext product vendor; do sudo umount "$W/mnt/$p" 2>/dev/null; done
          sudo chown -R "$(id -u):$(id -g)" report 2>/dev/null

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wear7-DIAG3-Exact-CheckVintf-20261003
          path: report/
          if-no-files-found: error
          retention-days: 60
