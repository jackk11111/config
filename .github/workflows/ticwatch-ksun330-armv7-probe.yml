name: TicWatch KSU Next 3.3.0 - armv7 probe

on:
  push:
    branches:
      - ticwatch-ksun330-armv7-probe
    paths:
      - '.github/workflows/ticwatch-ksun330-armv7-probe.yml'
  workflow_dispatch:

jobs:
  armv7-ksud:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout probe
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libclang-dev file

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK
        run: |
          yes | sdkmanager 'ndk;27.3.13750724'
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Fetch exact KernelSU Next v3.3.0
        run: |
          git init -q KSUN
          git -C KSUN remote add origin https://github.com/KernelSU-Next/KernelSU-Next.git
          git -C KSUN fetch -q --depth=1 origin 3b18216f71df189ab3d1b1ce0bdb21be1268e771
          git -C KSUN checkout -q --detach FETCH_HEAD
          test "$(git -C KSUN rev-parse HEAD)" = "3b18216f71df189ab3d1b1ce0bdb21be1268e771"

      - name: Setup Rust armv7 Android target
        run: |
          rustup target add armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: Build unmodified KSU Next 3.3.0 ksud code for armv7
        env:
          BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi: >-
            --sysroot=${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            -I${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/arm-linux-androideabi
            -I${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
        run: |
          cd KSUN/userspace/ksud
          cargo ndk -t armeabi-v7a -P 26 build --release
          test -x target/armv7-linux-androideabi/release/ksud
          file target/armv7-linux-androideabi/release/ksud | tee "$GITHUB_WORKSPACE/armv7-file.txt"
          sha256sum target/armv7-linux-androideabi/release/ksud | tee "$GITHUB_WORKSPACE/armv7-sha256.txt"

      - name: Check embedded helper architecture policy
        run: |
          grep -n -A8 -B4 'IF NOT x86_64 ANDROID' KSUN/userspace/ksud/src/assets.rs | tee armv7-assets-policy.txt
          if grep -q '#\[folder = "bin/aarch64"\]' KSUN/userspace/ksud/src/assets.rs; then
            echo 'ARMV7_KSUD_COMPILES_BUT_EMBEDS_AARCH64_HELPERS=1' | tee -a armv7-assets-policy.txt
          else
            echo 'ARMV7_ASSET_POLICY_CHANGED=1' | tee -a armv7-assets-policy.txt
          fi

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksun330-armv7-probe
          path: |
            armv7-file.txt
            armv7-sha256.txt
            armv7-assets-policy.txt
            KSUN/userspace/ksud/target/armv7-linux-androideabi/release/ksud
          if-no-files-found: ignore
