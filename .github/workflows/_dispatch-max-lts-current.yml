name: Dispatch current MAX-LTS V2

on:
  push:
    branches:
      - ticwatch-max-lts-211
    paths:
      - '.github/workflows/_dispatch-max-lts-current.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch V2 on current branch HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ticwatch-max-lts-211-build-v2.yml --repo "$GITHUB_REPOSITORY" --ref ticwatch-max-lts-211
