name: Wear7 locate exact stock379 VNDK33 APEX

on:
  workflow_dispatch:
  push:
    branches: [wear7-rom-staging]
    paths: ['.github/workflows/wear7-locate-vndk33-apex.yml']

permissions:
  contents: read

env:
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: wear7-rom-staging
          fetch-depth: 1
      - name: Download and inspect stock379
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null; sudo apt-get install -y curl unzip e2fsprogs file >/dev/null
          mkdir -p "$RUNNER_TEMP/mnt/system" "$RUNNER_TEMP/mnt/system_ext" "$RUNNER_TEMP/mnt/product" report
          curl -fL --retry 3 --retry-delay 3 -o "$RUNNER_TEMP/tic379.zip" "$TIC_URL"
          echo "$TIC_SHA256  $RUNNER_TEMP/tic379.zip" | sha256sum -c -
          for p in system system_ext product; do
            python3 wear7/scripts/reconstruct_block_ota.py "$RUNNER_TEMP/tic379.zip" "$p" "$RUNNER_TEMP/$p.raw"
            sudo mount -o loop,ro "$RUNNER_TEMP/$p.raw" "$RUNNER_TEMP/mnt/$p"
            echo "=== $p ROOT ===" | tee -a report/ROOT_LISTING.txt
            sudo find "$RUNNER_TEMP/mnt/$p" -maxdepth 3 -iname '*vndk*' -printf '%y\t%p\t%l\n' | sort | tee "report/${p}_VNDK_FIND.txt"
            sudo find "$RUNNER_TEMP/mnt/$p" -maxdepth 3 \( -path '*/apex/*' -o -path '*/apex' \) -printf '%y\t%p\t%l\n' | sort | grep -Ei 'vndk|com.android' | head -n 500 | tee "report/${p}_APEX_LIST.txt" || true
          done
          grep -R -E 'vndk\.v33|vndk.*33|com\.android\.vndk' report/*_VNDK_FIND.txt report/*_APEX_LIST.txt | tee report/VNDK33_LOCATIONS.txt || true
          test -s report/VNDK33_LOCATIONS.txt
      - name: Cleanup
        if: always()
        run: |
          for p in system system_ext product; do sudo umount "$RUNNER_TEMP/mnt/$p" 2>/dev/null || true; done
          sudo chown -R "$(id -u):$(id -g)" report 2>/dev/null || true
          find report -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > report/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Wear7-Stock379-VNDK33-Locate
          path: report/
          retention-days: 30
          compression-level: 9
