name: TicWatch MAX-LTS 5.15.211 - Slatecom PM Fix

on:
  workflow_dispatch:
  push:
    branches:
      - ticwatch-max-lts-211
    paths:
      - '.github/workflows/ticwatch-max-lts-211-slatecom-fix.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ticwatch-max-lts-211-slatecom-fix
  cancel-in-progress: true

env:
  LLVM_VERSION: '20.1.0'
  LLVM_ARCHIVE: 'LLVM-20.1.0-Linux-X64.tar.xz'
  BASE_KERNEL_SHA: '3929c55fbc7559af6df290d2c0f66dc551af161a'
  AOSP_LTS_TIP: '7dfb6fc41ea7e4dd2c49fffcba48e86979ad5508'
  EXPECTED_MERGE_BASE: 'fc88a7504f0f262cc5b2e8a7f58b2a1108034856'
  EXPECTED_UTS_PREFIX: '5.15.211-Xinran_StarBai-Test'
  PREVIOUS_RUN_ID: '34655933953'
  PREVIOUS_ARTIFACT: 'TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter'
  MANAGER_APK: 'KernelSU_Next_v3.3.0-spoofed-TicWatch-armeabi-v7a-release.apk'
  MANAGER_APK_SHA256: '8310faebd2b592ccddd6a15a6d996c70d89cd679eb51835e84d18f531471357b'
  KSU_NEXT_MANAGER_SIZE: '0x3c2'
  KSU_NEXT_MANAGER_HASH: '3bc9938c38106bcf618bbe1d37ad4adde8a49c659e2860709bbfc341f7e749f2'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout MAX-LTS orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ticwatch-max-lts-211

      - name: Free space and install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc python3 python-is-python3 \
            libssl-dev libelf-dev dwarves make cmake zip unzip curl wget \
            gnupg gawk gcc-multilib g++-multilib ccache rsync file \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf

      - name: Retrieve known-good MAX-LTS bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p previous
          gh run download "$PREVIOUS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PREVIOUS_ARTIFACT" --dir previous
          test -s "previous/$MANAGER_APK"
          printf '%s  %s\n' "$MANAGER_APK_SHA256" "previous/$MANAGER_APK" | sha256sum -c -
          cp "previous/$MANAGER_APK" "$GITHUB_WORKSPACE/$MANAGER_APK"
          test -s previous/wireless-flasher/busybox
          test -s previous/wireless-flasher/magiskboot
          test -s previous/wireless-flasher/flash.sh
          test -s previous/TicWatch-MAX-LTS-5.15.211-KSUN330-SuSFS-SeccompFilter.zip

      - name: Install exact LLVM 20.1.0
        shell: bash
        run: |
          set -Eeuo pipefail
          wget -q --show-progress "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_ARCHIVE}"
          tar -xJf "$LLVM_ARCHIVE"
          mv "LLVM-${LLVM_VERSION}-Linux-X64" "$GITHUB_WORKSPACE/aosp-clang"
          rm -f "$LLVM_ARCHIVE"
          echo "AOSP_CLANG_PATH=$GITHUB_WORKSPACE/aosp-clang" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/aosp-clang/bin/clang" --version | tee llvm-version.txt
          "$GITHUB_WORKSPACE/aosp-clang/bin/clang" --version | head -n1 | grep -Fq '20.1.0'

      - name: S6.1 Prepare TicWatch base up to LTS insertion point
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -i \
            -e "s|^KSUN_MANAGER=.*|KSUN_MANAGER=\"$MANAGER_APK\"|" \
            -e "s|^KSUN_MANAGER_SHA256=.*|KSUN_MANAGER_SHA256=\"$MANAGER_APK_SHA256\"|" \
            ticwatch-ultimate/preflight.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ticwatch-ultimate/preflight.sh')
          s=p.read_text()
          anchor='pass "LOCALVERSION matches installed Xinran_StarBai-Test baseline"\n'
          replacement=anchor + 'printf "BUILDV2_BASE_READY=1\\n" | tee -a "$REPORT"\nexit 0\n'
          if s.count(anchor) != 1:
              raise SystemExit('preflight LTS insertion anchor changed')
          p.write_text(s.replace(anchor, replacement, 1))
          PY
          bash ticwatch-ultimate/preflight.sh
          test -d .ticwatch-preflight/common/.git
          grep -Fqx 'BUILDV2_BASE_READY=1' ticwatch-ultimate-results/preflight.txt

      - name: S6.2 Fetch pinned Android-common 5.15.211 tip
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch -q --unshallow origin
          fi
          git remote remove aosp >/dev/null 2>&1 || true
          git remote add aosp https://android.googlesource.com/kernel/common
          git fetch -q aosp "$AOSP_LTS_TIP"
          git cat-file -e "$AOSP_LTS_TIP^{commit}"

      - name: S6.3 Verify expected merge base
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          merge_base="$(git merge-base HEAD "$AOSP_LTS_TIP")"
          echo "MERGE_BASE=$merge_base"
          test "$merge_base" = "$EXPECTED_MERGE_BASE"

      - name: S6.4 Merge Android-common 5.15.211
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          if ! git -c user.name='TicWatch LTS CI' -c user.email='ci@local' \
              merge --no-ff --no-edit "$AOSP_LTS_TIP" >"$GITHUB_WORKSPACE/lts-merge-summary.txt" 2>&1; then
            echo 'MERGE_RESULT=FAIL'
            git diff --name-only --diff-filter=U | head -n 50 || true
            tail -n 20 "$GITHUB_WORKSPACE/lts-merge-summary.txt" || true
            exit 1
          fi
          echo 'MERGE_RESULT=PASS'

      - name: S6.5 Verify merge completeness and ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          test -z "$(git diff --name-only --diff-filter=U)"
          git merge-base --is-ancestor "$AOSP_LTS_TIP" HEAD

      - name: S6.6 Verify Makefile version is 5.15.211
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          version="$(awk '$1=="VERSION"{v=$3} $1=="PATCHLEVEL"{p=$3} $1=="SUBLEVEL"{s=$3} END{print v"."p"."s}' Makefile)"
          echo "MAKEFILE_VERSION=$version"
          test "$version" = '5.15.211'

      - name: S6.7 Save clean LTS merged head
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/lts-merged-head.txt"

      - name: S6.8 Continue KSU Next and SuSFS preflight on verified LTS tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- ticwatch-ultimate/preflight.sh
          sed -i \
            -e "s|^KSUN_MANAGER=.*|KSUN_MANAGER=\"$MANAGER_APK\"|" \
            -e "s|^KSUN_MANAGER_SHA256=.*|KSUN_MANAGER_SHA256=\"$MANAGER_APK_SHA256\"|" \
            ticwatch-ultimate/preflight.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ticwatch-ultimate/preflight.sh')
          s=p.read_text()
          old='''mkdir -p "$(dirname "$REPORT")"\nrm -rf "$ROOT"\nmkdir -p "$ROOT"\n: > "$REPORT"\n'''
          new='''mkdir -p "$(dirname "$REPORT")"\n[ -d "$ROOT/common/.git" ] || { echo "FAIL: verified LTS common tree missing" >&2; exit 1; }\n: >> "$REPORT"\n'''
          if s.count(old) != 1:
              raise SystemExit('preflight root initialization anchor changed')
          s=s.replace(old,new,1)
          start=s.index('log "TicWatch Ultimate 5.15 / KernelSU Next v3.3.0 + SuSFS v2.2.0 preflight"')
          end=s.index('log "[2/11] Fetch exact KernelSU Next v3.3.0 source"')
          intro='''log "TicWatch MAX-LTS 5.15.211 / KernelSU Next v3.3.0 + SuSFS v2.2.0 resume preflight"\nlog "REUSE_VERIFIED_LTS_TREE=1"\nlog ""\n'''
          p.write_text(s[:start] + intro + s[end:])
          PY
          REPORT="$GITHUB_WORKSPACE/ticwatch-ultimate-results/preflight.txt"
          LTS_HEAD="$(cat lts-merged-head.txt)"
          printf 'LTS_AOSP_TIP=%s\nLTS_MERGE_BASE=%s\nLTS_VERSION=5.15.211\nLTS_MERGE_COMMIT=%s\n' \
            "$AOSP_LTS_TIP" "$EXPECTED_MERGE_BASE" "$LTS_HEAD" | tee -a "$REPORT"
          set +e
          bash ticwatch-ultimate/preflight.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -E '^(\[[0-9]+/11\]|PASS:|FAIL:|RESULT=)' "$REPORT" | tail -n 25 || true
            exit "$rc"
          fi
          grep -Fqx 'RESULT=PASS' "$REPORT"
          cd .ticwatch-preflight/common
          test "$(awk '$1=="VERSION"{v=$3} $1=="PATCHLEVEL"{p=$3} $1=="SUBLEVEL"{s=$3} END{print v"."p"."s}' Makefile)" = '5.15.211'
          git merge-base --is-ancestor "$AOSP_LTS_TIP" HEAD

      - name: Preserve known-good first-zygote repair
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ticwatch-ultimate/fix-ksun330-susfs-first-zygote.sh
          grep -Fq 'DEFINE_STATIC_KEY_TRUE(is_first_zygote);' .ticwatch-preflight/common/KernelSU-Next/kernel/runtime/ksud_integration.c
          grep -Fq 'static_branch_disable(&is_first_zygote);' .ticwatch-preflight/common/KernelSU-Next/kernel/runtime/ksud_integration.c

      - name: Keep Seccomp FILTER for crowned Manager
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.ticwatch-preflight/common/KernelSU-Next/kernel/hook/setuid_hook.c')
          s=p.read_text()
          old='''    if (likely(ksu_is_manager_appid_valid()) && unlikely(is_uid_manager(ruid))) {\n        disable_seccomp();\n        pr_info("install fd for manager: %d\\n", ruid);\n        ksu_install_fd();\n        return 0;\n    }\n'''
          new='''    if (likely(ksu_is_manager_appid_valid()) && unlikely(is_uid_manager(ruid))) {\n        /* Keep Android's seccomp filter and allow only the KSU reboot supercall. */\n        if (current->seccomp.mode == SECCOMP_MODE_FILTER && current->seccomp.filter) {\n            spin_lock_irq(&current->sighand->siglock);\n            ksu_seccomp_allow_cache(current->seccomp.filter, __NR_reboot);\n            spin_unlock_irq(&current->sighand->siglock);\n        }\n        pr_info("install fd for manager: %d\\n", ruid);\n        ksu_install_fd();\n        return 0;\n    }\n'''
          if s.count(old)!=1:
              raise SystemExit('manager SuSFS seccomp anchor changed')
          p.write_text(s.replace(old,new,1))
          PY
          F=.ticwatch-preflight/common/KernelSU-Next/kernel/hook/setuid_hook.c
          grep -Fq 'ksu_seccomp_allow_cache(current->seccomp.filter, __NR_reboot);' "$F"

      - name: Apply proven ARM32 SuSFS syscall ABI fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.ticwatch-preflight/common/KernelSU-Next/userspace/ksud/src/susfsd.rs')
          s=p.read_text()
          if 'use libc::{syscall, SYS_reboot, c_char};' not in s:
              raise SystemExit('unexpected susfsd import layout')
          s=s.replace('use libc::{syscall, SYS_reboot, c_char};','use libc::{syscall, SYS_reboot, c_char, c_long};',1)
          repl={
            'syscall(SYS_reboot, KSU_INSTALL_MAGIC1, SUSFS_MAGIC, CMD_SUSFS_SHOW_VERSION, &mut cmd as *mut _);':'syscall(SYS_reboot as c_long, KSU_INSTALL_MAGIC1 as c_long, SUSFS_MAGIC as c_long, CMD_SUSFS_SHOW_VERSION as c_long, &mut cmd as *mut _);',
            'syscall(SYS_reboot, KSU_INSTALL_MAGIC1, SUSFS_MAGIC, CMD_SUSFS_SHOW_VARIANT, &mut cmd as *mut _);':'syscall(SYS_reboot as c_long, KSU_INSTALL_MAGIC1 as c_long, SUSFS_MAGIC as c_long, CMD_SUSFS_SHOW_VARIANT as c_long, &mut cmd as *mut _);',
            'syscall(SYS_reboot, KSU_INSTALL_MAGIC1, SUSFS_MAGIC, CMD_SUSFS_SHOW_ENABLED_FEATURES, &mut cmd as *mut _);':'syscall(SYS_reboot as c_long, KSU_INSTALL_MAGIC1 as c_long, SUSFS_MAGIC as c_long, CMD_SUSFS_SHOW_ENABLED_FEATURES as c_long, &mut cmd as *mut _);'
          }
          for old,new in repl.items():
              if s.count(old)!=1:
                  raise SystemExit('unexpected susfsd syscall layout')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Inject built-in slatecom PM notifier quirk
        shell: bash
        run: |
          set -Eeuo pipefail
          K=.ticwatch-preflight/common
          cat > "$K/kernel/slatecom_pm_nowarn.c" <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * TicWatch Pro 5/Enduro Mobvoi/QCOM slatecom PM notifier quirk.
           *
           * The vendor slatecom_spi.ko warns on valid PM_SUSPEND_PREPARE (3)
           * and PM_POST_SUSPEND (4) because those events fall into a WARN_ONCE
           * default branch. Do not patch vendor_dlkm: arm a kprobe only on the
           * exact known instruction in the vendor function and bypass that WARN
           * path only for events 3/4. Events 1/2 and unexpected events remain
           * on the vendor's original path.
           *
           * Exact known vendor function (current Mobvoi module):
           *   slatecom_pm_notifier size 0x110
           *   probe offset       +0xf8 : mov w9,#1 (opcode 0x52800029)
           *   normal return path +0x74
           */
          #include <linux/init.h>
          #include <linux/kernel.h>
          #include <linux/kprobes.h>
          #include <linux/suspend.h>
          #include <linux/workqueue.h>
          #include <asm/ptrace.h>

          #define SLATECOM_SYMBOL       "slatecom_pm_notifier"
          #define SLATECOM_PROBE_OFF    0xf8UL
          #define SLATECOM_RETURN_OFF   0x74UL
          #define SLATECOM_OPCODE_MOV   0x52800029U
          #define SLATECOM_MAX_RETRIES  120

          static bool slatecom_armed;
          static bool slatecom_terminal;
          static unsigned int slatecom_retries;

          static int __kprobes slatecom_nowarn_pre(struct kprobe *p,
                                                   struct pt_regs *regs)
          {
              unsigned long event = regs->regs[19];

              if (event != PM_SUSPEND_PREPARE && event != PM_POST_SUSPEND)
                  return 0;

              instruction_pointer_set(regs,
                  (unsigned long)p->addr -
                  (SLATECOM_PROBE_OFF - SLATECOM_RETURN_OFF));
              return 1;
          }

          static struct kprobe slatecom_kp = {
              .symbol_name = SLATECOM_SYMBOL,
              .offset = SLATECOM_PROBE_OFF,
              .pre_handler = slatecom_nowarn_pre,
          };

          static void slatecom_arm_workfn(struct work_struct *work);
          static DECLARE_DELAYED_WORK(slatecom_arm_work, slatecom_arm_workfn);

          static void slatecom_arm_workfn(struct work_struct *work)
          {
              int ret;

              if (slatecom_armed || slatecom_terminal)
                  return;

              ret = register_kprobe(&slatecom_kp);
              if (ret == -ENOENT) {
                  if (++slatecom_retries < SLATECOM_MAX_RETRIES)
                      schedule_delayed_work(&slatecom_arm_work, HZ / 4 ?: 1);
                  else {
                      slatecom_terminal = true;
                      pr_warn("slatecom_pm_nowarn: target symbol not found; inactive\n");
                  }
                  return;
              }

              if (ret) {
                  slatecom_terminal = true;
                  pr_warn("slatecom_pm_nowarn: register_kprobe failed: %d\n", ret);
                  return;
              }

              if ((u32)slatecom_kp.opcode != SLATECOM_OPCODE_MOV) {
                  u32 got = (u32)slatecom_kp.opcode;
                  unregister_kprobe(&slatecom_kp);
                  slatecom_terminal = true;
                  pr_warn("slatecom_pm_nowarn: vendor signature mismatch opcode=0x%08x; inactive\n",
                          got);
                  return;
              }

              slatecom_armed = true;
              pr_info("slatecom_pm_nowarn: armed %s+0x%lx for PM events 3/4\n",
                      SLATECOM_SYMBOL, SLATECOM_PROBE_OFF);
          }

          static int __init slatecom_nowarn_init(void)
          {
              schedule_delayed_work(&slatecom_arm_work, 0);
              return 0;
          }
          late_initcall(slatecom_nowarn_init);
          EOF

          grep -Fq 'slatecom_pm_nowarn.o' "$K/kernel/Makefile" || printf '\n# TicWatch Mobvoi slatecom PM notifier quirk\nobj-y += slatecom_pm_nowarn.o\n' >> "$K/kernel/Makefile"
          grep -Fq 'PM_SUSPEND_PREPARE' "$K/kernel/slatecom_pm_nowarn.c"
          grep -Fq 'SLATECOM_OPCODE_MOV   0x52800029U' "$K/kernel/slatecom_pm_nowarn.c"
          grep -Fq 'obj-y += slatecom_pm_nowarn.o' "$K/kernel/Makefile"

      - name: Resolve final MAX-LTS config
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          rm -rf out
          sed -i 's/ -dirty//g' scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' scripts/setlocalversion
          export ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export PATH="$AOSP_CLANG_PATH/bin:$PATH" LLVM=1 LLVM_IAS=1
          export KBUILD_BUILD_VERSION=0 KBUILD_BUILD_USER='XinRan♡' KBUILD_BUILD_HOST='Bai'
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC=clang BUILD_CONFIG=build.config.gki.aarch64 O=out DEPMOD=depmod gki_defconfig
          scripts/config --file out/.config -e LTO_CLANG -d LTO_NONE -e LTO_CLANG_THIN -d LTO_CLANG_FULL -e THINLTO
          scripts/config --file out/.config -e LRU_GEN -e LRU_GEN_ENABLED -d LRU_GEN_STATS
          scripts/config --file out/.config -e TCP_CONG_ADVANCED -e TCP_CONG_CUBIC -e TCP_CONG_BBR -e DEFAULT_BBR -d DEFAULT_CUBIC -e NET_SCH_FQ
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC=clang O=out olddefconfig
          grep -Fqx 'CONFIG_KSU=y' out/.config
          grep -Fqx 'CONFIG_KSU_SUSFS=y' out/.config
          grep -Fqx 'CONFIG_SECCOMP_FILTER=y' out/.config
          grep -Fqx 'CONFIG_KPROBES=y' out/.config
          grep -Fqx 'CONFIG_KALLSYMS_ALL=y' out/.config
          grep -Fqx 'CONFIG_MODULES=y' out/.config
          grep -Fqx 'CONFIG_LRU_GEN_ENABLED=y' out/.config
          grep -Fqx 'CONFIG_DEFAULT_BBR=y' out/.config
          grep -Fqx 'CONFIG_NET_SCH_FQ=y' out/.config
          grep -Fqx 'CONFIG_LOCALVERSION="-Xinran_StarBai-Test"' out/.config
          cp out/.config "$GITHUB_WORKSPACE/final.config"

      - name: Compile MAX-LTS 5.15.211 with slatecom fix
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .ticwatch-preflight/common
          export ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export PATH="$AOSP_CLANG_PATH/bin:$PATH" LLVM=1 LLVM_IAS=1
          export KCFLAGS='-Wno-error -Wno-deprecated-declarations'
          export KBUILD_BUILD_VERSION=0 KBUILD_BUILD_USER='XinRan♡' KBUILD_BUILD_HOST='Bai'
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$AOSP_LTS_TIP")"
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            KSU_NEXT_MANAGER_SIZE="$KSU_NEXT_MANAGER_SIZE" KSU_NEXT_MANAGER_HASH="$KSU_NEXT_MANAGER_HASH" \
            2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"
          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          test -s out/System.map
          test -s out/Module.symvers
          nm out/vmlinux | grep -Fq 'slatecom_nowarn_init'
          grep -Fq 'kernel/slatecom_pm_nowarn.o' "$GITHUB_WORKSPACE/kernel-build.log"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image"
          cp out/System.map "$GITHUB_WORKSPACE/System.map"
          cp out/Module.symvers "$GITHUB_WORKSPACE/Module.symvers"
          cp kernel/slatecom_pm_nowarn.c "$GITHUB_WORKSPACE/slatecom_pm_nowarn.c"
          make -s O=out ARCH=arm64 kernelrelease | tee "$GITHUB_WORKSPACE/kernelrelease.txt"
          release="$(cat "$GITHUB_WORKSPACE/kernelrelease.txt")"
          case "$release" in ${EXPECTED_UTS_PREFIX}*) ;; *) echo "Unexpected kernel release: $release" >&2; exit 1;; esac

      - name: Package safe wireless flasher and AnyKernel
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bundle/wireless-flasher bundle/audit anykernel
          cp Image bundle/wireless-flasher/Image
          cp previous/wireless-flasher/busybox bundle/wireless-flasher/busybox
          cp previous/wireless-flasher/magiskboot bundle/wireless-flasher/magiskboot
          cp previous/wireless-flasher/flash.sh bundle/wireless-flasher/flash.sh
          chmod 0755 bundle/wireless-flasher/busybox bundle/wireless-flasher/magiskboot bundle/wireless-flasher/flash.sh
          IMAGE_SHA="$(sha256sum Image | awk '{print $1}')"
          python3 - "$IMAGE_SHA" <<'PY'
          from pathlib import Path
          import re, sys
          sha=sys.argv[1]
          p=Path('bundle/wireless-flasher/flash.sh')
          s=p.read_text()
          s,n=re.subn(r'^EXPECTED_IMAGE_SHA="[0-9a-f]+"$', f'EXPECTED_IMAGE_SHA="{sha}"', s, count=1, flags=re.M)
          if n != 1: raise SystemExit('EXPECTED_IMAGE_SHA anchor missing')
          s,n=re.subn(r'^EXPECTED_RELEASE_PREFIX="[^"]+"$', 'EXPECTED_RELEASE_PREFIX="5.15.211-Xinran_StarBai-Test"', s, count=1, flags=re.M)
          if n != 1: raise SystemExit('EXPECTED_RELEASE_PREFIX anchor missing')
          p.write_text(s)
          PY
          sh -n bundle/wireless-flasher/flash.sh
          grep -Fq "EXPECTED_IMAGE_SHA=\"$IMAGE_SHA\"" bundle/wireless-flasher/flash.sh
          grep -Fq 'EXPECTED_RELEASE_PREFIX="5.15.211-Xinran_StarBai-Test"' bundle/wireless-flasher/flash.sh
          (
            cd bundle/wireless-flasher
            sha256sum Image busybox magiskboot flash.sh > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

