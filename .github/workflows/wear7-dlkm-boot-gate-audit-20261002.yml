name: Wear7 DLKM early-boot gate audit

on:
  push:
    branches: [wear7-diag4-init-bisect-20261002]
    paths:
      - '.github/workflows/wear7-dlkm-boot-gate-audit-20261002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Download and unpack exact DIAG3 super
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs kmod >/dev/null
          mkdir -p parts unpack mnt/vendor mnt/vendor_dlkm mnt/system_dlkm
          gh release download wear7-diag3-final-20261002 --repo "$GITHUB_REPOSITORY" --pattern 'super_WEAR7_V11_DIAG3_FINAL.img.part*' --dir parts
          cat parts/super_WEAR7_V11_DIAG3_FINAL.img.part* > super.img
          echo '75c8d716e0f243cfe309d9fca29aba0253f524bb70d93959dcd5d4fba0dc3329  super.img' | sha256sum -c -
          simg2img super.img super.raw
          if command -v lpunpack >/dev/null 2>&1; then
            lpunpack super.raw unpack
          else
            ZIP=otatools.zip
            curl -fL --retry 3 -sS -o "$ZIP" https://ci.android.com/builds/submitted/16102939/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip
            python3 - "$ZIP" tools <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if n=='bin/lpunpack' or n.startswith(('lib64/','lib/')):
                      p=(out/n).resolve()
                      if not p.is_relative_to(out): raise SystemExit('unsafe')
                      z.extract(n,out)
          PY
            chmod +x tools/bin/lpunpack
            LD_LIBRARY_PATH="$PWD/tools/lib64:$PWD/tools/lib" tools/bin/lpunpack super.raw unpack
          fi
          for p in vendor vendor_dlkm system_dlkm; do
            [ -f "unpack/$p.img" ] || continue
            sudo mount -o loop,ro,noload "unpack/$p.img" "mnt/$p" || true
          done

      - name: Audit loader selection and module ABI
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '===== LOAD_DLKMS PROPERTY ====='
          grep -RIna --binary-files=without-match 'ro.vendor.qti.load_dlkm.service' mnt/vendor 2>/dev/null || true
          echo
          echo '===== INIT.QTI.KERNEL EARLY-INIT ====='
          sed -n '1,235p' mnt/vendor/etc/init/hw/init.qti.kernel.rc 2>/dev/null || true
          echo
          echo '===== LOADER FILES ====='
          for f in \
            mnt/vendor/bin/load_dlkm \
            mnt/vendor/bin/system_dlkm_modprobe.sh \
            mnt/vendor/bin/vendor_modprobe.sh; do
            [ -e "$f" ] || continue
            echo "--- $f ---"
            file "$f" || true
            if head -c2 "$f" 2>/dev/null | grep -q '#!'; then cat "$f"; else strings "$f" | grep -Ei 'module|modprobe|dlkm|uname|kernel' | head -n 80 || true; fi
          done
          echo
          echo '===== MODULE LIST FILES ====='
          find mnt/vendor mnt/vendor_dlkm mnt/system_dlkm -type f \( -name 'modules.load*' -o -name 'modules.dep*' -o -name 'modules.alias*' \) -print -exec sh -c 'echo "--- $1 ---"; sed -n "1,160p" "$1"' _ {} \; 2>/dev/null || true
          echo
          echo '===== KO VERMAGIC UNIQUE ====='
          python3 - <<'PY'
          import pathlib,subprocess,re,collections
          roots=[pathlib.Path('mnt/vendor'),pathlib.Path('mnt/vendor_dlkm'),pathlib.Path('mnt/system_dlkm')]
          kos=[]
          for r in roots:
              if r.exists(): kos.extend(r.rglob('*.ko'))
          print('KO_COUNT='+str(len(kos)))
          vals=collections.Counter()
          samples={}
          for p in kos:
              try:
                  out=subprocess.check_output(['modinfo','-F','vermagic',str(p)],stderr=subprocess.DEVNULL,text=True).strip()
              except Exception:
                  out=''
              if not out:
                  try:
                      b=subprocess.check_output(['strings',str(p)],stderr=subprocess.DEVNULL,text=True,errors='ignore')
                      m=re.search(r'vermagic=([^\n]+)',b)
                      out=m.group(1).strip() if m else '<none>'
                  except Exception: out='<error>'
              vals[out]+=1; samples.setdefault(out,str(p))
          for v,n in vals.most_common():
              print(f'VERMAGIC|{n}|{v}|SAMPLE={samples[v]}')
          print('CURRENT_DEVICE_KERNEL_BASE=5.15.220')
          PY
          echo
          echo '===== KERNEL RELEASE STRINGS IN DLKM ====='
          grep -RIna --binary-files=text -E '5\.15\.[0-9]+' mnt/vendor_dlkm mnt/system_dlkm 2>/dev/null | head -n 120 || true
          echo 'RESULT=DLKM_BOOT_GATE_AUDIT_PASS'
