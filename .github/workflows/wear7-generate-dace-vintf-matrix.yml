name: Wear7 generate exact dace framework VINTF matrix

on:
  workflow_dispatch:
  push:
    branches: [wear7-rom-staging]
    paths: ['.github/workflows/wear7-generate-dace-vintf-matrix.yml']

permissions:
  contents: read

env:
  TIC_URL: https://android.googleapis.com/packages/data/ota-api/package/2269bd24a774cae37adc720d3d97bd1b76846e2b.zip
  TIC_SHA256: ffa61d822a5c667c230ce2ba9426ce4eb282adcaa0891279ef002f65ca15a08d

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: wear7-rom-staging
          fetch-depth: 1

      - name: Prepare host
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y curl unzip e2fsprogs >/dev/null
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/mnt" report

      - name: Reconstruct exact stock379 vendor
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 --retry-delay 3 -o "$RUNNER_TEMP/src/tic379.zip" "$TIC_URL"
          echo "$TIC_SHA256  $RUNNER_TEMP/src/tic379.zip" | sha256sum -c -
          python3 wear7/scripts/reconstruct_block_ota.py "$RUNNER_TEMP/src/tic379.zip" vendor "$RUNNER_TEMP/vendor.raw"
          test "$(stat -c %s "$RUNNER_TEMP/vendor.raw")" = 297361408
          echo '150238505037c881b079b7c9de1adc231f2c4a94b64f8dd3a7694ebc7408371e  '"$RUNNER_TEMP/vendor.raw" | sha256sum -c -
          sudo mount -o loop,ro "$RUNNER_TEMP/vendor.raw" "$RUNNER_TEMP/mnt"
          test -s "$RUNNER_TEMP/mnt/etc/vintf/manifest_monaco.xml"
          sha256sum "$RUNNER_TEMP/mnt/etc/vintf/manifest_monaco.xml" | tee report/MANIFEST_MONACO_SHA256.txt
          find "$RUNNER_TEMP/mnt/etc/vintf/manifest" -maxdepth 1 -type f -name '*.xml' -print | sort | tee report/MANIFEST_FRAGMENTS.txt

      - name: Generate supplemental framework matrix from exact stock manifests
        run: |
          set -Eeuo pipefail
          python3 wear7/scripts/generate_framework_matrix_from_device_manifest.py \
            --main "$RUNNER_TEMP/mnt/etc/vintf/manifest_monaco.xml" \
            --fragments "$RUNNER_TEMP/mnt/etc/vintf/manifest" \
            --out report/compatibility_matrix.dace.xml \
            --sepolicy-version 33.0 \
            --kernel-sepolicy-version 30 \
            --matrix-version 9.0 \
            | tee report/GENERATOR_REPORT.txt
          test -s report/compatibility_matrix.dace.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='report/compatibility_matrix.dace.xml'
          r=ET.parse(p).getroot()
          assert r.tag=='compatibility-matrix' and r.attrib.get('type')=='framework'
          assert r.attrib.get('version')=='9.0'
          hals=r.findall('hal')
          assert len(hals) >= 50, len(hals)
          sp=r.find('sepolicy')
          assert sp is not None
          assert sp.findtext('kernel-sepolicy-version')=='30'
          assert [e.text for e in sp.findall('sepolicy-version')]==['33.0']
          names={h.findtext('name') for h in hals}
          required={
            'vendor.display.config',
            'vendor.qti.hardware.qseecom',
            'android.hardware.bluetooth.audio',
            'android.se.omapi',
            'vendor.google_clockwork.healthservices',
            'vendor.google_clockwork.wristorientation',
          }
          missing=required-names
          assert not missing, missing
          print('DACE_MATRIX_SCHEMA_AUDIT=PASS')
          print('HAL_COUNT='+str(len(hals)))
          PY
          sha256sum report/compatibility_matrix.dace.xml | tee report/DACE_MATRIX_SHA256.txt

      - name: Cleanup and upload
        if: always()
        run: |
          sudo umount "$RUNNER_TEMP/mnt" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" report 2>/dev/null || true
          find report -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > report/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Wear7-Dace-Vintf-Matrix
          path: report/
          retention-days: 30
          compression-level: 9
